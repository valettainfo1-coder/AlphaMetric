/* Teilbare Erfolgs-Karten (Canvas, 1080×1350 Story-Format) — der Kern des
   Product-led-Growth-Loops: jede Karte trägt Marke + Tagline + App-Link,
   jeder Share ist eine kostenlose Impression. Web-Share-API mit Datei,
   sonst Download. */
function drawShareCard(opts){
  const c=document.createElement("canvas"); c.width=1080; c.height=1350;
  const x=c.getContext("2d");
  // Hintergrund mit dezentem Akzent-Schein
  x.fillStyle="#F7F5F1"; x.fillRect(0,0,1080,1350);
  const g=x.createRadialGradient(540,170,40,540,170,900);
  g.addColorStop(0,"rgba(96,140,230,.10)"); g.addColorStop(1,"rgba(247,245,241,0)");
  x.fillStyle=g; x.fillRect(0,0,1080,700);
  // Logo: 3 Balken + Wortmarke
  x.fillStyle="#1A1A1A";
  [[80,104,36],[100,86,54],[120,68,72]].forEach(([bx,by,bh])=>{ if(x.roundRect){x.beginPath();x.roundRect(bx,by,14,bh,7);x.fill();}else x.fillRect(bx,by,14,bh); });
  x.font="800 58px 'Schibsted Grotesk',system-ui"; x.fillText("METRICGYM",156,138);
  // Eyebrow
  x.fillStyle="#9DB4F0"; x.font="700 34px 'Schibsted Grotesk',system-ui";
  x.fillText((opts.eyebrow||"").toUpperCase(),80,250);
  // Hero
  x.fillStyle="#1A1A1A"; x.font=`900 ${opts.heroSize||200}px 'Schibsted Grotesk',system-ui`;
  x.fillText(opts.hero,80,opts.heroSize?250+opts.heroSize*0.95:470);
  x.fillStyle="#6E6A62"; x.font="600 44px 'Schibsted Grotesk',system-ui";
  let y=(opts.heroSize?250+opts.heroSize*0.95:470)+70;
  x.fillText(opts.heroLabel||"",80,y); y+=120;
  // bis zu 3 Sekundär-Stats
  (opts.stats||[]).forEach(([v,l,accent])=>{
    x.fillStyle=accent?"#9DB4F0":"#1A1A1A"; x.font="900 100px 'Schibsted Grotesk',system-ui"; x.fillText(v,80,y);
    x.fillStyle="#6E6A62"; x.font="600 38px 'Schibsted Grotesk',system-ui"; x.fillText(l,80,y+52); y+=200;
  });
  // Footer-Band
  x.fillStyle="#1A1A1A"; x.font="700 40px 'Schibsted Grotesk',system-ui";
  x.fillText("Fortschritt, wissenschaftlich fundiert.",80,1230);
  x.fillStyle="#A39E93"; x.font="500 32px 'Schibsted Grotesk',system-ui";
  x.fillText("metricgym.app",80,1285);
  return c;
}
function shareCanvas(canvas,fname,text){
  const done=()=>toast("Bild bereit — teilen oder speichern");
  if(canvas.toBlob){
    canvas.toBlob(async(blob)=>{
      try{
        const file=new File([blob],fname,{type:"image/png"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; }
      }catch{}
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); URL.revokeObjectURL(a.href); done();
    },"image/png");
  } else { const a=document.createElement("a"); a.href=canvas.toDataURL("image/png"); a.download=fname; a.click(); done(); }
}

/* =====================================================================
   ENGAGEMENT-ENGINE (Bindung) — Streak (Verlustangst), Level/XP
   (Fortschritts-Gefühl), Meilensteine + variable Belohnung (Konfetti),
   sichtbares „Investment" (Sunk-Cost). Alles aus echten Daten abgeleitet.
   ===================================================================== */
function activityDays(){
  const d=new Set();
  S.readinessHistory.forEach(r=>d.add(r.date));
  S.trainingHistory.forEach(t=>d.add(t.date));
  Object.entries(S.nutritionLog).forEach(([k,l])=>{if((l.meals||[]).length)d.add(k);});
  return d;
}
function engagementStats(){
  const days=activityDays();
  let streak=0;
  for(let i=0;;i++){const key=dkey(new Date(Date.now()-i*dayMs));
    if(days.has(key))streak++; else if(i===0) continue; else break;}
  const activeToday=days.has(todayKey());
  const sessions=S.trainingHistory.filter(t=>t.type!=="rest").length;
  const statusN=S.readinessHistory.length;
  const nutriN=Object.values(S.nutritionLog).filter(l=>(l.meals||[]).length).length;
  const prs=Object.keys(S.liftLog).filter(n=>{const s=e1Series(n);return s.length>=2&&s[s.length-1].v>Math.min(...s.map(p=>p.v));}).length;
  const xp=sessions*50+statusN*15+nutriN*10+prs*80+streak*8;
  const LX=(lv)=>Math.round(80*(lv-1)*(lv-1)); // XP, um Level lv zu erreichen
  let level=1; while(xp>=LX(level+1))level++;
  const cur=LX(level), next=LX(level+1);
  const levelPct=Math.min(1,(xp-cur)/((next-cur)||1));
  const totalVol=Object.values(S.liftLog).flat().reduce((s,x)=>s+((x.w||0)*(x.reps||0)),0)
    +S.trainingHistory.reduce((s,t)=>s+(t.volume||0),0);
  const journey=days.size?Math.round((Date.now()-Math.min(...[...days].map(d=>new Date(d).getTime())))/dayMs)+1:0;
  return {streak,activeToday,sessions,statusN,nutriN,prs,xp,level,toNext:Math.max(0,next-xp),levelPct,totalVol,journey,daysCount:days.size};
}

function confetti(){
  try{
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    const DPR=Math.min(2,window.devicePixelRatio||1);
    const c=document.createElement("canvas");
    c.style.cssText="position:fixed;inset:0;z-index:75;pointer-events:none";
    c.width=window.innerWidth*DPR; c.height=window.innerHeight*DPR;
    document.body.appendChild(c); const x=c.getContext("2d"); x.scale(DPR,DPR);
    const W=window.innerWidth,H=window.innerHeight;
    const cols=["#9DB4F0","#7E8BE8","#56C8D6","#C9D2E2","#4A6FD8","#B7C6F2","#FFFFFF"];
    // feinere, hochwertigere Partikel: Mix aus schmalen Plättchen, Kreisen & Funken
    const P=Array.from({length:190},()=>{const kind=Math.random();return {
      x:W*(0.34+Math.random()*0.32), y:H*0.30,
      vx:(Math.random()-.5)*11, vy:Math.random()*-12-4,
      r:1.4+Math.random()*3, rot:Math.random()*6.28, vr:(Math.random()-.5)*0.34,
      drift:(Math.random()-.5)*0.04, ph:Math.random()*6.28,
      shape: kind<0.5?"rect":kind<0.82?"circle":"spark",
      col:cols[Math.floor(Math.random()*cols.length)], a:1 };});
    const start=performance.now(), LIFE=2600;
    (function f(t){
      const el=t-start; x.clearRect(0,0,W,H); let on=false;
      P.forEach(p=>{ p.vy+=0.34; p.ph+=0.08; p.x+=p.vx+Math.sin(p.ph)*0.6; p.y+=p.vy; p.rot+=p.vr; p.vx*=0.992;
        p.a=el>LIFE*0.6?Math.max(0,1-(el-LIFE*0.6)/(LIFE*0.4)):1;
        if(p.y<H+30&&p.a>0)on=true;
        x.save(); x.globalAlpha=p.a; x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.col;
        if(p.shape==="circle"){x.beginPath();x.arc(0,0,p.r,0,6.283);x.fill();}
        else if(p.shape==="spark"){x.fillRect(-0.6,-p.r*2,1.2,p.r*4);}
        else {x.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);}
        x.restore(); });
      if(on&&el<LIFE+200)requestAnimationFrame(f); else c.remove();
    })(start);
  }catch{}
}

function checkCelebrations(){
  const s=engagementStats();
  const passed=MILESTONES.filter(m=>m.test(s)).map(m=>m.id);
  if(S.celebrated==null){ S.celebrated=passed; S.lastLevel=s.level; save(); return; } // Erstlauf: still seeden
  const news=passed.filter(id=>!S.celebrated.includes(id));
  if(news.length){ S.celebrated=[...S.celebrated,...news]; save();
    const m=MILESTONES.find(x=>x.id===news[news.length-1]); celebrate(m.t,m.d); return; }
  if(s.level>(S.lastLevel||1)){ S.lastLevel=s.level; save(); celebrate("Level "+s.level+" erreicht!","Dein Einsatz zahlt sich aus. Weiter geht's."); }
}

function muscleBody(view,arg,sex){

  // bei der Frau — Ober-/Unterkörper unabhängig entlang X gestaucht/gestreckt, Muskelformen selbst
  // bleiben unverändert (die echten, anatomisch korrekten Polygone werden nur proportioniert).
  const sxUp=sf?0.82:1.13, sxLo=sf?0.97:0.95;

    <filter id="${fid}g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

function muscleHeatBody(){

/* Konsistenz-Kalender: letzte 12 Wochen, Spalten=Wochen, Zeilen=Mo–So,
   Zelle eingefärbt nach trainiertem Volumen des Tages. */
function consistencyHeatmap(){
  const weeks=12;
  const byDate={};
  S.trainingHistory.forEach(t=>{if(t.type!=="rest"&&t.type!=="cardio")byDate[t.date]=(byDate[t.date]||0)+t.sets;});
  const today=new Date(); const dow=(today.getDay()+6)%7;
  const monThis=new Date(today); monThis.setDate(today.getDate()-dow); // Montag dieser Woche
  const shade=(s)=>s===0?"var(--s3)":s<=6?"rgba(96,140,230,.35)":s<=12?"rgba(96,140,230,.6)":"rgba(96,140,230,.95)";
  let cols="";
  for(let w=weeks-1;w>=0;w--){
    let cells="";
    for(let r=0;r<7;r++){
      const d=new Date(monThis); d.setDate(monThis.getDate()-w*7+r);
      const key=dkey(d);
      const future=d>today;
      const s=byDate[key]||0;
      cells+=`<div title="${key}: ${s} Sätze" style="width:12px;height:12px;border-radius:3px;background:${future?"transparent":shade(s)}"></div>`;
    }
    cols+=`<div style="display:flex;flex-direction:column;gap:3px">${cells}</div>`;
  }
  return `<div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:4px">${cols}</div>
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="xs t2">vor 12 Wochen</span>
      <span class="row" style="gap:4px;align-items:center"><span class="xs t2">weniger</span>
        ${[0,5,10,16].map(s=>`<span style="width:11px;height:11px;border-radius:3px;background:${shade(s)};display:inline-block"></span>`).join("")}
        <span class="xs t2">mehr</span></span></div>`;
}

function aiHeaders(){

function geminiOn(){ return !!S.aiOn && geminiKey().length>20; }

const GEMINI_MODEL="gemini-flash-latest";
function geminiURL(stream){ return "https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":"+(stream?"streamGenerateContent?alt=sse":"generateContent"); }
// dataURL ("data:image/jpeg;base64,…") → Gemini inline_data-Part
function dataURLpart(u){ const m=/^data:([^;]+);base64,(.*)$/.exec(u||""); return m?{inline_data:{mime_type:m[1],data:m[2]}}:null; }
// Einzel-Antwort (Text oder JSON). user = String ODER {text, images:[dataURL]} für Vision.
async function geminiGen(system,user,opts){
  opts=opts||{};
  const parts=[];
  if(typeof user==="string"){ parts.push({text:user}); }
  else { if(user.text)parts.push({text:user.text}); for(const u of (user.images||[])){ const p=dataURLpart(u); if(p)parts.push(p); } }
  const body={ contents:[{role:"user",parts}],
    generationConfig:{ temperature:opts.temp??0.5, maxOutputTokens:opts.max||600, ...(opts.json?{responseMimeType:"application/json"}:{}) } };
  if(system) body.systemInstruction={parts:[{text:system}]};
  const res=await fetch(geminiURL(false),{method:"POST",headers:{"Content-Type":"application/json","X-goog-api-key":geminiKey()},body:JSON.stringify(body)});
  if(!res.ok){ let m=""; try{m=(await res.json()).error?.message||"";}catch{} throw new Error("Gemini "+res.status+(m?": "+m:"")); }
  const j=await res.json();
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
}
// Streaming-Chat (SSE) für den Coach.
async function geminiStream(system,history,onDelta){
  const contents=history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const body={ contents, systemInstruction:{parts:[{text:system}]}, generationConfig:{temperature:0.6,maxOutputTokens:600} };
  const res=await fetch(geminiURL(true),{method:"POST",headers:{"Content-Type":"application/json","X-goog-api-key":geminiKey()},body:JSON.stringify(body)});
  if(!res.ok)throw new Error("Gemini "+res.status);
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="", full="";
  while(true){ const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); const lines=buf.split("\n"); buf=lines.pop();
    for(const ln of lines){ const t=ln.trim(); if(!t.startsWith("data:"))continue; const d=t.slice(5).trim(); if(!d||d==="[DONE]")continue;
      try{ const tok=(JSON.parse(d).candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""); if(tok){full+=tok;onDelta(full);} }catch{} } }
  return full.trim();
}

// Provider-Kette: Gemini (primär) → OpenRouter → Groq. Jeder Schritt fällt bei Fehler
// (z. B. 429-Quota) auf den nächsten zurück; erst wenn alle scheitern, wirft die Funktion.
async function aiChain(runners){
  let lastErr;
  for(const run of runners){ if(!run.on)continue; try{ return await run.fn(); }catch(e){ lastErr=e; } }
  throw lastErr||new Error("Keine KI verfügbar");
}

}

// Bild herunterskalieren (max. Kante ~1100 px, JPEG) — hält die Vision-Payload klein.
function downscaleImage(file,maxEdge){
  maxEdge=maxEdge||1100;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      let{width:w,height:h}=img; const sc=Math.min(1,maxEdge/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.82));
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
/* Eine Chat-Runde: streamt in die letzte .msg.ai-Bubble des Containers;
   bei Fehler/kein Key → Fallback-Funktion. Persistiert in arr. */
async function aiTurn(arr,chatId,fallbackFn){
  const renderFn=window["__rerender_"+chatId];
  const history=arr.filter(m=>m.t!=="…").map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}));
  if(!aiActive()){ arr[arr.length-1].t=fallbackFn(); save(); renderFn&&renderFn(); return; }
  try{
    const full=await aiStream(history,(txt)=>{
      const box=document.getElementById(chatId); if(!box)return;
      const bubble=box.querySelector(".msg.ai:last-child"); if(bubble){bubble.textContent=txt; box.scrollTop=box.scrollHeight;}
    });
    arr[arr.length-1].t=full||fallbackFn();
  }catch(err){ arr[arr.length-1].t=fallbackFn()+"\n\n_(KI gerade nicht erreichbar — Standard-Antwort. Details: "+String(err.message||err).slice(0,80)+")_"; }
  save(); renderFn&&renderFn();
}

    const sys=`Du bist Trainingsplaner. Antworte NUR mit JSON: {"summary":"kurzer Satz","exercises":[{"name":"<exakt aus erlaubter Liste>","sets":3,"reps":"6-10"}]}. 5–8 Übungen, Mehrgelenksübungen zuerst. NUR Namen aus der erlaubten Liste verwenden.`;
    const usr=`Erlaubte Übungen: ${pool.join(", ")}.\nAktuelle Einheit (${TYPE_META[base].label}): ${cur}.\nNutzer: ${a.exp}, Ziel ${(S.profile.tg.goals||[]).map(g=>GOAL_LABEL[g]).join("+")}.\nWunsch: "${req.trim()}"`;
    try{
      const j=await aiJSON(sys,usr);
      const ex=((j&&j.exercises)||[]).filter(e=>e&&EXDB[e.name]).slice(0,9);
      if(!ex.length)throw new Error("keine gültigen Übungen");
      const before=sessionDef(typeKey).main.map(e=>`${e.n} ${e.sets}×${e.reps}`);
      applyAISession(typeKey,ex);
      const after=ex.map(e=>`${e.name} ${e.sets}×${e.reps}`);
      overlay.innerHTML=""; render();
      setTimeout(()=>aiAdjustResult((j&&j.summary)||"Einheit neu zusammengestellt.", before, after),70);
    }catch(err){ if(box){box.textContent="Konnte nicht anpassen — formulier es konkreter. ("+String(err.message||err).slice(0,50)+")";} }
  };
  overlay.innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)A.closeModal()"><div class="sheet fade">
    <p class="display-m mb4" style="display:flex;align-items:center;gap:8px">${icon("sparkle",18)} Plan anpassen <span class="badge volt" style="font-size:9px">KI</span></p>
    <p class="xs t2 mb12">Sag, was du an „${TYPE_META[base].label}" ändern willst — Coach Metric baut die Einheit um.</p>
    <div class="chips mb12">${chips.map(c=>`<button class="chip" onclick="A.aiAdjustGo('${c}')">${c}</button>`).join("")}</div>
    <textarea id="aiadj-in" class="quicklog-field" rows="2" placeholder="z. B. 'Nur Kurzhanteln da und mein Knie zwickt'"></textarea>
    <div id="aiadj-status" class="xs t2 mt8" style="display:none"></div>
    <button class="btn volt mt12" onclick="A.aiAdjustGo()">Anpassen lassen</button>
  </div></div>`;
}
function applyAISession(typeKey,exList){
  const {base,variant}=parseTypeKey(typeKey);
  const plan=variant==="B"?activePlanB():activePlan();
  const mk=(n,sets,reps)=>{const d=EXDB[n]||{};return {n,sets:Math.max(1,Math.min(6,parseInt(sets)||3)),reps:String(reps||"8-12"),tempo:d.tempo||"2-0-1-0",rir:d.rir||"1–2",m:d.m||"—",why:d.why||"",alt:d.alt||null,lengthened:!!d.lengthened};};
  if(plan[base]){
    // Undo-Schnappschuss: vorherige Übungen sichern, damit der Nutzer die KI-Anpassung
    // jederzeit zurücknehmen kann (Vorher/Nachher).
    S.planUndo={typeKey, prevMain:JSON.parse(JSON.stringify(plan[base].main||[])), when:Date.now()};
    plan[base].main=exList.map(e=>mk(e.name,e.sets,e.reps));
  }
  if(S.exOverrides)delete S.exOverrides[typeKey];
  save();
}
function planUndoRestore(){
  const u=S.planUndo; if(!u){toast("Nichts rückgängig zu machen");return;}
  const {base,variant}=parseTypeKey(u.typeKey);
  const plan=variant==="B"?activePlanB():activePlan();
  if(plan[base])plan[base].main=u.prevMain;
  S.planUndo=null; save(); overlay.innerHTML=""; render();
  toast("↩ KI-Anpassung zurückgenommen — Originalplan wiederhergestellt");
}
// Klare Meldung: WAS die KI am Plan geändert hat — Vorher/Nachher + Rückgängig.
function aiAdjustResult(summary, before, after){
  const li=(arr,other)=>arr.map(x=>`<li style="${other.includes(x)?"color:var(--t3)":"color:var(--t1);font-weight:600"}">${x}</li>`).join("");
  modal(`<p class="ct">${icon("sparkle",14)} KI hat deinen Plan angepasst</p>
    ${summary?`<p class="sm mb12" style="line-height:1.5">${summary}</p>`:""}
    <div class="grid2" style="gap:10px">
      <div style="background:var(--s2);border-radius:12px;padding:12px"><p class="xs t2 mb4">Vorher</p>
        <ul class="xs" style="margin:0;padding-left:15px;line-height:1.7">${li(before,after)}</ul></div>
      <div style="background:rgba(96,140,230,.08);border-radius:12px;padding:12px"><p class="xs t2 mb4">Nachher (neu)</p>
        <ul class="xs" style="margin:0;padding-left:15px;line-height:1.7">${li(after,before)}</ul></div>
    </div>
    <p class="xs t2 mt8">Fett markiert = von der KI geändert.</p>
    <button class="btn mt12" onclick="planUndoRestore()">${icon("undo",15)} Rückgängig — Original wiederherstellen</button>`);
}

// =====================================================================
// MONATS-ÜBERBLICK — Tagesbewertung (Adhärenz) + Kalender rot->grün + Cheat-Days
// =====================================================================
// ---------- Objektive Erholung aus Health-Daten (HRV / Ruhepuls / Schlaf) ----------
// Persönliche Baseline = Median der letzten ~30 Messwerte. So bewerten wir relativ
// zu DIR, nicht gegen eine Norm — genau wie Oura/Whoop.
function hrvBaseline(){ const a=S.hrvLog.slice(-30).map(x=>x.v).sort((p,q)=>p-q); return a.length?a[Math.floor(a.length/2)]:null; }
function rhrBaseline(){ const a=S.rhrLog.slice(-30).map(x=>x.v).sort((p,q)=>p-q); return a.length?a[Math.floor(a.length/2)]:null; }
function rhrFor(dk){ return S.rhrLog.find(x=>dkey(new Date(x.t))===dk)||null; }
// Erholungs-Score 0..100 eines Tages aus gemessenen Werten; null wenn keine Daten.
function healthDayScore(dateKey){
  const hrv=S.hrvLog.find(x=>x.date===dateKey);
  const rhr=rhrFor(dateKey);
  const sl=S.sleepLog.find(x=>x.date===dateKey);
  if(!hrv&&!rhr&&!sl) return null;
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const parts=[]; const hb=hrvBaseline(), rb=rhrBaseline();
  if(hrv&&hb) parts.push([0.5, c01(0.5+(hrv.v-hb)/hb*1.2)]);   // HRV über Baseline = erholt
  if(rhr&&rb) parts.push([0.3, c01(0.5+(rb-rhr.v)/rb*1.5)]);   // Ruhepuls unter Baseline = erholt
  if(sl)      parts.push([0.2, c01((sl.v-5)/3)]);              // 5 h → 0, 8 h → 1
  if(!parts.length) return sl?Math.round(c01((sl.v-5)/3)*100):null;
  const wsum=parts.reduce((s,p)=>s+p[0],0);
  return Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/wsum*100);
}
const DAY_COLORS={green:"#5BC48A",orange:"#E0A24A",red:"#E56A5C",cheat:"#9B7CF0",
  empty:"rgba(255,255,255,.05)",future:"rgba(255,255,255,.025)"};
const DAY_KIND_LBL={green:"Durchgezogen",orange:"Teilweise",red:"Verpasst",cheat:"Cheat Day",empty:"Keine Daten"};
// Tages-Score 0..100 aus echten Daten: Training (40) + Ernährung (45) + Status-Check (15).
// Geplante Ruhetage zählen voll (Erholung gehört dazu). Großes kcal-Plus = Cheat Day (zählt, kein Fail).
function dayScore(dateKey){
  const today=todayKey();
  if(dateKey>today) return {kind:"future"};
  const p=S.profile; if(!p) return {kind:"empty",parts:{}};
  const dow=(new Date(dateKey+"T12:00:00").getDay()+6)%7;
  const planned=schedule()[dow];
  let pts=0,max=0; const parts={};
  max+=40;
  const trained=S.trainingHistory.some(t=>t.date===dateKey&&t.type!=="rest");
  if(planned==="rest"){pts+=40;parts.train="rest";}
  else if(trained){pts+=40;parts.train="done";}
  else parts.train="missed";
  max+=45; let cheat=false;
  const nl=S.nutritionLog[dateKey]; const tg=(planned==="rest")?p.tg.rest:p.tg.train;
  if(nl&&(nl.meals||[]).length){
    const sum=nl.meals.reduce((s,m)=>({k:s.k+(m.k||0),pr:s.pr+(m.p||0)}),{k:0,pr:0});
    parts.kcal=Math.round(sum.k); parts.prot=Math.round(sum.pr);
    if(sum.k>tg.kcal*1.25){cheat=true;pts+=22;parts.nutri="cheat";}
    else{const dev=Math.abs(sum.k-tg.kcal)/(tg.kcal||1);
      pts+=dev<=0.12?25:dev<=0.25?16:8;
      pts+=sum.pr>=tg.p*0.9?20:sum.pr>=tg.p*0.7?12:5; parts.nutri="ok";}
  } else parts.nutri="none";
  max+=15;
  if(S.readinessHistory.some(r=>r.date===dateKey)){pts+=15;parts.status="done";}
  else { const hs=healthDayScore(dateKey); if(hs!=null){pts+=15;parts.status="health";parts.healthScore=hs;} }
  const score=Math.round(pts/max*100);
  const anyData=parts.train==="done"||parts.nutri==="ok"||parts.nutri==="cheat"||parts.status==="done"||parts.status==="health";
  let kind;
  if(!anyData) kind="empty"; else if(cheat) kind="cheat";
  else if(score>=75) kind="green"; else if(score>=50) kind="orange"; else kind="red";
  return {score,kind,cheat,parts,planned};
}
function monthlyOverview(){
  const off=S.monthOffset||0, now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+off, 1);
  const year=base.getFullYear(), month=base.getMonth();
  const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const dim=new Date(year,month+1,0).getDate();
  const firstDow=(new Date(year,month,1).getDay()+6)%7;
  const todayK=todayKey();
  const tally={green:0,orange:0,red:0,cheat:0,scored:0,sum:0};

    const ds=dayScore(dk), col=DAY_COLORS[ds.kind]||DAY_COLORS.empty;
    const filled=["green","orange","red","cheat"].includes(ds.kind);

  }
  const done=tally.scored, avg=done?Math.round(tally.sum/done):0;
  const pct=done?Math.round(tally.green/done*100):0;
  const grade=avg>=85?["Stark","var(--good)"]:avg>=70?["Solide","var(--hl)"]:avg>=50?["Ausbaufähig","var(--warn)"]:["Dranbleiben","var(--danger)"];
  const msg=done===0?"Noch keine bewerteten Tage diesen Monat — logge Training und Ernährung, dann färbt sich dein Kalender Tag für Tag."
    :pct>=70?`Starker Monat — du ziehst durch.${tally.cheat>0?` ${tally.cheat} Cheat-Day${tally.cheat>1?"s":""} sind völlig okay, solange der Rest sitzt.`:""}`
    :pct>=40?"Solide Basis. Ein paar Tage mehr im grünen Bereich heben deinen Schnitt spürbar."
    :"Jeder grüne Tag zählt. Fang mit dem täglichen Loggen an — der Rest folgt.";
  const WD=["M","D","M","D","F","S","S"];
  return `<div class="card">

// Sanfte Farbskala rot → orange → gelb → grün für einen 0..100-Score.
function trendColor(s){
  if(s>=85) return "#5BC48A"; if(s>=72) return "#9FCB6E";
  if(s>=58) return "#E0C24A"; if(s>=42) return "#E0A24A"; return "#E56A5C";
}
// Entwicklung über Monate: ein Durchschnitts-Block pro Monat (rot→grün) +
// Verlaufsrichtung. Beantwortet "wie entwickle ich mich" über die Zeit.
function developmentTrend(){
  const now=new Date(), months=[];
  for(let m=5;m>=0;m--){
    const base=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const y=base.getFullYear(), mo=base.getMonth(), dim=new Date(y,mo+1,0).getDate();
    let sum=0,n=0;
    for(let d=1;d<=dim;d++){
      const dk=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const ds=dayScore(dk);
      if(["green","orange","red","cheat"].includes(ds.kind)){sum+=ds.score||0;n++;}
    }
    months.push({mo,avg:n?Math.round(sum/n):null,days:n});
  }
  const scored=months.filter(m=>m.avg!=null);
  if(scored.length<2) return ""; // erst ab 2 bewerteten Monaten aussagekräftig
  const MA=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const first=scored[0].avg, last=scored[scored.length-1].avg, diff=last-first;
  const dir=diff>=5?["▲","var(--good)","Aufwärtstrend — du wirst Monat für Monat konstanter."]
    :diff<=-5?["▼","var(--warn)","Leicht rückläufig — ein paar grüne Tage mehr drehen das schnell."]
    :["▬","var(--hl)","Stabil — du hältst dein Niveau."];
  const blocks=months.map(m=>{
    const has=m.avg!=null, col=has?trendColor(m.avg):"rgba(255,255,255,.05)";
    return `<div style="flex:1;text-align:center">
      <div style="aspect-ratio:1;border-radius:11px;background:${col};display:flex;align-items:center;justify-content:center;color:${has?"#0B0B0F":"var(--t3)"};font-family:var(--font-mono);font-weight:700;font-size:14px">${has?m.avg:"·"}</div>
      <p class="xs t2" style="margin-top:5px">${MA[m.mo]}</p></div>`;
  }).join("");
  return `<div class="card">
    <div class="row mb12"><p class="ct" style="margin:0">${icon("activity",13)} Deine Entwicklung · 6 Monate</p>
      <span class="metric" style="font-size:15px;color:${dir[1]}">${dir[0]} ${diff>=0?"+":""}${diff}</span></div>
    <div style="display:flex;gap:8px;align-items:flex-end">${blocks}</div>
    <p class="sm t2 mt12" style="line-height:1.55">${dir[2]} Jeder Block ist dein Monatsschnitt aus Training, Ernährung & Erholung.</p>
  </div>`;
}

function gateCard(title,need,have,unit,ctaLabel,ctaTab){
  // FIX (v5/6B): need kam teils als String ("3"/"5") an — hart auf Number, sonst
  // rechnet `need-have` per Typkoersion zwar, aber `have/need` ist fragil.
  need=Number(need); have=Number(have);
  // FIX (v5/6B): Zähler "x / y" umbrach bei langen Titeln neben der Progressbar — nowrap.
  return `<div class="card"><p class="ct">${title}</p>
    <p class="sm t2 mb8">Noch ${Math.max(0,need-have)} ${unit} bis zu deiner persönlichen Auswertung — leg jetzt los.</p>
    <div class="row mb8"><div class="progress" style="height:8px;min-width:0"><div style="width:${Math.min(100,have/need*100)}%"></div></div>
    <span class="metric xs t2" style="white-space:nowrap;flex-shrink:0">${have} / ${need}</span></div>
    ${ctaLabel?`<button class="btn" style="min-height:42px;font-size:13px" onclick="S.tab='${ctaTab||"train"}';save();render();">${ctaLabel}</button>`:""}</div>`;
}
// Selbstlernender Stoffwechsel sichtbar: Erhaltung vs. Ziel + Lern-Korrektur + echter Gewichtstrend.
function metabolismCard(){
  const p=S.profile; if(!p||!p.td) return "";
  const days=Math.min(7,Math.max(1,p.a.days||4));
  const intakeAvg=Math.round((p.tg.train.kcal*days+p.tg.rest.kcal*(7-days))/7);
  const maint=p.td.avg, deltaPct=Math.round((intakeAvg-maint)/maint*100), adj=S.calAdjust||0;
  const wl=(S.weightLog||[]).filter(x=>x&&x.t&&x.v).sort((x,y)=>x.t-y.t);
  let obsKgWk=null, chart="";
  if(wl.length>=4 && (wl[wl.length-1].t-wl[0].t)/dayMs>=10){
    const n=wl.length; let sx=0,sy=0,sxx=0,sxy=0;
    wl.forEach(q=>{const x=(q.t-wl[0].t)/dayMs;sx+=x;sy+=q.v;sxx+=x*x;sxy+=x*q.v;});
    const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx); if(isFinite(slope))obsKgWk=Math.round(slope*7*100)/100;
    chart=`<p class="sm mb8" style="font-weight:500;margin-top:14px">Dein Gewichtstrend</p>`+lineChart(wl.map(q=>({t:q.t,v:q.v})));
  }
  const stat=(l,v,c)=>`<div style="background:var(--s2);border-radius:14px;padding:12px 8px;text-align:center">
    <p class="hero-num ${c||''}" style="font-size:21px">${v}</p><p class="xs t2" style="margin-top:2px">${l}</p></div>`;
  const adjTxt = adj===0?"noch keine Korrektur" : (adj<0?`−${Math.abs(adj)} kcal`:`+${adj} kcal`);
  const note = obsKgWk!=null
    ? `Dein Gewicht ändert sich aktuell <b style="color:var(--t1)">${obsKgWk>=0?"+":""}${obsKgWk.toFixed(2).replace(".",",")} kg/Woche</b>. Die Engine gleicht dein Ziel automatisch mit deiner echten Kurve ab${adj!==0?` (bereits ${adjTxt} angepasst)`:""} — so wird es Woche für Woche genauer.`
    : `Sobald du dich ~2 Wochen regelmäßig wiegst, gleicht die Engine dein Kalorienziel automatisch mit deiner echten Gewichtskurve ab — und korrigiert die Schätzung auf deinen realen Stoffwechsel.`;
  return `<div class="card"><p class="ct">${icon("activity",14)} Dein Stoffwechsel · selbstlernend</p>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:10px">
      ${stat("Erhaltung",nfi.format(maint))}
      ${stat("Dein Ziel",nfi.format(intakeAvg),deltaPct<0?"volt-txt":deltaPct>0?"warn-txt":"")}
      ${stat("Lern-Korrektur",adj===0?"±0":(adj<0?"−"+Math.abs(adj):"+"+adj),adj!==0?"volt-txt":"t2")}
    </div>
    <p class="xs t2 mt8" style="text-align:center">${deltaPct===0?"Erhaltung":(deltaPct<0?deltaPct+"% Defizit":"+"+deltaPct+"% Überschuss")} · ${p.tg.dirLabel}</p>
    ${chart}
    <p class="sm t2 mt12" style="line-height:1.55">${note}</p></div>`;
}

        ${groups.map(m=>{
          const v=w0[m]||0, [lo,hi]=VOL_BANDS[m];
          const scale=Math.max(hi,v)*1.1;
          const status=v<lo?["zu niedrig","var(--info)"]:v>hi?["zu hoch","var(--danger)"]:["optimal","var(--volt)"];
          return `<div class="mb12"><div class="row mb4"><span class="sm" style="font-weight:600">${m}</span>
            <span class="metric xs ${v<lo?"":v>hi?"danger-txt":"volt-txt"}">${v} Sätze · ${status[0]}</span></div>
            <div style="position:relative;height:14px;background:var(--s3);border-radius:7px;overflow:hidden">
              <div style="position:absolute;left:${lo/scale*100}%;width:${(hi-lo)/scale*100}%;top:0;bottom:0;background:rgba(96,140,230,.16)"></div>
              <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,v/scale*100)}%;background:${status[1]};opacity:.8;border-radius:7px"></div>
            </div>
            <p class="xs t2" style="margin-top:3px">Optimal: ${lo}–${hi} Sätze/Woche</p></div>`;
        }).join("")}
      </div>`;
    }
  }

  // RPE
  if(allSets.length>=10){
    const rpeCounts={7:0,8:0,9:0,10:0};
    allSets.forEach(s=>{const k=Math.min(10,Math.max(7,Math.round(s.rpe??8)));rpeCounts[k]++;});
    const total=allSets.length, pct10=Math.round(rpeCounts[10]/total*100);
    html+=`<div class="card"><p class="ct">Wie hart du wirklich trainierst</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">
        ${[7,8,9,10].map(k=>{const pc=rpeCounts[k]/total;
          return `<div style="flex:1;text-align:center">
            <div style="height:${Math.max(4,pc*76)}px;background:${k<=8?"var(--volt)":k===9?"var(--warn)":"var(--danger)"};border-radius:4px 4px 0 0;opacity:.85"></div>
            <p class="metric xs t2" style="margin-top:4px">RPE ${k}</p><p class="metric xs">${Math.round(pc*100)} %</p></div>`;}).join("")}
      </div>
      ${pct10>20?`<p class="warncard mt8" role="alert"><b>Übertrainings-Risiko:</b> ${pct10} % RPE-10-Sätze. <span class="conf">Konfidenz 75 %</span></p>`:`<p class="xs t2 mt8">Zielzone: ~70 % bei RPE 7–8 (Helms et al., 2016).</p>`}</div>`;
  } else html+=gateCard("Wie hart du wirklich trainierst",10,allSets.length,"Sätze","Training beginnen","train");

  // Körper
  if(S.weightLog.length>=3){
    const w7=S.weightLog;
    const wMin=Math.min(...w7.map(q=>q.v)),wMax=Math.max(...w7.map(q=>q.v));
    const lastW=w7[w7.length-1].v, hM=a.height/100, bmi=Math.round(lastW/(hM*hM)*10)/10;
    const bf=a.bodyFat!=null?a.bodyFat:null;
    const lean=bf!=null?Math.round(lastW*(1-bf/100)*10)/10:null;
    const ffmi=lean!=null?Math.round((lean/(hM*hM)+6.1*(1.8-hM))*10)/10:null;
    html+=`<div class="card"><p class="ct">Deine Körperentwicklung</p>
      <svg viewBox="0 0 340 170" style="width:100%;aspect-ratio:2/1;display:block" aria-hidden="true">
        ${w7.map((q,i)=>{const x=8+i/Math.max(1,w7.length-1)*324,y=160-(q.v-wMin)/(wMax-wMin||1)*144;
          return `<circle cx="${x}" cy="${y}" r="1.6" fill="var(--t3)"/>`;}).join("")}
        <path d="${w7.map((q,i)=>{const win=w7.slice(Math.max(0,i-6),i+1),avg=win.reduce((s,z)=>s+z.v,0)/win.length;
          const x=8+i/Math.max(1,w7.length-1)*324,y=160-(avg-wMin)/(wMax-wMin||1)*144;return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}).join(" ")}"
          fill="none" stroke="var(--volt)" stroke-width="2"/></svg>
      <div class="chips mt8">
        <span class="badge mute">Aktuell <span class="metric" style="margin-left:4px">${fmtKg(lastW)}</span></span>
        <span class="badge mute">BMI <span class="metric" style="margin-left:4px">${nf.format(bmi)}</span></span>
        ${ffmi!=null?`<span class="badge mute">FFMI <span class="metric" style="margin-left:4px">${nf.format(ffmi)}</span></span>`:""}
      </div></div>`;
  } else html+=gateCard("Deine Körperentwicklung",3,S.weightLog.length,"Wiegungen","Gewicht eintragen","profile");

  // Recovery — öffnet bei manuellen Checks ODER gemessenen Health-Daten (HRV/Ruhepuls)
  if(S.readinessHistory.length>=5 || S.hrvLog.length>=3 || S.rhrLog.length>=5){
    const r14=S.readinessHistory.slice(-14);
    const debt=r14.length?Math.round(r14.reduce((s,x)=>s+Math.max(0,8-(x.sleepH||7)),0)*10)/10:null;
    const hrvB=hrvBaseline(), rhrB=rhrBaseline();
    const hrv7=S.hrvLog.slice(-7), rhr7=S.rhrLog.slice(-7);
    const hrvAvg=hrv7.length?Math.round(hrv7.reduce((s,x)=>s+x.v,0)/hrv7.length):null;
    const rhrAvg=rhr7.length?Math.round(rhr7.reduce((s,x)=>s+x.v,0)/rhr7.length):null;
    html+=`<div class="card"><p class="ct">Deine Erholung im Blick${r14.length?` · ${r14.length} Tage`:""}</p>
      ${r14.length?`<div style="display:flex;align-items:flex-end;gap:3px;height:80px">
        ${r14.map(x=>`<div style="flex:1" title="${x.date}: ${x.score}">
          <div style="height:${Math.max(3,x.score/100*76)}px;background:${x.score>=60?"var(--volt)":x.score>=40?"var(--info)":"var(--danger)"};border-radius:2px;opacity:.85"></div></div>`).join("")}
      </div>`:""}
      ${debt!=null?`<div class="row mt8"><span class="sm t2">Schlaf-Defizit (vs. 8 h)</span>
        <span class="metric ${debt>6?"danger-txt":debt>3?"warn-txt":"volt-txt"}">${nf.format(debt)} h</span></div>`:""}
      ${hrvAvg!=null?`<div class="row mt8"><span class="sm t2">HRV Ø 7 Tage ${hrvB!=null?`(Baseline ${hrvB})`:""}</span>
        <span class="metric ${hrvB!=null&&hrvAvg>=hrvB?"volt-txt":hrvB!=null?"warn-txt":""}">${hrvAvg} ms</span></div>`:""}
      ${rhrAvg!=null?`<div class="row mt8"><span class="sm t2">Ruhepuls Ø 7 Tage ${rhrB!=null?`(Baseline ${rhrB})`:""}</span>
        <span class="metric ${rhrB!=null&&rhrAvg<=rhrB?"volt-txt":rhrB!=null?"warn-txt":""}">${rhrAvg} bpm</span></div>`:""}
      ${(hrvAvg!=null||rhrAvg!=null)?`<p class="xs t2 mt8" style="line-height:1.55">HRV über und Ruhepuls unter deiner Baseline = gut erholt. Diese Messwerte färben deine Tage im Monats-Überblick.</p>`:""}</div>`;
  } else html+=gateCard("Recovery","5",S.readinessHistory.length,"Status-Checks");

  // Ernährung
  const nutriDays=Object.keys(S.nutritionLog).filter(d=>(S.nutritionLog[d].meals||[]).length>0);
  if(nutriDays.length>=3){
    const days7=[...Array(7)].map((_,i)=>dkey(new Date(Date.now()-(6-i)*dayMs)));
    const nutri7=days7.map(d=>{
      const log=S.nutritionLog[d];
      if(!log)return{d,k:0,p:0,c:0,f:0};
      return {d,...log.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p,c:x.c+m.c,f:x.f+m.f}),{k:0,p:0,c:0,f:0})};
    });
    const macroSum=nutri7.reduce((s,x)=>({p:s.p+x.p,c:s.c+x.c,f:s.f+x.f}),{p:0,c:0,f:0});
    const kcalMax=Math.max(...nutri7.map(x=>x.k),p.tg.train.kcal)*1.1;
    const protDays=nutri7.filter(x=>x.p>=p.tg.train.p).length, protTracked=nutri7.filter(x=>x.k>0).length||1;
    html+=`<div class="card"><p class="ct">Ernährung · 7 Tage</p>
      <div style="display:flex;align-items:flex-end;gap:5px;height:90px;position:relative">
        <div style="position:absolute;left:0;right:0;bottom:${p.tg.train.kcal/kcalMax*80}px;border-top:1px dashed var(--volt);opacity:.6"></div>
        ${nutri7.map(x=>`<div style="flex:1;text-align:center">
          <div style="height:${Math.max(2,x.k/kcalMax*80)}px;background:${x.k>0&&Math.abs(x.k-p.tg.train.kcal)/p.tg.train.kcal<=.1?"var(--volt)":"var(--t3)"};border-radius:3px 3px 0 0;opacity:.85"></div>
          <p class="xs t2" style="margin-top:3px">${x.d.slice(8)}</p></div>`).join("")}
      </div>
      <div class="row mt8"><span class="sm t2">Protein-Treue</span>
        <span class="metric ${protDays/protTracked>=.7?"volt-txt":"warn-txt"}">${protDays}/${protTracked} Tage</span></div>
      ${(()=>{const da7=dietAdherence(7);return da7?`<div class="row mt8"><span class="sm t2">${LABELS.adherence} ${infoBtn("adherence")}</span>
        <span class="metric ${da7.pct>=70?"volt-txt":"warn-txt"}">${da7.pct} % <span class="conf">· ${da7.conf} %</span></span></div>`:"";})()}
      <div class="row mt8" style="justify-content:flex-start;gap:16px">
        ${donutSVG([{v:macroSum.p*4,col:"var(--volt)"},{v:macroSum.c*4,col:"var(--info)"},{v:macroSum.f*9,col:"var(--t3)"}],90)}
        <div class="sm t2" style="line-height:1.9">
          <span style="color:var(--volt)">●</span> Protein ${nfi.format(macroSum.p*4)} kcal<br>
          <span style="color:var(--info)">●</span> Carbs ${nfi.format(macroSum.c*4)} kcal<br>
          <span style="color:var(--t3)">●</span> Fett ${nfi.format(macroSum.f*9)} kcal</div></div></div>`;
  } else html+=gateCard("Ernährungs-Analytics","3",nutriDays.length,"Tage geloggt");

  // Versorgst du deinen Körper richtig?: NUR aus tatsächlich geloggten Top-10-Lebensmitteln (PERFORMANCE)
  if(S.tier==="free"){
    html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig?</p>
      <div class="lockcard" style="margin-top:0"><p class="sm">${icon("lock",13)} Vitamin-D-, B12-, Eisen- und Magnesium-Schätzung aus deinen Logs — Teil von PERFORMANCE.</p>
      <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('micro')">Freischalten</button></div></div>`;
  } else if(nutriDays.length>=3){
    const sums=[0,0,0,0]; let hits=0;
    for(const [d,l] of Object.entries(S.nutritionLog)){
      if(Date.now()-new Date(d).getTime()>=7*dayMs)continue;
      for(const m of (l.meals||[])){
        const key=Object.keys(MICRO).find(k=>m.n.startsWith(k));
        if(!key)continue;
        const base=(FOODS.find(x=>x[0]===key)||[,100])[1];
        const mult=(m.g||base)/base;
        MICRO[key].forEach((v,i)=>{sums[i]+=v*mult;}); hits++;
      }
    }
    if(hits>0){
      html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig? · 7 Tage ${infoBtn("micro")}</p>
        ${MICRO_NAMES.map((nme,i)=>{const pc=Math.min(100,Math.round(sums[i]/(MICRO_REF[i]*7)*100));
          return `<div class="barrow"><span class="blbl">${nme}</span>
            <div class="btrack"><div class="bfill" style="width:${pc}%;background:${pc>=70?"var(--volt)":pc>=40?"var(--info)":"var(--warn)"}"></div></div>
            <span class="bval metric">${pc} %</span></div>`;}).join("")}
        <p class="xs t2 mt8">Geschätzt aus ${hits} geloggten Einträgen mit hinterlegten Werten — Richtungsanzeige, kein vollständiges Tracking.</p></div>`;
    } else {
      html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig? ${infoBtn("micro")}</p>
        <p class="sm t2">Noch keine Lebensmittel mit hinterlegten Mikronährwerten geloggt (z. B. Lachs, Eier, Haferflocken, Spinat).</p></div>`;
    }
  } else html+=gateCard("Versorgst du deinen Körper richtig?",3,nutriDays.length,"Tage","Mahlzeit loggen","nutrition");

  // Insights — Tier-Slicing: Free 1 / Pro 5 / Elite 8, Lock-Card nennt Kategorien
  const insCap=S.tier==="free"?1:(S.tier==="elite"?8:5);
  const visIns=ins.slice(0,insCap);
  const hiddenIns=ins.slice(insCap);
  const hiddenCats=[...new Set(hiddenIns.map(i=>/Fortschrittstempo/.test(i.t)?LABELS.velocity:/Ernährungs-Treue/.test(i.t)?LABELS.adherence:/Trainingsbelastung/.test(i.t)?LABELS.volume:/Übertrain/.test(i.t)?"Übertrainings-Risiko":"Trend-Analyse"))];
  html+=visIns.length?`<div class="card"><p class="ct">${icon("sparkle",14)} Was deine Daten dir sagen</p>
    ${visIns.map(i=>`<div class="${i.risk?"warncard":"msg ai"}" style="max-width:100%;margin-bottom:8px">${i.t}<div class="conf mt8">Konfidenz ${i.conf} %</div></div>`).join("")}
    ${hiddenIns.length?`<div class="lockcard"><p class="sm">${icon("lock",13)} ${hiddenIns.length} weitere ${hiddenIns.length===1?"Insight":"Insights"} verfügbar — ${hiddenCats.slice(0,3).join(", ")}.</p>
      <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('insights')">${TIER_LABEL[S.tier==="free"?"pro":"elite"]} freischalten</button></div>`:""}</div>`
  :`<div class="card"><p class="ct">${icon("sparkle",14)} Was deine Daten dir sagen</p><p class="sm t2">Sobald deine Daten ein belastbares Muster zeigen, erklärt dir die Engine deinen Fortschritt.</p></div>`;

  root.innerHTML=html;
}

let dayType="train", pendingItems=null, pendingManual=null;
// Makro-„Batterie": horizontaler Füllbalken mit Zielmarke und Über-/Unterzustand
function macroBattery(label,cur,target,col,priority){
  const pct=target?Math.min(100,cur/target*100):0;
  const over=cur>target*1.08;
  return `<div style="margin-bottom:13px">
    <div class="row mb4"><span class="sm" style="font-weight:${priority?700:600}">${label}${priority?' <span class="xs" style="color:var(--hl);font-weight:700">· Priorität</span>':""}</span>
      <span class="metric xs ${over?"warn-txt":pct>=90?"volt-txt":"t2"}">${nfi.format(cur)} / ${nfi.format(target)} g</span></div>
    <div class="fxtrack" style="height:14px;border-radius:7px">
      <div class="fxfill" style="width:${Math.max(pct,1.5)}%;border-radius:7px;background:${over?"linear-gradient(90deg,#E0A24A,#D4574B)":priority?"linear-gradient(90deg,#A9C2E6,#4A6FD8)":"linear-gradient(90deg,#9DB4F0,#7E8BE8)"}"></div>
      <div style="position:absolute;left:90%;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.28)"></div>
    </div></div>`;
}
// Energie-Budget: verbleibende kcal als Held + segmentierter Makro-Treibstoffbalken
function energyBudget(sum,tg){
  const remaining=tg.kcal-sum.k, over=remaining<0;
  const pk=sum.p*4,ck=sum.c*4,fk=sum.f*9, fuel=pk+ck+ffFix(fk)||1;
  const fillPct=Math.min(100,sum.k/tg.kcal*100);
  const seg=(v,grad)=>`<div style="width:${fuel?v/fuel*100:0}%;background:${grad}"></div>`;
  return `<div style="text-align:center;padding:6px 0 2px">
      <p class="hero-num" style="font-size:46px;line-height:1;${over?"color:var(--warn)":""}">${over?"+"+nfi.format(-remaining):nfi.format(remaining)}</p>
      <p class="xs t2" style="margin-top:2px">${over?"kcal über Ziel":"kcal übrig"} · ${nfi.format(sum.k)} von ${nfi.format(tg.kcal)} kcal</p>
    </div>
    <div class="fxtrack" style="height:20px;margin:14px 0 8px">
      <div class="fxfill" style="display:flex;width:${Math.max(fillPct,1.5)}%;background:${over?"linear-gradient(90deg,#E0A24A,#D4574B)":""}">
        ${over?"":seg(pk,"linear-gradient(180deg,#A9C2E6,#4A6FD8)")+seg(ck,"linear-gradient(180deg,#8FA0C0,#5B6B85)")+seg(fk,"linear-gradient(180deg,#E8B264,#C98A3D)")}
      </div>
      <div style="position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.4);border-radius:2px"></div>
    </div>
    <div class="row" style="justify-content:center;gap:14px">
      <span class="xs t2" style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:var(--hl);display:inline-block"></span>Protein</span>
      <span class="xs t2" style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:#7D8CA3;display:inline-block"></span>Carbs</span>
      <span class="xs t2" style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:var(--warn);display:inline-block"></span>Fett</span>
    </div>`;
}
function ffFix(x){return x;} // (Helfer für Lesbarkeit der Treibstoff-Summe)
function nutritionStats(sum){
  const p=S.profile, bw=p.a.weight||80;
  // Ziel-Verhältnis (wissenschaftlich, ~1,8 g/kg) statt des verwirrenden Tages-Iststands
  const ppkg=Math.round(p.tg.train.p/bw*10)/10;
  const last7=[...Array(7)].map((_,i)=>dkey(new Date(Date.now()-i*dayMs))).map(k=>S.nutritionLog[k]).filter(l=>l&&(l.meals||[]).length);
  const avgK=last7.length?Math.round(last7.reduce((s,l)=>s+l.meals.reduce((a,m)=>a+m.k,0),0)/last7.length):0;
  let streak=0;
  for(let d=0;;d++){const key=dkey(new Date(Date.now()-d*dayMs));const l=S.nutritionLog[key];
    if(!l||!(l.meals||[]).length){if(d===0)continue;break;}
    if(l.meals.reduce((s,m)=>s+m.p,0)>=p.tg.train.p*0.9)streak++;else break;}
  return [["metric",ppkg.toString().replace(".",","),"g/kg Protein-Ziel"],["metric",avgK?nfi.format(avgK):"—","Ø kcal · 7 T"],["",streak+(streak===1?" Tag":" Tage"),"Protein-Streak"]];
}
function renderNutrition(){
  const p=S.profile; let tg=p.tg[dayType==="train"?"train":"rest"];
  // Wearable: liegt für heute ein echter Aktiv-Verbrauch vor, ersetzt er die Schätzung
  // -> Tagesziel = Ruhetag-Basis + tatsächlich verbrannte Aktiv-Kalorien (echtes TDEE).
  const wearKcal=S.wearActive[todayKey()];
  if(wearKcal!=null){ const adj=Math.round(p.tg.rest.kcal+wearKcal); tg=Object.assign({},p.tg.rest,{kcal:adj,c:Math.max(0,Math.round((adj-p.tg.rest.p*4-p.tg.rest.f*9)/4))}); }
  const log=nlogToday();
  const sum=log.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p,c:s.c+m.c,f:s.f+m.f}),{k:0,p:0,c:0,f:0});
  A.dt=(t)=>{dayType=t;renderNutrition();};
  A.delMeal=(i)=>{log.meals.splice(i,1);save();renderNutrition();};
  A.water=(d)=>{log.water=Math.max(0,Math.min(12,(log.water||0)+d));save();renderNutrition();};
  A.foodInput=(el)=>{
    const q=el.value.trim().toLowerCase(), ac=document.getElementById("food-autocomplete");
    if(!ac)return;
    if(q.length<2){ac.style.display="none";ac.innerHTML="";return;}
    let matches=FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,5);
    // Kein wörtlicher Treffer? Tippfehler-/phonetische Erkennung als Fallback ("skier" → Skyr).
    if(!matches.length){ const hit=matchFood(q); if(hit)matches=[hit.f]; }
    if(!matches.length){ac.style.display="none";return;}
    ac.style.display="block";
    ac.innerHTML=matches.map((f)=>`<button class="ac-item" onclick="A.acPick(${FOODS.indexOf(f)})">${f[0]} <span class="xs t2">· ${nfi.format(f[2])} kcal / ${f[1]} g</span></button>`).join("");
  };
  A.acPick=(idx)=>{
    document.getElementById("food-name").value=FOODS[idx][0];
    const ac=document.getElementById("food-autocomplete"); if(ac)ac.style.display="none";
    document.getElementById("food-gram").focus();
  };
  A.addCustomFood=()=>{
    const name=document.getElementById("food-name").value.trim();
    const gram=parseInt(document.getElementById("food-gram").value)||null;
    if(!name){toast("Lebensmittel eingeben");return;}
    const exact=FOODS.find(f=>f[0].toLowerCase()===name.toLowerCase())||FOODS.find(f=>f[0].toLowerCase().includes(name.toLowerCase()))||((matchFood(name)||{}).f);
    if(exact){ const e=addFood(exact,gram); toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`); renderNutrition(); }
    else { pendingManual={name,gram:gram||100}; renderNutrition(); }
  };
  A.manualSave=()=>{
    const k=parseInt(document.getElementById("m-k").value)||0;
    const pp=parseFloat(document.getElementById("m-p").value)||0;
    const c=parseFloat(document.getElementById("m-c").value)||0;
    const f=parseFloat(document.getElementById("m-f").value)||0;
    if(k<=0){toast("Kalorien angeben");return;}
    nlogToday().meals.push({n:pendingManual.name+` (${pendingManual.gram} g)`,g:pendingManual.gram,k,p:pp,c,f});
    pendingManual=null; save(); renderNutrition();
  };
  A.manualCancel=()=>{pendingManual=null;renderNutrition();};
  A.parseFood=()=>{
    const el=document.getElementById("quicklog-in");
    const txt=(el&&el.value.trim())||""; if(!txt)return;
    // KI ZUERST: erkennt JEDES Gericht kontextuell (auch "Kaiserschmarrn mit Rosinen
    // & Apfelmus"), korrigiert Tippfehler, schätzt Makros. Ohne KI → geprüfte Datenbank.
    if(aiActive()){ A.aiParse(txt); return; }
    const items=parseNutrition(txt);
    if(items.some(i=>i.food)){ pendingItems=items; renderNutrition(); return; }
    toast("Nichts erkannt — z. B. '200 g Hähnchen und 150 g Reis'");
  };
  // KI-Parsing: ganze Eingabe → einzelne Posten mit geschätzten Nährwerten. Ergebnis wird
  // als Vorschau gezeigt (Übernehmen/Verwerfen) — nichts wird blind geloggt.
  A.aiParse=(txt)=>{
    txt=txt||((document.getElementById("quicklog-in")||{}).value||"").trim();
    if(!txt){toast("Schreib zuerst, was du gegessen hast");return;}
    const dbFallback=(silentMsg)=>{ const db=parseNutrition(txt);
      if(db.some(i=>i.food)){ pendingItems=db; renderNutrition(); if(silentMsg)toast(silentMsg); }
      else { pendingItems=null; renderNutrition(); toast("Konnte nicht deuten — bitte etwas konkreter"); } };
    if(!aiActive()){ dbFallback(); return; }
    pendingItems=[{loading:true}]; renderNutrition();
    const sys='Du bist ein Ernährungs-Experte. Zerlege die freie deutsche Eingabe in einzelne '
      +'Lebensmittel/Gerichte/Getränke und schätze realistische Nährwerte (Hausmannskost, '
      +'Restaurant, Marken, Cocktails). Erkenne Umgangssprache, Tippfehler und zusammengesetzte '
      +'Gerichte wie "Kaiserschmarrn mit Rosinen und Apfelmus" als sinnvolle Posten. Fehlt eine '
      +'Menge, nimm eine typische Portion. Antworte NUR mit JSON: '
      +'{"items":[{"name":"sauberer dt. Name","grams":<int g/ml>,"kcal":<int>,"p":<int>,"c":<int>,"f":<int>,"conf":<0..1>}]}. '
      +'Wenn es gar kein Essen/Getränk ist: {"items":[]}.';
    aiJSON(sys,'Eingabe: "'+txt+'"').then(j=>{
      const items=(((j&&j.items))||[]).filter(it=>it&&it.kcal>0).map(it=>({ai:true,
        name:String(it.name||txt).slice(0,60), gram:Math.max(0,Math.round(it.grams||0)),
        kcal:Math.round(it.kcal), p:Math.round(it.p||0), c:Math.round(it.c||0), f:Math.round(it.f||0),
        conf:Math.max(0.5,Math.min(0.97,it.conf||0.82))}));
      if(!items.length){ dbFallback(); return; }
      pendingItems=items; renderNutrition();
    }).catch(()=>dbFallback("KI gerade offline — Datenbank-Erkennung genutzt"));
  };
  A.mealSuggest=()=>{
    if(!aiActive()){toast("KI-Coach im Profil aktivieren (Profil)");return;}
    const tgX=p.tg[dayType==="train"?"train":"rest"], lg=nlogToday();
    const su=lg.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p}),{k:0,p:0});
    const remK=Math.max(0,tgX.kcal-su.k), remP=Math.max(0,tgX.p-Math.round(su.p));
    modal(`<p class="ct">${icon("sparkle",14)} Coach Metric überlegt …</p><p class="sm t2" id="meal-sg" style="line-height:1.6">…</p>`);
    aiComplete(aiPersona(),`Mir fehlen heute noch ${remK} kcal und ${remP} g Protein (Tagesziel ${tgX.kcal} kcal / ${tgX.p} g Protein). Schlag mir 2 konkrete, einfache Mahlzeiten vor, die das ungefähr treffen — kurz, mit groben Mengen.`,{max:320})
      .then(t=>{const el=document.getElementById("meal-sg"); if(el)el.innerHTML=(t||"—").replace(/\n/g,"<br>");})
      .catch(()=>{const el=document.getElementById("meal-sg"); if(el)el.textContent="Gerade nicht erreichbar — versuch es gleich nochmal.";});
  };
  A.approveItems=()=>{
    let n=0;
    for(const it of (pendingItems||[])){
      if(!it||typeof it!=="object"||it.loading) continue;       // defensiv: kaputte Posten überspringen
      if(it.food){ addFood(it.food,it.gram); n++; }
      else if(it.ai&&it.kcal>0){ nlogToday().meals.push({n:(it.name||"Eintrag")+" (KI)",g:it.gram||0,k:Math.round(it.kcal),p:Math.round(it.p||0),c:Math.round(it.c||0),f:Math.round(it.f||0)}); n++; }
    }
    save();
    const el=document.getElementById("quicklog-in"); if(el)el.value="";
    pendingItems=null; toast(`✓ ${n} ${n===1?"Eintrag":"Einträge"} eingetragen`); renderNutrition();
  };
  A.cancelItems=()=>{pendingItems=null;renderNutrition();};
  A.quick=(i)=>{const e=addFood(FOODS[i],null);toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`);renderNutrition();};
  // MOCK: Foto-Erkennung — wählt deterministisch (Dateigröße) ein Lebensmittel aus FOODS.
  // TODO Real: Vision-API (z. B. Claude/GPT-4V) für echte Lebensmittel-Erkennung + Mengenschätzung.
  A.photoPick=async(el)=>{
    const f=el.files&&el.files[0]; if(!f)return; el.value="";
    if(!aiActive()){ // ohne KI: Foto-Erkennung nicht möglich → Hinweis
      toast("Foto-Erkennung braucht die KI — sonst bitte per Text loggen"); return; }
    pendingItems=[{loading:true}]; renderNutrition();
    try{
      const img=await downscaleImage(f,1100);
      const sys='Du erkennst Essen/Getränke auf einem Foto und schätzt realistische Nährwerte. '
        +'Liste alle erkennbaren Posten. Antworte NUR mit JSON: '
        +'{"items":[{"name":"dt. Name","grams":<int g/ml>,"kcal":<int>,"p":<int>,"c":<int>,"f":<int>,"conf":<0..1>}]}. '
        +'Wenn kein Essen erkennbar: {"items":[]}.';
      const j=await aiVisionJSON(sys,"Was ist auf diesem Foto? Schätze die Portionen.",[img]);
      const items=(((j&&j.items))||[]).filter(it=>it&&it.kcal>0).map(it=>({ai:true,photo:true,
        name:String(it.name||"Foto").slice(0,60), gram:Math.max(0,Math.round(it.grams||0)),
        kcal:Math.round(it.kcal), p:Math.round(it.p||0), c:Math.round(it.c||0), f:Math.round(it.f||0),
        conf:Math.max(0.5,Math.min(0.97,it.conf||0.75))}));
      if(!items.length){ pendingItems=null; renderNutrition(); toast("Auf dem Foto war kein Essen erkennbar"); return; }
      pendingItems=items; renderNutrition();
    }catch(e){ pendingItems=null; renderNutrition(); toast("Foto-Analyse fehlgeschlagen — versuch es nochmal"); }
  };
  A.explainSat=()=>A.explain("satiety");
  // Ein-Tipp-Favoriten: meistgeloggte Lebensmittel, sonst sinnvolle Defaults
  const tally={};
  Object.values(S.nutritionLog).forEach(l=>(l.meals||[]).forEach(m=>{const base=m.n.replace(/ \(.*\)$/,"");tally[base]=(tally[base]||0)+1;}));
  let favIdx=Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([n])=>FOODS.findIndex(f=>f[0]===n)).filter(i=>i>=0);
  ["Hähnchenbrust","Magerquark","Haferflocken","Banane (1 mittel)","Reis (weiß, gekocht)","Ei (1 Stück)"].forEach(n=>{const i=FOODS.findIndex(f=>f[0]===n);if(i>=0&&!favIdx.includes(i))favIdx.push(i);});
  favIdx=favIdx.slice(0,6);
  const waterGlasses=log.water||0, waterMl=waterGlasses*250;
  root.innerHTML=`
    ${banner("nutrition","utensils","<b>Loggen in 10 Sekunden.</b> Tippen oder einsprechen — Kalorien und Protein rechnet die Engine für dich.")}
    <div class="card">
      <div class="row mb16" style="background:var(--s2);border-radius:999px;padding:4px;border:1px solid var(--border)">
        <button class="btn ${dayType==="train"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('train')">Trainingstag</button>
        <button class="btn ${dayType==="rest"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('rest')">Ruhetag</button></div>
      ${energyBudget(sum,tg)}
      <p class="xs t2" style="text-align:center;line-height:1.5;margin-top:4px">${wearKcal!=null
        ? `${icon("activity",12)} <b style="color:var(--hl)">An dein Wearable angepasst:</b> ${nfi.format(wearKcal)} kcal aktiv heute → Tagesziel = Ruhebedarf + echter Verbrauch.`
        : dayType==="train"
        ? `Trainingstag-Ziel — enthält die Kalorien, die du in der Einheit verbrennst (≈ ${nfi.format(Math.max(0,p.tg.train.kcal-p.tg.rest.kcal))} kcal mehr als am Ruhetag). <b style="color:var(--t1)">Trainierst du nicht oder lässt das Cardio aus, nimm das Ruhetag-Ziel.</b>`
        : `Ruhetag-Ziel — die Basis ohne Trainingsverbrauch. An Trainingstagen darfst du entsprechend mehr essen.`}</p>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px">
        ${nutritionStats(sum).map(([cls,v,l])=>`<div style="background:var(--s2);border-radius:12px;padding:11px 6px;text-align:center">
          <p class="${cls}" style="font-size:17px;font-weight:700">${v}</p><p class="xs t2" style="margin-top:2px">${l}</p></div>`).join("")}
      </div>
      <p class="xs t2 mt8" style="text-align:center">Ziele aus deinem Profil ${infoBtn("kcalTarget")} ${infoBtn("protein")}</p>
    </div>

    <div class="card"><p class="ct">Makros heute</p>
      ${macroBattery("Protein",sum.p,tg.p,"var(--hl)",true)}
      ${macroBattery("Carbs",sum.c,tg.c,"#7D8CA3",false)}
      ${macroBattery("Fett",sum.f,tg.f,"var(--warn)",false)}
      <p class="xs t2 mt4">Die Marke zeigt 90 % deines Ziels. Protein zuerst — der größte Hebel für Muskelaufbau und Sättigung.</p>
    </div>

    <!-- SMART-LOG: KI-Natursprache als primäre Methode (ersetzt das alte „Schnell loggen") -->
    <div class="card">
      <p class="ct">${icon("sparkle",14)} Smart-Log${aiActive()?'<span class="badge volt" style="font-size:9px;margin-left:6px">KI aktiv</span>':""}</p>
      <p class="xs t2 mb12" style="line-height:1.5">Schreib oder sprich einfach, was du gegessen hast — auch mehrere Sachen, mit Tippfehlern. Die KI erkennt alles, rechnet Kalorien & Makros und trägt es ein.</p>
      ${quickLogField("z. B. „2 Eier, Haferflocken mit Banane und ein Proteinshake“","A.parseFood")}
      ${favIdx.length?`<p class="label" style="margin:16px 0 8px">Schnellzugriff</p><div class="chips mb4">${favIdx.map(i=>`<button class="chip" onclick="A.quick(${i})">+ ${FOODS[i][0].replace(/ \(.*\)$/,"")}</button>`).join("")}</div>`:""}
      <div class="mt12" style="display:grid;grid-template-columns:auto 1fr;gap:8px">
        <button class="btn" style="padding:0 22px;white-space:nowrap" onclick="document.getElementById('vf-file').click()">${icon("camera",15)} Foto</button>
        <button class="btn" style="white-space:nowrap;font-size:14px" onclick="A.mealSuggest()">${icon("message",15)} Was soll ich essen?</button>
      </div>
      <input type="file" id="vf-file" accept="image/*" capture="environment" style="display:none" onchange="A.photoPick(this)">
      ${pendingItems?(pendingItems[0]&&pendingItems[0].loading
        ?`<div class="warncard" style="border-color:rgba(96,140,230,.4);background:rgba(96,140,230,.06)">
          <div class="row" style="align-items:center;gap:10px"><div class="spin" style="width:18px;height:18px;border-width:2px"></div>
          <span class="sm t2">Coach Metric liest deinen Eintrag …</span></div></div>`
        :`<div class="warncard" style="border-color:rgba(96,140,230,.4);background:rgba(96,140,230,.06)">
        ${pendingItems.some(it=>it.ai)?`<p class="xs t2 mb8">${icon("sparkle",11)} ${pendingItems.some(it=>it.photo)?"Vom Foto erkannt":"Von der KI erkannt"} & geschätzt — vor dem Übernehmen kurz prüfen.</p>`:""}
        ${pendingItems.map(it=>it.food?`
          <div class="row mb4"><span class="sm">${it.fuzzy?`<span class="xs t2">„${it.raw.trim()}" erkannt als</span> `:""}${it.food[0]} · <span class="metric">${it.gram} g</span></span>
          <span class="metric xs t2">${nfi.format(it.food[2]*it.gram/it.food[1])} kcal <span class="conf">· ${Math.round(it.conf*100)} %</span></span></div>`
          :it.ai?`
          <div class="row mb4"><span class="sm">${it.name} · <span class="metric">${it.gram?it.gram+" g":"Portion"}</span></span>
          <span class="metric xs t2">${nfi.format(it.kcal)} kcal · ${it.p} g P</span></div>`
          :`<p class="xs danger-txt mb4">„${it.raw}" nicht erkannt — tipp es unten bei „Suche & manuell" ein</p>`).join("")}
        <div class="grid2 mt8"><button class="btn" onclick="A.cancelItems()">Verwerfen</button>
        <button class="btn volt" onclick="A.approveItems()">Übernehmen</button></div></div>`):""}
    </div>

    <details class="acc"><summary>Suche &amp; manuell eingeben<span class="chev">${icon("chevron",15)}</span></summary>
      <div class="accbody">
      <div class="row mb8">

    <div class="card"><div class="row mb8"><p class="ct" style="margin:0">${icon("droplet",14)} Wasser</p>
      <span class="metric sm ${waterMl>=2500?"volt-txt":"t2"}">${nf.format(waterMl/1000)} / 2,5 l</span></div>

      </div></div>

    <div class="card"><div class="row mb8"><p class="ct" style="margin:0">Heute geloggt</p>
      <div class="viewtoggle">
        <button class="${S.viewMode.nutrition==="list"?"sel":""}" onclick="A.vm('nutrition','list')" aria-label="Liste">${icon("rows",14)}</button>
        <button class="${S.viewMode.nutrition==="grid"?"sel":""}" onclick="A.vm('nutrition','grid')" aria-label="Galerie">${icon("grid",14)}</button></div></div>
      ${log.meals.length&&S.viewMode.nutrition==="grid"?`<div class="tiles">${log.meals.map((m,i)=>`
        <div class="tile"><div class="tart" style="background:linear-gradient(135deg,#F2EADF,#E9DECF);aspect-ratio:16/9"><span style="opacity:.6">${icon("utensils",26)}</span></div>
        <div class="tbody"><b>${m.n}</b><span class="metric">${nfi.format(m.k)} kcal · ${nf.format(m.p)} P</span></div></div>`).join("")}</div>`
      :log.meals.length?`<ul class="list">${log.meals.map((m,i)=>{
        const sat=satiety(m);
        return `<li><span>${m.n}${sat?` <button class="badge ${sat.cls}" style="cursor:pointer;border:none;font-size:9.5px;padding:2px 7px" onclick="A.explainSat()">${sat.lbl}</button>`:""}</span>
        <span style="display:flex;gap:10px;align-items:center"><span class="metric">${nfi.format(m.k)} kcal</span>
        <button class="iconbtn" style="min-width:32px;min-height:32px;font-size:13px" onclick="A.delMeal(${i})" aria-label="Löschen">✕</button></span></li>`;}).join("")}</ul>`
      :`<p class="sm t2">Noch nichts geloggt — tipp oben auf einen Favoriten oder sprich deine Mahlzeit ein.</p>`}</div>
  `;
}

      ${cta}
    </div>`;
  };
  const founding=FOUNDING_OFFER&&S.tier==="free"?`<div class="founding">${icon("star",16)}
    <div><p class="sm" style="font-weight:700">Gründer-Konditionen</p>
      <p class="xs t2" style="line-height:1.45">Dieser Preis gilt für die erste Mitglieder-Generation — und bleibt für dich erhalten, solange dein Abo läuft.</p></div></div>`:"";
  const trialBanner=trialActive()?`<div class="pw-trial">${icon("zap",16)}
    <div><p class="sm" style="font-weight:700">${TIER_LABEL[S.trialTier]}-Test aktiv · noch ${trialDaysLeft()} Tage</p>
      <p class="xs t2">Voller Zugriff. Du behältst alles, wenn du bis dahin bleibst.</p></div></div>`:"";
  root.innerHTML=`
    <div class="heroband"><h2>Wähle deine Tiefe</h2>
      <p class="sm t2" style="max-width:310px;margin:8px auto 0">START bleibt dauerhaft kostenlos und voll trainierbar. Die höheren Pläne schalten frei, wie genau die Engine dich versteht — und wie weit sie dich bringt.</p></div>
    ${trialBanner}${founding}
    <div class="row mb16" style="background:var(--s2);border-radius:999px;padding:4px;border:1px solid var(--border)">
      <button class="btn ${b==="monthly"?"volt":"ghost"}" style="min-height:40px" onclick="A.billing('monthly')">Monatlich</button>
      <button class="btn ${b==="yearly"?"volt":"ghost"}" style="min-height:40px" onclick="A.billing('yearly')">Jährlich <span class="badge ${b==="yearly"?"mute":"volt"}" style="margin-left:6px">2 Monate gratis</span></button></div>
    ${card("free",false)}
    ${card("pro",true)}
    ${card("elite",false)}
    <div class="card" style="text-align:center">
      <p class="sm" style="font-weight:600;line-height:1.6">Risikofrei testen</p>
      <p class="xs t2" style="line-height:1.7;margin-top:4px">${upTo?`${TRIAL_DAYS} Tage voller Zugriff, keine Zahlung im Voraus. `:""}Jederzeit in einem Tippen kündbar. Dein Datenexport (DSGVO) ist in jedem Plan inklusive — du bist nie eingesperrt.</p>
    </div>

/* =====================================================================
   HEALTH-IMPORT (v5/Phase 8A) — Datei-Import statt unmöglicher Live-Sync.
   Ehrlichkeit: HealthKit/Google Fit sind aus einer Browser-App heraus nicht
   live erreichbar. Wir lesen die exportierte Datei lokal — Gewicht →
   Gewichtsverlauf, Schlafdauer → vorhandene Status-Einträge (nichts wird
   erfunden), Ruhepuls → Erholungs-Übersicht.
   ===================================================================== */
function parseAppleHealthExport(xml){
  const out={weight:[],sleepH:{},rhr:[],hrv:[]};
  const tags=xml.match(/<Record\b[^>]*>/g)||[];
  for(const tag of tags){
    const attr=(n)=>{const m=tag.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:null;};
    const type=attr("type"); if(!type)continue;
    if(type==="HKQuantityTypeIdentifierBodyMass"){
      const v=parseFloat(attr("value")), unit=attr("unit")||"kg", t=Date.parse(attr("startDate")||"");
      if(isFinite(v)&&isFinite(t)) out.weight.push({t,v:/lb/i.test(unit)?Math.round(v*0.45359*10)/10:v});
    } else if(type==="HKCategoryTypeIdentifierSleepAnalysis"){
      const s=Date.parse(attr("startDate")||""), e=Date.parse(attr("endDate")||""), val=attr("value")||"";
      if(isFinite(s)&&isFinite(e)&&e>s&&!/InBed/i.test(val)){
        const d=dkey(new Date(s));
        out.sleepH[d]=(out.sleepH[d]||0)+(e-s)/36e5;
      }
    } else if(type==="HKQuantityTypeIdentifierRestingHeartRate"){
      const v=parseFloat(attr("value")), t=Date.parse(attr("startDate")||"");
      if(isFinite(v)&&isFinite(t)) out.rhr.push({t,v:Math.round(v)});
    } else if(type==="HKQuantityTypeIdentifierHeartRateVariabilitySDNN"){
      const v=parseFloat(attr("value")), t=Date.parse(attr("startDate")||"");
      if(isFinite(v)&&isFinite(t)) out.hrv.push({t,v:Math.round(v)});
    }
  }
  return out;
}
function importHealthData(text,fname){
  const counts={weight:0,sleep:0,rhr:0,hrv:0};
  const mergeWeight=(arr)=>{
    for(const w of arr){
      if(!isFinite(w.t)||!isFinite(w.v)||w.v<20||w.v>400)continue;
      const day=dkey(new Date(w.t));
      if(!S.weightLog.some(x=>dkey(new Date(x.t))===day)){
        S.weightLog.push({t:w.t,v:Math.round(w.v*10)/10}); counts.weight++;
      }
    }
    S.weightLog.sort((a,b)=>a.t-b.t);
  };
  const t=text.trim();
  if(t.startsWith("<")||/\.xml$/i.test(fname)){
    const p=parseAppleHealthExport(t);
    mergeWeight(p.weight);
    // Schlaf: in vorhandene Status-Einträge mergen UND als eigene gemessene Reihe sichern
    // (damit ein Tag auch ohne manuellen Check Erholungsdaten hat).
    for(const [d,h] of Object.entries(p.sleepH)){
      const hh=Math.round(Math.min(14,h)*10)/10;
      const ex=S.readinessHistory.find(r=>r.date===d);
      if(ex){ex.sleepH=hh; counts.sleep++;}
      const t=Date.parse(d+"T08:00:00");
      if(!S.sleepLog.some(x=>x.date===d)){S.sleepLog.push({date:d,t,v:hh}); if(!ex)counts.sleep++;}
    }
    S.sleepLog.sort((a,b)=>a.t-b.t);
    for(const r of p.rhr){ if(!S.rhrLog.some(x=>x.t===r.t)){S.rhrLog.push(r); counts.rhr++;} }
    S.rhrLog.sort((a,b)=>a.t-b.t);
    // HRV (SDNN): pro Tag den Mittelwert behalten — robuster als Einzelmessungen.
    const hrvByDay={};
    for(const h of p.hrv){ const d=dkey(new Date(h.t)); (hrvByDay[d]=hrvByDay[d]||[]).push(h.v); }
    for(const [d,arr] of Object.entries(hrvByDay)){
      const v=Math.round(arr.reduce((s,x)=>s+x,0)/arr.length), t=Date.parse(d+"T08:00:00");
      if(!S.hrvLog.some(x=>x.date===d)){S.hrvLog.push({date:d,t,v}); counts.hrv++;}
    }
    S.hrvLog.sort((a,b)=>a.t-b.t);
    return counts;
  }
  try{
    const j=JSON.parse(t);
    const arr=Array.isArray(j)?j:(Array.isArray(j.weight)?j.weight:[]);
    mergeWeight(arr.map(x=>({t:typeof x.t==="number"?x.t:Date.parse(x.date||x.t||""),v:parseFloat(String(x.weight??x.v??"").toString().replace(",","."))})));
    return counts;
  }catch{}
  const rows=t.split(/\r?\n/).map(l=>l.split(/[;,]/)).filter(r=>r.length>=2);
  const ws=rows.map(r=>({t:Date.parse(r[0]),v:parseFloat(String(r[1]).replace(",","."))})).filter(x=>isFinite(x.t)&&isFinite(x.v));
  if(ws.length){ mergeWeight(ws); return counts; }
  return null;
}

        <div><p class="xs t2">Proteinziel ${infoBtn("protein")}</p><p class="metric sm">${nfi.format(p.tg.train.p)} g</p></div>
