<style>
  /* Typografie (modern): Space Grotesk (Headlines/Hero) · Inter (UI/Fließtext) · JetBrains Mono (Metriken). */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    /* Premium Dark-Theme (Oura-inspiriert): tiefes Blau + Silber, kühl & hochwertig */
    --bg:#080A0F; --s1:#13151C; --s2:#1A1D26; --s3:#262A36; --border:rgba(255,255,255,.12);
    --hairline:rgba(255,255,255,.07);
    --t1:#EEF1F6; --t2:#9BA3B4; --t3:#646C7D;
    --accent:#4A6FD8; --accent-soft:rgba(74,111,216,.18);
    --hl:#9DB4F0; --hl-soft:rgba(157,180,240,.16); /* kühler Blau-Akzent auf Dunkel */
    --volt:#9DB4F0; /* Daten-Highlights (Charts, Deltas) */
    --silver:#C9D2E2; /* Platin/Silber-Sekundärakzent */
    --info:#7FA0C8; --danger:#E56A5C; --warn:#E0A24A;
    --good:#5BC48A; /* Recovery-/Erfolgs-Grün (Whoop-Logik) */
    /* Wiederkehrende Dark-Glass-Flächen: zentral steuerbar */
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08); --stroke:rgba(255,255,255,.10);
    --font-display:'Schibsted Grotesk',system-ui,sans-serif;
    --font-ui:'Inter',system-ui,sans-serif;
    --font-hero:'Schibsted Grotesk',system-ui,sans-serif;
    --font-serif:'Fraunces',Georgia,'Times New Roman',serif; /* editoriale Insight-Headlines */
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --glass-bg:rgba(30,28,36,.55);
    --glass-bg-strong:rgba(22,21,27,.88);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:dark;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:var(--font-ui);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    letter-spacing:-0.005em; line-height:1.5;
    min-height:100dvh;
  }
  /* Headlines & Marken-Elemente: Space Grotesk; Fließtext bleibt Inter. */
  h1,h2,h3,.display-m,.hero-num,.huge,.dial,.logo-text,.lp-h,.lp-h2,.lp-quote,.lp-claim .n,.tier-card .display-m{font-family:var(--font-display);}
  .serif{font-family:var(--font-serif); font-weight:500; letter-spacing:-.01em;}
  /* Ambient Aurora HINTER der Glas-Ebene — tiefe, leuchtende Bronze/Amber-Verläufe auf Schwarz */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(55% 38% at 12% 4%, rgba(74,111,216,.22), transparent 70%),
      radial-gradient(48% 34% at 92% 14%, rgba(130,110,214,.18), transparent 72%),
      radial-gradient(60% 46% at 50% 102%, rgba(58,150,200,.16), transparent 70%),
      radial-gradient(40% 30% at 80% 80%, rgba(150,170,214,.08), transparent 70%),
      var(--bg);
  }
  .metric{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .hero-num{font-family:var(--font-hero); font-weight:900; letter-spacing:-0.03em;}
  .wrap{max-width:430px; margin:0 auto; min-height:100dvh; padding:70px 16px 124px;}
  .wrap.noshell{padding-top:16px;}
  h1{font-size:17px; font-weight:800; letter-spacing:-0.01em;}
  h2{font-size:27px; font-weight:800; letter-spacing:-0.02em; line-height:1.15; margin-bottom:4px;}
  .display-m{font-size:19px; font-weight:700; letter-spacing:-0.01em; line-height:1.3;}
  .label{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); display:block; margin:0 0 var(--sp-3) var(--sp-1);}
  .section{margin-bottom:var(--sp-7);}
  .hint{font-size:13px; color:var(--t2); margin-bottom:16px; line-height:1.55;}

  /* ===== Liquid Glass (HELL): Basis für alle erhöhten Elemente ===== */
  /* FIX (v5/6A): .menu-sheet aus der 60%-Glass-Gruppe entfernt — eigene,
     deckendere Definition unten (glass-bg-strong + blur 32px), sonst scheint
     der Seiteninhalt durchs offene Menü. */
  .card,.acc,.tier-card,.lockcard,.warncard,.qcard,.modal,.sheet{
    position:relative;
    background:linear-gradient(168deg, rgba(255,255,255,.06), rgba(255,255,255,.012) 62%), var(--glass-bg);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--stroke);
    box-shadow:0 12px 34px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .card::before,.tier-card::before,.sheet::before,.modal::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,0) 48%);
  }
  .card{border-radius:24px; padding:22px; margin-bottom:14px;}
  .modal,.sheet{background:var(--glass-bg-strong); -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);}
  /* Glass-Light für Listen (Perf: kein blur auf vielen Elementen) */
  .acc,.qcard,.lockcard,.warncard{-webkit-backdrop-filter:none; backdrop-filter:none; background:var(--surface);}

  .ct{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); margin-bottom:12px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:48px; border-radius:999px; border:1px solid rgba(255,255,255,.65);
    background:var(--surface); color:var(--t1); font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05), inset 0 1px 0 var(--surface);
    transition:all .25s var(--spring);
  }
  .btn:active{transform:scale(.97); box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);}
  .btn.volt{background:linear-gradient(135deg,#F3F6FB,#CFD8E8 60%,#AFBAD0); color:#10131A; border:1px solid rgba(255,255,255,.55); font-weight:700;
    box-shadow:0 10px 28px rgba(120,140,200,.22), inset 0 1px 0 rgba(255,255,255,.7);}
  .btn.volt:active{transform:scale(.97);}
  .btn.ghost{background:transparent; border:none; box-shadow:none; color:var(--t2); min-height:44px; font-weight:600;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .opt{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px;
    background:var(--surface); border:1px solid var(--hairline); border-radius:16px;
    color:var(--t1); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    min-height:44px; transition:all .25s var(--spring);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .opt:active{transform:scale(.985);}
  .opt.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .opt .sub{display:block; font-size:12px; color:inherit; opacity:.65; font-weight:400; margin-top:2px;}
  .grid5{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .cell{
    padding:13px 2px; text-align:center; background:var(--surface); border:1px solid var(--hairline);
    border-radius:14px; color:var(--t1); font-size:17px; font-weight:600; cursor:pointer;
    font-family:var(--font-mono); min-height:44px; transition:all .25s var(--spring);
  }
  .cell.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .cell.dash{border-style:dashed;}
  .progress{height:6px; flex:1; background:var(--s3); border-radius:999px; overflow:hidden;}
  .progress>div{height:100%; background:var(--hl); border-radius:999px; transition:width .7s cubic-bezier(.25,.8,.25,1);}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back{background:none; border:none; color:var(--t2); font-size:22px; cursor:pointer; min-width:44px; min-height:44px;}
  input[type=range]{width:100%; height:44px; accent-color:var(--accent);}
  input[type=date],input[type=number],input[type=text],input[type=email],input[type=password]{
    width:100%; min-height:48px; padding:0 14px; background:var(--surface); color:var(--t1);
    border:1px solid var(--border); border-radius:14px; font-size:16px; font-family:inherit;
  }
  input.err{border-color:var(--danger);}
  input.ok{border-color:var(--accent);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--t2); margin-bottom:5px;}
  .fielderr{font-size:12px; color:var(--danger); margin-top:4px; min-height:14px;}
  .dial{text-align:center; font-size:46px; font-weight:900; letter-spacing:-0.03em; margin-bottom:8px; font-family:var(--font-hero);}
  .dial small{font-size:15px; color:var(--t2); font-weight:500; letter-spacing:0;}
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid;}
  .badge.info{color:var(--info); border-color:rgba(125,140,163,.35); background:rgba(125,140,163,.1);}
  .badge.volt{color:#fff; border-color:var(--accent); background:var(--accent);}
  .badge.danger{color:var(--danger); border-color:rgba(212,87,75,.3); background:rgba(212,87,75,.08);}
  .badge.warn{color:var(--warn); border-color:rgba(201,138,61,.35); background:rgba(201,138,61,.1);}
  .badge.mute{color:var(--t2); border-color:var(--border); background:var(--s2);}
  .warncard{border:1px solid rgba(201,138,61,.3); background:rgba(224,162,74,.09); border-radius:16px; padding:14px; margin-bottom:10px; font-size:13px; line-height:1.55;}
  .warncard b{color:var(--warn);}

  /* ===== App Bar: helles Glass, fixed ===== */
  .appbar{
    position:fixed; top:0; left:0; right:0; z-index:45;
    background:rgba(11,11,15,.72);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--hairline);
  }
  .appbar-inner{max-width:430px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 14px; min-height:54px;}
  .logo-btn{display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:8px 4px; color:var(--t1); min-height:44px;}
  .logo-text{font-family:var(--font-display); font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--t1);}
  .icon-btn{width:40px; height:40px; min-width:40px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--hairline); border-radius:50%; cursor:pointer; color:var(--t1);
    box-shadow:0 1px 3px rgba(0,0,0,.05); transition:all .25s var(--spring);}
  .icon-btn:active{transform:scale(.94);}
  .menu-backdrop{position:fixed; inset:0; z-index:44; background:rgba(26,26,26,.18);}
  .menu-sheet{position:fixed; top:54px; left:12px; right:12px; z-index:46; max-width:406px; margin:0 auto;
    border-radius:22px; padding:10px;
    background:linear-gradient(rgba(18,17,22,.5),rgba(18,17,22,.5)), var(--glass-bg-strong);
    -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);
    border:1px solid var(--surface);
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.08);}
  .menu-head{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:12px 14px; margin-bottom:4px; background:var(--s1); border:1px solid var(--hairline); border-radius:16px; cursor:pointer; font-family:inherit; color:var(--t1); min-height:64px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .menu-head .avatar{width:46px;height:46px;font-size:18px;}
  .menu-head .mh-name{font-weight:700; font-size:15px;}
  .menu-item{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 12px; background:none; border:none; color:var(--t1); font-size:14.5px; font-weight:600; font-family:inherit; border-radius:14px; cursor:pointer; min-height:52px; transition:background .2s;}
  .menu-item:hover{background:var(--s2);}
  .menu-item:active{background:var(--s3);}
  .menu-item .mi-ic{width:38px;height:38px;min-width:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--t1);}
  .menu-item .mi-sub{display:block;font-size:11.5px;color:var(--t2);font-weight:400;margin-top:1px;}
  .menu-item .mi-chev{margin-left:auto;color:var(--t3);display:inline-flex;}
  .menu-divider{height:1px; background:var(--hairline); margin:6px 4px;}

  /* ===== Bottom Nav: 5 Tabs, Floating Glass Pill, Analytics zentriert ===== */
  /* KRITISCH: #tabbar ist direktes Body-Kind, keine transform-Eltern → fixed bleibt stabil. */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:48; pointer-events:none;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));
    transform:none !important;
  }
  /* Liquid-Glass v2: mehrschichtiges Glas — Verlauf + Blur + Specular-Highlight,
     aktiver Tab bekommt eine eigene Glas-Pille. */
  .tabbar-inner{
    pointer-events:auto; max-width:406px; margin:0 auto; position:relative;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:linear-gradient(135deg, rgba(40,38,48,.72), rgba(22,21,27,.5));
    -webkit-backdrop-filter:blur(32px) saturate(200%); backdrop-filter:blur(32px) saturate(200%);
    border:1px solid var(--surface);
    border-radius:999px; padding:6px 8px;
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 14px 38px rgba(0,0,0,.14),
      inset 0 1px 0 rgba(255,255,255,.10), inset 0 -10px 18px rgba(0,0,0,.2);
  }
  .tabbar-inner::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.10), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, rgba(255,255,255,.06));
    opacity:.7;
  }
  .tab{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 5px;
    background:none; border:none; color:var(--t3); font-size:9.5px; font-weight:700; cursor:pointer; font-family:inherit; min-height:48px;
    transition:color .25s var(--spring);
  }
  .tab .ic{
    display:flex; align-items:center; justify-content:center;
    width:46px; height:27px; border-radius:999px;
    transition:all .3s var(--spring);
  }
  .tab.active{color:var(--t1);}
  .tab.active .ic{
    transform:translateY(-1px);
    background:linear-gradient(135deg, rgba(157,180,240,.30), rgba(157,180,240,.12));
    border:1px solid rgba(157,180,240,.5);
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .tab:active .ic{transform:scale(.92);}
  .tab.flag .ic{
    width:46px; height:46px; margin-top:-22px; border-radius:50%;
    background:var(--accent); color:#fff; border:3px solid var(--bg);
    box-shadow:0 6px 16px rgba(26,26,26,.25);
  }
  .tab.flag{color:var(--t3);}
  .tab.flag.active{color:var(--t1);}
  .tab.flag.active .ic{transform:translateY(-3px) scale(1.05); box-shadow:0 8px 20px rgba(26,26,26,.3);}

  .fab{
    position:fixed; bottom:104px; right:16px; z-index:47;
    width:54px; height:54px; border-radius:50%; border:1px solid var(--stroke); cursor:pointer;
    background:rgba(24,24,24,.92); color:#fff;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 8px 22px rgba(26,26,26,.28); display:flex; align-items:center; justify-content:center;
    transition:transform .25s var(--spring);
  }
  .fab:active{transform:scale(.93);}
  /* Wenn ein Sheet/Modal offen ist: Bottom-Nav + Coach-FAB ausblenden, damit nichts überlappt. */
  body.overlay-open .tabbar, body.overlay-open .fab{opacity:0; pointer-events:none; visibility:hidden;}
  .coach-panel{position:fixed; bottom:104px; right:12px; left:12px; max-width:406px; margin:0 auto; z-index:50;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper button{width:44px; height:44px; border-radius:999px; background:var(--surface); color:var(--t1);
    border:1px solid var(--hairline); font-size:20px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .stepper .val{min-width:86px; text-align:center; font-size:18px;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{min-width:44px; height:44px; border-radius:999px; background:var(--surface); border:1px solid var(--hairline);
    color:var(--t2); font-family:var(--font-mono); font-size:14px; cursor:pointer; padding:0 8px; transition:all .25s var(--spring);}
  .scale button.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; text-align:center; gap:18px;}
  .huge{font-size:54px; font-weight:900; letter-spacing:-0.03em; color:var(--t1); font-family:var(--font-hero);}
  .spin{width:40px; height:40px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .pulse{animation:pulse .6s ease-out infinite;}
  .fade{animation:fade .4s var(--spring);}
  @keyframes fade{from{opacity:0; transform:translateY(12px) scale(.98)}to{opacity:1; transform:none}}
  /* Gestaffeltes Einblenden der Karten */
  .wrap>.card:nth-child(1),.section:nth-child(1) .card{animation:fade .4s var(--spring) backwards;}
  .wrap>.card:nth-child(2),.section:nth-child(2) .card{animation:fade .4s var(--spring) .05s backwards;}
  .wrap>.card:nth-child(3),.section:nth-child(3) .card{animation:fade .4s var(--spring) .1s backwards;}
  .wrap>.card:nth-child(4),.section:nth-child(4) .card{animation:fade .4s var(--spring) .15s backwards;}
  .wrap>.card:nth-child(5),.section:nth-child(5) .card{animation:fade .4s var(--spring) .2s backwards;}
  @keyframes popIn{from{opacity:0; transform:translateY(16px) scale(.95)}to{opacity:1; transform:none}}
  .pop{animation:popIn .45s var(--spring);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:9px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--hairline);
    color:var(--t1); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; min-height:40px; transition:all .25s var(--spring);
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .chip:active{transform:scale(.96);}
  .chip.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  /* Konversations-Feed: Nutzer = helle Bubble rechts, Coach = Fließtext links */
  .msg{max-width:82%; font-size:14px; line-height:1.6; margin-bottom:12px;}
  .msg.user{margin-left:auto; background:var(--s3); border:none; color:var(--t1); padding:11px 15px; border-radius:20px; border-bottom-right-radius:6px; animation:popIn .4s var(--spring);}
  .msg.ai{background:none; border:none; padding:0; color:var(--t1); max-width:95%; animation:fade .4s var(--spring);}
  .ring-lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t2); font-weight:700;}
  .list li{display:flex; justify-content:space-between; font-size:14px; padding:3px 0; list-style:none; color:var(--t1); gap:8px;}
  .list li span:last-child{color:var(--t2);}
  .volt-txt{color:var(--hl);} .danger-txt{color:var(--danger);} .warn-txt{color:var(--warn);} .t2{color:var(--t2);}
  .sm{font-size:13px;} .xs{font-size:11px;}
  .mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px;}
  .pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;}
  .pill{flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--hairline);
    background:var(--surface); color:var(--t2); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; min-height:38px;}
  .pill.active{border-color:var(--accent); background:var(--accent); color:#fff;}
  .setdots{display:flex; gap:6px; align-items:center;}
  .setdots .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--t3); transition:all .3s var(--spring);}
  .setdots .dot.full{background:var(--hl); border-color:var(--hl); transform:scale(1.1);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .qcard{flex-shrink:0; width:140px; border-radius:18px; padding:12px; cursor:pointer; font-family:inherit; color:var(--t1); text-align:left;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{border-radius:24px; padding:22px; max-width:380px; width:100%; max-height:80dvh; overflow-y:auto;}
  .toast{position:fixed; bottom:118px; left:50%; transform:translateX(-50%); z-index:70;
    background:rgba(24,24,24,.92); color:#fff; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; animation:popIn .35s var(--spring);
    max-width:90%; text-align:center; box-shadow:0 8px 24px rgba(26,26,26,.25);}
  details summary{list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  .strength-meter{height:5px; border-radius:999px; background:var(--s3); overflow:hidden; margin-top:6px;}
  .strength-meter>div{height:100%; transition:width .3s,background .3s;}
  .ac-list{background:var(--surface-2); border:1px solid var(--hairline); border-radius:14px; overflow:hidden; margin-top:6px; box-shadow:0 4px 12px rgba(0,0,0,.06);}
  .ac-item{display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none; border-bottom:1px solid var(--hairline); color:var(--t1); font-size:14px; cursor:pointer; font-family:inherit; min-height:44px;}
  .ac-item:last-child{border-bottom:none;}
  .barrow{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .barrow .blbl{width:86px; font-size:11px; font-weight:600; color:var(--t2); flex-shrink:0;}
  .barrow .btrack{flex:1; height:12px; background:var(--s3); border-radius:6px; overflow:hidden;}
  .barrow .bfill{height:100%; border-radius:6px; transition:width .7s cubic-bezier(.25,.8,.25,1);}
  .barrow .bval{width:62px; text-align:right; font-size:11px; color:var(--t2); flex-shrink:0;}
  .iconbtn{background:none; border:none; color:var(--t2); cursor:pointer; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;}
  .conf{font-size:10px; color:var(--t3); font-family:var(--font-mono);}
  .quicklog-field{width:100%; min-height:64px; padding:14px 16px 50px; box-sizing:border-box;
    background:var(--surface); border:1px solid var(--hairline); border-radius:18px;
    color:var(--t1); font-size:15px; font-family:var(--font-display); resize:none; line-height:1.5;}
  .quick-log{position:relative;}
  .quicklog-submit{position:absolute; bottom:10px; right:10px; width:auto; min-height:38px; min-width:44px; padding:0 18px; border-radius:999px; font-size:13px;}
  .quicklog-mic{position:absolute; bottom:10px; left:10px; width:44px; min-width:44px; min-height:38px; padding:0; border-radius:999px;}
  .exrow{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:13px 4px; background:none; border:none; border-top:1px solid var(--hairline); color:var(--t1); font-family:inherit; font-size:14px; cursor:pointer; min-height:50px; text-align:left;}
  .exrow .exn{font-weight:600; display:flex; align-items:center; gap:6px;}
  .acc{border-radius:18px; margin-bottom:10px;}
  .acc summary{display:flex; align-items:center; justify-content:space-between; padding:16px; cursor:pointer; min-height:48px; font-size:14px; font-weight:700;}
  .acc summary .chev{transition:transform .3s var(--spring); display:inline-flex;}
  .acc[open] summary .chev{transform:rotate(180deg);}
  .acc[open] summary{border-bottom:1px solid var(--hairline);}
  .acc .accbody{padding:6px 16px 16px; animation:fade .35s var(--spring);}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{border-radius:28px 28px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-width:430px; width:100%; max-height:85dvh; overflow-y:auto; animation:sheetUp .45s var(--spring);}
  @keyframes sheetUp{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  .tier-card{border-radius:22px; padding:var(--sp-5); margin-bottom:var(--sp-4);}
  .tier-card.featured{border:2px solid var(--accent);}
  .tier-feat{display:flex; gap:8px; font-size:13.5px; color:var(--t1); padding:5px 0; line-height:1.5;}
  .tier-feat span:first-child{color:var(--hl); flex-shrink:0; font-weight:700;}
  .lockcard{border:1px dashed var(--border); border-radius:16px; padding:14px 16px; margin-top:10px;}
  .heroband{padding:0 0 var(--sp-5); text-align:center;}
  /* ===== Immersive Today-Hero (Oura/Apple-würdig): atmosphärische Szene + Score + Serif-Voice ===== */
  .today-hero{position:relative; margin:-70px -16px 20px; padding:80px 22px 30px; overflow:hidden; text-align:center;}
  .today-hero .th-scene{position:absolute; inset:0; z-index:-1;
    background:
      radial-gradient(120% 78% at 50% -6%, #313F70 0%, #1A2342 36%, #0C1020 70%, var(--bg) 100%),
      radial-gradient(70% 44% at 50% 86%, rgba(125,160,240,.16), transparent 72%);}
  .today-hero .th-scene::after{content:""; position:absolute; inset:0;
    background:radial-gradient(78% 46% at 50% 16%, rgba(165,195,255,.14), transparent 60%);}
  .th-metrics{display:flex; justify-content:center; gap:26px; margin-bottom:14px;}
  .th-metric{background:none; border:none; font-family:inherit; cursor:pointer; color:inherit; padding:0;}
  .th-metric .m-ic{color:var(--hl); display:flex; justify-content:center; margin-bottom:5px; opacity:.92;}
  .th-metric .m-v{font-family:var(--font-hero); font-weight:700; font-size:19px; line-height:1; letter-spacing:-.01em;}
  .th-metric .m-l{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--t2); margin-top:4px; font-weight:600;}
  .th-ring{display:flex; justify-content:center; margin:8px 0 2px; filter:drop-shadow(0 18px 44px rgba(110,140,240,.34));}
  .th-lbl{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--t2); font-weight:700; margin-top:8px;}
  .th-headline{font-family:var(--font-serif); font-weight:500; font-size:31px; line-height:1.08; letter-spacing:-.015em; margin:8px auto 10px; max-width:330px;}
  .th-sub{font-size:13.5px; line-height:1.55; color:var(--t2); max-width:300px; margin:0 auto 18px;}
  .th-cta{max-width:260px; margin:0 auto;}
  /* Value Banner: Soft-Paper-Karte mit Icon-Kreis */
  .banner{display:flex; gap:12px; align-items:center; border-radius:18px; padding:14px 14px 14px 16px; margin-bottom:var(--sp-4);
    background:var(--surface); border:1px solid rgba(255,255,255,.65);
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05), inset 0 1px 0 var(--surface);}
  .banner .bicon{width:38px; height:38px; min-width:38px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; color:var(--t1);}
  .banner p{font-size:12.5px; line-height:1.5; color:var(--t2); flex:1; min-width:0;}
  .banner b{color:var(--t1); font-weight:700;}
  .banner .bx{flex-shrink:0; min-width:30px; min-height:30px; display:flex; align-items:center; justify-content:center; background:none; border:none; color:var(--t3); cursor:pointer;}
  /* Grid-/Listen-Toggle + Kacheln (Magazin-Stil) */
  .viewtoggle{display:flex; gap:4px; background:var(--surface); border:1px solid var(--hairline); border-radius:999px; padding:3px;}
  .viewtoggle button{width:38px; height:32px; border:none; border-radius:999px; background:none; color:var(--t3); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .viewtoggle button.sel{background:var(--accent); color:#fff;}
  .tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; animation:fade .35s var(--spring);}
  .tile{border-radius:18px; overflow:hidden; background:var(--surface); border:1px solid var(--hairline);
    box-shadow:0 2px 10px rgba(0,0,0,.05); text-align:left; cursor:pointer; font-family:inherit; color:var(--t1); padding:0;}
  .tile .tart{aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;}
  .tile .tbody{padding:10px 12px 12px;}
  .tile .tbody b{font-size:13px; display:block; margin-bottom:2px;}
  .tile .tbody span{font-size:11px; color:var(--t2);}
  .statchip{display:inline-flex; align-items:center; gap:4px; background:var(--s2); border-radius:8px; padding:3px 8px; font-size:10.5px; font-weight:600; color:var(--t2); margin:2px 4px 2px 0;}
  .whybox{background:var(--s2); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.55; color:var(--t2); margin-top:8px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--s3);color:var(--t1);font-weight:800;display:flex;align-items:center;justify-content:center;}
  .icon-circle{width:44px;height:44px;min-width:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--t1);}
  /* ===== Landingpage (Marketing) ===== */
  .lp{max-width:460px;margin:0 auto;padding:0 0 60px;}
  .lp-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;z-index:30;
    background:rgba(247,245,241,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);}
  .lp-sec{padding:46px 20px;}
  .lp-eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--hl);margin-bottom:14px;}
  .lp-h{font-size:38px;font-weight:900;letter-spacing:-.035em;line-height:1.04;margin-bottom:16px;}
  .lp-h2{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.14;margin-bottom:11px;}
  .lp-lead{font-size:16.5px;line-height:1.62;color:var(--t2);}
  .lp-hero{padding:16px 20px 32px;text-align:center;position:relative;overflow:hidden;}
  .lp-hero::after{content:"";position:absolute;inset:-40% -20% auto -20%;height:70%;z-index:-1;
    background:radial-gradient(60% 80% at 50% 0%,rgba(154,101,54,.12),transparent 70%);}
  .lp-claimgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .lp-claim{background:var(--s1);border:1px solid var(--hairline);border-radius:18px;padding:22px 16px;text-align:center;
    box-shadow:0 2px 14px rgba(0,0,0,.05);transition:transform .28s var(--spring),box-shadow .28s ease,border-color .28s ease;}
  .lp-claim:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(154,101,54,.13);border-color:rgba(154,101,54,.28);}
  .lp-claim .n{font-family:var(--font-hero);font-weight:900;font-size:36px;letter-spacing:-.03em;line-height:1;}
  .lp-claim .l{font-size:12.5px;color:var(--t2);margin-top:9px;line-height:1.42;}
  .lp-pillar{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--hairline);}
  .lp-pillar .ic{width:46px;height:46px;min-width:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;}
  .lp-step{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;}
  .lp-step .num{width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--hl);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:14px;}
  .lp-quote{font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-.01em;}
  .lp-dark{background:var(--accent);color:#fff;border-radius:26px;margin:0 12px;padding:34px 24px;}
  .lp-dark .lp-h2,.lp-dark .lp-quote{color:#fff;}
  .lp-seg{display:flex;gap:4px;background:var(--s2);border:1px solid var(--border);border-radius:999px;padding:4px;}
  .lp-seg button{flex:1;min-height:38px;border:none;border-radius:999px;background:none;color:var(--t2);font-weight:600;font-size:12.5px;
    font-family:inherit;cursor:pointer;padding:0 6px;}
  .lp-seg button.sel{background:var(--accent);color:#fff;}
  /* Partikelball */
  .pb-wrap{width:188px; height:188px; position:relative;}
  .pb-wrap::after{content:""; position:absolute; inset:4%; border-radius:50%; z-index:-1;
    background:radial-gradient(circle at 38% 32%, rgba(176,137,92,.26), rgba(247,245,241,0) 72%);}
  .pb-big{width:clamp(360px,46vw,520px); height:clamp(360px,46vw,520px);}
  .pb-canvas{width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
  .pb-canvas:active{cursor:grabbing;}
  @keyframes lp-pop{0%{transform:scale(.65);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @keyframes lp-draw{to{stroke-dashoffset:0}}
  .lp-res-pop{display:inline-block;animation:lp-pop .45s var(--spring);}
  .lp-chartline{stroke-dasharray:640;stroke-dashoffset:640;animation:lp-draw 1.1s ease forwards;}
  .lp-seg button{transition:all .2s var(--spring);} .lp-seg button.sel{transform:translateY(-1px);}

  /* ===================== DESKTOP (≥1024px) ===================== */
  @media (min-width:1024px){
    /* App-Navigation wird zur linken Seitenleiste */
    .tabbar{top:56px; bottom:0; left:0; right:auto; width:236px; padding:0; pointer-events:auto;}
    .tabbar-inner{display:flex!important; flex-direction:column; justify-content:flex-start; gap:4px; width:236px; height:calc(100dvh - 56px);
      border-radius:0; border:none; border-right:1px solid var(--hairline); padding:20px 16px; margin:0;
      background:rgba(22,21,27,.55); box-shadow:none;}
    .tab{flex-direction:row; justify-content:flex-start; gap:13px; font-size:14.5px; min-height:48px; padding:11px 14px; border-radius:13px;}
    .tab .ic{width:auto!important; height:auto!important; margin:0!important; background:none!important; border:none!important; box-shadow:none!important; border-radius:0!important; color:inherit!important; transform:none!important;}
    .tab.active{background:var(--accent-soft);}
    .tab.flag{color:var(--t3);} .tab.flag.active{color:var(--t1);}
    /* Inhalt rechts neben der Sidebar, komfortable Breite */
    .appbar-inner{max-width:none; padding-left:24px; padding-right:24px;}
    .wrap{max-width:780px; margin-left:236px; margin-right:auto; padding:84px 48px 64px;}
    .wrap.noshell{margin-left:0; max-width:none; padding:0;}
    .fab{right:40px; bottom:40px;}
    .coach-panel{left:auto; right:40px; width:390px; margin:0; bottom:40px;}
    /* zweispaltige Inhalte auf großen Screens */
    .grid2.deskwide{grid-template-columns:repeat(2,1fr);}
    .modal{max-width:520px;}

    /* ---- Landingpage: echte Desktop-Komposition ---- */
    .lp{max-width:1120px;}
    .lp-nav{padding:20px 48px;}
    .lp-hero{display:grid; grid-template-columns:1fr 1.05fr; gap:48px; align-items:center; text-align:left; padding:64px 48px 78px;}
    .lp-hero>.lp-herocopy{order:1;}
    .lp-hero>.lp-herovis{order:2; display:flex; justify-content:center;}
    .lp-hero .lp-cta-row{display:flex; gap:12px;}
    .lp-hero .lp-cta-row .btn{margin:0!important;}
    .lp-h{font-size:64px; line-height:1.0;}
    .lp-lead{font-size:18.5px; margin-left:0!important; margin-right:0!important;}
    .lp-hero::after{inset:-30% -10% auto 20%; height:80%;}
    .lp-sec{padding:56px 48px; max-width:1120px; margin:0 auto;}
    .lp-claimgrid{grid-template-columns:repeat(4,1fr);}
    .lp-pillars-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
    .lp-pillars-grid .lp-pillar{border-top:none; border:1px solid var(--hairline); border-radius:18px; padding:22px; background:var(--s1);}

/* ===== Partikel-Marke: Sphäre aus beige/braunen Punkten =====
   spherePoints projiziert eine Fibonacci-Sphäre bei fixer Rotation in 2D —
   Basis für das statische Logo (SVG) UND den interaktiven Hero-Ball (Canvas). */
const PART_COLORS=["#C9D6EE","#AEC0E8","#90A8E4","#7E8BE8","#A9B8DA","#E2E8F4"];
function spherePoints(n,ry,rx){
  ry=ry==null?0.5:ry; rx=rx==null?-0.35:rx;
  const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx), out=[];
  for(let i=0;i<n;i++){
    const y=1-(i/(n-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), ph=i*2.399963;
    let x=Math.cos(ph)*r, z=Math.sin(ph)*r;
    let x1=x*cy - z*sy, z1=x*sy + z*cy;
    let y2=y*cx - z1*sx, z2=y*sx + z1*cx;
    const persp=1/(1.85 - z2*0.55);
    out.push({x:x1*persp, y:y2*persp, z:z2, persp});
  }
  return out.sort((a,b)=>a.z-b.z);
}

    return `<circle cx="${(c+p.x*R).toFixed(2)}" cy="${(c+p.y*R).toFixed(2)}" r="${rad.toFixed(2)}" fill="currentColor" opacity="${a}"/>`;}).join("");
  return `<svg width="${h}" height="${h}" viewBox="0 0 ${h} ${h}" aria-hidden="true" style="display:inline-block;color:var(--hl)">${dots}</svg>`;
}

/* Interaktiver Partikelball (Canvas): rotiert, stößt Partikel vom Zeiger ab.

    base.push({x:Math.cos(ph)*r,y,z:Math.sin(ph)*r,c:PART_COLORS[i%PART_COLORS.length]});}

    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){ptr.on=false;return;}
    ptr.x=e.clientX-r.left-W/2; ptr.y=e.clientY-r.top-H/2; ptr.on=true; vry=0.02;};
  if(interactive)window.addEventListener("pointermove",PB.onMove,{passive:true});

    ry+=spin+vry; vry*=0.94;
    const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
    ctx.clearRect(0,0,W,H);
    const proj=base.map(p=>{let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y;
      let y2=y*cx-z*sx,z2=y*sx+z*cx;const persp=1/(1.85-z2*0.55);
      return {sx:x*R*persp,sy:y2*R*persp,z:z2,persp,c:p.c};});
    const pr=Math.max(104,R*0.55), pf=pr*0.26;

      if(interactive&&ptr.on&&d2<pr*pr){const d=Math.sqrt(d2)||1,f=(pr-d)/pr*pf;q.sx+=dx/d*f;q.sy+=dy/d*f;}});

/* =====================================================================
   METRICGYM V4 — Performance Intelligence Platform (Single-File-PWA)

// ---------- Format ----------
const nf  = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const nfi = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});

/* ---------- Sprach-Ebene (v5/Phase 2) ----------
   Zentrale Klartext-Labels: Die UI spricht die Sprache des Nutzers,

const KEY="metricgym-v4";

/* Foto-Speicher: Bilder liegen in IndexedDB (nicht im localStorage-State, der
   sonst die Quote sprengt) — in S stehen nur Metadaten. Komplett lokal. */
const PDB={db:null,
  open(){return new Promise((res)=>{try{const r=indexedDB.open("mg-photos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("p");
    r.onsuccess=()=>{PDB.db=r.result;res(PDB.db);}; r.onerror=()=>res(null);}catch{res(null);}});},
  async put(id,v){const db=await PDB.open();if(!db)return;return new Promise(r=>{const tx=db.transaction("p","readwrite");tx.objectStore("p").put(v,id);tx.oncomplete=()=>r();tx.onerror=()=>r();});},
  async get(id){const db=await PDB.open();if(!db)return null;return new Promise(r=>{const t=db.transaction("p","readonly").objectStore("p").get(id);t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null);});},
  async del(id){const db=await PDB.open();if(!db)return;return new Promise(r=>{const tx=db.transaction("p","readwrite");tx.objectStore("p").delete(id);tx.oncomplete=()=>r();tx.onerror=()=>r();});}};
// Bild herunterskalieren (max 900px, JPEG) → kleine dataURL für Vergleichsansicht
function downscaleImage(file,max,cb){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{let{width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));};
    img.onerror=()=>cb(null); img.src=fr.result;};
  fr.onerror=()=>cb(null); fr.readAsDataURL(file);
}

// ---------- Engine ----------
function mifflin(sex,age,h,w){ return Math.round(10*w+6.25*h-5*age+(sex==="male"?5:-161)); }
function katch(w,bf){ return Math.round(370+21.6*w*(1-bf/100)); }
function bmrCalc(a){ return a.bodyFat!=null?katch(a.weight,a.bodyFat):mifflin(a.sex,a.age,a.height,a.weight); }
const NEAT={sedentary:1.2,light:1.3,moderate:1.4,active:1.475,very_active:1.55};
function tdeeCalc(bmr,act,w,len,days){
  const rest=Math.round(bmr*NEAT[act]);
  const train=rest+Math.round(5.0*w*(len/60));
  return {rest,train,avg:Math.round((train*days+rest*(7-days))/7)};
}
const GOAL_D={muscle_gain:[.1,.1],fat_loss:[-.2,-.2],recomp:[.1,-.1],strength:[.05,.05],general:[0,0],endurance:[0,0],mobility:[0,0]};
const GOAL_LABEL={muscle_gain:"Muskelaufbau",fat_loss:"Fettabbau",recomp:"Recomp",strength:"Maximalkraft",general:"Fitness",endurance:"Ausdauer",mobility:"Mobility"};
function multiTargets(a,bmr,td){
  const goals=(a.goals&&a.goals.length?a.goals:[a.goal||"muscle_gain"]);
  const hasFat=goals.includes("fat_loss"), hasGain=goals.includes("muscle_gain");
  const conflicts=[];
  // Eine einzige kalorische Richtung — ein neutrales „Fitness/Ausdauer/Mobility"-Ziel
  // verwässert NIEMALS ein Defizit/Surplus (man kann nicht zugleich ab- und aufbauen).
  let dir, dirLabel;
  if(hasFat&&hasGain){ dir=-0.08; dirLabel="Recomp · leichtes Defizit";
    conflicts.push({type:"recomp",msg:"Muskelaufbau + Fettabbau = Recomp: leichtes Defizit (−8 %) bei hohem Protein.",bio:"Viel Protein schützt deine Muskeln im Defizit (Helms et al., 2014)."}); }
  else if(hasFat){ dir=-0.20; dirLabel="Defizit −20 %"; }
  else if(hasGain){ dir=0.10; dirLabel="Aufbau-Überschuss +10 %"; }
  else if(goals.includes("strength")){ dir=0.03; dirLabel="leichter Überschuss"; }
  else { dir=0; dirLabel="Erhaltung"; }
  if(goals.includes("strength")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Kraft + Ausdauer: Interferenzeffekt. Kraft vor Ausdauer, mind. 6 h Abstand.",bio:"Concurrent Training dämpft mTOR-Signalwege (Wilson et al., 2012)."});
  }
  const days=Math.min(7,Math.max(1,a.days||4));
  const avgT=Math.round(td.avg*(1+dir));               // Ziel = Wochenschnitt
  const floor=a.sex==="female"?1400:1600, warn=[];
  // Kalorien-Cycling: Trainingstage etwas mehr, Ruhetage weniger — Schnitt bleibt das Ziel
  let trainK=Math.round(avgT*1.08), restK;
  if(days>=7){ trainK=avgT; restK=avgT; }
  else { restK=Math.round((avgT*7-trainK*days)/(7-days)); }
  const clamp=(v)=>{ if(v<floor){warn.push("floor");return floor;} return Math.round(v); };
  trainK=clamp(trainK); restK=clamp(restK);
  let prot;
  if(a.bodyFat!=null) prot=Math.round(2.2*a.weight*(1-a.bodyFat/100));
  else prot=Math.round(1.8*Math.min(a.weight,25*(a.height/100)**2));
  const fat=Math.round(.9*a.weight);
  const mac=(k)=>({kcal:k,p:prot,f:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4))});
  return {train:mac(trainK),rest:mac(restK),warn:[...new Set(warn)],conflicts,goals,dir,dirLabel};
}
function e1rm(w,reps,rpe){
  if(reps===1) return w;
  const eff=reps+(10-(rpe??8));
  return Math.round(w*(1+eff/30)*10)/10;
}
function statusScore(sleep,energy,stress,sore){
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const comps=[[.3,c01((sleep-1)/4)],[.25,c01((energy-1)/4)],[.2,c01(1-(stress-1)/4)],[.25,c01(1-(sore-1)/4)]];
  const score=Math.round(comps.reduce((s,c)=>s+c[0]*c[1],0)*100);
  const tier=score>=80?"Stark":score>=60?"Gut":score>=40?"Mäßig":"Erholung";
  return {score,tier};
}
function forecast12w(series){
  if(series.length<3) return null;
  const n=series.length;
  let st=0,sy=0,stt=0,sty=0;
  series.forEach((p)=>{st+=p.t;sy+=p.v;stt+=p.t*p.t;sty+=p.t*p.v;});
  const den=n*stt-st*st, slope=den===0?0:(n*sty-st*sy)/den, last=series[n-1];
  let vv=last.v, ss=slope; const pts=[];
  for(let b=0;b<3;b++){ vv+=ss*28; ss*=.85; pts.push({wk:(b+1)*4, v:Math.round(Math.min(vv,last.v*1.15)*10)/10}); }
  return pts;

function dietAdherence(nDays){

    .filter(([d,l])=>(l.meals||[]).length>0&&Date.now()-new Date(d).getTime()<nDays*dayMs);

function parseStatus(txt){
  const t=txt.toLowerCase(); const r={};

  else if(/gut geschlafen/.test(t))r.sleep=4;

  else if(/schlecht geschlafen|wenig geschlafen|kaum geschlafen/.test(t))r.sleep=2;
  else if(/sehr schlecht geschlafen|durchgemacht/.test(t))r.sleep=1;

  else if(/mittelmäßig|geht so/.test(t))r.energy=3;
  else if(/müde|schlapp|erschöpft/.test(t))r.energy=2;
  if(/sehr gestresst|extrem.*stress/.test(t))r.stress=5;
  else if(/viel stress|gestresst|stress hoch/.test(t))r.stress=4;
  else if(/normaler stress|etwas stress/.test(t))r.stress=3;
  else if(/wenig stress/.test(t))r.stress=2;
  else if(/kein stress|entspannt|ruhig/.test(t))r.stress=1;

// ---------- Auth ----------
async function hashPw(pw){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }catch{
    let h1=0x811c9dc5,h2=0x1000193;
    for(const c of pw){h1=Math.imul(h1^c.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+c.charCodeAt(0),2654435761)>>>0;}
    return "fnv-"+h1.toString(36)+h2.toString(36);
  }
}
function pwStrength(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10; if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const entropy=pw.length*Math.log2(pool||1);
  if(entropy<40)return{lbl:"schwach",pct:33,col:"var(--danger)"};
  if(entropy<60)return{lbl:"mittel",pct:66,col:"var(--warn)"};
  return{lbl:"stark",pct:100,col:"var(--volt)"};
}

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

    readinessHistory.push({date:new Date(now-d*dayMs).toISOString().slice(0,10),score:r.score,tier:r.tier,sleep,energy,stress,sore,sleepH:Math.round((5.5+rng()*3)*10)/10});
  }
  const trainingHistory=[]; const labels=["push","pull","legs","upper"];
  for(let wk=0;wk<10;wk++){ for(let d=0;d<4;d++){
    if(rng()<.1) continue;
    trainingHistory.push({date:new Date(now-(9.5*7-wk*7-d*1.5)*dayMs).toISOString().slice(0,10),
      type:labels[d%4],sets:16+Math.floor(rng()*8),volume:Math.round(5200+rng()*3200),avgRpe:Math.round((7.2+rng()*1.6)*10)/10});
  }}
  const nutritionLog={}; for(let d=7;d>=1;d--){

    nutritionLog[date]={meals:[{n:"Demo-Tag (aggregiert)",g:0,k:Math.round(2300+(rng()-.4)*700),p:Math.round(130+rng()*60),c:Math.round(220+rng()*80),f:Math.round(60+rng()*30)}],water:Math.floor(4+rng()*7)};
  }
  return {liftLog,weightLog,readinessHistory,trainingHistory,nutritionLog};
}

/* Satz-Schema je Erfahrung: c = Haupt-Grundübungen, a = weitere Mehrgelenks-
   übungen, i = Isolation (Robinson 2024: Isolation näher ans Versagen).
   Grundwerte = Wochenstart (MEV-nah). Über den Trainingsblock baut sich das
   Volumen progressiv auf (siehe weekSets) Richtung MAV/MRV (Israetel 2017,
   Pelland 2025), Woche 4 = Erholung. */
const SETS_BY_EXP={
  beginner:{c:3,a:2,i:2,count:5},
  novice:{c:3,a:3,i:2,count:6},
  intermediate:{c:4,a:3,i:3,count:7},
  advanced:{c:4,a:4,i:3,count:8},
};
/* Progressives Volumen je Trainingsblock-Woche: Mehrgelenksübungen tragen den
   Aufbau (mehr Last-Toleranz), Isolation steigt gedämpft; Woche 4 deloadet. */
function weekSets(name,baseSets){
  const w=S.currentWeek||1;
  if(w===4) return Math.max(1,Math.round(baseSets*0.55));
  const add=(w===2?1:w===3?2:0);
  const isComp=(EXDB[name]||{}).compound;
  return baseSets+(isComp?add:Math.max(0,add-1));
}
function generateTrainingPlan(profile,variant){
  const a=(profile&&profile.a)||{};
  const vB=variant==="B"; // Variante B: andere Übungsauswahl pro Slot → Abwechslung
  const exp=a.exp||"novice", goals=a.goals||["muscle_gain"];
  const equipment=EQ_ALLOWED[a.equipment]?a.equipment:"gym_full";
  const allowed=EQ_ALLOWED[equipment], hasBench=EQ_BENCH[equipment];
  const focus=(a.focus||[]).filter(m=>FOCUS_EX[m]);
  const scheme=SETS_BY_EXP[exp]||SETS_BY_EXP.novice;
  const strength=goals[0]==="strength";
  const repC=strength?"3–5":"5–8", restC=strength?210:165;
  const fits=(n)=>{const d=EXDB[n]; return d&&allowed.includes(d.eq)&&(!d.bench||hasBench);};
  const mk=(n,sets,reps,rest)=>{const d=EXDB[n]||{};return {n,sets,reps,rest,tempo:d.tempo||"2-0-1-0",rir:d.rir||"1–2",m:d.m||"—",why:d.why||"",alt:d.alt||null,lengthened:!!d.lengthened};};
  // Slot-Auswahl: Equipment-Filter + Dedupe, dann Sätze/Reps nach Rolle.
  // Variante B nimmt pro Slot — wo möglich — den ZWEITEN passenden Kandidaten,
  // damit A- und B-Einheit sich in den Übungen unterscheiden.
  const buildMain=(key)=>{
    const chosen=[];
    for(const slot of SESSION_SLOTS[key]){
      if(chosen.length>=scheme.count)break;
      const fitting=slot.filter(x=>fits(x)&&!chosen.includes(x));
      const n=vB&&fitting.length>1?fitting[1]:fitting[0];
      if(n)chosen.push(n);
    }
    // Fokus-Bonus: Extra-Übung früh einsortieren (Position 3, nach den Haupt-Grundübungen)
    for(const fm of focus){
      if(!(DAY_MUSCLES[key]||[]).includes(fm))continue;
      const bonus=(FOCUS_EX[fm]||[]).find(x=>fits(x)&&!chosen.includes(x));
      if(bonus){chosen.splice(Math.min(2,chosen.length),0,bonus);break;}
    }
    return chosen.map((n,i)=>{
      const d=EXDB[n]||{};
      if(d.compound&&i<2)return mk(n,scheme.c,repC,restC);
      if(d.compound)return mk(n,scheme.a,"6–10",120);
      return mk(n,scheme.i,d.lengthened?"12–20":"10–15",60);
    });
  };
  const day=(key,main,abs)=>{
    const absEx=abs?ABS_BLOCK.map(([n,st,rp,rs])=>mk(n,st,rp,rs)):[];
    // Session-Dauer wird BERECHNET, nicht abgefragt: Aufwärmen + Sätze×(Arbeit+Pause) + Cool-down
    const setMin=main.reduce((s,e)=>s+e.sets*(0.75+e.rest/60),0)+absEx.reduce((s,e)=>s+e.sets*1.5,0);
    const est=Math.round((8+setMin+5)/5)*5;
    return {key,...TYPE_META[key],warmup:WARMUP_DEFAULT,cooldown:COOLDOWN_DEFAULT,main,abs:absEx,est};
  };
  return {
    push:day("push",buildMain("push")),
    pull:day("pull",buildMain("pull")),
    legs:day("legs",buildMain("legs"),true),
    upper:day("upper",buildMain("upper")),
    lower:day("lower",buildMain("lower"),true),
    cardio:{...day("cardio",[mk("Zone-2 Cardio",1,"30–40 Min",0)]),est:35},
    rest:{key:"rest",...TYPE_META.rest,warmup:[],cooldown:[],main:[],abs:[],est:0},
  };
}
/* ---------- Optimaler Wochenplan (v5/Phase 1): Vorschlag + Begründung ----------
   Split nach Tagen + Erholungsprofil, Platzierung nach Wochen-Präferenz,
   Cardio auf einem Ruhetag. Der Nutzer behält die volle Kontrolle (User owns schedule). */
function generateOptimalSchedule(a){
  a=a||{};
  const days=Math.min(6,Math.max(2,a.days||4));
  const rec=a.recovery_profile||"average", pref=a.schedule_pref||"consistent";
  const SPLITS={
    2:["upper","lower"],
    3:rec==="slow"?["upper","lower","upper"]:["push","pull","legs"],
    4:["upper","lower","upper","lower"],
    5:rec==="slow"?["upper","lower","push","pull","legs"]:["push","pull","legs","upper","lower"],
    6:rec==="slow"?["push","pull","legs","upper","lower","cardio"]:["push","pull","legs","push","pull","legs"],
  };
  const POS={
    consistent:{2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]},
    weekday_strong:{2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5]},
    weekend_strong:{2:[5,6],3:[2,5,6],4:[1,3,5,6],5:[1,3,4,5,6],6:[0,1,3,4,5,6]},
  };
  const types=SPLITS[days], pos=(POS[pref]||POS.consistent)[days];
  const sch=["rest","rest","rest","rest","rest","rest","rest"];
  types.forEach((t,i)=>{sch[pos[i]]=t;});
  if(days<=4){
    const restIdx=sch.map((t,i)=>t==="rest"?i:null).filter(x=>x!=null);
    if(restIdx.length>=2)sch[restIdx[Math.floor(restIdx.length/2)]]="cardio";
  }
  const splitTxt={
    2:"2 kompakte Einheiten (Ober-/Unterkörper) — maximaler Effekt pro Training.",
    3:rec==="slow"?"3 Einheiten im Ober-/Unterkörper-Wechsel — voller Reiz, viel Luft zur Erholung.":"3 Einheiten als Push / Pull / Beine — klare Trennung, jede Muskelgruppe erholt sich komplett.",
    4:"4 Einheiten im Ober-/Unterkörper-Wechsel — jede Muskelgruppe wird 2× pro Woche trainiert: der Sweet Spot für Muskelaufbau.",
    5:"5 Einheiten — Push / Pull / Beine plus Oberkörper / Unterkörper: hohe Frequenz, klug verteilt.",
    6:rec==="slow"?"6 Einheiten mit eingebautem Cardio-Tag — Frequenz hoch, Belastung dosiert.":"6 Einheiten — doppelter Push/Pull/Beine-Durchlauf für maximale Trainingsfrequenz.",
  }[days];
  const recTxt={
    fast:"Du erholst dich schnell — deine Einheiten dürfen dicht beieinander liegen.",
    average:"Zwischen harten Einheiten für dieselben Muskeln liegen mindestens 48 Stunden.",
    slow:"Du brauchst länger zur Erholung — der Plan lässt deinen Muskeln bewusst mehr Luft.",
  }[rec];
  const prefTxt={
    weekday_strong:"Alles liegt unter der Woche — dein Wochenende bleibt frei.",
    weekend_strong:"Das Wochenende trägt die Hauptlast — so passt der Plan in deinen Alltag.",
    consistent:"Gleichmäßig über die Woche verteilt: konstanter Rhythmus, konstanter Fortschritt.",
  }[pref];
  const cardioTxt=sch.includes("cardio")?" Der lockere Cardio-Tag liegt auf einem Ruhetag — er fördert deine Erholung, statt sie zu kosten.":"";
  return {schedule:sch,rationale:`${splitTxt} ${recTxt} ${prefTxt}${cardioTxt}`};
}
/* Fortlaufende Rotation (nicht an Wochentage gekoppelt): eine Sequenz von
   Einheiten — du machst einfach die nächste, wann immer du im Gym bist.
   A/B-Varianten sorgen für Übungsabwechslung bei wiederholten Typen. */
function generateRotation(a){
  a=a||{};
  const days=Math.min(6,Math.max(2,a.days||4));
  const rec=a.recovery_profile||"average";
  const ROT={
    2:["upperA","lowerA"],
    3:rec==="slow"?["upperA","lowerA","upperB"]:["pushA","pullA","legs"],
    4:["upperA","lowerA","upperB","lowerB"],
    5:["pushA","pullA","legs","upperA","lowerA"],
    6:rec==="slow"?["pushA","pullA","legsA","upperA","lowerA","cardio"]:["pushA","pullA","legsA","pushB","pullB","legsB"],
  };
  return (ROT[days]||ROT[4]).slice();
}
function activeRotation(){
  if(!S.rotation&&S.profile){S.rotation=generateRotation(S.profile.a);save();}
  return S.rotation||["upperA","lowerA","upperB","lowerB"];
}
// Die als Nächstes anstehende Einheit der Rotation (Pointer, wandert beim Abschluss weiter).
function rotationNext(){ const r=activeRotation(); return r[(S.rotationPos||0)%r.length]; }
function activePlan(){
  if(!S.plan&&S.profile){S.plan=generateTrainingPlan(S.profile);save();}
  return S.plan||generateTrainingPlan(null);
}
function activePlanB(){
  if(!S.planB&&S.profile){S.planB=generateTrainingPlan(S.profile,"B");save();}
  return S.planB||generateTrainingPlan(null,"B");

/* Variantenschlüssel zerlegen: "pushB" → {base:"push", variant:"B"}.
   Basistypen (push/pull/legs/upper/lower/cardio/rest) enden nie auf A/B. */
function parseTypeKey(key){
  const m=/^(push|pull|legs|upper|lower)([AB])$/.exec(key||"");
  return m?{base:m[1],variant:m[2]}:{base:key,variant:null};
}
/* TYPES: dynamische Sicht auf den Plan (inkl. Soreness-Modus, A/B-Varianten) —
   .ex bleibt als Kompat-Array für Player/Empfehlungen/Voice erhalten. */
function sessionDef(key){
  const {base,variant}=parseTypeKey(key);
  const plan=variant==="B"?activePlanB():activePlan();
  const d=plan[base]||plan.rest;
  const sore=!!S.soreMode[key];
  const ov=(S.exOverrides&&S.exOverrides[key])||{};
  const main=d.main.map((e,i)=>{
    // Nutzer-Tausch (Long-Press) hat Vorrang: Übung ersetzt, Sätze/Pausen bleiben
    if(ov[i]&&EXDB[ov[i]]){
      const nd=EXDB[ov[i]];
      return {...e,n:ov[i],tempo:nd.tempo||e.tempo,rir:nd.rir||e.rir,m:nd.m||e.m,
        why:nd.why||"",alt:nd.alt||null,lengthened:!!nd.lengthened,userSwap:true,orig:e.n};
    }
    if(sore&&e.alt)return {...e,n:e.alt.split(" (")[0],swapped:true,orig:e.n};
    return e;
  });
  const allEx=[...main,...(d.abs||[])];
  const label=d.label+(variant?` ${variant}`:"");
  return {...d,key,base,variant,label,main,ex:allEx.map(e=>[e.n,e.sets,e.reps,e.rest])};
}
/* Long-Press auf eine Übung (v5-Erweiterung): Alternativen-Menü, nach Effizienz
   sortiert — z. B. wenn ein Gerät belegt oder nicht vorhanden ist. */
function openSwapSheet(key,idx){
  const cur=sessionDef(key).main[idx]; if(!cur)return;
  const curM=(EXDB[cur.orig||cur.n]||EXDB[cur.n]||{}).m||cur.m;
  const a=(S.profile&&S.profile.a)||{};
  const allowed=EQ_ALLOWED[a.equipment]||EQ_ALLOWED.gym_full;
  const hasBench=EQ_BENCH[a.equipment]??true;
  const inSession=new Set(sessionDef(key).main.map(e=>e.n));
  const alts=Object.entries(EXDB)
    .filter(([n,d])=>d.m===curM&&n!==cur.n&&!inSession.has(n)&&n!=="Zone-2 Cardio")
    .map(([n,d])=>{
      const fits=allowed.includes(d.eq)&&(!d.bench||hasBench);
      // Effizienz-Ranking: Mehrgelenksübungen > Isolation mit Dehnungsreiz > Isolation;
      // Übungen, die zum Equipment passen, immer zuerst.
      const eff=(fits?10:0)+(d.compound?3:(d.lengthened?2:1));
      return {n,d,fits,eff};
    })
    .sort((x,y)=>y.eff-x.eff);
  A.swapTo=(n)=>{
    S.exOverrides[key]=S.exOverrides[key]||{};

/* Muskelgruppen-Verteilung einer Session: Satz-Anteil je Muskelgruppe in % —
   berechnet aus dem echten Plan des Tages, nichts erfunden. */
function muscleSplit(key){
  const d=sessionDef(key);
  const setsOf=(e)=>weekSets(e.orig||e.n,e.sets);
  const tot=[...d.main,...(d.abs||[])].reduce((s,e)=>s+setsOf(e),0)||1;
  const map={};
  const addEx=(e,fallback)=>{
    const m=(EXDB[e.orig||e.n]||{}).m||MUSCLE_OF[e.n]||fallback;
    map[m]=(map[m]||0)+setsOf(e);
  };
  d.main.forEach(e=>addEx(e,"Ganzkörper"));
  (d.abs||[]).forEach(e=>addEx(e,"Core"));
  return Object.entries(map).map(([m,s])=>({m,pct:Math.round(s/tot*100)})).sort((x,y)=>y.pct-x.pct);
}
function muscleSplitBars(key){
  const parts=muscleSplit(key);
  if(!parts.length)return "";

    ${parts.map(p=>`<div class="barrow"><span class="blbl">${p.m}</span>

}

function recommend(name){
  const h=liftHistory(name);
  if(!h.length) return null; // ehrlich: keine Daten, keine Empfehlung
  const last=h[h.length-1];
  const inc=(last.rpe??8)<=8?2.5:0;

  return {w:Math.round((last.w+inc)*deload/2.5)*2.5, reps:Math.max(5,last.reps)};

// ---------- Insight-/Risk-Engine (regelbasiert, mit Konfidenz) ----------
function buildInsights(){
  const out=[];
  const p=S.profile; if(!p)return out;
  const r7=S.readinessHistory.slice(-7);
  const th7=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<7*dayMs);
  const th14=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<14*dayMs);
  // Volumen-Trend
  if(S.trainingHistory.length>=6){
    const old=S.trainingHistory.slice(0,Math.floor(S.trainingHistory.length/2));
    const recent=S.trainingHistory.slice(Math.floor(S.trainingHistory.length/2));
    const avgO=old.reduce((s,t)=>s+t.volume,0)/old.length, avgR=recent.reduce((s,t)=>s+t.volume,0)/recent.length;
    const d=Math.round((avgR-avgO)/avgO*100);
    if(Math.abs(d)>=5) out.push({t:`Dein Trainingsvolumen hat sich um ${d>0?"+":""}${d} % verändert (Ø ${nfi.format(avgR)} kg/Session).`,conf:Math.min(95,55+S.trainingHistory.length*2)});
  }
  // Gewicht × Protein
  if(S.weightLog.length>=8&&Object.keys(S.nutritionLog).length>=5){
    const w=S.weightLog;
    const dW=Math.round((w[w.length-1].v-w[0].v)*10)/10;
    const protDays=Object.values(S.nutritionLog).filter(l=>(l.meals||[]).reduce((s,m)=>s+m.p,0)>=p.tg.train.p).length;
    const protPct=Math.round(protDays/Object.keys(S.nutritionLog).length*100);
    out.push({t:`Gewicht ${dW>0?"+":""}${nf.format(dW)} kg im Zeitraum — Protein-Adhärenz lag bei ${protPct} %.`,conf:Math.min(90,40+S.weightLog.length)});
  }
  // Stagnation × Recovery
  const bench=e1Series("Bankdrücken");
  if(bench.length>=5&&r7.length>=4){
    const tail=bench.slice(-4);
    const flat=Math.abs(tail[tail.length-1].v-tail[0].v)<tail[0].v*0.01;
    const avgR=Math.round(r7.reduce((s,x)=>s+x.score,0)/r7.length);
    if(flat&&avgR<65) out.push({t:`Bankdrücken stagniert — wahrscheinlichste Ursache: niedrige Erholungswerte (Ø Status ${avgR}/100).`,conf:70});
  }
  // Risk: Übertraining
  const rpes=th14.map(t=>t.avgRpe).filter(Boolean);
  if(rpes.length>=4){
    const avg=rpes.reduce((a,b)=>a+b,0)/rpes.length;
    if(avg>8.6) out.push({t:`Übertrainings-Risiko erhöht: deine Anstrengung lag im Schnitt bei ${nf.format(Math.round(avg*10)/10)}/10 über 14 Tage. Empfehlung: 1 Satz pro Übung streichen.`,conf:75,risk:true});
  }
  // Risk: Adhärenz
  const plannedPerWeek=schedule().filter(t=>t!=="rest").length||p.a.days;
  if(S.trainingHistory.length>=4){
    const adh=Math.min(100,Math.round(th7.length/Math.max(1,plannedPerWeek)*100));
    if(adh<70) out.push({t:`Dranbleiber-Check: nur ${adh} % deiner geplanten Trainings diese Woche. Kürzere Sessions schlagen ausgefallene.`,conf:80,risk:true});
  }
  // Volumen-Toleranz: 2 Wochen in Folge außerhalb MEV–MRV (min 4 Sessions Daten)
  if(S.trainingHistory.length>=4){
    const w0=weeklyMuscleSets(0), w1=weeklyMuscleSets(1);
    for(const [m,band] of Object.entries(VOL_BANDS)){
      const a0=w0[m]||0, a1=w1[m]||0;
      if(a0>band[1]&&a1>band[1]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen über deinem belastbaren Maximum (${a0} Sätze/Woche, optimal sind ${band[0]}–${band[1]}) — deine Erholung kommt nicht hinterher (Fachbegriff: MRV).`,conf:70,risk:true});
      else if(a0>0&&a1>0&&a0<band[0]&&a1<band[0]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen zu niedrig für spürbares Wachstum (${a0} Sätze/Woche) — peile mindestens ${band[0]} Sätze an (Fachbegriff: MEV).`,conf:65});
    }
  }
  // Diet-Adherence-Score (min 3 Tage — sonst kein Output)
  const da=dietAdherence(14);
  if(da) out.push({t:`${LABELS.adherence}: ${da.pct} % der letzten ${da.n} Tage im Zielbereich (±10 % Kalorien, mindestens 90 % Protein).`,conf:da.conf});
  // Adaptation Velocity (stärkster Lift mit ≥5 Datenpunkten)
  for(const lift of ["Kniebeuge","Bankdrücken","Kreuzheben"]){
    const av=adaptationVelocity(lift);
    if(av){
      const expl={schnell:"über dem Erwartungswert deines Trainingsalters — deine Bedingungen stimmen",normal:"im Erwartungsbereich — die Progression läuft sauber",langsam:"unter Erwartung — prüfe Schlaf, Protein und Steigerungsschema",stagnierend:`Plateau — ${LABELS.deload} oder Übungswechsel angezeigt (Schoenfeld, 2017)`}[av.cls];
      out.push({t:`${LABELS.velocity} bei ${lift}: ${av.pctPerMonth>=0?"+":""}${nf.format(av.pctPerMonth)} % Maximalkraft pro Monat — „${av.cls}": ${expl}.`,conf:av.conf});
      break;
    }
  }
  return out.slice(0,8); // Anzeige-Limit pro Tier: Free 1 / Pro 5 / Elite 8
}

// ---------- Voice/NLP: Training ----------
function parseWorkout(input){
  const txt=input.trim().toLowerCase();
  let conf=0.3, name=null;
  const tokens=txt.replace(/[^a-zäöüß0-9\s,.]/g," ").split(/\s+/);
  for(const exName of ALL_EXERCISES){
    const words=exName.toLowerCase().split(/\s+/);
    if(words.some(w=>tokens.some(t=>t.length>=3&&(t.startsWith(w)||w.startsWith(t))))){ name=exName; conf+=0.3; break; }
  }
  // Rechtschreib-Regel auch hier: "bankdrücen 90kg 3x8" wird verstanden
  if(!name){
    let best=null;
    for(const exName of ALL_EXERCISES){
      const words=exName.toLowerCase().replace(/\(.*\)/,"").split(/\s+/).filter(w=>w.length>=4);
      for(const w of words)for(const t of tokens){
        if(t.length<4)continue;
        const d=fuzzyDist(t,w);
        if(d!=null&&(!best||d<best.d))best={n:exName,d};
      }
    }
    if(best){ name=best.n; conf+=0.2; }
  }
  const wMatch=txt.match(/(\d+[.,]?\d*)\s*(kg|kilo)/);
  const weight=wMatch?parseFloat(wMatch[1].replace(",",".")):null;
  if(weight!=null)conf+=0.15;
  let sets=null,reps=null;
  const sxr=txt.match(/(\d+)\s*x\s*(\d+)/);
  if(sxr){sets=parseInt(sxr[1]);reps=parseInt(sxr[2]);conf+=0.2;}
  else{
    const sMatch=txt.match(/(\d+)\s*(sätze|satz|sets)/);
    const rMatch=txt.match(/(\d+)\s*(wiederholungen|wdh|reps)/);
    if(sMatch){sets=parseInt(sMatch[1]);conf+=0.1;}
    if(rMatch){reps=parseInt(rMatch[1]);conf+=0.1;}
  }
  if(!name)return null;
  return {name,weight:weight??0,sets:sets??1,reps:reps??8,conf:Math.min(0.98,conf)};
}
function logParsedWorkout(pw){
  const now=Date.now();
  if(!S.liftLog[pw.name])S.liftLog[pw.name]=[];
  for(let i=0;i<pw.sets;i++) S.liftLog[pw.name].push({t:now+i,w:pw.weight,reps:pw.reps,rpe:8});
  const vol=Math.round(pw.weight*pw.reps*pw.sets);
  const existing=S.trainingHistory.find(t=>t.date===todayKey());
  if(existing){existing.sets+=pw.sets;existing.volume+=vol;}
  else S.trainingHistory.push({date:todayKey(),type:todayType(),sets:pw.sets,volume:vol,avgRpe:8});
  save();
}

/* Levenshtein-Distanz für Tippfehler-tolerante Erkennung. */
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;
  if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
/* GENERELLE RECHTSCHREIB-REGEL: beste Edit-Distanz von `needle` zu IRGENDEINER
   Teilzeichenkette von `hay` (Sellers-Algorithmus). "häncxen" findet so
   "hähnchen" mitten in "hähnchenbrust" — egal ob der Fehler vorn, mittig
   oder hinten sitzt, ob Buchstaben fehlen, vertauscht oder falsch sind. */
function levSub(needle,hay){
  const m=needle.length,n=hay.length;
  if(!m||!n)return Math.max(m,n);
  let prev=new Array(n+1).fill(0); // freier Start in hay
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(needle[i-1]===hay[j-1]?0:1));
    prev=cur;
  }
  return Math.min(...prev); // freies Ende
}
/* Kombinierte Wort-Ähnlichkeit: wörtlich + phonetisch, mit längenabhängiger
   Toleranz. Gibt die Distanz zurück oder null, wenn zu unähnlich. */
function fuzzyDist(t,w){
  if(t===w||t.startsWith(w)||w.startsWith(t))return 0;
  const tol=Math.max(1,Math.ceil(t.length/4)+(t.length>=8?1:0));
  const d=Math.min(levSub(t,w),levSub(phon(t),phon(w))+0.5);
  return d<=tol?d:null;
}
/* Phonetische Normalisierung (deutsch): gleich klingende Schreibweisen werden
   identisch — "skier"→"skir" und "skyr"→"skir" treffen sich so trotz
   2 Buchstaben Unterschied. */
function phon(s){
  return s.toLowerCase()
    .replace(/ß/g,"ss").replace(/ie/g,"i").replace(/y/g,"i")
    .replace(/ph/g,"f").replace(/th/g,"t").replace(/ck/g,"k")
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u")
    .replace(/(.)\1+/g,"$1");
}
/* Liefert {f, dist}: dist 0 = exakter Treffer, >0 = Tippfehler-/Hörfehler-Korrektur. */
function matchFood(segment){
  const tokens=segment.toLowerCase().replace(/[^a-zäöüß0-9\s]/g," ").split(/\s+/)
    .filter(t=>t.length>=3&&!/^\d+$/.test(t)&&!["und","mit","ein","eine","einen","gramm","stück","etwas","noch","dann","heute"].includes(t));
  let best=null;
  for(const f of FOODS){
    const words=f[0].toLowerCase().replace(/\(.*\)/,"").trim().split(/\s+/).filter(w=>w.length>=3);
    for(const w of words)for(const t of tokens){
      const dist=fuzzyDist(t,w);
      if(dist!=null&&(!best||dist<best.dist||(dist===best.dist&&f[0].length<best.f[0].length)))
        best={f,dist};
    }
  }
  return best;
}
function parseNutrition(input){
  // Multi-Item: "500g hähnchen und 300g reis, 2 tomaten"
  const segments=input.trim().toLowerCase().split(/\s*(?:,|\bund\b|\+|danach)\s*/).filter(Boolean);
  const items=[];
  for(const seg of segments){
    const hit=matchFood(seg);
    if(!hit){items.push({raw:seg,food:null});continue;}
    const food=hit.f;
    const gramMatch=seg.match(/(\d+)\s*(g|gramm)\b/);
    const countMatch=seg.match(/(\d+)\s*(stück|stk|x)\b/)||seg.match(/^(\d+)\s+/);
    const wordCount={ein:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5}[seg.split(/\s+/)[0]];
    const gram=gramMatch?parseInt(gramMatch[1]):null;
    const count=countMatch?parseInt(countMatch[1]):(wordCount||null);
    const g=gram??(count?food[1]*count:food[1]);
    let conf=0.55; if(gram||count)conf+=0.3; if(seg.includes(food[0].toLowerCase().split(" ")[0]))conf+=0.1;
    conf-=hit.dist*0.08; // Tippfehler-Korrektur: ehrlich niedrigere Konfidenz
    items.push({raw:seg,food,gram:g,fuzzy:hit.dist>0,conf:Math.max(0.4,Math.min(0.97,conf))});
  }
  return items;
}
function nlogToday(){
  if(!S.nutritionLog[todayKey()])S.nutritionLog[todayKey()]={meals:[],water:0};
  if(S.nutritionLog[todayKey()].water==null)S.nutritionLog[todayKey()].water=0;
  return S.nutritionLog[todayKey()];
}
function addFood(food,gram){
  const mult=gram?gram/food[1]:1;
  const entry={n:food[0]+(gram&&gram!==food[1]?` (${gram} g)`:""),g:gram||food[1],
    k:Math.round(food[2]*mult),p:Math.round(food[3]*mult*10)/10,c:Math.round(food[4]*mult*10)/10,f:Math.round(food[5]*mult*10)/10};
  nlogToday().meals.push(entry); save();
  return entry;
}

function lineChart(series, fc){
  const all=[...series.map(p=>p.v), ...(fc||[]).map(p=>p.v)];
  const min=Math.min(...all)*.97, max=Math.max(...all)*1.03, W=340,H=190,P=8;
  const tMax=series[series.length-1].t+(fc?84*dayMs:0), tMin=series[0].t;
  const X=(t)=>P+(t-tMin)/(tMax-tMin||1)*(W-2*P), Y=(v)=>H-P-(v-min)/(max-min||1)*(H-2*P);
  const line=series.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  let dash="",band="";
  if(fc){
    const lt=series[series.length-1];
    const fpts=[{t:lt.t,v:lt.v},...fc.map((p)=>({t:lt.t+p.wk*7*dayMs,v:p.v}))];
    dash=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const up=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v*(1+0.018*i)).toFixed(1)}`).join(" ");
    const lo=[...fpts].reverse().map((p,i)=>{const j=fpts.length-1-i;return `L${X(p.t).toFixed(1)},${Y(p.v*(1-0.018*j)).toFixed(1)}`;}).join(" ");
    band=`<path d="${up} ${lo} Z" fill="var(--volt)" opacity=".08"/>`;
  }
  // FIX (v5/6B): bei wenigen Datenpunkten/kurzer Zeitspanne erzeugten die 4
  // festen Ticks identische bzw. überlappende Datums-Labels — Duplikate filtern.
  let lastTick="";
  const ticks=[0,.33,.66,1].map((f)=>{const t=tMin+f*(tMax-tMin);
    const lbl=fmtD(new Date(t));
    if(lbl===lastTick)return "";
    lastTick=lbl;
    return `<text x="${X(t)}" y="${H-2}" fill="var(--t3)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${lbl}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:16/10;display:block" aria-hidden="true">
    ${band}<path d="${line}" fill="none" stroke="var(--volt)" stroke-width="2"/>
    ${dash?`<path d="${dash}" fill="none" stroke="var(--volt)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}${ticks}</svg>`;
}
function donutSVG(parts,size=110){
  const total=parts.reduce((s,p)=>s+p.v,0)||1, r=size/2-10, c=2*Math.PI*r;

    const len=p.v/total*c;

    off+=len; return s;
  }).join("");
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">${segs}</svg>`;
}

/* Interaktiver Ziel-Rechner: ehrliche, studienbasierte Projektion (Bereiche,
   klar als Projektion gekennzeichnet — keine versprochenen Einzelresultate). */
const LP={goal:"muscle_gain",days:4,exp:"novice"};
function landingProjection(){
  // Kraftzuwachs auf Grundübungen über 12 Wochen, %-Bereich nach Trainingsalter
  // (Größenordnung gem. Literatur: Anfänger steigern am schnellsten).
  const base={beginner:[20,35],novice:[12,22],intermediate:[6,12],advanced:[3,7]}[LP.exp]||[12,22];
  const dFac=Math.min(1,0.55+LP.days*0.11); // mehr Tage → näher ans obere Ende (mit Sättigung)
  const lo=Math.round(base[0]*dFac), hi=Math.round(base[1]*dFac);
  // Geschätzter Zeitaufwand/Woche aus Tagen × ~55 Min
  const minWk=LP.days*55;
  // Magermasse-Aufbau-Tendenz (qualitativ, nicht als kg versprochen)
  const muscle={muscle_gain:"deutlich",recomp:"moderat",strength:"gering, dafür viel Kraft",fat_loss:"erhalten im Defizit",general:"solide",endurance:"gering",mobility:"gering"}[LP.goal]||"solide";
  return {lo,hi,minWk,muscle};
}
function projChart(lo,hi){
  // Sättigungskurve von 0 → Mittelwert über 12 Wochen, als Fläche
  const mid=(lo+hi)/2, W=300,H=120,P=6, pts=[];
  for(let w=0;w<=12;w++){const v=mid*(1-Math.exp(-w/4.5));pts.push([P+w/12*(W-2*P),H-P-v/(mid||1)*(H-2*P)]);}
  const line=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${line} L${W-P},${H-P} L${P},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:5/2;display:block">
    <path d="${area}" fill="var(--hl)" opacity=".12"/>
    <path class="lp-chartline" d="${line}" fill="none" stroke="var(--hl)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${pts[12][0]}" cy="${pts[12][1]}" r="4" fill="var(--hl)"/>
    <text x="${P}" y="${H-1}" font-size="9" fill="var(--t3)" font-family="JetBrains Mono,monospace">Heute</text>
    <text x="${W-P}" y="${H-1}" font-size="9" fill="var(--t3)" text-anchor="end" font-family="JetBrains Mono,monospace">Woche 12</text></svg>`;
}
function lpResultInner(){

function renderRegister(){
  A.back=()=>{S.screen="landing";save();render();};
  A.vUser=(el)=>{el.classList.toggle("err",el.value.length>0&&el.value.length<3);el.classList.toggle("ok",el.value.length>=3);};
  A.vMail=(el)=>{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value);el.classList.toggle("err",el.value.length>0&&!ok);el.classList.toggle("ok",ok);};
  A.vPw=(el)=>{
    const s=pwStrength(el.value), m=document.getElementById("pwmeter"), lbl=document.getElementById("pwlbl");
    if(m){m.style.width=s.pct+"%";m.style.background=s.col;} if(lbl){lbl.textContent=el.value?("Stärke: "+s.lbl):"";}
    el.classList.toggle("err",el.value.length>0&&el.value.length<8);el.classList.toggle("ok",el.value.length>=8);
  };
  A.vPw2=(el)=>{const pw=document.getElementById("r-pw").value;el.classList.toggle("err",el.value.length>0&&el.value!==pw);el.classList.toggle("ok",el.value.length>0&&el.value===pw);};
  A.register=async()=>{
    const u=document.getElementById("r-user").value.trim();
    const e=document.getElementById("r-mail").value.trim().toLowerCase();
    const p=document.getElementById("r-pw").value;
    const p2=document.getElementById("r-pw2").value;
    const err=document.getElementById("r-err");
    err.textContent="";
    if(u.length<3){err.textContent="Benutzername: mindestens 3 Zeichen.";return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){err.textContent="Bitte gültige E-Mail-Adresse angeben.";return;}
    if(p.length<8){err.textContent="Passwort: mindestens 8 Zeichen.";return;}
    if(p!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}
    if(S.users.some(x=>x.email===e)){err.textContent="Diese E-Mail ist bereits registriert.";return;}
    const pwHash=await hashPw(p);
    S.users.push({username:u,email:e,pwHash});
    S.currentUser=S.users.length-1; S.devMode=false; S.tier="free";
    if(S.invitedBy){ S.tier="pro"; S.proBonusUntil=Date.now()+14*dayMs; setTimeout(()=>toast("Willkommensbonus: 14 Tage PERFORMANCE aktiv"),600); }

    S.liftLog={}; S.weightLog=[]; S.readinessHistory=[]; S.trainingHistory=[];
    S.nutritionLog={}; S.chat=[]; S.schedule=null; S.plan=null; S.checkin=null; S.checkinDate=null;
    S.screen="onboarding"; S.step=0;
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Konto erstellen</h2></div>

    <div class="field"><label for="r-mail">E-Mail</label>
      <input type="email" id="r-mail" autocomplete="email" oninput="A.vMail(this)" placeholder="du@beispiel.de"></div>
    <div class="field"><label for="r-pw">Passwort</label>
      <input type="password" id="r-pw" autocomplete="new-password" oninput="A.vPw(this)" placeholder="mind. 8 Zeichen">
      <div class="strength-meter"><div id="pwmeter" style="width:0"></div></div>
      <p class="xs t2 mt8" id="pwlbl" style="min-height:14px"></p></div>
    <div class="field"><label for="r-pw2">Passwort bestätigen</label>
      <input type="password" id="r-pw2" autocomplete="new-password" oninput="A.vPw2(this)"></div>
    <p class="fielderr" id="r-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.register()">Registrieren & Assessment starten</button>
    <p class="xs t2 mt16" style="text-align:center">SHA-256-Hash, nie Klartext. Daten bleiben auf diesem Gerät.</p></div>`;

function renderLogin(){
  A.back=()=>{S.screen="landing";save();render();};
  A.forgot=()=>modal(`<p class="ct">Passwort vergessen?</p><p class="sm t2" style="line-height:1.6">Demo-Modus: Passwort-Reset via E-Mail ist nicht verfügbar — lösche den LocalStorage dieser Seite, um alle Konten zurückzusetzen.</p>`);
  A.login=async()=>{
    const err=document.getElementById("l-err");
    err.textContent="";
    if(S.lockoutUntil&&Date.now()<S.lockoutUntil){
      err.textContent=`Zu viele Versuche. Warte ${Math.ceil((S.lockoutUntil-Date.now())/1000)} s.`;return;
    }
    const e=document.getElementById("l-mail").value.trim().toLowerCase();
    const p=document.getElementById("l-pw").value;
    const idx=S.users.findIndex(x=>x.email===e);
    const hash=await hashPw(p);
    if(idx<0||S.users[idx].pwHash!==hash){
      S.loginAttempts=(S.loginAttempts||0)+1;
      if(S.loginAttempts>=5){S.lockoutUntil=Date.now()+30000;S.loginAttempts=0;
        err.textContent="5 Fehlversuche — Login für 30 Sekunden gesperrt.";}
      else err.textContent=`E-Mail oder Passwort falsch (Versuch ${S.loginAttempts}/5).`;
      save();return;
    }
    S.currentUser=idx; S.loginAttempts=0; S.lockoutUntil=null;
    S.screen=S.profile?"app":"onboarding"; S.tab="home";
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Anmelden</h2></div>

    <div class="field"><label for="l-pw">Passwort</label>
      <input type="password" id="l-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')A.login()"></div>
    <p class="fielderr" id="l-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.login()">Anmelden</button>
    <button class="btn ghost mt8" onclick="A.forgot()">Passwort vergessen?</button></div>`;
}

    const cur=S.a[k]||[];

    if(k==="goals"&&S.tier==="free"&&cur.length>=1&&!cur.includes(v)){showUpgradeTeaser("multi_goal");return;}

    root.innerHTML=bar+`<div class="fade"><h2>${st.q}</h2><p class="hint"></p>

  else if(st.type==="medical"){
    root.innerHTML=bar+`<div class="fade"><h2>Bevor es losgeht</h2>
      <p class="hint">METRICGYM ersetzt keine medizinische Beratung. Bei Herz-Kreislauf-Problemen, Schwindel oder attestierten Einschränkungen: vorher ärztlich abklären.</p>

  }
  else if(st.type==="reveal"){
    root.innerHTML=`<div class="center"><div class="spin"></div><p class="sm t2">Engine berechnet …</p></div>`;
    setTimeout(()=>{
      const a={...S.a,days:S.a.days||4,act:S.a.act||"light",sex:S.a.sex||"male",age:S.a.age||29};

      a.schedule_pref=a.schedule_pref||"consistent"; a.recovery_profile=a.recovery_profile||"average";
