// =====================================================================
// ANALYTICS — niemals erfundene Werte, Daten-Gates pro Modul
// =====================================================================
function gateCard(title,need,have,unit){
  return `<div class="card"><p class="ct">${title}</p>
    <p class="sm t2 mb8">Noch nicht genug Daten.</p>
    <div class="row"><div class="progress" style="height:8px"><div style="width:${Math.min(100,have/need*100)}%"></div></div>
    <span class="metric xs t2">${have} / ${need} ${unit}</span></div></div>`;
}
function renderAnalytics(){
  const p=S.profile, a=p.a;
  const dp=dataProgress();
  const lifts=Object.keys(S.liftLog).filter(n=>e1Series(n).length>=3);
  const allSets=Object.values(S.liftLog).flat();
  const ins=buildInsights();
  const today=S.checkin||(S.readinessHistory.length?{score:S.readinessHistory[S.readinessHistory.length-1].score,tier:S.readinessHistory[S.readinessHistory.length-1].tier}:null);

  let html=`
    <!-- Daten-Sammelstand: ehrlich, immer sichtbar bis voll -->
    ${(dp.training<7||dp.nutrition<7||dp.status<7)?`<div class="card" style="border-color:rgba(91,140,255,.35)">
      <p class="ct">📡 Datensammlung · letzte 7 Tage</p>
      ${[["Training",dp.training],["Ernährung",dp.nutrition],["Status",dp.status]].map(([l,v])=>`
        <div class="barrow"><span class="blbl">${l}</span>
        <div class="btrack"><div class="bfill" style="width:${v/7*100}%;background:${v>=5?"var(--volt)":v>=3?"var(--info)":"var(--t3)"}"></div></div>
        <span class="bval metric">${v} / 7 Tage</span></div>`).join("")}
      <p class="xs t2 mt8">Analytics erscheinen erst, wenn genug echte Daten da sind — wir erfinden nichts.</p></div>`:""}

    ${today?`<div class="card row" style="justify-content:flex-start;gap:20px">${ringSVG(today.score,today.tier)}
      <div><p class="ct" style="margin-bottom:4px">Status</p><p class="xs t2">Aktueller Erholungszustand.</p></div></div>`
    :gateCard("Status","1","0","Check-ins")}`;

  // Kraft-Trajectory
  if(lifts.length){
    const top=lifts.sort((x,y)=>e1Series(y).length-e1Series(x).length).slice(0,2);
    html+=`<div class="card"><p class="ct">Kraft-Trajectory ${infoBtn("trajectory")}</p>${top.map(n=>{
      const s=e1Series(n), fc=forecast12w(s);
      return `<p class="sm mb8" style="font-weight:500">${n}</p>${lineChart(s,fc)}
        ${fc?`<p class="sm volt-txt metric mt8">Prognose: ${fmtKg(fc[2].v)} bis ${fmtD(new Date(s[s.length-1].t+84*dayMs))} <span class="conf">· Konfidenz ${Math.min(85,40+s.length*4)} %</span></p>`:""}
        <p class="xs t2 mt8 mb16">Konfidenz steigt mit jeder Session: aktuell ${s.length} Datenpunkte — ab 12 wird die Prognose deutlich stabiler.</p>`;
    }).join("")}</div>`;
  } else html+=gateCard("Kraft-Trajectory","3","0","Sessions je Übung");

  // Volumen
  if(S.trainingHistory.length>=3){
    const wks=[...Array(4)].map((_,i)=>{
      const from=Date.now()-(4-i)*7*dayMs, to=Date.now()-(3-i)*7*dayMs;
      return S.trainingHistory.filter(t=>{const x=new Date(t.date).getTime();return x>=from&&x<to;}).reduce((s,t)=>s+t.sets,0);
    });
    const maxW=Math.max(...wks,1);
    const volWhy=S.currentWeek===4
      ?"Grund: geplanter Deload (Woche 4 von 4) — Volumen bewusst reduziert, kein Trainingsausfall."
      :(wks[2]>0&&wks[3]<wks[2]*0.7?"Aktuelle Woche liegt deutlich unter der Vorwoche — geplante Sessions prüfen.":wks[2]>0&&wks[3]>wks[2]*1.3?"Volumen-Sprung ggü. Vorwoche — Steigerungen über +30 %/Woche erhöhen das Verletzungsrisiko (Gabbett, 2016).":"Volumen stabil zur Vorwoche — gute Basis für Progression.");
    html+=`<div class="card"><p class="ct">Wochenvolumen · Sätze</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">
        ${wks.map((v,i)=>`<div style="flex:1;text-align:center">
          <div style="height:${Math.max(3,v/maxW*76)}px;background:${i===3?"var(--volt)":"var(--t3)"};border-radius:4px 4px 0 0;opacity:.85"></div>
          <p class="xs t2" style="margin-top:4px">W${i+1}</p><p class="metric xs">${v}</p></div>`).join("")}
      </div>
      <p class="xs t2 mt8">${volWhy}</p></div>`;
  } else html+=gateCard("Wochenvolumen","3",S.trainingHistory.length,"Sessions");

  // RPE
  if(allSets.length>=10){
    const rpeCounts={7:0,8:0,9:0,10:0};
    allSets.forEach(s=>{const k=Math.min(10,Math.max(7,Math.round(s.rpe??8)));rpeCounts[k]++;});
    const total=allSets.length, pct10=Math.round(rpeCounts[10]/total*100);
    html+=`<div class="card"><p class="ct">Intensitätsprofil</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">
        ${[7,8,9,10].map(k=>{const pc=rpeCounts[k]/total;
          return `<div style="flex:1;text-align:center">
            <div style="height:${Math.max(4,pc*76)}px;background:${k<=8?"var(--volt)":k===9?"var(--warn)":"var(--danger)"};border-radius:4px 4px 0 0;opacity:.85"></div>
            <p class="metric xs t2" style="margin-top:4px">RPE ${k}</p><p class="metric xs">${Math.round(pc*100)} %</p></div>`;}).join("")}
      </div>
      ${pct10>20?`<p class="warncard mt8" role="alert"><b>Übertrainings-Risiko:</b> ${pct10} % RPE-10-Sätze. <span class="conf">Konfidenz 75 %</span></p>`:`<p class="xs t2 mt8">Zielzone: ~70 % bei RPE 7–8 (Helms et al., 2016).</p>`}</div>`;
  } else html+=gateCard("Intensitätsprofil","10",allSets.length,"Sätze");

  // Körper
  if(S.weightLog.length>=3){
    const w7=S.weightLog;
    const wMin=Math.min(...w7.map(q=>q.v)),wMax=Math.max(...w7.map(q=>q.v));
    const lastW=w7[w7.length-1].v, hM=a.height/100, bmi=Math.round(lastW/(hM*hM)*10)/10;
    const bf=a.bodyFat!=null?a.bodyFat:null;
    const lean=bf!=null?Math.round(lastW*(1-bf/100)*10)/10:null;
    const ffmi=lean!=null?Math.round((lean/(hM*hM)+6.1*(1.8-hM))*10)/10:null;
    html+=`<div class="card"><p class="ct">Körperkennzahlen</p>
      <svg viewBox="0 0 340 170" style="width:100%;aspect-ratio:2/1;display:block" aria-hidden="true">
        ${w7.map((q,i)=>{const x=8+i/Math.max(1,w7.length-1)*324,y=160-(q.v-wMin)/(wMax-wMin||1)*144;
          return `<circle cx="${x}" cy="${y}" r="1.6" fill="var(--t3)"/>`;}).join("")}
        <path d="${w7.map((q,i)=>{const win=w7.slice(Math.max(0,i-6),i+1),avg=win.reduce((s,z)=>s+z.v,0)/win.length;
          const x=8+i/Math.max(1,w7.length-1)*324,y=160-(avg-wMin)/(wMax-wMin||1)*144;return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}).join(" ")}"
          fill="none" stroke="var(--volt)" stroke-width="2"/></svg>
      <div class="chips mt8">
        <span class="badge mute">Aktuell <span class="metric" style="margin-left:4px">${fmtKg(lastW)}</span></span>
        <span class="badge mute">BMI <span class="metric" style="margin-left:4px">${nf.format(bmi)}</span></span>
        ${ffmi!=null?`<span class="badge mute">FFMI <span class="metric" style="margin-left:4px">${nf.format(ffmi)}</span></span>`:""}
      </div></div>`;
  } else html+=gateCard("Körperkennzahlen","3",S.weightLog.length,"Wiegungen");

  // Recovery
  if(S.readinessHistory.length>=5){
    const r14=S.readinessHistory.slice(-14);
    const debt=Math.round(r14.reduce((s,x)=>s+Math.max(0,8-(x.sleepH||7)),0)*10)/10;
    html+=`<div class="card"><p class="ct">Recovery · ${r14.length} Tage</p>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px">
        ${r14.map(x=>`<div style="flex:1" title="${x.date}: ${x.score}">
          <div style="height:${Math.max(3,x.score/100*76)}px;background:${x.score>=60?"var(--volt)":x.score>=40?"var(--info)":"var(--danger)"};border-radius:2px;opacity:.85"></div></div>`).join("")}
      </div>
      <div class="row mt8"><span class="sm t2">Schlaf-Defizit (vs. 8 h)</span>
        <span class="metric ${debt>6?"danger-txt":debt>3?"warn-txt":"volt-txt"}">${nf.format(debt)} h</span></div></div>`;
  } else html+=gateCard("Recovery","5",S.readinessHistory.length,"Status-Checks");

  // Ernährung
  const nutriDays=Object.keys(S.nutritionLog).filter(d=>(S.nutritionLog[d].meals||[]).length>0);
  if(nutriDays.length>=3){
    const days7=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*dayMs).toISOString().slice(0,10));
    const nutri7=days7.map(d=>{
      const log=S.nutritionLog[d];
      if(!log)return{d,k:0,p:0,c:0,f:0};
      return {d,...log.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p,c:x.c+m.c,f:x.f+m.f}),{k:0,p:0,c:0,f:0})};
    });
    const macroSum=nutri7.reduce((s,x)=>({p:s.p+x.p,c:s.c+x.c,f:s.f+x.f}),{p:0,c:0,f:0});
    const kcalMax=Math.max(...nutri7.map(x=>x.k),p.tg.train.kcal)*1.1;
    const protDays=nutri7.filter(x=>x.p>=p.tg.train.p).length, protTracked=nutri7.filter(x=>x.k>0).length||1;
    html+=`<div class="card"><p class="ct">Ernährung · 7 Tage</p>
      <div style="display:flex;align-items:flex-end;gap:5px;height:90px;position:relative">
        <div style="position:absolute;left:0;right:0;bottom:${p.tg.train.kcal/kcalMax*80}px;border-top:1px dashed var(--volt);opacity:.6"></div>
        ${nutri7.map(x=>`<div style="flex:1;text-align:center">
          <div style="height:${Math.max(2,x.k/kcalMax*80)}px;background:${x.k>0&&Math.abs(x.k-p.tg.train.kcal)/p.tg.train.kcal<=.1?"var(--volt)":"var(--t3)"};border-radius:3px 3px 0 0;opacity:.85"></div>
          <p class="xs t2" style="margin-top:3px">${x.d.slice(8)}</p></div>`).join("")}
      </div>
      <div class="row mt8"><span class="sm t2">Protein-Adhärenz</span>
        <span class="metric ${protDays/protTracked>=.7?"volt-txt":"warn-txt"}">${protDays}/${protTracked} Tage</span></div>
      ${(()=>{const da7=dietAdherence(7);return da7?`<div class="row mt8"><span class="sm t2">Adhärenz-Score (±10 % kcal, ≥90 % P)</span>
        <span class="metric ${da7.pct>=70?"volt-txt":"warn-txt"}">${da7.pct} % <span class="conf">· ${da7.conf} %</span></span></div>`:"";})()}
      <div class="row mt8" style="justify-content:flex-start;gap:16px">
        ${donutSVG([{v:macroSum.p*4,col:"var(--volt)"},{v:macroSum.c*4,col:"var(--info)"},{v:macroSum.f*9,col:"var(--t3)"}],90)}
        <div class="sm t2" style="line-height:1.9">
          <span style="color:var(--volt)">●</span> Protein ${nfi.format(macroSum.p*4)} kcal<br>
          <span style="color:var(--info)">●</span> Carbs ${nfi.format(macroSum.c*4)} kcal<br>
          <span style="color:var(--t3)">●</span> Fett ${nfi.format(macroSum.f*9)} kcal</div></div></div>`;
  } else html+=gateCard("Ernährungs-Analytics","3",nutriDays.length,"Tage geloggt");

  // Mikronährstoff-Hinweise: NUR aus tatsächlich geloggten Top-10-Lebensmitteln
  if(nutriDays.length>=3){
    const sums=[0,0,0,0]; let hits=0;
    for(const [d,l] of Object.entries(S.nutritionLog)){
      if(Date.now()-new Date(d).getTime()>=7*dayMs)continue;
      for(const m of (l.meals||[])){
        const key=Object.keys(MICRO).find(k=>m.n.startsWith(k));
        if(!key)continue;
        const base=(FOODS.find(x=>x[0]===key)||[,100])[1];
        const mult=(m.g||base)/base;
        MICRO[key].forEach((v,i)=>{sums[i]+=v*mult;}); hits++;
      }
    }
    if(hits>0){
      html+=`<div class="card"><p class="ct">Mikronährstoff-Hinweise · 7 Tage ${infoBtn("micro")}</p>
        ${MICRO_NAMES.map((nme,i)=>{const pc=Math.min(100,Math.round(sums[i]/(MICRO_REF[i]*7)*100));
          return `<div class="barrow"><span class="blbl">${nme}</span>
            <div class="btrack"><div class="bfill" style="width:${pc}%;background:${pc>=70?"var(--volt)":pc>=40?"var(--info)":"var(--warn)"}"></div></div>
            <span class="bval metric">${pc} %</span></div>`;}).join("")}
        <p class="xs t2 mt8">Geschätzt aus ${hits} geloggten Einträgen mit hinterlegten Werten — Richtungsanzeige, kein vollständiges Tracking.</p></div>`;
    } else {
      html+=`<div class="card"><p class="ct">Mikronährstoff-Hinweise ${infoBtn("micro")}</p>
        <p class="sm t2">Noch keine Lebensmittel mit hinterlegten Mikronährwerten geloggt (z. B. Lachs, Eier, Haferflocken, Spinat).</p></div>`;
    }
  } else html+=gateCard("Mikronährstoff-Hinweise","3",nutriDays.length,"Tage geloggt");

  // Insights
  html+=ins.length?`<div class="card" style="border-color:rgba(200,255,46,.3)"><p class="ct">🧠 Engine-Insights</p>
    ${ins.map(i=>`<div class="${i.risk?"warncard":"msg ai"}" style="max-width:100%;margin-bottom:8px">${i.t}<div class="conf mt8">Konfidenz ${i.conf} %</div></div>`).join("")}</div>`
  :`<div class="card"><p class="ct">🧠 Engine-Insights</p><p class="sm t2">Die Engine erklärt deinen Fortschritt, sobald Muster statistisch belastbar sind — keine erfundenen Zahlen.</p></div>`;

  root.innerHTML=html;
}

// =====================================================================
// ERNÄHRUNG (Voice-first, Multi-Item, Approval)
// =====================================================================
let dayType="train", pendingItems=null, pendingManual=null;
function renderNutrition(){
  const p=S.profile, tg=p.tg[dayType==="train"?"train":"rest"];
  const log=nlogToday();
  const sum=log.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p,c:s.c+m.c,f:s.f+m.f}),{k:0,p:0,c:0,f:0});
  A.dt=(t)=>{dayType=t;renderNutrition();};
  A.delMeal=(i)=>{log.meals.splice(i,1);save();renderNutrition();};
  A.water=(d)=>{log.water=Math.max(0,Math.min(12,(log.water||0)+d));save();renderNutrition();};
  A.foodInput=(el)=>{
    const q=el.value.trim().toLowerCase(), ac=document.getElementById("food-autocomplete");
    if(!ac)return;
    if(q.length<2){ac.style.display="none";ac.innerHTML="";return;}
    const matches=FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,5);
    if(!matches.length){ac.style.display="none";return;}
    ac.style.display="block";
    ac.innerHTML=matches.map((f)=>`<button class="ac-item" onclick="A.acPick(${FOODS.indexOf(f)})">${f[0]} <span class="xs t2">· ${nfi.format(f[2])} kcal / ${f[1]} g</span></button>`).join("");
  };
  A.acPick=(idx)=>{
    document.getElementById("food-name").value=FOODS[idx][0];
    const ac=document.getElementById("food-autocomplete"); if(ac)ac.style.display="none";
    document.getElementById("food-gram").focus();
  };
  A.addCustomFood=()=>{
    const name=document.getElementById("food-name").value.trim();
    const gram=parseInt(document.getElementById("food-gram").value)||null;
    if(!name){toast("Lebensmittel eingeben");return;}
    const exact=FOODS.find(f=>f[0].toLowerCase()===name.toLowerCase())||FOODS.find(f=>f[0].toLowerCase().includes(name.toLowerCase()));
    if(exact){ const e=addFood(exact,gram); toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`); renderNutrition(); }
    else { pendingManual={name,gram:gram||100}; renderNutrition(); }
  };
  A.manualSave=()=>{
    const k=parseInt(document.getElementById("m-k").value)||0;
    const pp=parseFloat(document.getElementById("m-p").value)||0;
    const c=parseFloat(document.getElementById("m-c").value)||0;
    const f=parseFloat(document.getElementById("m-f").value)||0;
    if(k<=0){toast("Kalorien angeben");return;}
    nlogToday().meals.push({n:pendingManual.name+` (${pendingManual.gram} g)`,g:pendingManual.gram,k,p:pp,c,f});
    pendingManual=null; save(); renderNutrition();
  };
  A.manualCancel=()=>{pendingManual=null;renderNutrition();};
  A.voiceFood=()=>speech((txt)=>{ const el=document.getElementById("vf-in"); if(el)el.value=txt; A.parseFood(); },"vf-mic");
  A.parseFood=()=>{
    const el=document.getElementById("vf-in");
    if(!el||!el.value.trim())return;
    const items=parseNutrition(el.value);
    if(!items.some(i=>i.food)){toast("Nichts erkannt — z. B. '200 g Hähnchen und 150 g Reis'");return;}
    pendingItems=items; renderNutrition();
  };
  A.approveItems=()=>{
    let n=0;
    for(const it of (pendingItems||[])){ if(it.food){addFood(it.food,it.gram);n++;} }
    pendingItems=null; toast(`✓ ${n} Lebensmittel eingetragen`); renderNutrition();
  };
  A.cancelItems=()=>{pendingItems=null;renderNutrition();};
  A.quick=(i)=>{const e=addFood(FOODS[i],null);toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`);renderNutrition();};
  // MOCK: Foto-Erkennung — wählt deterministisch (Dateigröße) ein Lebensmittel aus FOODS.
  // TODO Real: Vision-API (z. B. Claude/GPT-4V) für echte Lebensmittel-Erkennung + Mengenschätzung.
  A.photoPick=(el)=>{
    const f=el.files&&el.files[0]; if(!f)return;
    const idx=f.size%FOODS.length;
    pendingItems=[{raw:"Foto",food:FOODS[idx],gram:FOODS[idx][1],conf:0.5,photo:true}];
    el.value=""; renderNutrition();
  };
  A.explainSat=()=>A.explain("satiety");
  const waterGlasses=log.water||0, waterMl=waterGlasses*250;
  root.innerHTML=`
    <div class="card">
      <div class="row mb16" style="background:var(--s2);border-radius:999px;padding:4px;border:1px solid var(--border)">
        <button class="btn ${dayType==="train"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('train')">Trainingstag</button>
        <button class="btn ${dayType==="rest"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('rest')">Ruhetag</button></div>
      <div class="grid4">${miniRing("Kalorien",sum.k,tg.kcal,"kcal")}${miniRing("Protein",sum.p,tg.p,"g")}${miniRing("Carbs",sum.c,tg.c,"g")}${miniRing("Fett",sum.f,tg.f,"g")}</div>
      <p class="xs t2 mt8" style="text-align:center">Ziele aus deinem Profil ${infoBtn("kcalTarget")} ${infoBtn("protein")}</p></div>

    <!-- Voice-First Logging -->
    <div class="card" style="border-color:rgba(200,255,46,.3)">
      <p class="ct">🎙 Sprich oder fotografiere deine Mahlzeit</p>
      <div class="row mb8">
        <button id="vf-mic" class="btn" style="width:50px;min-width:50px" onclick="A.voiceFood()" aria-label="Spracheingabe">🎤</button>
        <input type="text" id="vf-in" placeholder="'500 g Hähnchen und 300 g Reis'" style="flex:1" onkeydown="if(event.key==='Enter')A.parseFood()">
        <button class="btn" style="width:50px;min-width:50px" onclick="document.getElementById('vf-file').click()" aria-label="Foto aufnehmen">📷</button>
        <button class="btn volt" style="width:50px;min-width:50px" onclick="A.parseFood()" aria-label="Parsen">➤</button></div>
      <input type="file" id="vf-file" accept="image/*" capture="environment" style="display:none" onchange="A.photoPick(this)">
      ${pendingItems?`<div class="warncard" style="border-color:rgba(200,255,46,.4);background:rgba(200,255,46,.06)">
        ${pendingItems.some(it=>it.photo)?`<p class="xs warn-txt mb8">Foto-Erkennung: Demo — in der Vollversion über Vision-API. Bitte prüfen.</p>`:""}
        ${pendingItems.map(it=>it.food?`
          <div class="row mb4"><span class="sm">${it.food[0]} · <span class="metric">${it.gram} g</span></span>
          <span class="metric xs t2">${nfi.format(it.food[2]*it.gram/it.food[1])} kcal <span class="conf">· ${Math.round(it.conf*100)} %</span></span></div>`
          :`<p class="xs danger-txt mb4">„${it.raw}" nicht erkannt</p>`).join("")}
        <div class="grid2 mt8"><button class="btn" onclick="A.cancelItems()">Verwerfen</button>
        <button class="btn volt" onclick="A.approveItems()">Übernehmen</button></div></div>`:""}
    </div>

    <div class="card"><p class="ct">Suche & manuell</p>
      <div class="row mb8">
        <input type="text" id="food-name" placeholder="Lebensmittel …" style="flex:1" oninput="A.foodInput(this)" autocomplete="off">
        <input type="number" id="food-gram" placeholder="g" style="width:76px" min="1" max="2000" inputmode="numeric">
        <button class="btn volt" style="width:50px;min-width:50px" onclick="A.addCustomFood()" aria-label="Hinzufügen">+</button></div>
      <div id="food-autocomplete" class="ac-list" style="display:none"></div>
      ${pendingManual?`<div class="warncard mt8"><b>„${pendingManual.name}"</b> unbekannt — Nährwerte für ${pendingManual.gram} g schätzen:
        <div class="grid4 mt8">
          <input type="number" id="m-k" placeholder="kcal" inputmode="numeric">
          <input type="number" id="m-p" placeholder="P" inputmode="numeric">
          <input type="number" id="m-c" placeholder="C" inputmode="numeric">
          <input type="number" id="m-f" placeholder="F" inputmode="numeric"></div>
        <div class="grid2 mt8"><button class="btn" onclick="A.manualCancel()">Abbrechen</button>
        <button class="btn volt" onclick="A.manualSave()">Speichern</button></div></div>`:""}</div>

    <div class="card"><div class="row mb8"><p class="ct" style="margin:0">💧 Wasser</p>
      <span class="metric sm ${waterMl>=2500?"volt-txt":"t2"}">${nf.format(waterMl/1000)} / 2,5 l</span></div>
      <div class="row">
        <div class="stepper"><button onclick="A.water(-1)" aria-label="Glas entfernen">−</button>
          <span class="val metric">${waterGlasses} 🥤</span>
          <button onclick="A.water(1)" aria-label="Glas hinzufügen">+</button></div>
        <div class="progress" style="height:8px"><div style="width:${Math.min(100,waterMl/2500*100)}%"></div></div>
      </div></div>

    <div class="card"><p class="ct">Heute geloggt</p>
      ${log.meals.length?`<ul class="list">${log.meals.map((m,i)=>{
        const sat=satiety(m);
        return `<li><span>${m.n}${sat?` <button class="badge ${sat.cls}" style="cursor:pointer;border:none;font-size:9.5px;padding:2px 7px" onclick="A.explainSat()">${sat.lbl}</button>`:""}</span>
        <span style="display:flex;gap:10px;align-items:center"><span class="metric">${nfi.format(m.k)} kcal</span>
        <button class="iconbtn" style="min-width:32px;min-height:32px;font-size:13px" onclick="A.delMeal(${i})" aria-label="Löschen">✕</button></span></li>`;}).join("")}</ul>`
      :`<p class="sm t2">Noch nichts geloggt. Sprich, such oder tipp deine Mahlzeit.</p>`}</div>

    <div class="card"><p class="ct">Quickliste</p>
      <div style="max-height:240px;overflow-y:auto">${FOODS.slice(0,24).map((f,i)=>`
        <button class="opt row" style="margin-bottom:6px" onclick="A.quick(${i})">
        <span><span style="display:block;font-size:14px">${f[0]}</span><span class="xs t2">${f[1]} g Basis</span></span>
        <span class="metric xs t2">${nfi.format(f[2])} kcal · ${nf.format(f[3])} g P</span></button>`).join("")}
        <p class="xs t2" style="text-align:center;padding:8px">… alle ${FOODS.length} via Suche</p></div></div>`;
}

// =====================================================================
// PROFIL
// =====================================================================
let EP=null;
function renderProfile(){
  const p=S.profile, u=S.users[S.currentUser]||{username:"—",email:"—"};
  A.logout=()=>{S.currentUser=null;S.screen="landing";coachOpen=false;save();render();};
  A.editProfile=()=>{EP={weight:p.a.weight,goals:[...(p.tg.goals||[])]};A.epRender();};
  A.epGoal=(g)=>{
    EP.goals=EP.goals.includes(g)?EP.goals.filter(x=>x!==g):(EP.goals.length<3?[...EP.goals,g]:EP.goals);
    A.epRender();
  };
  A.epRender=()=>{
    modal(`<p class="ct">Profil bearbeiten</p>
      <div class="field"><label for="ep-w">Aktuelles Gewicht (kg)</label>
        <input type="number" id="ep-w" inputmode="decimal" value="${EP.weight}" min="30" max="250" step="0.1"></div>
      <p class="xs t2 mb8">Ziele (max. 3, erstes = primär)</p>
      <div class="chips mb8">${Object.entries(GOAL_LABEL).map(([g,l])=>`
        <button class="chip ${EP.goals.includes(g)?"sel":""}" onclick="A.epGoal('${g}')">${EP.goals.includes(g)?(EP.goals.indexOf(g)+1)+". ":""}${l}</button>`).join("")}</div>
      <button class="btn volt" onclick="A.epSave()">Speichern & Ziele neu berechnen</button>`);
    const inp=document.getElementById("ep-w");
    if(inp)inp.oninput=()=>{EP.weight=parseFloat(inp.value)||EP.weight;};
  };
  A.epSave=()=>{
    if(!EP)return;
    const w=Math.round((EP.weight||p.a.weight)*10)/10;
    if(w<30||w>250){toast("Gewicht zwischen 30 und 250 kg");return;}
    p.a.weight=w;
    if(EP.goals.length)p.a.goals=EP.goals;
    p.bmr=bmrCalc(p.a);
    p.td=tdeeCalc(p.bmr,p.a.act||"light",p.a.weight,p.a.len||60,p.a.days||4);
    p.tg=multiTargets(p.a,p.bmr,p.td);
    S.weightLog=S.weightLog.filter(x=>new Date(x.t).toISOString().slice(0,10)!==todayKey());
    S.weightLog.push({t:Date.now(),v:w});
    EP=null; overlay.innerHTML=""; save(); render();
    toast("Profil aktualisiert — Ziele neu berechnet");
  };
  A.exportData=()=>{
    try{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=`metricgym-export-${todayKey()}.json`; a.click();
      URL.revokeObjectURL(url);
    }catch{ toast("Export fehlgeschlagen"); }
  };
  A.wipe=()=>{
    modal(`<p class="ct">Alle Daten löschen?</p><p class="sm t2 mb8">Unwiderruflich — Konto, Profil, gesamte Historie.</p>
      <button class="btn" style="border-color:rgba(255,77,77,.4);color:var(--danger)" onclick="A.wipeConfirm()">Endgültig löschen</button>`);
  };
  A.wipeConfirm=()=>{
    try{localStorage.removeItem(KEY);}catch{}
    S={screen:"landing",users:[],currentUser:null,loginAttempts:0,lockoutUntil:null,devMode:false,step:0,
       a:{height:181,weight:82,sleep:7,goals:[]},profile:null,tab:"home",currentWeek:1,checkin:null,checkinDate:null,
       schedule:null,scheduleSuggestion:null,logged:[],exIdx:0,restEnd:null,prToday:null,playerType:null,
       liftLog:{},trainingHistory:[],nutritionLog:{},readinessHistory:[],weightLog:[],chat:[]};
    coachOpen=false; overlay.innerHTML=""; save(); render();
  };
  root.innerHTML=`
    <div class="card row" style="justify-content:flex-start;gap:14px">
      <div class="avatar" style="width:52px;height:52px;font-size:20px">${u.username.slice(0,1).toUpperCase()}</div>
      <div><p style="font-weight:600">${u.username} ${S.devMode?'<span class="badge volt" style="margin-left:6px">Dev</span>':""}</p>
      <p class="xs t2">${u.email}</p></div></div>
    ${p?`<div class="card"><p class="ct">Ziele</p>
      <div class="chips">${(p.tg.goals||[]).map((g,i)=>`<span class="badge ${i===0?"volt":"mute"}">${GOAL_LABEL[g]}</span>`).join("")}</div>
      <div class="grid2 mt16">
        <div><p class="xs t2">Kalorienziel (Training) ${infoBtn("kcalTarget")}</p><p class="metric sm">${fmtKcal(p.tg.train.kcal)}</p></div>
        <div><p class="xs t2">Proteinziel ${infoBtn("protein")}</p><p class="metric sm">${nfi.format(p.tg.train.p)} g</p></div>
      </div>
      <button class="btn mt16" onclick="A.editProfile()">Profil bearbeiten</button></div>`:""}
    <div class="card"><p class="ct">Daten</p>
      <button class="btn mb8" onclick="A.exportData()">Daten exportieren (JSON)</button>
      <button class="btn" style="border-color:rgba(255,77,77,.35);color:var(--danger)" onclick="A.wipe()">Konto & Daten löschen</button>
      <p class="xs t2 mt8">DSGVO Art. 17 / 20 · Alle Daten liegen lokal auf diesem Gerät.</p></div>
    <button class="btn ghost" onclick="A.logout()">⎋ Abmelden</button>
    <p class="xs" style="color:var(--t3);text-align:center;margin-top:16px">METRICGYM V4 · Performance Intelligence</p>`;
}

// ---------- Boot ----------
window.addEventListener("error",(e)=>{
  if(!root.innerText.trim()){
    root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
    <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(e.message||"unbekannt")}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
  }
});
try{ render(); }catch(err){
  root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
  <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(err&&err.message||err)}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
}
</script>
</body>
</html>
