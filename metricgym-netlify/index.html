<style>
  /* Typografie: Inter Tight (UI + Hero-Zahlen) + JetBrains Mono (Metriken). */
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    /* Helles, warmes Creme-Theme (editorial-minimalistisch) */
    --bg:#F7F5F1; --s1:#FFFFFF; --s2:#F0EDE7; --s3:#E8E4DC; --border:#E2DDD3;
    --hairline:rgba(0,0,0,.06);
    --t1:#1A1A1A; --t2:#6E6A62; --t3:#A39E93;
    --accent:#1A1A1A; --accent-soft:rgba(26,26,26,.06);
    --hl:#E8633A; --hl-soft:rgba(232,99,58,.12); /* einziger warmer Akzent */
    --volt:#E8633A; /* Daten-Highlights (Charts, Deltas) — remapped auf Terracotta */
    --info:#7D8CA3; --danger:#D4574B; --warn:#C98A3D;
    --font-display:'Inter Tight',system-ui,sans-serif;
    --font-hero:'Inter Tight',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --glass-bg:rgba(255,255,255,.6);
    --glass-bg-strong:rgba(255,255,255,.82);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:light;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:var(--font-display);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  /* Pastell-Tiefe HINTER der Glas-Ebene — sonst wirkt Glas wie weiße Box */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60% 40% at 15% 8%, rgba(232,99,58,.07), transparent 70%),
      radial-gradient(50% 35% at 88% 22%, rgba(125,140,163,.09), transparent 70%),
      radial-gradient(70% 50% at 50% 95%, rgba(201,138,61,.06), transparent 70%),
      var(--bg);
  }
  .metric{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .hero-num{font-family:var(--font-hero); font-weight:900; letter-spacing:-0.03em;}
  .wrap{max-width:430px; margin:0 auto; min-height:100dvh; padding:70px 16px 110px;}
  .wrap.noshell{padding-top:16px;}
  h1{font-size:17px; font-weight:800; letter-spacing:-0.01em;}
  h2{font-size:27px; font-weight:800; letter-spacing:-0.02em; line-height:1.15; margin-bottom:4px;}
  .display-m{font-size:19px; font-weight:700; letter-spacing:-0.01em; line-height:1.3;}
  .label{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); display:block; margin:0 0 var(--sp-3) var(--sp-1);}
  .section{margin-bottom:var(--sp-7);}
  .hint{font-size:13px; color:var(--t2); margin-bottom:16px; line-height:1.55;}

  /* ===== Liquid Glass (HELL): Basis für alle erhöhten Elemente ===== */
  /* FIX (v5/6A): .menu-sheet aus der 60%-Glass-Gruppe entfernt — eigene,
     deckendere Definition unten (glass-bg-strong + blur 32px), sonst scheint
     der Seiteninhalt durchs offene Menü. */
  .card,.acc,.tier-card,.lockcard,.warncard,.qcard,.modal,.sheet{
    position:relative;
    background:var(--glass-bg);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03),
      0 8px 24px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .card::before,.tier-card::before,.sheet::before,.modal::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.5), rgba(255,255,255,0) 50%);
  }
  .card{border-radius:20px; padding:var(--sp-5); margin-bottom:var(--sp-4);}
  .modal,.sheet{background:var(--glass-bg-strong); -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);}
  /* Glass-Light für Listen (Perf: kein blur auf vielen Elementen) */
  .acc,.qcard,.lockcard,.warncard{-webkit-backdrop-filter:none; backdrop-filter:none; background:rgba(255,255,255,.72);}

  .ct{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); margin-bottom:12px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:48px; border-radius:999px; border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.66); color:var(--t1); font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.8);
    transition:all .25s var(--spring);
  }
  .btn:active{transform:scale(.97); box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);}
  .btn.volt{background:rgba(24,24,24,.92); color:#FFFFFF; border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 6px 18px rgba(26,26,26,.22), inset 0 1px 0 rgba(255,255,255,.15);}
  .btn.volt:active{transform:scale(.97);}
  .btn.ghost{background:transparent; border:none; box-shadow:none; color:var(--t2); min-height:44px; font-weight:600;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .opt{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px;
    background:rgba(255,255,255,.72); border:1px solid var(--hairline); border-radius:16px;
    color:var(--t1); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    min-height:44px; transition:all .25s var(--spring);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .opt:active{transform:scale(.985);}
  .opt.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .opt .sub{display:block; font-size:12px; color:inherit; opacity:.65; font-weight:400; margin-top:2px;}
  .grid5{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .cell{
    padding:13px 2px; text-align:center; background:rgba(255,255,255,.72); border:1px solid var(--hairline);
    border-radius:14px; color:var(--t1); font-size:17px; font-weight:600; cursor:pointer;
    font-family:var(--font-mono); min-height:44px; transition:all .25s var(--spring);
  }
  .cell.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .cell.dash{border-style:dashed;}
  .progress{height:6px; flex:1; background:var(--s3); border-radius:999px; overflow:hidden;}
  .progress>div{height:100%; background:var(--hl); border-radius:999px; transition:width .7s cubic-bezier(.25,.8,.25,1);}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back{background:none; border:none; color:var(--t2); font-size:22px; cursor:pointer; min-width:44px; min-height:44px;}
  input[type=range]{width:100%; height:44px; accent-color:var(--accent);}
  input[type=date],input[type=number],input[type=text],input[type=email],input[type=password]{
    width:100%; min-height:48px; padding:0 14px; background:rgba(255,255,255,.8); color:var(--t1);
    border:1px solid var(--border); border-radius:14px; font-size:16px; font-family:inherit;
  }
  input.err{border-color:var(--danger);}
  input.ok{border-color:var(--accent);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--t2); margin-bottom:5px;}
  .fielderr{font-size:12px; color:var(--danger); margin-top:4px; min-height:14px;}
  .dial{text-align:center; font-size:46px; font-weight:900; letter-spacing:-0.03em; margin-bottom:8px; font-family:var(--font-hero);}
  .dial small{font-size:15px; color:var(--t2); font-weight:500; letter-spacing:0;}
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid;}
  .badge.info{color:var(--info); border-color:rgba(125,140,163,.35); background:rgba(125,140,163,.1);}
  .badge.volt{color:#fff; border-color:var(--accent); background:var(--accent);}
  .badge.danger{color:var(--danger); border-color:rgba(212,87,75,.3); background:rgba(212,87,75,.08);}
  .badge.warn{color:var(--warn); border-color:rgba(201,138,61,.35); background:rgba(201,138,61,.1);}
  .badge.mute{color:var(--t2); border-color:var(--border); background:var(--s2);}
  .warncard{border:1px solid rgba(201,138,61,.3); background:rgba(255,250,240,.85); border-radius:16px; padding:14px; margin-bottom:10px; font-size:13px; line-height:1.55;}
  .warncard b{color:var(--warn);}

  /* ===== App Bar: helles Glass, fixed ===== */
  .appbar{
    position:fixed; top:0; left:0; right:0; z-index:45;
    background:rgba(247,245,241,.72);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--hairline);
  }
  .appbar-inner{max-width:430px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 14px; min-height:54px;}
  .logo-btn{display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:8px 4px; color:var(--t1); min-height:44px;}
  .logo-text{font-family:var(--font-display); font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--t1);}
  .icon-btn{width:40px; height:40px; min-width:40px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.7); border:1px solid var(--hairline); border-radius:50%; cursor:pointer; color:var(--t1);
    box-shadow:0 1px 3px rgba(0,0,0,.05); transition:all .25s var(--spring);}
  .icon-btn:active{transform:scale(.94);}
  .menu-backdrop{position:fixed; inset:0; z-index:44; background:rgba(26,26,26,.18);}
  .menu-sheet{position:fixed; top:54px; left:12px; right:12px; z-index:46; max-width:406px; margin:0 auto;
    border-radius:22px; padding:10px;
    background:linear-gradient(rgba(247,245,241,.35),rgba(247,245,241,.35)), var(--glass-bg-strong);
    -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);
    border:1px solid rgba(255,255,255,.78);
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.9);}
  .menu-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 16px; background:none; border:none; color:var(--t1); font-size:15px; font-weight:600; font-family:inherit; border-radius:14px; cursor:pointer; min-height:48px;}
  .menu-item:active{background:var(--s2);}
  .menu-divider{height:1px; background:var(--hairline); margin:8px 4px;}

  /* ===== Bottom Nav: 5 Tabs, Floating Glass Pill, Analytics zentriert ===== */
  /* KRITISCH: #tabbar ist direktes Body-Kind, keine transform-Eltern → fixed bleibt stabil. */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:48; pointer-events:none;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));
    transform:none !important;
  }
  .tabbar-inner{
    pointer-events:auto; max-width:406px; margin:0 auto;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    border-radius:999px; padding:6px 8px;
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.85);
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 5px;
    background:none; border:none; color:var(--t3); font-size:9.5px; font-weight:700; cursor:pointer; font-family:inherit; min-height:48px;
    transition:color .25s var(--spring);
  }
  .tab .ic{display:flex; align-items:center; justify-content:center; transition:transform .25s var(--spring);}
  .tab.active{color:var(--t1);}
  .tab.active .ic{transform:translateY(-1px);}
  .tab.flag .ic{
    width:46px; height:46px; margin-top:-22px; border-radius:50%;
    background:var(--accent); color:#fff; border:3px solid var(--bg);
    box-shadow:0 6px 16px rgba(26,26,26,.25);
  }
  .tab.flag{color:var(--t3);}
  .tab.flag.active{color:var(--t1);}
  .tab.flag.active .ic{transform:translateY(-3px) scale(1.05); box-shadow:0 8px 20px rgba(26,26,26,.3);}

  .fab{
    position:fixed; bottom:104px; right:16px; z-index:47;
    width:54px; height:54px; border-radius:50%; border:1px solid rgba(255,255,255,.6); cursor:pointer;
    background:rgba(24,24,24,.92); color:#fff;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 8px 22px rgba(26,26,26,.28); display:flex; align-items:center; justify-content:center;
    transition:transform .25s var(--spring);
  }
  .fab:active{transform:scale(.93);}
  .coach-panel{position:fixed; bottom:104px; right:12px; left:12px; max-width:406px; margin:0 auto; z-index:50;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper button{width:44px; height:44px; border-radius:999px; background:rgba(255,255,255,.75); color:var(--t1);
    border:1px solid var(--hairline); font-size:20px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .stepper .val{min-width:86px; text-align:center; font-size:18px;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{min-width:44px; height:44px; border-radius:999px; background:rgba(255,255,255,.72); border:1px solid var(--hairline);
    color:var(--t2); font-family:var(--font-mono); font-size:14px; cursor:pointer; padding:0 8px; transition:all .25s var(--spring);}
  .scale button.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; text-align:center; gap:18px;}
  .huge{font-size:54px; font-weight:900; letter-spacing:-0.03em; color:var(--t1); font-family:var(--font-hero);}
  .spin{width:40px; height:40px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .pulse{animation:pulse .6s ease-out infinite;}
  .fade{animation:fade .4s var(--spring);}
  @keyframes fade{from{opacity:0; transform:translateY(12px) scale(.98)}to{opacity:1; transform:none}}
  /* Gestaffeltes Einblenden der Karten */
  .wrap>.card:nth-child(1),.section:nth-child(1) .card{animation:fade .4s var(--spring) backwards;}
  .wrap>.card:nth-child(2),.section:nth-child(2) .card{animation:fade .4s var(--spring) .05s backwards;}
  .wrap>.card:nth-child(3),.section:nth-child(3) .card{animation:fade .4s var(--spring) .1s backwards;}
  .wrap>.card:nth-child(4),.section:nth-child(4) .card{animation:fade .4s var(--spring) .15s backwards;}
  .wrap>.card:nth-child(5),.section:nth-child(5) .card{animation:fade .4s var(--spring) .2s backwards;}
  @keyframes popIn{from{opacity:0; transform:translateY(16px) scale(.95)}to{opacity:1; transform:none}}
  .pop{animation:popIn .45s var(--spring);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.72); border:1px solid var(--hairline);
    color:var(--t1); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; min-height:40px; transition:all .25s var(--spring);
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .chip:active{transform:scale(.96);}
  .chip.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  /* Konversations-Feed: Nutzer = helle Bubble rechts, Coach = Fließtext links */
  .msg{max-width:82%; font-size:14px; line-height:1.6; margin-bottom:12px;}
  .msg.user{margin-left:auto; background:var(--s3); border:none; color:var(--t1); padding:11px 15px; border-radius:20px; border-bottom-right-radius:6px; animation:popIn .4s var(--spring);}
  .msg.ai{background:none; border:none; padding:0; color:var(--t1); max-width:95%; animation:fade .4s var(--spring);}
  .ring-lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t2); font-weight:700;}
  .list li{display:flex; justify-content:space-between; font-size:14px; padding:3px 0; list-style:none; color:var(--t1); gap:8px;}
  .list li span:last-child{color:var(--t2);}
  .volt-txt{color:var(--hl);} .danger-txt{color:var(--danger);} .warn-txt{color:var(--warn);} .t2{color:var(--t2);}
  .sm{font-size:13px;} .xs{font-size:11px;}
  .mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px;}
  .pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;}
  .pill{flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--hairline);
    background:rgba(255,255,255,.72); color:var(--t2); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; min-height:38px;}
  .pill.active{border-color:var(--accent); background:var(--accent); color:#fff;}
  .setdots{display:flex; gap:6px; align-items:center;}
  .setdots .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--t3); transition:all .3s var(--spring);}
  .setdots .dot.full{background:var(--hl); border-color:var(--hl); transform:scale(1.1);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}

/* =====================================================================
   METRICGYM V4 — Performance Intelligence Platform (Single-File-PWA)
   Prinzipien: Visual-first · keine erfundenen Metriken · User owns
   schedule · Voice-first Input · kontextueller Floating-Coach.
   ===================================================================== */

// ---------- Format ----------
const nf  = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const nfi = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const df  = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});
const dfLong = new Intl.DateTimeFormat("de-DE",{weekday:"long", day:"numeric", month:"long"});
const fmtKg=(v)=>nf.format(v)+" kg", fmtKcal=(v)=>nfi.format(v)+" kcal", fmtD=(d)=>df.format(d);
const todayKey=()=>new Date().toISOString().slice(0,10);
const dayMs=864e5;

/* ---------- Sprach-Ebene (v5/Phase 2) ----------
   Zentrale Klartext-Labels: Die UI spricht die Sprache des Nutzers,
   Fachbegriffe erscheinen nur als Zusatz "(Fachbegriff: X)" in den
   ⓘ-Erklärungen. Interne Funktions-/Variablennamen bleiben unverändert. */
const LABELS={
  meso:"Trainingsblock",            // Fachbegriff: Mesozyklus
  deload:"Erholungswoche",          // Fachbegriff: Deload
  e1rm:"geschätzte Maximalkraft",   // Fachbegriff: e1RM
  rpe:"Anstrengung",                // Fachbegriff: RPE
  volume:"Trainingsbelastung",      // Fachbegriff: Volumen (MEV–MRV)
  velocity:"Dein Fortschrittstempo",// Fachbegriff: Adaptation Velocity
  adherence:"Ernährungs-Treue",     // Fachbegriff: Diet Adherence
  hypertrophy:"Muskelaufbau",       // Fachbegriff: Hypertrophie
  micros:"Vitamine & Mineralstoffe",// Fachbegriff: Mikronährstoffe
  satiety:"Sättigungs-Check",       // Fachbegriff: Satiety
};

// ---------- Storage ----------
const KEY="metricgym-v4";
const MEM={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch{ return MEM[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{ MEM[k]=v; } },
};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>store.set(KEY,JSON.stringify(S)),100); }

// ---------- Engine ----------
function mifflin(sex,age,h,w){ return Math.round(10*w+6.25*h-5*age+(sex==="male"?5:-161)); }
function katch(w,bf){ return Math.round(370+21.6*w*(1-bf/100)); }
function bmrCalc(a){ return a.bodyFat!=null?katch(a.weight,a.bodyFat):mifflin(a.sex,a.age,a.height,a.weight); }
const NEAT={sedentary:1.2,light:1.3,moderate:1.4,active:1.475,very_active:1.55};
function tdeeCalc(bmr,act,w,len,days){
  const rest=Math.round(bmr*NEAT[act]);
  const train=rest+Math.round(5.0*w*(len/60));
  return {rest,train,avg:Math.round((train*days+rest*(7-days))/7)};
}
const GOAL_D={muscle_gain:[.1,.1],fat_loss:[-.2,-.2],recomp:[.1,-.1],strength:[.05,.05],general:[0,0],endurance:[0,0],mobility:[0,0]};
const GOAL_LABEL={muscle_gain:"Muskelaufbau",fat_loss:"Fettabbau",recomp:"Recomp",strength:"Maximalkraft",general:"Fitness",endurance:"Ausdauer",mobility:"Mobility"};
function multiTargets(a,bmr,td){
  const goals=(a.goals&&a.goals.length?a.goals:[a.goal||"muscle_gain"]);
  const conflicts=[];
  let recompOverride=false;
  if(goals.includes("muscle_gain")&&goals.includes("fat_loss")){
    recompOverride=true;
    conflicts.push({type:"recomp",msg:"Muskelaufbau + Fettabbau = Recomp-Protokoll. Kalorienziel ±50 kcal um den TDEE.",bio:"Hoher Proteinbedarf schützt Muskelmasse im Defizit (Helms et al., 2014)."});
  }
  if(goals.includes("strength")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Kraft + Ausdauer: Interferenzeffekt. Kraft vor Ausdauer, mind. 6 h Abstand.",bio:"Concurrent Training dämpft mTOR-Signalwege (Wilson et al., 2012)."});
  }
  const floor=a.sex==="female"?1400:1600, warn=[];
  const clamp=(k)=>{let v=k; if(v<bmr){v=bmr;warn.push("bmr");} if(v<floor){v=floor;warn.push("floor");} return Math.round(v);};
  let tk,rk;
  if(recompOverride){ tk=clamp(td.train+50); rk=clamp(td.rest-50); }
  else{
    const weights=goals.map((_,i)=>i===0?(goals.length===1?1:0.6):0.4/(goals.length-1));
    let bt=0,br=0;
    goals.forEach((g,i)=>{const d=GOAL_D[g]||GOAL_D.general; bt+=d[0]*weights[i]; br+=d[1]*weights[i];});
    tk=clamp(td.train*(1+bt)); rk=clamp(td.rest*(1+br));
  }
  let prot;
  if(a.bodyFat!=null) prot=Math.round(2.2*a.weight*(1-a.bodyFat/100));
  else prot=Math.round(1.8*Math.min(a.weight,25*(a.height/100)**2));
  const fat=Math.round(.9*a.weight);
  const mac=(k)=>({kcal:k,p:prot,f:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4))});
  return {train:mac(tk),rest:mac(rk),warn:[...new Set(warn)],conflicts,goals};
}
function e1rm(w,reps,rpe){
  if(reps===1) return w;
  const eff=reps+(10-(rpe??8));
  return Math.round(w*(1+eff/30)*10)/10;
}
function statusScore(sleep,energy,stress,sore){
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const comps=[[.3,c01((sleep-1)/4)],[.25,c01((energy-1)/4)],[.2,c01(1-(stress-1)/4)],[.25,c01(1-(sore-1)/4)]];
  const score=Math.round(comps.reduce((s,c)=>s+c[0]*c[1],0)*100);
  const tier=score>=80?"Stark":score>=60?"Gut":score>=40?"Mäßig":"Erholung";
  return {score,tier};
}
function forecast12w(series){
  if(series.length<3) return null;
  const n=series.length;
  let st=0,sy=0,stt=0,sty=0;
  series.forEach((p)=>{st+=p.t;sy+=p.v;stt+=p.t*p.t;sty+=p.t*p.v;});
  const den=n*stt-st*st, slope=den===0?0:(n*sty-st*sy)/den, last=series[n-1];
  let vv=last.v, ss=slope; const pts=[];
  for(let b=0;b<3;b++){ vv+=ss*28; ss*=.85; pts.push({wk:(b+1)*4, v:Math.round(Math.min(vv,last.v*1.15)*10)/10}); }
  return pts;

// ---------- Diet-Adherence-Score (±10 % kcal, ≥90 % Protein) — min 3 Tage ----------
function dietAdherence(nDays){
  if(!S.profile)return null;
  const tg=S.profile.tg.train;
  const days=Object.entries(S.nutritionLog)
    .filter(([d,l])=>(l.meals||[]).length>0&&Date.now()-new Date(d).getTime()<nDays*dayMs);
  if(days.length<3)return null;
  let hit=0;
  for(const [,l] of days){
    const s=l.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p}),{k:0,p:0});
    if(Math.abs(s.k-tg.kcal)/tg.kcal<=0.1&&s.p>=tg.p*0.9)hit++;
  }
  return {pct:Math.round(hit/days.length*100),n:days.length,conf:Math.min(90,40+days.length*7)};
}

function adaptationVelocity(name){
  const s=e1Series(name); if(s.length<5)return null;
  const span=(s[s.length-1].t-s[0].t)/dayMs; if(span<14)return null;
  const pctPerMonth=Math.round(((s[s.length-1].v-s[0].v)/s[0].v)/(span/30)*1000)/10;
  const exp=S.profile?S.profile.a.exp:"intermediate";
  const fast={beginner:6,novice:4,intermediate:2.5,advanced:1.5}[exp]||2.5;
  const cls=pctPerMonth>=fast?"schnell":pctPerMonth>=fast*0.4?"normal":pctPerMonth>0.3?"langsam":"stagnierend";

function parseStatus(txt){
  const t=txt.toLowerCase(); const r={};
  if(/sehr gut geschlafen|top geschlafen|ausgeschlafen/.test(t))r.sleep=5;
  else if(/gut geschlafen/.test(t))r.sleep=4;
  else if(/mittel.*geschlafen|ok geschlafen/.test(t))r.sleep=3;
  else if(/schlecht geschlafen|wenig geschlafen|kaum geschlafen/.test(t))r.sleep=2;
  else if(/sehr schlecht geschlafen|durchgemacht/.test(t))r.sleep=1;
  if(/voller energie|sehr fit|energiegeladen/.test(t))r.energy=5;
  else if(/\bfit\b|gut erholt|erholt/.test(t))r.energy=4;
  else if(/mittelmäßig|geht so/.test(t))r.energy=3;
  else if(/müde|schlapp|erschöpft/.test(t))r.energy=2;
  if(/sehr gestresst|extrem.*stress/.test(t))r.stress=5;
  else if(/viel stress|gestresst|stress hoch/.test(t))r.stress=4;
  else if(/normaler stress|etwas stress/.test(t))r.stress=3;
  else if(/wenig stress/.test(t))r.stress=2;
  else if(/kein stress|entspannt|ruhig/.test(t))r.stress=1;
  if(/starker kater|alles tut weh|sehr starker kater/.test(t))r.sore=4;
  else if(/mittlerer kater/.test(t))r.sore=3;
  else if(/leichter kater|etwas kater|bisschen kater/.test(t))r.sore=2;
  else if(/kein kater|keine schmerzen/.test(t))r.sore=1;
  return r;
}

// ---------- Auth ----------
async function hashPw(pw){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }catch{
    let h1=0x811c9dc5,h2=0x1000193;
    for(const c of pw){h1=Math.imul(h1^c.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+c.charCodeAt(0),2654435761)>>>0;}
    return "fnv-"+h1.toString(36)+h2.toString(36);
  }
}
function pwStrength(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10; if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const entropy=pw.length*Math.log2(pool||1);
  if(entropy<40)return{lbl:"schwach",pct:33,col:"var(--danger)"};
  if(entropy<60)return{lbl:"mittel",pct:66,col:"var(--warn)"};
  return{lbl:"stark",pct:100,col:"var(--volt)"};
}

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function buildDevSeed(){
  const rng=mulberry32(0x4D475947), now=Date.now();
  const lifts={"Kniebeuge":95,"Bankdrücken":75,"Kreuzheben":125,"Schulterdrücken":42.5,"Klimmzug":0,"Langhantelrudern":60};

    liftLog[name]=[];
    for(let wk=0;wk<10;wk++){
      if(rng()<.08) continue;
      const prog=1+0.10*(1-Math.exp(-wk/4));
      const dl=(wk%4===3)?0.9:1;
      const w=base===0?0:Math.round(base*prog*dl/2.5)*2.5;
      const t=now-(9.5*7-wk*7)*dayMs+rng()*2*dayMs;
      liftLog[name].push({t,w,reps:5+Math.floor(rng()*4),rpe:7+Math.floor(rng()*3)});

    weightLog.push({t:now-d*dayMs, v:Math.round((81.2+(66-d)*.018+(rng()-.5)*.6)*10)/10}); }
  const readinessHistory=[]; for(let d=13;d>=0;d--){
    const sleep=2+Math.floor(rng()*4), energy=2+Math.floor(rng()*4), stress=1+Math.floor(rng()*3), sore=1+Math.floor(rng()*4);
    const r=statusScore(sleep,energy,stress,sore);
    readinessHistory.push({date:new Date(now-d*dayMs).toISOString().slice(0,10),score:r.score,tier:r.tier,sleep,energy,stress,sore,sleepH:Math.round((5.5+rng()*3)*10)/10});
  }
  const trainingHistory=[]; const labels=["push","pull","legs","upper"];
  for(let wk=0;wk<10;wk++){ for(let d=0;d<4;d++){
    if(rng()<.1) continue;
    trainingHistory.push({date:new Date(now-(9.5*7-wk*7-d*1.5)*dayMs).toISOString().slice(0,10),
      type:labels[d%4],sets:16+Math.floor(rng()*8),volume:Math.round(5200+rng()*3200),avgRpe:Math.round((7.2+rng()*1.6)*10)/10});
  }}
  const nutritionLog={}; for(let d=7;d>=1;d--){
    const date=new Date(now-d*dayMs).toISOString().slice(0,10);
    nutritionLog[date]={meals:[{n:"Demo-Tag (aggregiert)",g:0,k:Math.round(2300+(rng()-.4)*700),p:Math.round(130+rng()*60),c:Math.round(220+rng()*80),f:Math.round(60+rng()*30)}],water:Math.floor(4+rng()*7)};
  }
  return {liftLog,weightLog,readinessHistory,trainingHistory,nutritionLog};
}

function generateTrainingPlan(profile){
  const a=(profile&&profile.a)||{};
  const exp=a.exp||"novice", goals=a.goals||["muscle_gain"];
  const equipment=EQ_ALLOWED[a.equipment]?a.equipment:"gym_full";
  const allowed=EQ_ALLOWED[equipment], hasBench=EQ_BENCH[equipment];
  const focus=(a.focus||[]).filter(m=>FOCUS_EX[m]);
  const scheme=SETS_BY_EXP[exp]||SETS_BY_EXP.novice;
  const strength=goals[0]==="strength";
  const repC=strength?"3–5":"5–8", restC=strength?210:165;
  const fits=(n)=>{const d=EXDB[n]; return d&&allowed.includes(d.eq)&&(!d.bench||hasBench);};
  const mk=(n,sets,reps,rest)=>{const d=EXDB[n]||{};return {n,sets,reps,rest,tempo:d.tempo||"2-0-1-0",rir:d.rir||"1–2",m:d.m||"—",why:d.why||"",alt:d.alt||null,lengthened:!!d.lengthened};};
  // Slot-Auswahl: Equipment-Filter + Dedupe, dann Sätze/Reps nach Rolle
  const buildMain=(key)=>{
    const chosen=[];
    for(const slot of SESSION_SLOTS[key]){
      if(chosen.length>=scheme.count)break;
      const n=slot.find(x=>fits(x)&&!chosen.includes(x));
      if(n)chosen.push(n);
    }
    // Fokus-Bonus: Extra-Übung früh einsortieren (Position 3, nach den Haupt-Grundübungen)
    for(const fm of focus){
      if(!(DAY_MUSCLES[key]||[]).includes(fm))continue;
      const bonus=(FOCUS_EX[fm]||[]).find(x=>fits(x)&&!chosen.includes(x));
      if(bonus){chosen.splice(Math.min(2,chosen.length),0,bonus);break;}
    }
    return chosen.map((n,i)=>{
      const d=EXDB[n]||{};
      if(d.compound&&i<2)return mk(n,scheme.c,repC,restC);
      if(d.compound)return mk(n,scheme.a,"6–10",120);
      return mk(n,scheme.i,d.lengthened?"12–20":"10–15",60);
    });
  };
  const day=(key,main,abs)=>{
    const absEx=abs?ABS_BLOCK.map(([n,st,rp,rs])=>mk(n,st,rp,rs)):[];
    // Session-Dauer wird BERECHNET, nicht abgefragt: Aufwärmen + Sätze×(Arbeit+Pause) + Cool-down
    const setMin=main.reduce((s,e)=>s+e.sets*(0.75+e.rest/60),0)+absEx.reduce((s,e)=>s+e.sets*1.5,0);
    const est=Math.round((8+setMin+5)/5)*5;
    return {key,...TYPE_META[key],warmup:WARMUP_DEFAULT,cooldown:COOLDOWN_DEFAULT,main,abs:absEx,est};
  };
  return {
    push:day("push",buildMain("push")),
    pull:day("pull",buildMain("pull")),
    legs:day("legs",buildMain("legs"),true),
    upper:day("upper",buildMain("upper")),
    lower:day("lower",buildMain("lower"),true),
    cardio:{...day("cardio",[mk("Zone-2 Cardio",1,"30–40 Min",0)]),est:35},
    rest:{key:"rest",...TYPE_META.rest,warmup:[],cooldown:[],main:[],abs:[],est:0},
  };
}
/* ---------- Optimaler Wochenplan (v5/Phase 1): Vorschlag + Begründung ----------
   Split nach Tagen + Erholungsprofil, Platzierung nach Wochen-Präferenz,
   Cardio auf einem Ruhetag. Der Nutzer behält die volle Kontrolle (User owns schedule). */
function generateOptimalSchedule(a){
  a=a||{};
  const days=Math.min(6,Math.max(2,a.days||4));
  const rec=a.recovery_profile||"average", pref=a.schedule_pref||"consistent";
  const SPLITS={
    2:["upper","lower"],
    3:rec==="slow"?["upper","lower","upper"]:["push","pull","legs"],
    4:["upper","lower","upper","lower"],
    5:rec==="slow"?["upper","lower","push","pull","legs"]:["push","pull","legs","upper","lower"],
    6:rec==="slow"?["push","pull","legs","upper","lower","cardio"]:["push","pull","legs","push","pull","legs"],
  };
  const POS={
    consistent:{2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]},
    weekday_strong:{2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5]},
    weekend_strong:{2:[5,6],3:[2,5,6],4:[1,3,5,6],5:[1,3,4,5,6],6:[0,1,3,4,5,6]},
  };
  const types=SPLITS[days], pos=(POS[pref]||POS.consistent)[days];
  const sch=["rest","rest","rest","rest","rest","rest","rest"];
  types.forEach((t,i)=>{sch[pos[i]]=t;});
  if(days<=4){
    const restIdx=sch.map((t,i)=>t==="rest"?i:null).filter(x=>x!=null);
    if(restIdx.length>=2)sch[restIdx[Math.floor(restIdx.length/2)]]="cardio";
  }
  const splitTxt={
    2:"2 kompakte Einheiten (Ober-/Unterkörper) — maximaler Effekt pro Training.",
    3:rec==="slow"?"3 Einheiten im Ober-/Unterkörper-Wechsel — voller Reiz, viel Luft zur Erholung.":"3 Einheiten als Push / Pull / Beine — klare Trennung, jede Muskelgruppe erholt sich komplett.",
    4:"4 Einheiten im Ober-/Unterkörper-Wechsel — jede Muskelgruppe wird 2× pro Woche trainiert: der Sweet Spot für Muskelaufbau.",
    5:"5 Einheiten — Push / Pull / Beine plus Oberkörper / Unterkörper: hohe Frequenz, klug verteilt.",
    6:rec==="slow"?"6 Einheiten mit eingebautem Cardio-Tag — Frequenz hoch, Belastung dosiert.":"6 Einheiten — doppelter Push/Pull/Beine-Durchlauf für maximale Trainingsfrequenz.",
  }[days];
  const recTxt={
    fast:"Du erholst dich schnell — deine Einheiten dürfen dicht beieinander liegen.",
    average:"Zwischen harten Einheiten für dieselben Muskeln liegen mindestens 48 Stunden.",
    slow:"Du brauchst länger zur Erholung — der Plan lässt deinen Muskeln bewusst mehr Luft.",
  }[rec];
  const prefTxt={
    weekday_strong:"Alles liegt unter der Woche — dein Wochenende bleibt frei.",
    weekend_strong:"Das Wochenende trägt die Hauptlast — so passt der Plan in deinen Alltag.",
    consistent:"Gleichmäßig über die Woche verteilt: konstanter Rhythmus, konstanter Fortschritt.",
  }[pref];
  const cardioTxt=sch.includes("cardio")?" Der lockere Cardio-Tag liegt auf einem Ruhetag — er fördert deine Erholung, statt sie zu kosten.":"";
  return {schedule:sch,rationale:`${splitTxt} ${recTxt} ${prefTxt}${cardioTxt}`};
}

/* TYPES: dynamische Sicht auf den Plan (inkl. Soreness-Modus) —
   .ex bleibt als Kompat-Array für Player/Empfehlungen/Voice erhalten. */
function sessionDef(key){
  const plan=activePlan(); const d=plan[key]||plan.rest;
  const sore=!!S.soreMode[key];
  const ov=(S.exOverrides&&S.exOverrides[key])||{};
  const main=d.main.map((e,i)=>{
    // Nutzer-Tausch (Long-Press) hat Vorrang: Übung ersetzt, Sätze/Pausen bleiben
    if(ov[i]&&EXDB[ov[i]]){
      const nd=EXDB[ov[i]];
      return {...e,n:ov[i],tempo:nd.tempo||e.tempo,rir:nd.rir||e.rir,m:nd.m||e.m,
        why:nd.why||"",alt:nd.alt||null,lengthened:!!nd.lengthened,userSwap:true,orig:e.n};
    }
    if(sore&&e.alt)return {...e,n:e.alt.split(" (")[0],swapped:true,orig:e.n};
    return e;
  });
  const allEx=[...main,...(d.abs||[])];
  return {...d,main,ex:allEx.map(e=>[e.n,e.sets,e.reps,e.rest])};
}
/* Long-Press auf eine Übung (v5-Erweiterung): Alternativen-Menü, nach Effizienz
   sortiert — z. B. wenn ein Gerät belegt oder nicht vorhanden ist. */
function openSwapSheet(key,idx){
  const cur=sessionDef(key).main[idx]; if(!cur)return;
  const curM=(EXDB[cur.orig||cur.n]||EXDB[cur.n]||{}).m||cur.m;
  const a=(S.profile&&S.profile.a)||{};
  const allowed=EQ_ALLOWED[a.equipment]||EQ_ALLOWED.gym_full;
  const hasBench=EQ_BENCH[a.equipment]??true;
  const inSession=new Set(sessionDef(key).main.map(e=>e.n));
  const alts=Object.entries(EXDB)
    .filter(([n,d])=>d.m===curM&&n!==cur.n&&!inSession.has(n)&&n!=="Zone-2 Cardio")
    .map(([n,d])=>{
      const fits=allowed.includes(d.eq)&&(!d.bench||hasBench);
      // Effizienz-Ranking: Mehrgelenksübungen > Isolation mit Dehnungsreiz > Isolation;
      // Übungen, die zum Equipment passen, immer zuerst.
      const eff=(fits?10:0)+(d.compound?3:(d.lengthened?2:1));
      return {n,d,fits,eff};
    })
    .sort((x,y)=>y.eff-x.eff);
  A.swapTo=(n)=>{
    S.exOverrides[key]=S.exOverrides[key]||{};
    S.exOverrides[key][idx]=n;
    save(); overlay.innerHTML=""; render();
    toast(`✓ ${n} eingewechselt`);
  };
  A.swapReset=()=>{
    if(S.exOverrides[key])delete S.exOverrides[key][idx];
    save(); overlay.innerHTML=""; render();
    toast("Original-Übung wiederhergestellt");
  };
  overlay.innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)A.closeModal()"><div class="sheet fade">
    <p class="display-m mb4">${cur.n} tauschen</p>
    <p class="sm t2 mb12" style="line-height:1.6">Gerät belegt oder nicht da? Alternativen für <b style="color:var(--t1)">${curM}</b>, sortiert nach Effizienz — Sätze und Pausen bleiben gleich.</p>
    ${alts.length?alts.map(x=>`<button class="opt" onclick="A.swapTo('${x.n}')">
      <span style="display:flex;justify-content:space-between;align-items:center;gap:8px">${x.n}
        <span class="statchip" style="margin:0">${x.d.compound?"Sehr effizient":x.d.lengthened?"Effizient":"Gezielt"}</span></span>
      <span class="sub">${x.d.compound?"Mehrgelenksübung — viel Reiz pro Satz":x.d.lengthened?"Isolation mit Dehnungsreiz":"Gezielte Isolation"}${x.fits?"":" · braucht anderes Equipment"}</span>
    </button>`).join(""):'<p class="sm t2 mb8">Keine passende Alternative in der Übungsdatenbank.</p>'}
    ${cur.userSwap?`<button class="btn mt8" onclick="A.swapReset()">${icon("undo",15)} Zurück zur Original-Übung (${cur.orig})</button>`:""}
  </div></div>`;
}

/* Muskelgruppen-Verteilung einer Session: Satz-Anteil je Muskelgruppe in % —
   berechnet aus dem echten Plan des Tages, nichts erfunden. */
function muscleSplit(key){
  const d=sessionDef(key);
  const tot=[...d.main,...(d.abs||[])].reduce((s,e)=>s+e.sets,0)||1;
  const map={};
  const addEx=(e,fallback)=>{
    const m=(EXDB[e.orig||e.n]||{}).m||MUSCLE_OF[e.n]||fallback;
    map[m]=(map[m]||0)+e.sets;
  };
  d.main.forEach(e=>addEx(e,"Ganzkörper"));
  (d.abs||[]).forEach(e=>addEx(e,"Core"));
  return Object.entries(map).map(([m,s])=>({m,pct:Math.round(s/tot*100)})).sort((x,y)=>y.pct-x.pct);
}
function muscleSplitBars(key){
  const parts=muscleSplit(key);

    ${parts.map(p=>`<div class="barrow"><span class="blbl">${p.m}</span>

      <span class="bval metric">${p.pct} %</span></div>`).join("")}</div>`;
}

function liftHistory(name){ return S.liftLog[name]||[]; }
function bestE1(name){ return liftHistory(name).reduce((m,s)=>s.w>0?Math.max(m,e1rm(s.w,s.reps,s.rpe)):m,0); }
function recommend(name){
  const h=liftHistory(name);
  if(!h.length) return null; // ehrlich: keine Daten, keine Empfehlung
  const last=h[h.length-1];
  const inc=(last.rpe??8)<=8?2.5:0;
  const deload=S.currentWeek===4?0.9:1;
  return {w:Math.round((last.w+inc)*deload/2.5)*2.5, reps:Math.max(5,last.reps)};
}
function e1Series(name){
  return liftHistory(name).filter(s=>s.w>0).map(s=>({t:s.t,v:e1rm(s.w,s.reps,s.rpe)}));
}
function daysWith(arrDates,nDays){
  const cut=Date.now()-nDays*dayMs;
  return new Set(arrDates.filter(d=>new Date(d).getTime()>=cut)).size;
}
function dataProgress(){
  return {
    training:Math.min(7,daysWith(S.trainingHistory.map(t=>t.date),7)),
    nutrition:Math.min(7,daysWith(Object.keys(S.nutritionLog).filter(d=>(S.nutritionLog[d].meals||[]).length>0),7)),
    status:Math.min(7,daysWith(S.readinessHistory.map(r=>r.date),7)),
  };
}

// ---------- Insight-/Risk-Engine (regelbasiert, mit Konfidenz) ----------
function buildInsights(){
  const out=[];
  const p=S.profile; if(!p)return out;
  const r7=S.readinessHistory.slice(-7);
  const th7=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<7*dayMs);
  const th14=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<14*dayMs);
  // Volumen-Trend
  if(S.trainingHistory.length>=6){
    const old=S.trainingHistory.slice(0,Math.floor(S.trainingHistory.length/2));
    const recent=S.trainingHistory.slice(Math.floor(S.trainingHistory.length/2));
    const avgO=old.reduce((s,t)=>s+t.volume,0)/old.length, avgR=recent.reduce((s,t)=>s+t.volume,0)/recent.length;
    const d=Math.round((avgR-avgO)/avgO*100);
    if(Math.abs(d)>=5) out.push({t:`Dein Trainingsvolumen hat sich um ${d>0?"+":""}${d} % verändert (Ø ${nfi.format(avgR)} kg/Session).`,conf:Math.min(95,55+S.trainingHistory.length*2)});
  }
  // Gewicht × Protein
  if(S.weightLog.length>=8&&Object.keys(S.nutritionLog).length>=5){
    const w=S.weightLog;
    const dW=Math.round((w[w.length-1].v-w[0].v)*10)/10;
    const protDays=Object.values(S.nutritionLog).filter(l=>(l.meals||[]).reduce((s,m)=>s+m.p,0)>=p.tg.train.p).length;
    const protPct=Math.round(protDays/Object.keys(S.nutritionLog).length*100);
    out.push({t:`Gewicht ${dW>0?"+":""}${nf.format(dW)} kg im Zeitraum — Protein-Adhärenz lag bei ${protPct} %.`,conf:Math.min(90,40+S.weightLog.length)});
  }
  // Stagnation × Recovery
  const bench=e1Series("Bankdrücken");
  if(bench.length>=5&&r7.length>=4){
    const tail=bench.slice(-4);
    const flat=Math.abs(tail[tail.length-1].v-tail[0].v)<tail[0].v*0.01;
    const avgR=Math.round(r7.reduce((s,x)=>s+x.score,0)/r7.length);
    if(flat&&avgR<65) out.push({t:`Bankdrücken stagniert — wahrscheinlichste Ursache: niedrige Erholungswerte (Ø Status ${avgR}/100).`,conf:70});
  }
  // Risk: Übertraining
  const rpes=th14.map(t=>t.avgRpe).filter(Boolean);
  if(rpes.length>=4){
    const avg=rpes.reduce((a,b)=>a+b,0)/rpes.length;
    if(avg>8.6) out.push({t:`Übertrainings-Risiko erhöht: deine Anstrengung lag im Schnitt bei ${nf.format(Math.round(avg*10)/10)}/10 über 14 Tage. Empfehlung: 1 Satz pro Übung streichen.`,conf:75,risk:true});
  }
  // Risk: Adhärenz
  const plannedPerWeek=schedule().filter(t=>t!=="rest").length||p.a.days;
  if(S.trainingHistory.length>=4){
    const adh=Math.min(100,Math.round(th7.length/Math.max(1,plannedPerWeek)*100));
    if(adh<70) out.push({t:`Dranbleiber-Check: nur ${adh} % deiner geplanten Trainings diese Woche. Kürzere Sessions schlagen ausgefallene.`,conf:80,risk:true});
  }
  // Volumen-Toleranz: 2 Wochen in Folge außerhalb MEV–MRV (min 4 Sessions Daten)
  if(S.trainingHistory.length>=4){
    const w0=weeklyMuscleSets(0), w1=weeklyMuscleSets(1);
    for(const [m,band] of Object.entries(VOL_BANDS)){
      const a0=w0[m]||0, a1=w1[m]||0;
      if(a0>band[1]&&a1>band[1]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen über deinem belastbaren Maximum (${a0} Sätze/Woche, optimal sind ${band[0]}–${band[1]}) — deine Erholung kommt nicht hinterher (Fachbegriff: MRV).`,conf:70,risk:true});
      else if(a0>0&&a1>0&&a0<band[0]&&a1<band[0]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen zu niedrig für spürbares Wachstum (${a0} Sätze/Woche) — peile mindestens ${band[0]} Sätze an (Fachbegriff: MEV).`,conf:65});
    }
  }
  // Diet-Adherence-Score (min 3 Tage — sonst kein Output)
  const da=dietAdherence(14);
  if(da) out.push({t:`${LABELS.adherence}: ${da.pct} % der letzten ${da.n} Tage im Zielbereich (±10 % Kalorien, mindestens 90 % Protein).`,conf:da.conf});
  // Adaptation Velocity (stärkster Lift mit ≥5 Datenpunkten)
  for(const lift of ["Kniebeuge","Bankdrücken","Kreuzheben"]){
    const av=adaptationVelocity(lift);
    if(av){
      const expl={schnell:"über dem Erwartungswert deines Trainingsalters — deine Bedingungen stimmen",normal:"im Erwartungsbereich — die Progression läuft sauber",langsam:"unter Erwartung — prüfe Schlaf, Protein und Steigerungsschema",stagnierend:`Plateau — ${LABELS.deload} oder Übungswechsel angezeigt (Schoenfeld, 2017)`}[av.cls];
      out.push({t:`${LABELS.velocity} bei ${lift}: ${av.pctPerMonth>=0?"+":""}${nf.format(av.pctPerMonth)} % Maximalkraft pro Monat — „${av.cls}": ${expl}.`,conf:av.conf});
      break;
    }
  }
  return out.slice(0,8); // Anzeige-Limit pro Tier: Free 1 / Pro 5 / Elite 8
}

function parseWorkout(input){
  const txt=input.trim().toLowerCase();
  let conf=0.3, name=null;
  const tokens=txt.replace(/[^a-zäöüß0-9\s,.]/g," ").split(/\s+/);
  for(const exName of ALL_EXERCISES){
    const words=exName.toLowerCase().split(/\s+/);
    if(words.some(w=>tokens.some(t=>t.length>=3&&(t.startsWith(w)||w.startsWith(t))))){ name=exName; conf+=0.3; break; }
  }
  const wMatch=txt.match(/(\d+[.,]?\d*)\s*(kg|kilo)/);
  const weight=wMatch?parseFloat(wMatch[1].replace(",",".")):null;
  if(weight!=null)conf+=0.15;
  let sets=null,reps=null;
  const sxr=txt.match(/(\d+)\s*x\s*(\d+)/);
  if(sxr){sets=parseInt(sxr[1]);reps=parseInt(sxr[2]);conf+=0.2;}
  else{
    const sMatch=txt.match(/(\d+)\s*(sätze|satz|sets)/);
    const rMatch=txt.match(/(\d+)\s*(wiederholungen|wdh|reps)/);
    if(sMatch){sets=parseInt(sMatch[1]);conf+=0.1;}
    if(rMatch){reps=parseInt(rMatch[1]);conf+=0.1;}
  }
  if(!name)return null;
  return {name,weight:weight??0,sets:sets??1,reps:reps??8,conf:Math.min(0.98,conf)};
}
function logParsedWorkout(pw){
  const now=Date.now();
  if(!S.liftLog[pw.name])S.liftLog[pw.name]=[];
  for(let i=0;i<pw.sets;i++) S.liftLog[pw.name].push({t:now+i,w:pw.weight,reps:pw.reps,rpe:8});
  const vol=Math.round(pw.weight*pw.reps*pw.sets);
  const existing=S.trainingHistory.find(t=>t.date===todayKey());
  if(existing){existing.sets+=pw.sets;existing.volume+=vol;}
  else S.trainingHistory.push({date:todayKey(),type:todayType(),sets:pw.sets,volume:vol,avgRpe:8});
  save();
}

/* Levenshtein-Distanz für Tippfehler-tolerante Lebensmittel-Erkennung:
   "hänchen", "harferflocken" oder "qark" werden trotzdem verstanden. */
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;
  if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
/* Liefert {f, dist}: dist 0 = exakter Treffer, >0 = Tippfehler-Korrektur. */
function matchFood(segment){
  const tokens=segment.toLowerCase().replace(/[^a-zäöüß0-9\s]/g," ").split(/\s+/)
    .filter(t=>t.length>=3&&!/^\d+$/.test(t)&&!["und","mit","ein","eine","einen","gramm","stück","etwas","noch","dann","heute"].includes(t));
  let best=null;
  for(const f of FOODS){
    const words=f[0].toLowerCase().replace(/\(.*\)/,"").trim().split(/\s+/).filter(w=>w.length>=3);
    for(const w of words)for(const t of tokens){
      let dist=null;
      if(t===w||t.startsWith(w)||w.startsWith(t))dist=0;
      else{
        const tol=Math.max(1,Math.floor(t.length/4));
        // Volles Wort UND Wort-Präfix vergleichen: "hänchen" trifft so auch "hähnchenbrust"
        const d=Math.min(lev(t,w),lev(t,w.slice(0,Math.min(w.length,t.length+tol))));
        if(d<=tol)dist=d;
      }
      if(dist!=null&&(!best||dist<best.dist||(dist===best.dist&&f[0].length<best.f[0].length)))
        best={f,dist};
    }
  }
  return best;
}
function parseNutrition(input){
  // Multi-Item: "500g hähnchen und 300g reis, 2 tomaten"
  const segments=input.trim().toLowerCase().split(/\s*(?:,|\bund\b|\+|danach)\s*/).filter(Boolean);
  const items=[];
  for(const seg of segments){
    const hit=matchFood(seg);
    if(!hit){items.push({raw:seg,food:null});continue;}
    const food=hit.f;
    const gramMatch=seg.match(/(\d+)\s*(g|gramm)\b/);
    const countMatch=seg.match(/(\d+)\s*(stück|stk|x)\b/)||seg.match(/^(\d+)\s+/);
    const wordCount={ein:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5}[seg.split(/\s+/)[0]];
    const gram=gramMatch?parseInt(gramMatch[1]):null;
    const count=countMatch?parseInt(countMatch[1]):(wordCount||null);
    const g=gram??(count?food[1]*count:food[1]);
    let conf=0.55; if(gram||count)conf+=0.3; if(seg.includes(food[0].toLowerCase().split(" ")[0]))conf+=0.1;
    conf-=hit.dist*0.08; // Tippfehler-Korrektur: ehrlich niedrigere Konfidenz
    items.push({raw:seg,food,gram:g,fuzzy:hit.dist>0,conf:Math.max(0.4,Math.min(0.97,conf))});
  }
  return items;
}

function addFood(food,gram){
  const mult=gram?gram/food[1]:1;
  const entry={n:food[0]+(gram&&gram!==food[1]?` (${gram} g)`:""),g:gram||food[1],
    k:Math.round(food[2]*mult),p:Math.round(food[3]*mult*10)/10,c:Math.round(food[4]*mult*10)/10,f:Math.round(food[5]*mult*10)/10};
  nlogToday().meals.push(entry); save();
  return entry;
}

function ringSVG(score,tier,size=130){
  const st=8,r=(size-st)/2,c=2*Math.PI*r,arc=c*.75,fill=score/100*arc;
  const col=score<40?"var(--danger)":score<60?"var(--info)":"var(--volt)";
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(135deg)" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s2)" stroke-width="${st}" stroke-dasharray="${arc} ${c}" stroke-linecap="round"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}" stroke-dasharray="${fill} ${c}" stroke-linecap="round" style="transition:stroke-dasharray .6s ease-out"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span class="metric" style="font-size:${size>100?34:size/3.6}px;font-weight:600">${score}</span>
      <span class="ring-lbl" style="font-size:${size>100?11:8}px">${tier}</span>
    </div></div>`;
}
function miniRing(label,v,t,unit,size=68){
  const pct=Math.min(1,t?v/t:0),st=5,r=(size-st)/2,c=2*Math.PI*r;
  return `<div style="text-align:center"><div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s2)" stroke-width="${st}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--volt)" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${pct*c} ${c}"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="metric xs">${nfi.format(v)}</div></div>
    <p class="xs t2" style="margin-top:4px">${label}</p>
    <p class="metric" style="font-size:9px;color:var(--t3)">/ ${nfi.format(t)} ${unit}</p></div>`;
}
function lineChart(series, fc){
  const all=[...series.map(p=>p.v), ...(fc||[]).map(p=>p.v)];
  const min=Math.min(...all)*.97, max=Math.max(...all)*1.03, W=340,H=190,P=8;
  const tMax=series[series.length-1].t+(fc?84*dayMs:0), tMin=series[0].t;
  const X=(t)=>P+(t-tMin)/(tMax-tMin||1)*(W-2*P), Y=(v)=>H-P-(v-min)/(max-min||1)*(H-2*P);
  const line=series.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  let dash="",band="";
  if(fc){
    const lt=series[series.length-1];
    const fpts=[{t:lt.t,v:lt.v},...fc.map((p)=>({t:lt.t+p.wk*7*dayMs,v:p.v}))];
    dash=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const up=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v*(1+0.018*i)).toFixed(1)}`).join(" ");
    const lo=[...fpts].reverse().map((p,i)=>{const j=fpts.length-1-i;return `L${X(p.t).toFixed(1)},${Y(p.v*(1-0.018*j)).toFixed(1)}`;}).join(" ");
    band=`<path d="${up} ${lo} Z" fill="var(--volt)" opacity=".08"/>`;
  }
  // FIX (v5/6B): bei wenigen Datenpunkten/kurzer Zeitspanne erzeugten die 4
  // festen Ticks identische bzw. überlappende Datums-Labels — Duplikate filtern.
  let lastTick="";
  const ticks=[0,.33,.66,1].map((f)=>{const t=tMin+f*(tMax-tMin);
    const lbl=fmtD(new Date(t));
    if(lbl===lastTick)return "";
    lastTick=lbl;
    return `<text x="${X(t)}" y="${H-2}" fill="var(--t3)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${lbl}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:16/10;display:block" aria-hidden="true">
    ${band}<path d="${line}" fill="none" stroke="var(--volt)" stroke-width="2"/>
    ${dash?`<path d="${dash}" fill="none" stroke="var(--volt)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}${ticks}</svg>`;
}
function donutSVG(parts,size=110){
  const total=parts.reduce((s,p)=>s+p.v,0)||1, r=size/2-10, c=2*Math.PI*r;
  let off=0;
  const segs=parts.map((p)=>{
    const len=p.v/total*c;
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.col}" stroke-width="14" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}"/>`;
    off+=len; return s;
  }).join("");
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">${segs}</svg>`;
}
function circleTimer(left,total,size=84){
  const r=(size-8)/2,c=2*Math.PI*r,pct=Math.max(0,left/Math.max(1,total));
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s2)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--volt)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${pct*c} ${c}"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="metric">
      ${Math.floor(left/60)}:${String(Math.round(left)%60).padStart(2,"0")}</div></div>`;
}

function speech(onResult,btnId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Spracherkennung nicht unterstützt — bitte tippen");return;}
  try{
    const rec=new SR();
    rec.lang="de-DE"; rec.interimResults=false; rec.maxAlternatives=1;
    const btn=document.getElementById(btnId); if(btn)btn.innerHTML=icon("mic",16)+"";

  }catch{ toast("Spracherkennung nicht verfügbar"); }

function renderRegister(){
  A.back=()=>{S.screen="landing";save();render();};

  A.vMail=(el)=>{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value);el.classList.toggle("err",el.value.length>0&&!ok);el.classList.toggle("ok",ok);};
  A.vPw=(el)=>{
    const s=pwStrength(el.value), m=document.getElementById("pwmeter"), lbl=document.getElementById("pwlbl");
    if(m){m.style.width=s.pct+"%";m.style.background=s.col;} if(lbl){lbl.textContent=el.value?("Stärke: "+s.lbl):"";}
    el.classList.toggle("err",el.value.length>0&&el.value.length<8);el.classList.toggle("ok",el.value.length>=8);
  };
  A.vPw2=(el)=>{const pw=document.getElementById("r-pw").value;el.classList.toggle("err",el.value.length>0&&el.value!==pw);el.classList.toggle("ok",el.value.length>0&&el.value===pw);};
  A.register=async()=>{
    const u=document.getElementById("r-user").value.trim();
    const e=document.getElementById("r-mail").value.trim().toLowerCase();
    const p=document.getElementById("r-pw").value;
    const p2=document.getElementById("r-pw2").value;
    const err=document.getElementById("r-err");

    if(p.length<8){err.textContent="Passwort: mindestens 8 Zeichen.";return;}
    if(p!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}
    if(S.users.some(x=>x.email===e)){err.textContent="Diese E-Mail ist bereits registriert.";return;}
    const pwHash=await hashPw(p);
    S.users.push({username:u,email:e,pwHash});
    S.currentUser=S.users.length-1; S.devMode=false; S.tier="free";

    <div class="field"><label for="r-pw">Passwort</label>
      <input type="password" id="r-pw" autocomplete="new-password" oninput="A.vPw(this)" placeholder="mind. 8 Zeichen">
      <div class="strength-meter"><div id="pwmeter" style="width:0"></div></div>
      <p class="xs t2 mt8" id="pwlbl" style="min-height:14px"></p></div>
    <div class="field"><label for="r-pw2">Passwort bestätigen</label>
      <input type="password" id="r-pw2" autocomplete="new-password" oninput="A.vPw2(this)"></div>
    <p class="fielderr" id="r-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.register()">Registrieren & Assessment starten</button>
    <p class="xs t2 mt16" style="text-align:center">SHA-256-Hash, nie Klartext. Daten bleiben auf diesem Gerät.</p></div>`;
}

function renderLogin(){
  A.back=()=>{S.screen="landing";save();render();};
  A.forgot=()=>modal(`<p class="ct">Passwort vergessen?</p><p class="sm t2" style="line-height:1.6">Demo-Modus: Passwort-Reset via E-Mail ist nicht verfügbar — lösche den LocalStorage dieser Seite, um alle Konten zurückzusetzen.</p>`);
  A.login=async()=>{
    const err=document.getElementById("l-err");
    err.textContent="";
    if(S.lockoutUntil&&Date.now()<S.lockoutUntil){
      err.textContent=`Zu viele Versuche. Warte ${Math.ceil((S.lockoutUntil-Date.now())/1000)} s.`;return;
    }
    const e=document.getElementById("l-mail").value.trim().toLowerCase();
    const p=document.getElementById("l-pw").value;
    const idx=S.users.findIndex(x=>x.email===e);
    const hash=await hashPw(p);
    if(idx<0||S.users[idx].pwHash!==hash){
      S.loginAttempts=(S.loginAttempts||0)+1;
      if(S.loginAttempts>=5){S.lockoutUntil=Date.now()+30000;S.loginAttempts=0;
        err.textContent="5 Fehlversuche — Login für 30 Sekunden gesperrt.";}
      else err.textContent=`E-Mail oder Passwort falsch (Versuch ${S.loginAttempts}/5).`;
      save();return;
    }
    S.currentUser=idx; S.loginAttempts=0; S.lockoutUntil=null;
    S.screen=S.profile?"app":"onboarding"; S.tab="home";
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Anmelden</h2></div>

}

function renderOnboarding(){
  const st=STEPS[S.step]||STEPS[0];
  const qNum=Math.min(QCOUNT,S.step+1);
  const bar=`<div class="topbar">
    <button class="back" onclick="A.back()" aria-label="Zurück">‹</button>
    <div class="progress"><div style="width:${qNum/QCOUNT*100}%"></div></div>
    <span class="metric xs t2">${qNum}/${QCOUNT}</span></div>`;
  A.back=()=>{ if(S.step>0){S.step--;save();render();} else {S.currentUser=null;S.screen="landing";save();render();} };
  A.next=()=>{S.step++;save();render();};
  A.pick=(k,v)=>{ S.a[k]=v; save(); setTimeout(A.next,130); };
  A.dial=(k,v)=>{ S.a[k]=parseFloat(v); save(); const el=document.getElementById("dialv"); if(el)el.textContent=nf.format(S.a[k]); };
  A.multi=(k,v,max)=>{
    const cur=S.a[k]||[];
    const effMax=(k==="goals"&&S.tier==="free")?1:max;
    if(k==="goals"&&S.tier==="free"&&cur.length>=1&&!cur.includes(v)){showUpgradeTeaser("multi_goal");return;}

function shareRecapPNG(r){
  try{
    const c=document.createElement("canvas"); c.width=1080; c.height=1350;
    const x=c.getContext("2d");
    x.fillStyle="#F7F5F1"; x.fillRect(0,0,1080,1350);
    x.fillStyle="#1A1A1A";
    // Logo: 3 aufsteigende Balken (wie logoSVG) + Wortmarke
    [[80,104,36],[100,86,54],[120,68,72]].forEach(([bx,by,bh])=>{
      if(x.roundRect){x.beginPath();x.roundRect(bx,by,14,bh,7);x.fill();}else{x.fillRect(bx,by,14,bh);}
    });
    x.font="800 60px 'Inter Tight',system-ui"; x.fillText("METRICGYM",156,140);
    x.fillStyle="#6E6A62"; x.font="600 40px 'Inter Tight',system-ui"; x.fillText("Mein Wochenrückblick",80,215);
    x.fillStyle="#1A1A1A"; x.font="900 220px 'Inter Tight',system-ui"; x.fillText(String(r.sets),80,520);
    x.fillStyle="#6E6A62"; x.font="600 44px 'Inter Tight',system-ui"; x.fillText("Sätze diese Woche",80,590);
    let y=760;
    if(r.avgR!=null){x.fillStyle="#1A1A1A";x.font="900 110px 'Inter Tight',system-ui";x.fillText(r.avgR+" / 100",80,y);
      x.fillStyle="#6E6A62";x.font="600 40px 'Inter Tight',system-ui";x.fillText("Ø Status",80,y+58); y+=230;}
    if(r.da!=null){x.fillStyle="#E8633A";x.font="900 110px 'Inter Tight',system-ui";x.fillText(r.da+" %",80,y);
      x.fillStyle="#6E6A62";x.font="600 40px 'Inter Tight',system-ui";x.fillText("Ernährungs-Treue",80,y+58);}

  root.innerHTML=`

    ${renderSection("Deine Woche",

        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center">
