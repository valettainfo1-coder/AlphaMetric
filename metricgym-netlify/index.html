<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0B">
<title>METRICGYM</title>
<style>
  :root{
    --bg:#0A0A0B; --s1:#121214; --s2:#1A1A1E; --border:#26262B;
    --volt:#C8FF2E; --info:#5B8CFF; --danger:#FF4D4D; --warn:#FFB02E;
    --t1:#F5F5F4; --t2:#9C9CA6; --t3:#6E6E78;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:dark;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:Inter,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .metric{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:430px; margin:0 auto; min-height:100dvh; padding:16px 16px 100px;}
  h1{font-size:22px; font-weight:600;}
  h2{font-size:23px; font-weight:600; line-height:1.3; margin-bottom:4px;}
  .hint{font-size:13px; color:var(--t2); margin-bottom:16px;}
  .card{background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .ct{font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--t2); margin-bottom:12px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:48px; border-radius:999px; border:1px solid var(--border);
    background:var(--s2); color:var(--t1); font-size:15px; font-weight:500;
    cursor:pointer; transition:background .15s ease-out; font-family:inherit;
  }
  .btn:active{background:var(--s1);}
  .btn.volt{background:var(--volt); color:var(--bg); border:none; font-weight:600;}
  .btn.volt:active{opacity:.85;}
  .btn.ghost{background:transparent; border:none; color:var(--t2); min-height:44px;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--volt); outline-offset:2px;}
  .opt{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px;
    background:var(--s1); border:1px solid var(--border); border-radius:12px;
    color:var(--t1); font-size:15px; font-weight:500; cursor:pointer; font-family:inherit;
    transition:background .15s,border-color .15s; min-height:44px;
  }
  .opt:hover{background:var(--s2);}
  .opt.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.1); color:var(--volt);}
  .opt .sub{display:block; font-size:12px; color:var(--t2); font-weight:400; margin-top:2px;}
  .opt.sel .sub{color:rgba(200,255,46,.7);}
  .grid6{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
  .grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .grid7{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cell{
    padding:13px 2px; text-align:center; background:var(--s1); border:1px solid var(--border);
    border-radius:12px; color:var(--t1); font-size:17px; font-weight:600; cursor:pointer;
    font-family:"JetBrains Mono",monospace; min-height:44px;
  }
  .cell.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.1); color:var(--volt);}
  .cell.dash{border-style:dashed;}
  .progress{height:4px; flex:1; background:var(--s2); border-radius:999px; overflow:hidden;}
  .progress>div{height:100%; background:var(--volt); transition:width .3s ease-out;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back{background:none; border:none; color:var(--t2); font-size:22px; cursor:pointer; min-width:44px; min-height:44px;}
  input[type=range]{width:100%; height:44px; accent-color:var(--volt);}
  input[type=date],input[type=number],input[type=text],input[type=email],input[type=password]{
    width:100%; min-height:48px; padding:0 14px; background:var(--s2); color:var(--t1);
    border:1px solid var(--border); border-radius:12px; font-size:16px; font-family:inherit;
  }
  input.err{border-color:var(--danger);}
  input.ok{border-color:rgba(200,255,46,.5);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--t2); margin-bottom:5px;}
  .fielderr{font-size:12px; color:var(--danger); margin-top:4px; min-height:14px;}
  .dial{text-align:center; font-size:44px; font-weight:600; margin-bottom:8px;}
  .dial small{font-size:15px; color:var(--t2); font-weight:400;}
  .badge{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:500; border:1px solid;}
  .badge.info{color:var(--info); border-color:rgba(91,140,255,.3); background:rgba(91,140,255,.12);}
  .badge.volt{color:var(--volt); border-color:rgba(200,255,46,.3); background:rgba(200,255,46,.12);}
  .badge.danger{color:var(--danger); border-color:rgba(255,77,77,.3); background:rgba(255,77,77,.12);}
  .badge.warn{color:var(--warn); border-color:rgba(255,176,46,.3); background:rgba(255,176,46,.12);}
  .badge.mute{color:var(--t2); border-color:var(--border); background:var(--s2);}
  .warncard{border:1px solid rgba(255,176,46,.35); background:rgba(255,176,46,.08); border-radius:12px; padding:12px; margin-bottom:10px; font-size:13px; line-height:1.5;}
  .warncard b{color:var(--warn);}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(18,18,20,.97); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar-inner{max-width:430px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px;
    background:none; border:none; color:var(--t2); font-size:9.5px; font-weight:500; cursor:pointer; font-family:inherit; min-height:44px;
  }
  .tab .ic{font-size:17px; line-height:1;}
  .tab.active{color:var(--volt);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper button{
    width:44px; height:44px; border-radius:999px; background:var(--s2); color:var(--t1);
    border:1px solid var(--border); font-size:20px; cursor:pointer;
  }
  .stepper .val{min-width:86px; text-align:center; font-size:18px;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{
    min-width:44px; height:44px; border-radius:999px; background:var(--s2); border:1px solid var(--border);
    color:var(--t2); font-family:"JetBrains Mono",monospace; font-size:14px; cursor:pointer; padding:0 8px;
  }
  .scale button.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.15); color:var(--volt);}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70dvh; text-align:center; gap:18px;}
  .huge{font-size:54px; font-weight:700; color:var(--volt);}
  .spin{width:40px; height:40px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--volt); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .pulse{animation:pulse .6s ease-out infinite;}
  .fade{animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .heat{display:grid; gap:3px; grid-template-columns:84px repeat(10,1fr); align-items:center;}
  .heat .lbl{font-size:11px; color:var(--t2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .heat .hc{height:22px; border-radius:4px; border:1px solid rgba(38,38,43,.5); cursor:pointer;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:10px 16px; border-radius:999px; background:var(--s2); border:1px solid var(--border);
    color:var(--t1); font-size:13px; cursor:pointer; font-family:inherit; min-height:44px;
  }
  .chip:hover{border-color:rgba(200,255,46,.4);}
  .chip.volt{border-color:rgba(200,255,46,.5); color:var(--volt);}
  .msg{max-width:85%; padding:12px 14px; border-radius:12px; font-size:14px; line-height:1.55; margin-bottom:10px;}
  .msg.user{margin-left:auto; background:rgba(200,255,46,.1); border:1px solid rgba(200,255,46,.3);}
  .msg.ai{background:var(--s1); border:1px solid var(--border);}
  .ring-lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--t2);}
  .list li{display:flex; justify-content:space-between; font-size:14px; padding:3px 0; list-style:none; color:var(--t1); gap:8px;}
  .list li span:last-child{color:var(--t2);}
  .volt-txt{color:var(--volt);} .danger-txt{color:var(--danger);} .warn-txt{color:var(--warn);} .t2{color:var(--t2);}
  .sm{font-size:13px;} .xs{font-size:11px;}
  .header{display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .header .spacer{flex:1;}
  .iconbtn{background:none; border:none; color:var(--t2); font-size:18px; cursor:pointer; min-width:44px; min-height:44px;}
  .mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px;}
  .wday{
    background:var(--s1); border:1px solid var(--border); border-radius:10px; padding:8px 2px;
    text-align:center; cursor:pointer; min-height:44px; font-family:inherit; color:var(--t1);
  }
  .wday.today{border-color:rgba(200,255,46,.6);}
  .wday.rest{opacity:.55; cursor:default;}
  .wday .d{font-size:10px; color:var(--t2);}
  .wday .e{font-size:15px; line-height:1.3;}
  .wday .l{font-size:8.5px; color:var(--t2); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;}
  .pill{
    flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--s2); color:var(--t2); font-size:12px; cursor:pointer; font-family:inherit; min-height:38px;
  }
  .pill.active{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.12); color:var(--volt);}
  .setdots{display:flex; gap:6px; align-items:center;}
  .setdots .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--t3);}
  .setdots .dot.full{background:var(--volt); border-color:var(--volt);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .qcard{
    flex-shrink:0; width:140px; background:var(--s1); border:1px solid var(--border); border-radius:12px;
    padding:12px; cursor:pointer; font-family:inherit; color:var(--t1); text-align:left;
  }
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--s1); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:380px; width:100%; max-height:80dvh; overflow-y:auto;}
  .toast{
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%); z-index:70;
    background:var(--s2); border:1px solid var(--border); color:var(--t1);
    padding:10px 18px; border-radius:999px; font-size:13px; animation:fade .2s ease-out;
    max-width:90%; text-align:center;
  }
  details{margin-top:8px;}
  details summary{font-size:12px; color:var(--info); cursor:pointer; min-height:24px; list-style:none;}
  details summary::before{content:"ⓘ "; }
  details p{font-size:12px; color:var(--t2); line-height:1.55; margin-top:6px;}
  .strength-meter{height:5px; border-radius:999px; background:var(--s2); overflow:hidden; margin-top:6px;}
  .strength-meter>div{height:100%; transition:width .2s,background .2s;}
  .ac-list{background:var(--s2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:6px;}
  .ac-item{display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none; border-bottom:1px solid var(--border); color:var(--t1); font-size:14px; cursor:pointer; font-family:inherit; min-height:44px;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--s1);}
  .barrow{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .barrow .blbl{width:86px; font-size:11px; color:var(--t2); flex-shrink:0;}
  .barrow .btrack{flex:1; height:14px; background:var(--s2); border-radius:4px; overflow:hidden;}
  .barrow .bfill{height:100%; border-radius:4px;}
  .barrow .bval{width:54px; text-align:right; font-size:11px; color:var(--t2); flex-shrink:0;}
</style>
</head>
<body>
<div id="root" class="wrap">
  <noscript>
    <div style="padding:32px 16px;color:#F5F5F4;font-family:system-ui">
      <p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:#C8FF2E">GYM</span></p>
      <p style="color:#9C9CA6;font-size:14px;line-height:1.6">Diese App braucht JavaScript. Du siehst diese Meldung vermutlich in einer Datei-Vorschau — bitte lade die Datei herunter und öffne sie direkt im Browser (Chrome, Safari, Firefox).</p>
    </div>
  </noscript>
</div>
<div id="tabbar"></div>
<div id="overlay"></div>

<script>
"use strict";
/* =====================================================================
   METRICGYM — Single-File-PWA (Vanilla JS, kein Build, kein Framework)
   Engine: BMR/TDEE/Multi-Goal-Targets/e1RM/Readiness/Forecast.
   Persistenz: localStorage mit In-Memory-Fallback. Auth: SHA-256-Hash.
   ===================================================================== */

// ---------- Format (de-DE) ----------
const nf  = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const nfi = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const df  = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});
const dfLong = new Intl.DateTimeFormat("de-DE",{weekday:"long", day:"numeric", month:"long"});
const fmtKg=(v)=>nf.format(v)+" kg", fmtKcal=(v)=>nfi.format(v)+" kcal", fmtD=(d)=>df.format(d);
const todayKey=()=>new Date().toISOString().slice(0,10);

// ---------- Sicherer Storage ----------
const KEY="metricgym-v2";
const MEM={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch{ return MEM[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{ MEM[k]=v; } },
};
let saveTimer=null;
function save(){ // debounced (100ms) — nie im rAF
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>store.set(KEY,JSON.stringify(S)),100);
}

// ---------- Engine ----------
function mifflin(sex,age,h,w){ return Math.round(10*w+6.25*h-5*age+(sex==="male"?5:-161)); }
function katch(w,bf){ return Math.round(370+21.6*w*(1-bf/100)); }
function bmrCalc(a){ return a.bodyFat!=null?katch(a.weight,a.bodyFat):mifflin(a.sex,a.age,a.height,a.weight); }
const NEAT={sedentary:1.2,light:1.3,moderate:1.4,active:1.475,very_active:1.55};
function tdeeCalc(bmr,act,w,len,days){
  const rest=Math.round(bmr*NEAT[act]);
  const train=rest+Math.round(5.0*w*(len/60));
  return {rest,train,avg:Math.round((train*days+rest*(7-days))/7)};
}
const GOAL_D={muscle_gain:[.1,.1],fat_loss:[-.2,-.2],recomp:[.1,-.1],strength:[.05,.05],general:[0,0],endurance:[0,0],mobility:[0,0]};
const GOAL_LABEL={muscle_gain:"Muskelaufbau",fat_loss:"Fettabbau",recomp:"Recomp",strength:"Maximalkraft",general:"Fitness",endurance:"Ausdauer",mobility:"Mobility"};

/** Multi-Goal-Engine: gewichtete Kalorien-Deltas + Konflikt-Detection.
 *  Primärziel 60 %, Sekundärziele teilen sich 40 % (Wilson et al., 2012:
 *  Interferenzeffekt bei concurrent training). */
function multiTargets(a,bmr,td){
  const goals=(a.goals&&a.goals.length?a.goals:[a.goal||"muscle_gain"]);
  const conflicts=[];
  let recompOverride=false;
  if(goals.includes("muscle_gain")&&goals.includes("fat_loss")){
    recompOverride=true;
    conflicts.push({type:"recomp",msg:"Muskelaufbau + Fettabbau = Recomp-Protokoll aktiviert. Kalorienziel wird auf ±50 kcal um den TDEE gesetzt.",bio:"Simultane Hypertrophie im Defizit ist möglich, aber langsam — hoher Proteinbedarf schützt Muskelmasse (Helms et al., 2014)."});
  }
  if(goals.includes("strength")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Kraft + Ausdauer: Interferenzeffekt möglich. Plane Kraft-Sessions vor Ausdauer, mindestens 6 h Abstand.",bio:"Concurrent Training dämpft mTOR-Signalwege der Hypertrophie (Wilson et al., 2012)."});
  }
  if(goals.includes("muscle_gain")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Aufbau + Ausdauer: halte Cardio moderat (≤ 2× 30 Min LISS), sonst frisst es deinen Überschuss.",bio:"AMPK-Aktivierung durch Ausdauer hemmt akut die Proteinsynthese (Wilson et al., 2012)."});
  }
  const floor=a.sex==="female"?1400:1600, warn=[];
  const clamp=(k)=>{let v=k; if(v<bmr){v=bmr;warn.push("bmr");} if(v<floor){v=floor;warn.push("floor");} return Math.round(v);};
  let tk,rk;
  if(recompOverride){ tk=clamp(td.train+50); rk=clamp(td.rest-50); }
  else{
    const weights=goals.map((_,i)=>i===0?(goals.length===1?1:0.6):0.4/(goals.length-1));
    let bt=0,br=0;
    goals.forEach((g,i)=>{const d=GOAL_D[g]||GOAL_D.general; bt+=d[0]*weights[i]; br+=d[1]*weights[i];});
    tk=clamp(td.train*(1+bt)); rk=clamp(td.rest*(1+br));
  }
  let prot;
  if(a.bodyFat!=null) prot=Math.round(2.2*a.weight*(1-a.bodyFat/100));
  else prot=Math.round(1.8*Math.min(a.weight,25*(a.height/100)**2));
  const fat=Math.round(.9*a.weight);
  const mac=(k)=>({kcal:k,p:prot,f:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4))});
  return {train:mac(tk),rest:mac(rk),warn:[...new Set(warn)],conflicts,goals};
}
function e1rm(w,reps,rpe){
  if(reps===1) return w;
  const eff=reps+(10-(rpe??8));
  return Math.round(w*(1+eff/30)*10)/10;
}
function readinessCalc(sleep,sore,stress,acwr,daysRest,mood){
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const comps=[[.3,c01((sleep-1)/4)],[.25,c01(1-(sore-1)/4)],[.15,c01(1-(stress-1)/4)],[.1,c01(1-Math.max(0,daysRest-2)/4)]];
  if(acwr!=null){
    let s; if(acwr<.8)s=c01(acwr/.8)*.3+.7; else if(acwr<=1.3)s=1; else s=c01(1-(acwr-1.3)/.7);
    comps.push([.2,s]);
  }
  const tw=comps.reduce((s,c)=>s+c[0],0), ws=comps.reduce((s,c)=>s+c[0]*c[1],0);
  let score=Math.round(ws/tw*100)+(mood||0);
  score=Math.max(0,Math.min(100,score));
  const tier=score>=80?"Primed":score>=60?"Ready":score>=40?"Caution":"Recover";
  return {score,tier,calibrating:acwr==null};
}
function splitFor(days){ return days<=3?"Full Body":days===4?"Upper / Lower":days===5?"PPL + Upper/Lower":"Push / Pull / Legs"; }
function forecast12w(series){
  if(series.length<3) return null;
  const n=series.length;
  let st=0,sy=0,stt=0,sty=0;
  series.forEach((p)=>{st+=p.t;sy+=p.v;stt+=p.t*p.t;sty+=p.t*p.v;});
  const den=n*stt-st*st, slope=den===0?0:(n*sty-st*sy)/den, last=series[n-1];
  let vv=last.v, ss=slope; const pts=[];
  for(let b=0;b<3;b++){ vv+=ss*28; ss*=.85; pts.push({wk:(b+1)*4, v:Math.round(Math.min(vv,last.v*1.15)*10)/10}); }
  return pts;
}

// ---------- Passwort-Hashing (SHA-256, nie Klartext) ----------
async function hashPw(pw){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }catch{
    // Fallback für nicht-sichere Kontexte (Datei-Viewer) — Demo only.
    let h1=0x811c9dc5,h2=0x1000193;
    for(const c of pw){h1=Math.imul(h1^c.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+c.charCodeAt(0),2654435761)>>>0;}
    return "fnv-"+h1.toString(36)+h2.toString(36);
  }
}
function pwStrength(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10; if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const entropy=pw.length*Math.log2(pool||1);
  if(entropy<40)return{lbl:"schwach",pct:33,col:"var(--danger)"};
  if(entropy<60)return{lbl:"mittel",pct:66,col:"var(--warn)"};
  return{lbl:"stark",pct:100,col:"var(--volt)"};
}

// ---------- Deterministischer Seed (mulberry32) ----------
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function buildSeed(){
  const rng=mulberry32(0x4D475947), now=Date.now(), day=864e5;
  const lifts={"Kniebeuge":95,"Bankdrücken":75,"Kreuzheben":125,"Schulterdrücken":42.5};
  const hist={};
  Object.entries(lifts).forEach(([name,base])=>{
    hist[name]=[];
    for(let wk=0;wk<10;wk++){
      if(rng()<.08) continue;
      const prog=1+0.10*(1-Math.exp(-wk/4));
      const dl=(wk%4===3)?0.9:1;
      const w=Math.round(base*prog*dl/2.5)*2.5;
      const t=now-(9.5*7-wk*7)*day+rng()*2*day;
      hist[name].push({t,w,reps:5+Math.floor(rng()*4),rpe:7+Math.floor(rng()*3)});
    }
  });
  const weights=[]; for(let d=66;d>=0;d--){ if(rng()<.15)continue;
    weights.push({t:now-d*day, v:Math.round((81.2+(66-d)*.018+(rng()-.5)*.6)*10)/10}); }
  const heat={}; ["Brust","Rücken","Schultern","Quadrizeps","Beinbeuger","Bizeps","Trizeps","Waden"].forEach((m)=>{
    heat[m]=Array.from({length:10},(_,i)=>(i%4===3?Math.round(4+rng()*3):Math.round(8+rng()*8)));
  });
  // 14 Tage Readiness-Historie (Komponenten 1–5, Schlafstunden)
  const readiness=[]; for(let d=13;d>=0;d--){
    const sleep=2+Math.floor(rng()*4), sore=1+Math.floor(rng()*4), stress=1+Math.floor(rng()*3);
    const sleepH=Math.round((5.5+rng()*3)*10)/10;
    const r=readinessCalc(sleep,sore,stress,0.9+rng()*0.4,1+Math.floor(rng()*3),0);
    readiness.push({date:new Date(now-d*day).toISOString().slice(0,10),score:r.score,tier:r.tier,sleep,sore,stress,sleepH});
  }
  // 10 Wochen Trainings-Historie (für Adhärenz/Volumen)
  const sessions=[]; const labels=["Push","Pull","Legs","Upper"];
  for(let wk=0;wk<10;wk++){ for(let d=0;d<4;d++){
    if(rng()<.1) continue;
    sessions.push({date:new Date(now-(9.5*7-wk*7-d*1.5)*day).toISOString().slice(0,10),
      day:labels[d%4],sets:16+Math.floor(rng()*8),volume:Math.round(5200+rng()*3200),avgRpe:Math.round((7.2+rng()*1.6)*10)/10});
  }}
  // 7 Tage Ernährungs-Historie
  const nutri={}; for(let d=7;d>=1;d--){
    const date=new Date(now-d*day).toISOString().slice(0,10);
    nutri[date]={kcal:Math.round(2300+(rng()-.4)*700),p:Math.round(130+rng()*60),c:Math.round(220+rng()*80),f:Math.round(60+rng()*30),water:Math.floor(4+rng()*7)};
  }
  return {lifts:hist,weights,heat,readiness,sessions,nutri};
}

  const col=tier==="Recover"?"var(--danger)":tier==="Caution"?"var(--info)":"var(--volt)";
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(135deg)" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s2)" stroke-width="${st}" stroke-dasharray="${arc} ${c}" stroke-linecap="round"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}" stroke-dasharray="${fill} ${c}" stroke-linecap="round" style="transition:stroke-dasharray .6s ease-out"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">

}

    dash=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const up=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v*(1+0.018*i)).toFixed(1)}`).join(" ");
    const lo=[...fpts].reverse().map((p,i)=>{const j=fpts.length-1-i;return `L${X(p.t).toFixed(1)},${Y(p.v*(1-0.018*j)).toFixed(1)}`;}).join(" ");
    band=`<path d="${up} ${lo} Z" fill="var(--volt)" opacity=".08"/>`;
  }
  const ticks=[0,.33,.66,1].map((f)=>{const t=tMin+f*(tMax-tMin);
    return `<text x="${X(t)}" y="${H-2}" fill="var(--t3)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmtD(new Date(t))}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:16/10;display:block" aria-hidden="true">
    ${band}<path d="${line}" fill="none" stroke="var(--volt)" stroke-width="2"/>
    ${dash?`<path d="${dash}" fill="none" stroke="var(--volt)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}${ticks}</svg>`;
}
function donutSVG(parts,size=120){ // parts=[{v,col,lbl}]
  const total=parts.reduce((s,p)=>s+p.v,0)||1, r=size/2-10, c=2*Math.PI*r;
  let off=0;
  const segs=parts.map((p)=>{
    const len=p.v/total*c;
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.col}" stroke-width="14" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" />`;
    off+=len; return s;
  }).join("");
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">${segs}</svg>`;
}
function circleTimer(left,total,size=84){
  const r=(size-8)/2,c=2*Math.PI*r,pct=Math.max(0,left/total);
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s2)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--volt)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${pct*c} ${c}"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="metric" >
      ${Math.floor(left/60)}:${String(Math.round(left)%60).padStart(2,"0")}</div></div>`;
}

function renderRegister(){
  A.back=()=>{S.screen="landing";save();render();};

  A.vMail=(el)=>{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value);el.classList.toggle("err",el.value.length>0&&!ok);el.classList.toggle("ok",ok);};
  A.vPw=(el)=>{
    const s=pwStrength(el.value), m=document.getElementById("pwmeter"), lbl=document.getElementById("pwlbl");
    if(m){m.style.width=s.pct+"%";m.style.background=s.col;} if(lbl){lbl.textContent=el.value?("Stärke: "+s.lbl):"";}
    el.classList.toggle("err",el.value.length>0&&el.value.length<8);el.classList.toggle("ok",el.value.length>=8);
  };
  A.vPw2=(el)=>{const pw=document.getElementById("r-pw").value;el.classList.toggle("err",el.value.length>0&&el.value!==pw);el.classList.toggle("ok",el.value.length>0&&el.value===pw);};
  A.register=async()=>{
    const u=document.getElementById("r-user").value.trim();
    const e=document.getElementById("r-mail").value.trim().toLowerCase();
    const p=document.getElementById("r-pw").value;
    const p2=document.getElementById("r-pw2").value;
    const err=document.getElementById("r-err");
    err.textContent="";
    if(u.length<3){err.textContent="Benutzername: mindestens 3 Zeichen.";return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){err.textContent="Bitte gültige E-Mail-Adresse angeben.";return;}
    if(p.length<8){err.textContent="Passwort: mindestens 8 Zeichen.";return;}
    if(p!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}
    if(S.users.some(x=>x.email===e)){err.textContent="Diese E-Mail ist bereits registriert.";return;}
    const pwHash=await hashPw(p);
    S.users.push({username:u,email:e,pwHash});
    S.currentUser=S.users.length-1;
    S.screen="onboarding"; S.step=0;
    save(); render();
  };

      <div class="strength-meter"><div id="pwmeter" style="width:0"></div></div>
      <p class="xs t2 mt8" id="pwlbl" style="min-height:14px"></p></div>
    <div class="field"><label for="r-pw2">Passwort bestätigen</label>

}

function renderLogin(){
  A.back=()=>{S.screen="landing";save();render();};
  A.forgot=()=>modal(`<p class="ct">Passwort vergessen?</p><p class="sm t2" style="line-height:1.6">Demo-Modus: Passwort-Reset via E-Mail ist nicht verfügbar — lösche den LocalStorage dieser Seite (Browser-Einstellungen → Websitedaten), um alle Konten zurückzusetzen.</p>`);
  A.login=async()=>{
    const err=document.getElementById("l-err");
    err.textContent="";
    if(S.lockoutUntil&&Date.now()<S.lockoutUntil){
      err.textContent=`Zu viele Versuche. Warte ${Math.ceil((S.lockoutUntil-Date.now())/1000)} s.`;return;
    }
    const e=document.getElementById("l-mail").value.trim().toLowerCase();
    const p=document.getElementById("l-pw").value;
    const idx=S.users.findIndex(x=>x.email===e);
    const hash=await hashPw(p);
    if(idx<0||S.users[idx].pwHash!==hash){
      S.loginAttempts=(S.loginAttempts||0)+1;
      if(S.loginAttempts>=5){S.lockoutUntil=Date.now()+30000;S.loginAttempts=0;
        err.textContent="5 Fehlversuche — Login für 30 Sekunden gesperrt.";}
      else err.textContent=`E-Mail oder Passwort falsch (Versuch ${S.loginAttempts}/5).`;
      save();return;
    }
    S.currentUser=idx; S.loginAttempts=0; S.lockoutUntil=null;
    S.screen=S.profile?"app":"onboarding"; S.tab="home";
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h1>Anmelden</h1></div>
    <div class="field"><label for="l-mail">E-Mail</label>
      <input type="email" id="l-mail" autocomplete="email"></div>
    <div class="field"><label for="l-pw">Passwort</label>
      <input type="password" id="l-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')A.login()"></div>
    <p class="fielderr" id="l-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.login()">Anmelden</button>
    <button class="btn ghost mt8" onclick="A.forgot()">Passwort vergessen?</button></div>`;
}

    if(v==="none"){ S.a[k]=cur.includes("none")?[]:["none"]; }
    else{
      let next=cur.filter(x=>x!=="none");
      if(next.includes(v)) next=next.filter(x=>x!==v);

function countUp(id,target,fmt){
  const el=document.getElementById(id);
  if(!el)return;
  const t0=performance.now(), dur=900;
  function tick(now){const pr=Math.min(1,(now-t0)/dur), e=1-(1-pr)**3;
    el.textContent=fmt(target*e); if(pr<1)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}

// ---------- Gemeinsame Helfer ----------
const WD=["Mo","Di","Mi","Do","Fr","Sa","So"];
function weekSchedule(){
  const p=S.profile, map=weekdayMap(p.a.days);
  return WD.map((d,i)=>{
    const idx=map.indexOf(i);
    return idx>=0?{wd:d,train:true,day:p.plan[idx],planIdx:idx}:{wd:d,train:false};
  });
}
function todayPlanIdx(){
  const dow=(new Date().getDay()+6)%7;
  const sched=weekSchedule();
  const today=sched[dow];
  if(today&&today.train)return today.planIdx;
  // nächster Trainingstag
  for(let i=1;i<7;i++){const s=sched[(dow+i)%7]; if(s.train)return s.planIdx;}
  return 0;
}
function weekStrip(interactive){
  const dow=(new Date().getDay()+6)%7;
  return `<div class="weekstrip">${weekSchedule().map((s,i)=>`
    <button class="wday ${i===dow?"today":""} ${s.train?"":"rest"}" ${s.train&&interactive?`onclick="A.gotoDay(${s.planIdx})"`:""}
      aria-label="${WD[i]}: ${s.train?s.day.label:"Erholung"}">
      <div class="d">${s.wd}</div>
      <div class="e">${s.train?(MUSCLE_EMOJI[s.day.label]||"🏋"):"🟢"}</div>
      <div class="l">${s.train?s.day.label.replace("Full Body","FB"):"Erh."}</div>
    </button>`).join("")}</div>`;
}
function ruleInsight(){
  // Regel-Engine: letzte 7 Tage Readiness + Adhärenz + Protein
  const r7=S.readinessHistory.slice(-7);
  const avgR=r7.length?Math.round(r7.reduce((s,x)=>s+x.score,0)/r7.length):null;
  const avgSleepH=r7.length?Math.round(r7.reduce((s,x)=>s+(x.sleepH||7),0)/r7.length*10)/10:null;
  const days=S.profile.a.days;
  const last7=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<7*864e5);
  const adh=Math.min(100,Math.round(last7.length/days*100));
  const rpes=S.trainingHistory.slice(-8).map(t=>t.avgRpe).filter(Boolean);
  const avgRpe=rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null;
  const parts=[];
  if(avgR!=null)parts.push(`Deine Readiness liegt diese Woche bei Ø ${avgR}/100.`);
  if(avgSleepH!=null&&avgSleepH<7)parts.push(`Schlaf ist dein limitierender Faktor (Ø ${nf.format(avgSleepH)} h — Ziel 8 h, Walker 2017).`);
  if(adh<80)parts.push(`Adhärenz ${adh} % — plane Sessions als feste Kalendertermine.`);
  else parts.push(`Adhärenz ${adh} % — stark.`);
  if(avgRpe!=null&&avgRpe>8.5)parts.push(`Ø RPE ${nf.format(avgRpe)} ist hoch: nimm diese Woche 1 Satz pro Übung raus (Übertrainingsschutz).`);
  else if(avgRpe!=null)parts.push(`Intensität (Ø RPE ${nf.format(avgRpe)}) liegt im produktiven Bereich 7–8.`);
  return parts.slice(0,3).join(" ");
}

          <p class="metric xs volt-txt">Empfohlen: ${fmtKg(rec.w)} × ${rec.reps}</p>
          <p class="xs t2">+2,5 kg wenn RPE ≤ 8 im letzten Set${best>0?` · Rekord: <span class="metric">${fmtKg(best)}</span> e1RM`:""}</p>
        </div>`;}).join("")}
      <button class="btn ${i===todayPlanIdx()?"volt":""} mt8" onclick="A.startDay(${i})">Starten</button>
    </div>`).join("")}`;
  if(S.scrollDay!=null){
    const el=document.getElementById("day-"+S.scrollDay);
    if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60);
    S.scrollDay=null; save();
  }
}

// TEIL 4D — PLAYER
// =====================================================================
let pw=null,pr=null,prpe=8,pnote="";
const RPE_DESC={7:"2–3 Reps Reserve",8:"1–2 Reps Reserve",9:"1 Rep Reserve",10:"Max-Anstrengung"};
function renderPlayer(){
  const p=S.profile;
  const dayIdx=S.playerDay!=null?S.playerDay:todayPlanIdx();
  const day=p.plan[dayIdx], ex=day.ex[S.exIdx];
  if(!ex){S.tab="summary";save();renderSummary();return;}
  const rec=recommend(ex.n);
  if(pw===null){pw=rec.w;pr=rec.reps;prpe=8;pnote="";}
  const logged=S.logged.filter(l=>l.n===ex.n);
  const targetSets=deloadSets(ex.sets);
  A.step=(k,d)=>{ if(k==="w"){pw=Math.max(0,Math.round((pw+d*2.5)*10)/10);} if(k==="r"){pr=Math.max(1,pr+d);} renderPlayer(); };
  A.rpe=(v)=>{prpe=v;renderPlayer();};
  A.note=(el)=>{pnote=el.value.slice(0,60);};
  A.log=()=>{
    S.logged.push({n:ex.n,w:pw,reps:pr,rpe:prpe,note:pnote,ts:Date.now()});
    pnote="";
    const e1=e1rm(pw,pr,prpe), prev=bestE1(ex.n);
    if(prev>0&&e1>prev&&(!S.prToday||e1-prev>S.prToday.delta)) S.prToday={n:ex.n,e1,delta:Math.round((e1-prev)*10)/10};
    S.restEnd=Date.now()+ex.rest*1000; save(); renderPlayer();
  };
  A.skipRest=()=>{S.restEnd=null;save();renderPlayer();};
  A.jump=(i)=>{pw=null;S.exIdx=i;save();render();};
  A.finish=()=>{
    pw=null;
    const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));
    const rpes=S.logged.map(l=>l.rpe);
    S.trainingHistory=S.trainingHistory.filter(t=>t.date!==todayKey());
    S.trainingHistory.push({date:todayKey(),day:day.label,sets:S.logged.length,volume:vol,
      avgRpe:rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:8});
    S.tab="summary"; S.restEnd=null; save(); render();
  };
  let rest="";
  if(S.restEnd&&S.restEnd>Date.now()){
    const left=Math.max(0,(S.restEnd-Date.now())/1000);
    rest=`<div class="card row"><div><p class="ct" style="margin-bottom:2px">Pause</p>
      <button class="btn ghost" style="width:auto;padding:0" onclick="A.skipRest()">Pause beenden</button></div>
      ${circleTimer(left,ex.rest)}</div>`;
    clearTimeout(timerInt); timerInt=setTimeout(()=>{ if(S.tab==="player") renderPlayer(); },250);
  } else if(S.restEnd){
    rest=`<div class="card row"><p class="metric volt-txt pulse" style="font-size:28px;font-weight:600">0:00</p>
      <button class="btn ghost" style="width:auto" onclick="A.skipRest()">OK</button></div>`;
  }
  const progressPct=((S.exIdx)/day.ex.length+((logged.length/targetSets)/day.ex.length))*100;
  root.innerHTML=header(day.label)+`
    <div class="progress mb8" aria-label="Fortschritt"><div style="width:${Math.min(100,progressPct)}%"></div></div>
    <p class="ring-lbl mb8">Übung ${S.exIdx+1} von ${day.ex.length}${S.currentWeek===4?" · Deload":""}</p>
    <div class="pills">${day.ex.map((e,i)=>`<button class="pill ${i===S.exIdx?"active":""}" onclick="A.jump(${i})">${e.n.length>16?e.n.slice(0,15)+"…":e.n}</button>`).join("")}</div>
    <div class="card">
      <div class="row mb4"><h2 style="font-size:19px">${ex.n}</h2>
        <button class="iconbtn" onclick="A.exInfo('${day.label}','${ex.n}')" aria-label="Info">ⓘ</button></div>
      <p class="sm volt-txt metric mb8">Engine: ${fmtKg(rec.w)} × ${rec.reps}</p>
      <div class="row mb12"><p class="ct" style="margin:0">Arbeitssätze</p>
        <div class="setdots" aria-label="${logged.length} von ${targetSets} Sets">${Array.from({length:targetSets},(_,i)=>`<span class="dot ${i<logged.length?"full":""}"></span>`).join("")}</div></div>
      <div class="row mb8"><span class="sm t2">Gewicht</span>
        <div class="stepper"><button onclick="A.step('w',-1)" aria-label="Gewicht verringern">−</button><span class="val metric">${fmtKg(pw)}</span><button onclick="A.step('w',1)" aria-label="Gewicht erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">Reps</span>
        <div class="stepper"><button onclick="A.step('r',-1)" aria-label="Reps verringern">−</button><span class="val metric">${pr}</span><button onclick="A.step('r',1)" aria-label="Reps erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">RPE</span>
        <div class="scale">${[7,8,9,10].map(v=>`<button class="${prpe===v?"sel":""}" onclick="A.rpe(${v})" title="${RPE_DESC[v]}" aria-label="RPE ${v}: ${RPE_DESC[v]}">${v}</button>`).join("")}</div></div>
      <p class="xs t2 mb8" style="text-align:right">${RPE_DESC[prpe]}</p>
      <input type="text" maxlength="60" placeholder="Notiz zum Set (optional)" value="${pnote}" oninput="A.note(this)" class="mb8" style="margin-bottom:10px">
      <button class="btn volt" onclick="A.log()">Set loggen</button>
      ${logged.length?`<ul class="list mt16" style="border-top:1px solid var(--border);padding-top:10px">
        ${logged.map(l=>`<li><span class="metric">${fmtKg(l.w)} × ${l.reps}</span><span class="metric">RPE ${l.rpe}${l.note?" · "+l.note:""}</span></li>`).join("")}</ul>`:""}
    </div>
    ${rest}
    <div class="grid2 mb8">
      <button class="btn" ${S.exIdx===0?"disabled":""} onclick="A.jump(${S.exIdx-1})">‹ Vorherige</button>
      <button class="btn" ${S.exIdx>=day.ex.length-1?"disabled":""} onclick="A.jump(${S.exIdx+1})">Nächste ›</button></div>
    <button class="btn" onclick="A.finish()">Session abschließen</button>`;
}

function renderSummary(){
  const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));

const VOL_BANDS={Brust:[10,20],Rücken:[12,22],Schultern:[10,20],Quadrizeps:[12,20],Beinbeuger:[10,20],Bizeps:[8,20],Trizeps:[8,20],Waden:[8,16]};

  const mk=(name)=>SEED.lifts[name].map(s=>({t:s.t,v:e1rm(s.w,s.reps,s.rpe)}));
  const sq=mk("Kniebeuge"), bp=mk("Bankdrücken");

  // Volumen-Perioden: 4 Wochen × Muskel

  const lean=bf!=null?Math.round(lastW*(1-bf/100)*10)/10:null;
  const hM=a.height/100, bmi=Math.round(lastW/(hM*hM)*10)/10;
  const ffmi=lean!=null?Math.round((lean/(hM*hM)+6.1*(1.8-hM))*10)/10:null;
  // Recovery
  const r14=S.readinessHistory.slice(-14);
  const sleepDebt=Math.round(r14.reduce((s,x)=>s+Math.max(0,8-(x.sleepH||7)),0)*10)/10;
  // Ernährung 7 Tage
  const days7=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10));
  const nutri7=days7.map(d=>{
    const log=S.nutritionLog[d];

    const s=log.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p,c:x.c+m.c,f:x.f+m.f}),{k:0,p:0,c:0,f:0});
    return {d,...s};

  const protDays=nutri7.filter(x=>x.p>=p.tg.train.p).length;

  // Kraft-Ratios (Strength-Standards, intermediate ~ Schoenfeld/StrengthLevel-Normen)
  const NORMS={beginner:{Kniebeuge:1.0,Bankdrücken:0.75,Kreuzheben:1.25},novice:{Kniebeuge:1.25,Bankdrücken:1.0,Kreuzheben:1.5},intermediate:{Kniebeuge:1.5,Bankdrücken:1.25,Kreuzheben:1.75},advanced:{Kniebeuge:2.0,Bankdrücken:1.5,Kreuzheben:2.25}};
  const norms=NORMS[a.exp||"intermediate"]||NORMS.intermediate;
  const maxK=Math.max(...Object.values(heat4).flat(),1);
  const kcalMax=Math.max(...nutri7.map(x=>x.k),p.tg.train.kcal)*1.1;
  root.innerHTML=header("Analytics")+`
    <div class="card row" style="justify-content:flex-start;gap:20px">${ringSVG(r.score,r.tier)}
      <div><p class="ct" style="margin-bottom:4px">Readiness</p><p class="xs t2">Heutiger Stand deiner Erholung.</p></div></div>

    <div class="card"><p class="ct">Strength Trajectory</p>
      <p class="sm mb8" style="font-weight:500">Kniebeuge (Langhantel)</p>${lineChart(sq,fcSq)}
      ${fcSq?`<p class="sm volt-txt metric mt8 mb16">Prognose: ${fmtKg(fcSq[2].v)} bis ${fmtD(new Date(sq[sq.length-1].t+84*864e5))}</p>`:""}
      <p class="sm mb8" style="font-weight:500">Bankdrücken (Langhantel)</p>${lineChart(bp,fcBp)}</div>

    <div class="card"><p class="ct">Trainingsvolumen · letzte 4 Wochen</p>
      ${Object.entries(heat4).map(([m,arr])=>{
        const total=arr[arr.length-1], band=VOL_BANDS[m]||[8,20];
        const col=total<band[0]?"var(--warn)":total>band[1]?"var(--danger)":"var(--volt)";
        return `<div class="barrow"><span class="blbl">${m}</span>
          <div class="btrack"><div class="bfill" style="width:${Math.min(100,total/maxK*100)}%;background:${col}"></div></div>
          <span class="bval metric">${total}/${band[0]}–${band[1]}</span></div>`;

      <p class="xs t2 mt8">Grün = produktive Zone (MEV–MRV, Israetel et al., 2017) · Gelb = sub-optimal · Rot = über MRV</p></div>

    <div class="card"><p class="ct">Intensitätsprofil (RPE)</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">

          return `<div style="flex:1;text-align:center">

          let leanLine="";
          if(bf!=null){leanLine=`<path d="${w7.map((q,i)=>{const lv=q.v*(1-bf/100);const x=8+i/(w7.length-1)*324,y=160-(lv-wMin)/(wMax-wMin||1)*144;return (i?"L":"M")+x.toFixed(1)+","+Math.max(4,y).toFixed(1);}).join(" ")}" fill="none" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="4 3"/>`;}
          return dots+`<path d="${line}" fill="none" stroke="var(--volt)" stroke-width="2"/>`+leanLine;})()}
      </svg>
      <p class="xs t2 mt8">Gewicht (volt, 7-Tage-Schnitt)${bf!=null?" · Magermasse-Schätzung (blau gestrichelt)":""} · aktuell <span class="metric">${fmtKg(lastW)}</span></p>
      <div class="chips mt8">
        <span class="badge mute">BMI <span class="metric" style="margin-left:4px">${nf.format(bmi)}</span></span>
        ${ffmi!=null?`<span class="badge mute">FFMI <span class="metric" style="margin-left:4px">${nf.format(ffmi)}</span></span>`:""}
        ${lean!=null?`<span class="badge mute">Magermasse <span class="metric" style="margin-left:4px">${fmtKg(lean)}</span></span>`:""}
      </div></div>

    <div class="card"><p class="ct">Recovery · 14 Tage</p>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px">
        ${r14.map(x=>{const h=(v,max)=>Math.max(2,v/max*24);
          return `<div style="flex:1;display:flex;flex-direction:column-reverse;gap:1px" title="${x.date}: ${x.score}">

            <div style="height:${h(6-x.sore,5)}px;background:var(--info);opacity:.7;border-radius:2px"></div>
            <div style="height:${h(6-x.stress,5)}px;background:var(--t3);border-radius:2px"></div>
          </div>`;}).join("")}
      </div>
      <p class="xs t2 mt8">Komponenten: 🟩 Schlaf · 🟦 Erholung (Kater invers) · ⬜ Stress (invers)</p>

          <p class="xs t2" style="margin-top:3px">${x.d.slice(8)}</p></div>`).join("")}

      ${Object.entries(norms).map(([lift,norm])=>{

        return `<div class="barrow"><span class="blbl">${lift}</span>
          <div class="btrack"><div class="bfill" style="width:${pc}%;background:${pc>=100?"var(--volt)":pc>=75?"var(--info)":"var(--warn)"}"></div></div>
          <span class="bval metric">${Math.round(ratio*100)} %</span></div>`;}).join("")}
      <p class="xs t2 mt8">Du drückst ${Math.round(bestE1("Bankdrücken")/lastW*100)} % deines Körpergewichts — Ziel für ${a.exp==="advanced"?"Advanced":"Intermediates"}: ${Math.round((norms["Bankdrücken"]||1.25)*100)} %.</p></div>

      <p class="sm" style="line-height:1.65">${ruleInsight()} ${pct10>20?"Dein RPE-Profil läuft heiß — die nächste Deload-Woche ist keine Option, sondern Pflicht.":"Dein Intensitätsprofil ist nachhaltig — weiter so."}</p></div>`;
}

// TEIL 6 — ERNÄHRUNG (Komplettrework)
// =====================================================================
let aiOpen=false, pendingManual=null;
function nlogToday(){
  if(!S.nutritionLog[todayKey()])S.nutritionLog[todayKey()]={meals:[],water:0};
  if(S.nutritionLog[todayKey()].water==null)S.nutritionLog[todayKey()].water=0;
  return S.nutritionLog[todayKey()];
}
function addFood(food,gram){
  const mult=gram?gram/food[1]:1;
  const entry={n:food[0]+(gram&&gram!==food[1]?` (${gram} g)`:""),g:gram||food[1],
    k:Math.round(food[2]*mult),p:Math.round(food[3]*mult*10)/10,c:Math.round(food[4]*mult*10)/10,f:Math.round(food[5]*mult*10)/10};
  nlogToday().meals.push(entry); save();
  return entry;
}
function parseNutrition(input){
  const txt=input.trim().toLowerCase();
  const gramMatch=txt.match(/(\d+)\s*(g|gramm)\b/);
  const countMatch=txt.match(/(\d+)\s*(stück|stk|x)\b/)||txt.match(/^(\d+)\s+/);
  const wordCount={ein:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5}[txt.split(/\s+/)[0]];
  const gram=gramMatch?parseInt(gramMatch[1]):null;
  const count=countMatch?parseInt(countMatch[1]):(wordCount||null);
  const tokens=txt.replace(/[^a-zäöüß0-9\s]/g," ").split(/\s+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)&&!["und","mit","ein","eine","einen","gramm"].includes(t));
  const found=FOODS.map(f=>{
    const words=f[0].toLowerCase().replace(/\(.*\)/,"").trim().split(/\s+/).filter(w=>w.length>=2);
    // Token-Match: "eier" ↔ "ei", "hähnchen" ↔ "hähnchenbrust"
    const hit=words.some(w=>tokens.some(t=>t.startsWith(w)||w.startsWith(t)));
    return hit?{f,len:f[0].length}:null;
  }).filter(Boolean).sort((a,b)=>a.len-b.len);
  if(!found.length)return null;
  const food=found[0].f;
  if(gram)return{food,gram};
  if(count)return{food,gram:food[1]*count};
  return{food,gram:food[1]};
}
let dayType="train";
function renderNutrition(){
  const p=S.profile, tg=p.tg[dayType==="train"?"train":"rest"];
  const log=nlogToday();
  const sum=log.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p,c:s.c+m.c,f:s.f+m.f}),{k:0,p:0,c:0,f:0});
  A.dt=(t)=>{dayType=t;renderNutrition();};
  A.delMeal=(i)=>{log.meals.splice(i,1);save();renderNutrition();};
  A.water=(d)=>{log.water=Math.max(0,Math.min(12,(log.water||0)+d));save();renderNutrition();};
  A.foodInput=(el)=>{
    const q=el.value.trim().toLowerCase(), ac=document.getElementById("food-autocomplete");
    if(!ac)return;
    if(q.length<2){ac.style.display="none";ac.innerHTML="";return;}
    const matches=FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,5);
    if(!matches.length){ac.style.display="none";return;}
    ac.style.display="block";
    ac.innerHTML=matches.map((f)=>`<button class="ac-item" onclick="A.acPick(${FOODS.indexOf(f)})">${f[0]} <span class="xs t2">· ${nfi.format(f[2])} kcal / ${f[1]} g</span></button>`).join("");
  };
  A.acPick=(idx)=>{
    document.getElementById("food-name").value=FOODS[idx][0];
    const ac=document.getElementById("food-autocomplete"); if(ac){ac.style.display="none";}
    document.getElementById("food-gram").focus();
  };
  A.addCustomFood=()=>{
    const name=document.getElementById("food-name").value.trim();
    const gram=parseInt(document.getElementById("food-gram").value)||null;
    if(!name){toast("Lebensmittel eingeben");return;}
    const exact=FOODS.find(f=>f[0].toLowerCase()===name.toLowerCase())||FOODS.find(f=>f[0].toLowerCase().includes(name.toLowerCase()));
    if(exact){
      const e=addFood(exact,gram);
      toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`);
      renderNutrition();
    } else {
      pendingManual={name,gram:gram||100};
      renderNutrition();
    }
  };
  A.manualSave=()=>{
    const k=parseInt(document.getElementById("m-k").value)||0;
    const pp=parseFloat(document.getElementById("m-p").value)||0;
    const c=parseFloat(document.getElementById("m-c").value)||0;
    const f=parseFloat(document.getElementById("m-f").value)||0;
    if(k<=0){toast("Kalorien angeben");return;}
    nlogToday().meals.push({n:pendingManual.name+` (${pendingManual.gram} g)`,g:pendingManual.gram,k,p:pp,c,f});
    pendingManual=null; save(); renderNutrition();
  };
  A.manualCancel=()=>{pendingManual=null;renderNutrition();};
  A.quick=(i)=>{const e=addFood(FOODS[i],null);toast(`✓ ${e.n} — ${nfi.format(e.k)} kcal`);renderNutrition();};
  A.toggleNutritionAI=()=>{aiOpen=!aiOpen;renderNutrition();};
  A.sendNutritionMsg=()=>{
    const inp=document.getElementById("nutrition-input");
    const val=(inp?inp.value:"").trim();
    if(!val)return;
    S.nutritionChat.push({r:"user",t:val});
    const parsed=parseNutrition(val);
    if(parsed){
      const e=addFood(parsed.food,parsed.gram);
      S.nutritionChat.push({r:"ai",t:`✓ Eingetragen: ${e.n} — ${nfi.format(e.k)} kcal, ${nf.format(e.p)} g Protein`});
    } else {
      S.nutritionChat.push({r:"ai",t:`Lebensmittel nicht gefunden. Versuche z. B. "150 g Lachs", "2 Eier" oder "1 Banane".`});
    }
    save(); renderNutrition();
  };
  A.startSpeech=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("Spracherkennung nicht unterstützt — bitte tippen");return;}
    try{
      const rec=new SR();
      rec.lang="de-DE"; rec.interimResults=false; rec.maxAlternatives=1;
      const mic=document.getElementById("mic-btn"); if(mic)mic.textContent="🔴";
      rec.start();
      rec.onresult=(e)=>{
        const transcript=e.results[0][0].transcript;
        const inp=document.getElementById("nutrition-input"); if(inp)inp.value=transcript;
        if(mic)mic.textContent="🎤";
        A.sendNutritionMsg();
      };
      rec.onerror=()=>{ if(mic)mic.textContent="🎤"; toast("Spracherkennung fehlgeschlagen"); };
    }catch{ toast("Spracherkennung nicht verfügbar"); }
  };
  const waterGlasses=log.water||0, waterMl=waterGlasses*250;
  root.innerHTML=header("Ernährung")+`
    <div class="card">
      <div class="row mb16" style="background:var(--s2);border-radius:999px;padding:4px;border:1px solid var(--border)">
        <button class="btn ${dayType==="train"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('train')">Trainingstag</button>
        <button class="btn ${dayType==="rest"?"volt":"ghost"}" style="min-height:40px" onclick="A.dt('rest')">Ruhetag</button></div>
      <div class="grid4">${miniRing("Kalorien",sum.k,tg.kcal,"kcal")}${miniRing("Protein",sum.p,tg.p,"g")}${miniRing("Carbs",sum.c,tg.c,"g")}${miniRing("Fett",sum.f,tg.f,"g")}</div></div>

    <div class="card"><p class="ct">Mahlzeit loggen</p>
      <div class="row mb8">
        <input type="text" id="food-name" placeholder="Lebensmittel eingeben …" style="flex:1" oninput="A.foodInput(this)" autocomplete="off">
        <input type="number" id="food-gram" placeholder="g" style="width:80px" min="1" max="2000" inputmode="numeric">
        <button class="btn volt" style="width:52px;min-width:52px" onclick="A.addCustomFood()" aria-label="Hinzufügen">+</button></div>
      <div id="food-autocomplete" class="ac-list" style="display:none"></div>
      ${pendingManual?`<div class="warncard mt8"><b>„${pendingManual.name}"</b> nicht in der Datenbank — schätze die Nährwerte für ${pendingManual.gram} g:
        <div class="grid4 mt8">
          <input type="number" id="m-k" placeholder="kcal" inputmode="numeric">
          <input type="number" id="m-p" placeholder="P (g)" inputmode="numeric">
          <input type="number" id="m-c" placeholder="C (g)" inputmode="numeric">
          <input type="number" id="m-f" placeholder="F (g)" inputmode="numeric"></div>
        <div class="grid2 mt8">
          <button class="btn" onclick="A.manualCancel()">Abbrechen</button>
          <button class="btn volt" onclick="A.manualSave()">Speichern</button></div></div>`:""}</div>

    <div class="card"><div class="row mb8"><p class="ct" style="margin:0">💧 Wasser</p>
      <span class="metric sm ${waterMl>=2500?"volt-txt":"t2"}">${nf.format(waterMl/1000)} / 2,5 l</span></div>
      <div class="row">
        <div class="stepper"><button onclick="A.water(-1)" aria-label="Glas entfernen">−</button>
          <span class="val metric">${waterGlasses} 🥤</span>
          <button onclick="A.water(1)" aria-label="Glas hinzufügen">+</button></div>
        <div class="progress" style="height:8px"><div style="width:${Math.min(100,waterMl/2500*100)}%"></div></div>
      </div></div>

    <div class="card"><p class="ct">Quickliste · ${FOODS.length} Lebensmittel</p>
      <div style="max-height:260px;overflow-y:auto">${FOODS.slice(0,30).map((f,i)=>`
        <button class="opt row" style="margin-bottom:6px" onclick="A.quick(${i})">
        <span><span style="display:block;font-size:14px">${f[0]}</span><span class="xs t2">${f[1]} g Basis</span></span>
        <span class="metric xs t2">${nfi.format(f[2])} kcal · ${nf.format(f[3])} g P</span></button>`).join("")}
        <p class="xs t2" style="text-align:center;padding:8px">… alle ${FOODS.length} via Suche oben verfügbar</p></div></div>

    <div class="card"><p class="ct">Heute geloggt</p>
      ${log.meals.length?`<ul class="list">${log.meals.map((m,i)=>`<li><span>${m.n}</span>
        <span style="display:flex;gap:10px;align-items:center"><span class="metric">${nfi.format(m.k)} kcal</span>
        <button class="iconbtn" style="min-width:32px;min-height:32px;font-size:13px" onclick="A.delMeal(${i})" aria-label="Löschen">✕</button></span></li>`).join("")}</ul>`
      :`<p class="sm t2">Noch nichts geloggt. Nutze die Suche, die Quickliste oder den KI-Assistenten.</p>`}</div>

    ${aiOpen?`<div id="nutrition-ai-panel" style="position:fixed;bottom:88px;right:16px;left:16px;max-width:398px;margin:0 auto;z-index:50">
      <div class="card" style="border-color:rgba(200,255,46,.4);box-shadow:0 8px 32px rgba(0,0,0,.5)">
        <div class="row mb8"><p class="ct" style="margin:0">🤖 KI Ernährungs-Assistent</p>
          <button class="btn ghost" style="width:auto" onclick="A.toggleNutritionAI()" aria-label="Schließen">✕</button></div>
        <div id="nutrition-chat" style="max-height:180px;overflow-y:auto;margin-bottom:8px">
          ${S.nutritionChat.slice(-6).map(m=>`<div class="msg ${m.r==="user"?"user":"ai"}" style="font-size:13px;padding:8px 12px">${m.t}</div>`).join("")||'<p class="xs t2">Sprich oder schreib deine Mahlzeit — ich trage sie automatisch ein.</p>'}</div>
        <div class="row">
          <button id="mic-btn" class="btn" style="width:52px;min-width:52px" onclick="A.startSpeech()" aria-label="Spracheingabe">🎤</button>
          <input type="text" id="nutrition-input" placeholder="z. B. '200 g Hähnchen'" style="flex:1;border-radius:999px" onkeydown="if(event.key==='Enter')A.sendNutritionMsg()">
          <button class="btn volt" style="width:52px;min-width:52px" onclick="A.sendNutritionMsg()" aria-label="Senden">➤</button></div>
      </div></div>`
    :`<button style="position:fixed;bottom:96px;right:16px;z-index:49;width:52px;height:52px;border-radius:50%;background:var(--volt);color:var(--bg);border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(200,255,46,.3)" onclick="A.toggleNutritionAI()" aria-label="KI Ernährungs-Assistent öffnen">🤖</button>`}`;
  const chatEl=document.getElementById("nutrition-chat");
  if(chatEl)chatEl.scrollTop=chatEl.scrollHeight;
}

// COACH
// =====================================================================
const MOCK={
  "Warum stagniert meine Bank?":"Deine Bank hängt laut Trajectory seit etwa drei Wochen auf demselben e1RM. Zwei Hebel: erstens prüfe, ob du die obere Rep-Range wirklich bei RPE 8 erreichst — falls nicht, bleib beim Gewicht und sammle Reps. Zweitens steht dein Deload in Woche 4 an; danach reagiert die Bank oft mit einem Sprung.",
  "Passe diese Woche auf 3 Tage an":"Machbar. Streiche den vierten Tag und zieh die wichtigsten Sätze zusammen: behalte beide Grundübungs-Slots, kürze Isolationsarbeit auf je 2 Sets. Dein Wochenvolumen sinkt um etwa 15 Prozent — bei deiner aktuellen Readiness ist das eher Feature als Bug.",
  "Wie viel Protein an Ruhetagen?":"Gleich viel wie an Trainingstagen — dein Proteinziel gilt täglich, denn die Muskelproteinsynthese läuft 24 bis 48 Stunden nach der Session weiter (Morton et al., 2018). Nur Kalorien und Carbs unterscheiden sich zwischen Trainings- und Ruhetag.",
  "Bewerte meine Readiness diese Woche":"Deine Readiness pendelt diese Woche im Ready-Bereich. Schlaf ist dein größter Hebel: die schwächeren Scores fielen auf Tage mit unter 6,5 Stunden. Heute spricht nichts gegen die geplante Session — bleib bei RPE 8 als Deckel."
};
let coachConsent=store.get(KEY+"-coach")==="1";
let chatStreaming=false;
function renderCoach(){
  A.consent=()=>{coachConsent=true;store.set(KEY+"-coach","1");renderCoach();};
  A.ask=(q)=>{
    if(chatStreaming)return;
    S.chat.push({r:"user",t:q}); save(); renderCoach();
    const ans=MOCK[q]||"Demo-Modus: Mit konfiguriertem API-Key analysiere ich deine echten Metriken — e1RM-Trends, Readiness und Adhärenz aus deinem Kontext.";
    const words=ans.split(" "); let i=0; S.chat.push({r:"ai",t:""}); chatStreaming=true;
    const int=setInterval(()=>{
      if(S.tab!=="coach"){clearInterval(int);S.chat[S.chat.length-1].t=ans;chatStreaming=false;save();return;}
      S.chat[S.chat.length-1].t+=(i?" ":"")+words[i]; i++;
      renderCoach();
      if(i>=words.length){clearInterval(int);chatStreaming=false;save();}
    },35);
  };
  A.send=()=>{const inp=document.getElementById("ci"); if(inp&&inp.value.trim())A.ask(inp.value.trim());};
  if(!coachConsent){
    root.innerHTML=header("Coach")+`<div class="card"><p class="ct">Datenfreigabe für den Coach</p>
      <p class="sm t2 mb16" style="line-height:1.6">Der AI-Coach verarbeitet aggregierte Gesundheitsdaten (Trainingsmetriken, Readiness, Ernährungsadhärenz). Es werden keine Roh-Logs übertragen, nur Zusammenfassungen. Du kannst die Einwilligung jederzeit widerrufen (Art. 9 DSGVO).</p>
      <button class="btn volt" onclick="A.consent()">Einwilligen & Coach starten</button>
      <p class="xs t2 mt8" style="text-align:center">Keine medizinische Beratung.</p></div>`;
    return;
  }
  root.innerHTML=header("Coach")+`<div id="chatbox">
    ${S.chat.length===0?`<p class="sm t2 mb16">Keine medizinische Beratung.</p>
      <div class="chips mb16">${Object.keys(MOCK).map(q=>`<button class="chip" onclick="A.ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join("")}</div>`:""}
    ${S.chat.map(m=>`<div class="msg ${m.r==="user"?"user":"ai"}">${m.t||"…"}</div>`).join("")}</div>
    <div class="row mt16" style="position:sticky;bottom:92px">
      <input type="text" id="ci" placeholder="Frag deinen Coach …" style="border-radius:999px" onkeydown="if(event.key==='Enter')A.send()">
      <button class="btn volt" style="width:52px;min-width:52px" onclick="A.send()" aria-label="Senden">➤</button></div>`;
  window.scrollTo(0,document.body.scrollHeight);
}

// ---------- Boot mit sichtbarem Fehler-Fallback ----------
window.addEventListener("error",(e)=>{
  if(!root.innerText.trim()){
    root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
    <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(e.message||"unbekannt")}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
  }
});
try{ render(); }catch(err){
  root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
  <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(err&&err.message||err)}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
}
</script>
