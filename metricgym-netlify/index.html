      <button class="btn volt mt16" onclick="A.editProfile()">${icon("settings",15)} Engine & Ziele anpassen</button></div>`:""}

    <div class="card"><p class="ct">${icon("activity",14)} Wearable · Apple Watch</p>
      <p class="xs t2 mb12" style="line-height:1.55">Trag die <b style="color:var(--t1)">heute aktiv verbrannten Kalorien</b> von deiner Watch ein — dein Kalorienziel passt sich sofort an deinen echten Verbrauch an (statt der Schätzung).</p>
      <div class="row" style="gap:10px">
        <input type="number" id="wear-k" inputmode="numeric" placeholder="z. B. 480 kcal aktiv" value="${S.wearActive[todayKey()]??""}" style="flex:1">
        <button class="btn volt" style="width:auto;padding:0 18px" onclick="A.setWearActive()">Übernehmen</button>
      </div>
      ${S.wearActive[todayKey()]!=null?`<p class="xs volt-txt mt8" style="display:flex;align-items:center;gap:5px">${icon("check",12)} ${nfi.format(S.wearActive[todayKey()])} kcal aktiv heute — Tagesziel angepasst.</p>`:""}
      <p class="xs t2 mt8" style="line-height:1.5">Automatischer Sync (Apple HealthKit / Google Fit) kommt mit der nativen Companion-App. Bis dahin liest du den Wert kurz von der Watch ab — die Anbindung an dein Tagesziel funktioniert bereits voll.</p>
    </div>
    <div class="card"><p class="ct">${icon("camera",14)} Körper-Fortschritt</p>
      ${(()=>{const m=S.measure;const last=m[m.length-1],first=m[0];
        if(!last)return `<p class="sm t2 mb12">Tracke Maße & Fotos — dein sichtbarer Beweis, wie weit du kommst.</p>`;
        return `<div class="chips mb12">${MEASURE_FIELDS.filter(([k])=>last[k]!=null).map(([k,l])=>{
          const d=first&&first!==last&&first[k]!=null?last[k]-first[k]:null;
          return `<span class="statchip">${l} ${nf.format(last[k])} cm${d!=null&&Math.abs(d)>=0.1?` <span style="color:${d<0?"var(--hl)":"var(--t2)"}">(${d>0?"+":""}${nf.format(Math.round(d*10)/10)})</span>`:""}</span>`;}).join("")}</div>`;})()}
      <div class="grid2" style="gap:8px">
        <button class="btn" onclick="A.measOpen()">${icon("edit",14)} Maße eintragen</button>
        <button class="btn" onclick="document.getElementById('photo-file').click()">${icon("camera",14)} Foto hinzufügen</button></div>
      <input type="file" id="photo-file" accept="image/*" capture="environment" style="display:none" onchange="A.photoAdd(this)">
      ${S.photos.length?`<div class="row mt12" style="gap:6px;overflow-x:auto;padding-bottom:4px">
        ${S.photos.slice(-8).map(p=>`<div style="position:relative;flex-shrink:0">
          <div id="thumb-${p.id}" style="width:70px;height:90px;border-radius:10px;background:var(--s2);background-size:cover;background-position:center"></div>
          <button class="iconbtn" style="position:absolute;top:-6px;right:-6px;min-width:24px;min-height:24px;background:var(--bg);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:11px" onclick="A.delPhoto('${p.id}')" aria-label="Foto löschen">${icon("x",12)}</button>
        </div>`).join("")}</div>
        ${S.photos.length>=2?`<button class="btn volt mt12" onclick="A.photoCompare()">${icon("sparkle",15)} Vorher / Nachher ansehen</button>`:`<p class="xs t2 mt8">Ab dem 2. Foto kannst du Vorher/Nachher vergleichen.</p>`}`:""}
    </div>

    <div class="card"><p class="ct">Profil-Snapshots</p>
      ${S.tier==="elite"?`
        ${S.snapshots.length?`<ul class="list mb8">${S.snapshots.slice(-4).map(sn=>`<li>
          <span class="xs t2">${fmtD(new Date(sn.date))}</span>
          <span class="metric xs">${fmtKg(sn.weight)} · ${nfi.format(sn.kcal)} kcal · ${sn.goals.map(g=>GOAL_LABEL[g]).join("+")}</span></li>`).join("")}</ul>
          ${p&&S.snapshots.length?`<p class="xs t2 mb8">Δ seit ${fmtD(new Date(S.snapshots[0].date))}: <span class="metric ${p.a.weight-S.snapshots[0].weight>=0?"volt-txt":"t2"}">${p.a.weight-S.snapshots[0].weight>=0?"+":""}${nf.format(Math.round((p.a.weight-S.snapshots[0].weight)*10)/10)} kg</span></p>`:""}`
        :'<p class="sm t2 mb8">Noch keine Snapshots — speichere deinen aktuellen Stand für spätere Vergleiche.</p>'}
        <button class="btn" onclick="A.saveSnapshot()">Snapshot jetzt speichern</button>`
      :`<div class="lockcard" style="margin-top:0"><p class="sm">${icon("lock",13)} Historische Profil-Stände zum Vorher/Nachher-Vergleich — Teil von ELITE.</p>
        <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('snapshots')">Mehr erfahren</button></div>`}
    </div>

    <div class="card" style="border-color:rgba(96,140,230,.3)"><p class="ct">${icon("brain",14)} KI-Coach (Coach Metric)</p>
      ${aiActive()
        ? `<p class="sm mb8"><span class="badge volt">aktiv</span> Dein KI-Coach ist an — er kennt deine Daten und antwortet frei im Plan-Assistenten und im Coach-Chat.</p>
           <button class="btn mb8" onclick="A.aiToggle()">KI-Coach ausschalten</button>`
        : `<p class="sm t2 mb8" style="line-height:1.6">Schalte den echten KI-Coach frei: freie Fragen zu Training, Ernährung & Motivation — mit deinen Daten beantwortet (Groq / Llama 3.3).</p>
           <input type="password" id="ai-key" placeholder="Groq API-Key (gsk_…)" style="width:100%;margin-bottom:8px" autocomplete="off" value="${(S.aiKey||"").replace(/"/g,"")}">
           <button class="btn volt" onclick="A.aiActivate()">KI-Coach aktivieren</button>`}
      <p class="xs t2 mt8" style="line-height:1.5">${icon("lock",12)} Dein Key bleibt <b style="color:var(--t1)">nur auf diesem Gerät</b> (lokal gespeichert, nie an uns gesendet). Hinweis: In einer Web-App ist der Key im Browser sichtbar — für den öffentlichen Launch gehört er hinter einen Server. Teile ihn nicht & rotiere ihn bei Verdacht.</p>
    </div>

    ${(()=>{
      const cnt=S.referralCount||0, w=S.wallet||{available:0,pending:0,ledger:[],lifetimeEarned:0};
      const rank=referralRank(cnt), next=nextReferralRank();
      const span=next?(next.min-rank.min):1, prog=next?Math.min(100,Math.round((cnt-rank.min)/span*100)):100;
      // Netzwerk-Visual: wachsender Kreis aus DIREKTEN Werbungen (einstufig — kein Downline-Verdienst).
      const orbs=[...Array(Math.min(cnt,18))].map((_,i)=>`<span style="width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9DB4F0,#4A6FD8);box-shadow:0 0 7px rgba(74,111,216,.5);display:inline-block"></span>`).join("");
      const ranks=REFERRAL_RANKS.map(r=>{
        const at=cnt>=r.min, isCur=r.name===rank.name;
        return `<div class="row" style="padding:9px 0;border-top:1px solid var(--hairline);align-items:center">
          <span style="width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:${at?r.color+"22":"var(--s3)"};border:1.5px solid ${at?r.color:"transparent"};color:${at?r.color:"var(--t2)"};font-size:11px;font-weight:800">${at?"★":r.min}</span>
          <span class="sm" style="flex:1;margin-left:10px">${r.name}${isCur?' <span class="xs volt-txt">· dein Rang</span>':""}<br><span class="xs t2">ab ${r.min} Freunden · ${fmtEUR(r.rate)} pro Werbung</span></span>
          ${at?`<span class="xs" style="color:${r.color}">erreicht</span>`:`<span class="xs t2">${r.min-cnt} fehlen</span>`}</div>`;
      }).join("");
      const led=(w.ledger||[]).slice(0,4).map(e=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--hairline)">
        <span class="xs t2" style="flex:1">${e.note}</span><span class="metric xs ${e.amount<0?"t2":"volt-txt"}">${e.amount<0?"−":"+"}${fmtEUR(Math.abs(e.amount))}</span></div>`).join("");
      return `<div class="card" style="border-color:${rank.color}55">
        <p class="ct">${icon("send",14)} Botschafter-Programm — verdiene echtes Geld</p>
        <div class="row" style="align-items:center;gap:12px;margin:4px 0 12px">
          <span style="width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:${rank.color}22;border:2px solid ${rank.color};color:${rank.color}">${icon("star",24)}</span>
          <div style="flex:1"><p class="sm" style="font-weight:700">${rank.name}-Botschafter</p>
            <p class="xs t2">Aktuell <b style="color:var(--t1)">${fmtEUR(rank.rate)}</b> pro geworbenem Freund</p></div>
          <div style="text-align:right"><p class="metric" style="font-size:15px;color:var(--good)">${fmtEUR(w.lifetimeEarned||0)}</p><p class="xs t2">gesamt verdient</p></div>
        </div>
        ${next?`<div class="row mb4"><span class="xs t2">Noch ${next.min-cnt} bis ${next.name} (${fmtEUR(next.rate)}/Werbung)</span><span class="metric xs">${cnt}/${next.min}</span></div>
          <div class="progress mb12" style="height:8px"><div style="width:${prog}%;background:${next.color}"></div></div>`
          :`<p class="xs volt-txt mb12">Höchster Rang erreicht — ${fmtEUR(rank.rate)} pro Werbung. Respekt.</p>`}
        ${cnt>0?`<p class="label" style="margin:0 0 6px">Dein Netzwerk · ${cnt}</p><div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">${orbs}${cnt>18?`<span class="xs t2" style="align-self:center">+${cnt-18}</span>`:""}</div>`:""}
        <div class="row" style="gap:10px;margin-bottom:12px">
          <div style="flex:1;background:var(--s2);border-radius:14px;padding:14px;text-align:center"><p class="hero-num" style="font-size:25px;color:var(--good)">${fmtEUR(w.available||0)}</p><p class="xs t2">verfügbar</p></div>
          <div style="flex:1;background:var(--s2);border-radius:14px;padding:14px;text-align:center"><p class="hero-num" style="font-size:25px;color:var(--hl)">${fmtEUR(w.pending||0)}</p><p class="xs t2">ausstehend</p></div>
        </div>
        <button class="btn ${(w.available||0)>=1?"volt":""} mb12" ${(w.available||0)>=1?"":'disabled style="opacity:.5"'} onclick="A.redeemWallet()">${icon("zap",15)} Guthaben auf Abo anrechnen</button>
        <p class="label" style="margin:0 0 4px">Rang-Leiter</p>
        <div style="background:var(--s2);border-radius:14px;padding:4px 14px 10px;margin-bottom:12px">${ranks}</div>
        ${led?`<p class="label" style="margin:4px 0 2px">Letzte Buchungen</p><div style="background:var(--s2);border-radius:14px;padding:4px 14px 8px;margin-bottom:12px">${led}</div>`:""}
        <p class="metric mb8" style="text-align:center">Dein Code: <span style="color:var(--hl)">${S.refCode}</span></p>
        <button class="btn volt mb8" onclick="A.invite()">${icon("send",15)} Als ${rank.name}-Botschafter teilen</button>
        <div class="row"><input type="text" id="redeem-in" placeholder="Freundes-Code einlösen" style="flex:1" autocomplete="off">
          <button class="btn" style="width:auto;padding:0 16px" onclick="A.redeem()">Einlösen</button></div>
        <p class="xs t2 mt8" style="line-height:1.5"><b style="color:var(--t1)">Cashflow-sicher:</b> Guthaben wird erst verfügbar, wenn dein Freund zahlt — finanziert aus seiner Zahlung.</p>
        <button class="btn ghost" style="min-height:34px;font-size:12px;justify-content:flex-start;padding-left:0" onclick="A.legalReferral()">${icon("info",13)} Echtes Geld & warum es legal ist</button>
        ${SB.enabled()?"":`<p class="xs t2 mt4">Hinweis: Bestätigte Einladungen zählt dein Cloud-Konto — dafür Supabase aktivieren.</p>`}
      </div>

      <div class="card"><p class="ct">${icon("star",14)} Cashback bei Partnern <span class="badge mute" style="margin-left:6px">bald</span></p>
        <p class="sm t2 mb8" style="line-height:1.6">Kaufst du Supplements, Equipment oder Sportkleidung über deinen METRICGYM-Link, fließt ein Teil als <b style="color:var(--t1)">echtes Guthaben</b> zurück — <b style="color:var(--t1)">bezahlt von der Marke</b>, nicht von dir. Reiner Bonus, kein Aufpreis.</p>
        <div class="chips">${["Supplements","Equipment","Sportkleidung","Wearables"].map(c=>`<span class="badge mute">${c}</span>`).join("")}</div>
        <p class="xs t2 mt8">Aktiv, sobald die Partnerprogramme angebunden sind.</p>
      </div>`;
    })()}

    <div class="card"><p class="ct">Health-Daten importieren</p>
      <p class="xs t2 mb8" style="line-height:1.6">Apple-Health-Export (<span class="metric">export.xml</span>), CSV (<span class="metric">datum,gewicht</span>) oder JSON. Übernommen werden: Gewicht → Verlauf · <b style="color:var(--t1)">HRV, Ruhepuls & Schlaf → gemessene Erholung</b> (färbt deine Tage im Monats-Überblick).</p>
      <button class="btn mb8" onclick="document.getElementById('health-file').click()">${icon("plus",15)} Datei wählen (.xml / .csv / .json)</button>
      <input type="file" id="health-file" accept=".xml,.csv,.json,text/xml,application/json,text/csv" style="display:none" onchange="A.healthFile(this)">
      ${(S.hrvLog.length||S.rhrLog.length||S.sleepLog.length)?(()=>{
        const bits=[];
        if(S.hrvLog.length){const l=S.hrvLog.slice(-7);bits.push(`HRV Ø <span class="metric">${Math.round(l.reduce((s,x)=>s+x.v,0)/l.length)} ms</span>`);}
        if(S.rhrLog.length){const l=S.rhrLog.slice(-7);bits.push(`Ruhepuls Ø <span class="metric">${Math.round(l.reduce((s,x)=>s+x.v,0)/l.length)} bpm</span>`);}
        if(S.sleepLog.length){const l=S.sleepLog.slice(-7);bits.push(`Schlaf Ø <span class="metric">${(l.reduce((s,x)=>s+x.v,0)/l.length).toFixed(1).replace(".",",")} h</span>`);}
        return `<p class="xs t2 mb8">${bits.join(" · ")}</p>`;})():""}
      <p class="xs t2" style="line-height:1.6"><b style="color:var(--t1)">Ehrlich gesagt:</b> Eine Live-Synchronisation mit HealthKit oder Google Fit ist aus einer Browser-App technisch nicht möglich. Der Import liest deine exportierte Datei — komplett lokal, nichts verlässt dein Gerät.</p></div>

    ${S.devMode?`<div class="card"><p class="ct">Dev: Demo-Daten</p>
      <p class="xs t2 mb8">Synthetische 10-Wochen-Historie zum Testen aller Analytics-Module. Nur im Developer-Modus sichtbar — echte Konten starten immer leer.</p>
      <div class="grid2">
        <button class="btn" onclick="A.loadDemoData()">Demo-Daten laden</button>
        <button class="btn" onclick="A.clearDemoData()">Historie leeren</button></div></div>`:""}

    <div class="card"><p class="ct">Daten</p>
      <!-- DSGVO: Export & Löschung sind in JEDEM Tier verfügbar — niemals gated. -->
      <button class="btn mb8" onclick="A.exportData()">Daten exportieren (JSON)</button>
      <button class="btn" style="border-color:rgba(255,77,77,.35);color:var(--danger)" onclick="A.wipe()">Konto & Daten löschen</button>
      <p class="xs t2 mt8">DSGVO Art. 17 / 20 · Alle Daten liegen lokal auf diesem Gerät.</p></div>
    <button class="btn ghost" onclick="A.logout()">⎋ Abmelden</button>
    <p class="xs" style="color:var(--t3);text-align:center;margin-top:16px">METRICGYM V4 · Performance Intelligence</p>`;
  // Foto-Thumbnails asynchron aus IndexedDB nachladen
  S.photos.slice(-8).forEach(async(p)=>{const d=await PDB.get(p.id);const el=document.getElementById("thumb-"+p.id);if(el&&d)el.style.backgroundImage=`url(${d})`;});
}

// ---------- Boot ----------
window.addEventListener("error",(e)=>{
  if(!root.innerText.trim()){
    root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
    <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(e.message||"unbekannt")}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
  }
});
try{ render(); }catch(err){
  root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
  <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(err&&err.message||err)}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
}
// Supabase: bestehende Session wiederherstellen (geräteübergreifender Auto-Login + Cloud-Pull)
(async()=>{
  try{
    if(!SB.enabled()) return;
    await SB.init();
    const {data}=await SB.client.auth.getSession();
    if(!data||!data.session) return;
    SB.user=data.session.user; SB.token=data.session.access_token;
    let cloud=null; try{ cloud=await SB.pull(); }catch(e){}
    if(cloud) SB.hydrate(cloud);
    const fname=(SB.user.user_metadata&&SB.user.user_metadata.first_name)||((SB.user.email||"").split("@")[0]);
    if(!S.users||!S.users.length) S.users=[{username:fname,email:SB.user.email,pwHash:""}];
    S.currentUser=0;
    SB.recordReferralIfNeeded();
    if(["landing","login","register"].includes(S.screen)||S.currentUser==null){ S.screen=S.profile?"app":"onboarding"; S.tab=S.tab||"home"; }
    save(); render();
  }catch(e){}
})();
</script>
</body>
</html>
