  :root{
    /* Premium Dark-Theme (Oura-inspiriert): tiefes Blau + Silber, kühl & hochwertig */
    --bg:#080A0F; --s1:#13151C; --s2:#1A1D26; --s3:#262A36; --border:rgba(255,255,255,.12);
    --hairline:rgba(255,255,255,.07);
    --t1:#EEF1F6; --t2:#9BA3B4; --t3:#646C7D;
    --accent:#4A6FD8; --accent-soft:rgba(74,111,216,.18);
    --hl:#9DB4F0; --hl-soft:rgba(157,180,240,.16); /* kühler Blau-Akzent auf Dunkel */
    --volt:#9DB4F0; /* Daten-Highlights (Charts, Deltas) */
    --silver:#C9D2E2; /* Platin/Silber-Sekundärakzent */
    --info:#7FA0C8; --danger:#E56A5C; --warn:#E0A24A;
    --good:#5BC48A; /* Recovery-/Erfolgs-Grün (Whoop-Logik) */
    /* Wiederkehrende Dark-Glass-Flächen: zentral steuerbar */
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08); --stroke:rgba(255,255,255,.10);
    /* Apple-Ästhetik: SF Pro (System) fuer UI/Zahlen + Fraunces-Serif fuer Headlines.
       SF Pro ist auf iPhone nativ und premium — kein 'billiger Webfont'-Eindruck. */
    --font-display:'Manrope',system-ui,-apple-system,sans-serif;
    --font-ui:'Manrope',system-ui,-apple-system,sans-serif;
    --font-hero:'Manrope',system-ui,-apple-system,sans-serif;
    --font-serif:'Fraunces',Georgia,'Times New Roman',serif; /* editoriale Headlines (eingebettet) */
    --font-mono:'Manrope',system-ui,-apple-system,sans-serif; /* Zahlen: SF Pro, tabular-nums via .metric */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --glass-bg:rgba(30,28,36,.55);
    --glass-bg-strong:rgba(22,21,27,.88);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:dark;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:var(--font-ui);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    letter-spacing:-0.005em; line-height:1.5;
    min-height:100dvh;
  }
  /* Headlines & Marken-Elemente: Space Grotesk; Fließtext bleibt Inter. */
  h1,h2,h3,.display-m,.hero-num,.huge,.dial,.logo-text,.lp-h,.lp-h2,.lp-quote,.lp-claim .n,.tier-card .display-m{font-family:var(--font-display);}
  .serif{font-family:var(--font-serif); font-weight:500; letter-spacing:-.01em;}
  /* Ambient Aurora HINTER der Glas-Ebene — tiefe, leuchtende Bronze/Amber-Verläufe auf Schwarz */
  /* Animierte Aurora: zwei langsam driftende Gradient-Ebenen ueber dem soliden Schwarz
     -> lebendiger, hochwertiger Hintergrund auf ALLEN Seiten (GPU-composited, subtil). */
  body::before{
    content:""; position:fixed; inset:-30%; z-index:-2; pointer-events:none; will-change:transform;
    background:
      radial-gradient(46% 32% at 18% 8%, rgba(74,111,216,.28), transparent 70%),
      radial-gradient(42% 30% at 88% 16%, rgba(132,110,216,.22), transparent 72%),
      radial-gradient(54% 42% at 50% 100%, rgba(58,150,200,.20), transparent 70%);
    animation:auroraA 28s ease-in-out infinite alternate;
  }
  body::after{
    content:""; position:fixed; inset:-30%; z-index:-2; pointer-events:none; will-change:transform;
    background:
      radial-gradient(40% 30% at 78% 82%, rgba(150,170,220,.14), transparent 70%),
      radial-gradient(38% 30% at 6% 68%, rgba(95,110,205,.16), transparent 72%);
    animation:auroraB 37s ease-in-out infinite alternate;
  }
  @keyframes auroraA{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}
    50%{transform:translate3d(3%,-2.5%,0) scale(1.1) rotate(2deg)}
    100%{transform:translate3d(-2.5%,3%,0) scale(1.06) rotate(-2deg)}
  }
  @keyframes auroraB{
    0%{transform:translate3d(0,0,0) scale(1.05)}
    100%{transform:translate3d(3.5%,-3%,0) scale(1.16)}
  }
  @media (prefers-reduced-motion:reduce){ body::before,body::after{animation:none} }
  /* ===== „Lebendiges KI-Feld" hinter Home: morphende, driftende Gradienten —
     wirkt wie ein intelligentes System, das im Hintergrund rechnet/optimiert. ===== */
  .ai-field{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;}
  .ai-field::before{content:""; position:absolute; inset:-32%; will-change:transform;
    background:
      radial-gradient(40% 32% at 20% 16%, rgba(74,111,216,.50), transparent 66%),
      radial-gradient(38% 30% at 84% 26%, rgba(126,139,232,.40), transparent 68%),
      radial-gradient(48% 40% at 58% 88%, rgba(58,150,200,.34), transparent 70%),
      radial-gradient(30% 26% at 42% 54%, rgba(110,123,224,.28), transparent 72%);
    filter:blur(26px); animation:aiDrift 22s ease-in-out infinite alternate;}
  .ai-field::after{content:""; position:absolute; inset:-16%; will-change:transform,opacity; mix-blend-mode:screen;
    background:radial-gradient(30% 26% at 50% 40%, rgba(157,180,240,.34), transparent 70%);
    animation:aiPulse 7.5s ease-in-out infinite, aiOrbit 30s linear infinite;}
  @keyframes aiDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5%,3.5%,0) scale(1.14)}100%{transform:translate3d(-4%,-3%,0) scale(1.08)}}
  @keyframes aiPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes aiOrbit{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .ai-field::before,.ai-field::after{animation:none} }
  /* ===== Anatomie-Glow (Oura-Stil): atmende Muskeln, weiche Aura, sanftes Aufleuchten ===== */
  .mg-svg{animation:mgIgnite .55s cubic-bezier(.22,1,.36,1) both;}
  .mg-on{animation:mgPulse 2.8s ease-in-out infinite;}
  .mg-on.s2{animation-duration:3.4s; animation-delay:.5s;}
  .mg-aura{animation:mgAura 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes mgPulse{0%,100%{opacity:.78}50%{opacity:1}}
  @keyframes mgAura{0%,100%{opacity:.30; transform:scale(.94)}50%{opacity:.62; transform:scale(1.05)}}
  @keyframes mgIgnite{from{opacity:0; transform:translateY(6px) scale(.97)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .mg-svg,.mg-on,.mg-aura{animation:none} }
  .metric{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .hero-num{font-family:var(--font-hero); font-weight:800; letter-spacing:-0.03em;}
  .wrap{max-width:430px; margin:0 auto; min-height:100dvh; padding:70px 16px 124px;}
  .wrap.noshell{padding-top:16px;}
  h1{font-size:17px; font-weight:700; letter-spacing:-0.01em;}
  h2{font-size:27px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; margin-bottom:4px;}
  .display-m{font-size:19px; font-weight:700; letter-spacing:-0.01em; line-height:1.3;}
  .label{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); display:block; margin:0 0 var(--sp-3) var(--sp-1);}
  .section{margin-bottom:var(--sp-7);}
  .hint{font-size:13px; color:var(--t2); margin-bottom:16px; line-height:1.55;}
  /* Quiz-Empfehlung: kontextueller Coach-Hinweis (Gradient-Callout) */
  .quiz-rec{display:flex; gap:9px; align-items:flex-start; margin:0 0 18px; padding:12px 14px; border-radius:14px;
    background:linear-gradient(135deg, rgba(74,111,216,.16), rgba(126,139,232,.05)); border:1px solid rgba(157,180,240,.35);
    font-size:12.5px; line-height:1.5; color:var(--t2); animation:fade .4s var(--spring) .05s backwards;}
  .quiz-rec svg{color:var(--hl); flex-shrink:0; margin-top:1px;} .quiz-rec b{color:var(--t1);}

  /* ===== Liquid Glass (HELL): Basis für alle erhöhten Elemente ===== */
  /* FIX (v5/6A): .menu-sheet aus der 60%-Glass-Gruppe entfernt — eigene,
     deckendere Definition unten (glass-bg-strong + blur 32px), sonst scheint
     der Seiteninhalt durchs offene Menü. */
  .card,.acc,.tier-card,.lockcard,.warncard,.qcard,.modal,.sheet{
    position:relative;
    background:linear-gradient(168deg, rgba(255,255,255,.06), rgba(255,255,255,.012) 62%), var(--glass-bg);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--stroke);
    box-shadow:0 12px 34px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .card::before,.tier-card::before,.sheet::before,.modal::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,0) 48%);
  }
  .card{border-radius:24px; padding:22px; margin-bottom:14px;}
  .modal,.sheet{background:var(--glass-bg-strong); -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);}
  /* Glass-Light für Listen (Perf: kein blur auf vielen Elementen) */
  .acc,.qcard,.lockcard,.warncard{-webkit-backdrop-filter:none; backdrop-filter:none; background:var(--surface);}

  .ct{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); margin-bottom:12px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:48px; border-radius:999px; border:1px solid rgba(255,255,255,.65);
    background:var(--surface); color:var(--t1); font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05), inset 0 1px 0 var(--surface);
    transition:all .25s var(--spring);
  }
  .btn:active{transform:scale(.97); box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);}
  .btn.volt{background:linear-gradient(115deg,#F3F6FB,#DCE3F0 40%,#C6D0E4 60%,#EAEFF8 85%,#F3F6FB); background-size:240% 100%;
    color:#10131A; border:1px solid rgba(255,255,255,.55); font-weight:700;
    box-shadow:0 10px 28px rgba(120,140,200,.22), inset 0 1px 0 rgba(255,255,255,.7);
    animation:voltSheen 7s ease-in-out infinite;}
  @keyframes voltSheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  .btn.volt:active{transform:scale(.97);}
  @media (prefers-reduced-motion:reduce){.btn.volt{animation:none}}
  .btn.ghost{background:transparent; border:none; box-shadow:none; color:var(--t2); min-height:44px; font-weight:600;}
  .btn.oauth-btn{display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; color:#1a1a1a; border:none; font-weight:600; min-height:50px; box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .btn.oauth-btn:hover{background:#f4f6fa;}
  .lp-or{display:flex; align-items:center; gap:12px; margin:16px 0 4px; color:var(--t2); font-size:12px; letter-spacing:.04em;}
  .lp-or::before,.lp-or::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent);}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .opt{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px;
    background:var(--surface); border:1px solid var(--hairline); border-radius:16px;
    color:var(--t1); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    min-height:44px; transition:all .25s var(--spring);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .opt:active{transform:scale(.985);}
  .opt.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .opt .sub{display:block; font-size:12px; color:inherit; opacity:.65; font-weight:400; margin-top:2px;}
  .grid5{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .cell{
    padding:13px 2px; text-align:center; background:var(--surface); border:1px solid var(--hairline);
    border-radius:14px; color:var(--t1); font-size:17px; font-weight:600; cursor:pointer;
    font-family:var(--font-mono); min-height:44px; transition:all .25s var(--spring);
  }
  .cell.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .cell.dash{border-style:dashed;}
  .progress{height:6px; flex:1; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden;}
  .progress>div{height:100%; background:linear-gradient(90deg,#9DB4F0,#4A6FD8); border-radius:999px; box-shadow:0 0 8px rgba(74,111,216,.45); transition:width .7s cubic-bezier(.25,.8,.25,1);}
  /* Wiederverwendbare Gradient-Füllung mit Glow + Sheen + Wachstums-Animation (Oura-Look) */
  .gradfill{position:relative; box-shadow:0 0 10px rgba(120,140,235,.45); animation:barGrowX 1s cubic-bezier(.25,.8,.25,1);}
  .gradfill::after{content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.24)); mix-blend-mode:overlay;}
  /* ===== Premium-Füll-Leiste (Oura/Apple-clean): glatter Gradient, runde Enden, weicher Glow ===== */
  .fxtrack{position:relative; border-radius:999px; overflow:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.22));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05);}
  .fxfill{position:relative; height:100%; border-radius:999px; overflow:hidden;
    box-shadow:0 0 8px rgba(120,140,235,.28), inset 0 1px 0 rgba(255,255,255,.28);
    transition:width .9s cubic-bezier(.25,.8,.25,1); animation:barGrowX 1s cubic-bezier(.25,.8,.25,1);}
  .fxfill::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);}
  @media (prefers-reduced-motion:reduce){.gradfill,.fxfill{animation:none}}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back{background:none; border:none; color:var(--t2); font-size:22px; cursor:pointer; min-width:44px; min-height:44px;}
  input[type=range]{width:100%; height:44px; accent-color:var(--accent);}
  input[type=date],input[type=number],input[type=text],input[type=email],input[type=password]{
    width:100%; min-height:48px; padding:0 14px; background:var(--surface); color:var(--t1);
    border:1px solid var(--border); border-radius:14px; font-size:16px; font-family:inherit;
  }
  input.err{border-color:var(--danger);}
  input.ok{border-color:var(--accent);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--t2); margin-bottom:5px;}
  .fielderr{font-size:12px; color:var(--danger); margin-top:4px; min-height:14px;}
  .dial{text-align:center; font-size:46px; font-weight:800; letter-spacing:-0.03em; margin-bottom:8px; font-family:var(--font-hero);}
  .dial small{font-size:15px; color:var(--t2); font-weight:500; letter-spacing:0;}
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid;}
  .badge.info{color:var(--info); border-color:rgba(125,140,163,.35); background:rgba(125,140,163,.1);}
  .badge.volt{color:#fff; border-color:var(--accent); background:var(--accent);}
  .badge.danger{color:var(--danger); border-color:rgba(212,87,75,.3); background:rgba(212,87,75,.08);}
  .badge.warn{color:var(--warn); border-color:rgba(201,138,61,.35); background:rgba(201,138,61,.1);}
  .badge.mute{color:var(--t2); border-color:var(--border); background:var(--s2);}
  .warncard{border:1px solid rgba(201,138,61,.3); background:rgba(224,162,74,.09); border-radius:16px; padding:14px; margin-bottom:10px; font-size:13px; line-height:1.55;}
  .warncard b{color:var(--warn);}

  /* ===== App Bar: helles Glass, fixed ===== */
  .appbar{
    position:fixed; top:0; left:0; right:0; z-index:45;
    background:rgba(11,11,15,.72);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--hairline);
  }
  .appbar-inner{max-width:430px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 14px; min-height:54px;}
  .logo-btn{display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:8px 4px; color:var(--t1); min-height:44px;}
  .logo-text{font-family:var(--font-display); font-size:14.5px; font-weight:700; letter-spacing:.16em; color:var(--t1); text-transform:uppercase;}
  .logo-text .gy{color:var(--hl); font-weight:600;}
  .icon-btn{width:40px; height:40px; min-width:40px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--hairline); border-radius:50%; cursor:pointer; color:var(--t1);
    box-shadow:0 1px 3px rgba(0,0,0,.05); transition:all .25s var(--spring);}
  .icon-btn:active{transform:scale(.94);}
  .menu-backdrop{position:fixed; inset:0; z-index:44; background:rgba(26,26,26,.18);}
  .menu-sheet{position:fixed; top:54px; left:12px; right:12px; z-index:46; max-width:406px; margin:0 auto;
    border-radius:22px; padding:10px;
    background:linear-gradient(rgba(18,17,22,.5),rgba(18,17,22,.5)), var(--glass-bg-strong);
    -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);
    border:1px solid var(--surface);
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.08);}
  .menu-head{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:12px 14px; margin-bottom:4px; background:var(--s1); border:1px solid var(--hairline); border-radius:16px; cursor:pointer; font-family:inherit; color:var(--t1); min-height:64px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .menu-head .avatar{width:46px;height:46px;font-size:18px;}
  .menu-head .mh-name{font-weight:700; font-size:15px;}
  .menu-item{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 12px; background:none; border:none; color:var(--t1); font-size:14.5px; font-weight:600; font-family:inherit; border-radius:14px; cursor:pointer; min-height:52px; transition:background .2s;}
  .menu-item:hover{background:var(--s2);}
  .menu-item:active{background:var(--s3);}
  .menu-item .mi-ic{width:38px;height:38px;min-width:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--t1);}
  .menu-item .mi-sub{display:block;font-size:11.5px;color:var(--t2);font-weight:400;margin-top:1px;}
  .menu-item .mi-chev{margin-left:auto;color:var(--t3);display:inline-flex;}
  .menu-divider{height:1px; background:var(--hairline); margin:6px 4px;}

  /* ===== Bottom Nav: 5 Tabs, Floating Glass Pill, Analytics zentriert ===== */
  /* KRITISCH: #tabbar ist direktes Body-Kind, keine transform-Eltern → fixed bleibt stabil. */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:48; pointer-events:none;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));
    transform:none !important;
  }
  /* Liquid-Glass v2: mehrschichtiges Glas — Verlauf + Blur + Specular-Highlight,
     aktiver Tab bekommt eine eigene Glas-Pille. */
  .tabbar-inner{
    pointer-events:auto; max-width:406px; margin:0 auto; position:relative;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:linear-gradient(135deg, rgba(40,38,48,.72), rgba(22,21,27,.5));
    -webkit-backdrop-filter:blur(32px) saturate(200%); backdrop-filter:blur(32px) saturate(200%);
    border:1px solid var(--surface);
    border-radius:999px; padding:6px 8px;
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 14px 38px rgba(0,0,0,.14),
      inset 0 1px 0 rgba(255,255,255,.10), inset 0 -10px 18px rgba(0,0,0,.2);
  }
  .tabbar-inner::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.10), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, rgba(255,255,255,.06));
    opacity:.7;
  }
  .tab{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 5px;
    background:none; border:none; color:var(--t3); font-size:9.5px; font-weight:700; cursor:pointer; font-family:inherit; min-height:48px;
    transition:color .25s var(--spring);
  }
  .tab .ic{
    display:flex; align-items:center; justify-content:center;
    width:46px; height:27px; border-radius:999px;
    transition:all .3s var(--spring);
  }
  .tab.active{color:var(--t1);}
  .tab.active .ic{
    transform:translateY(-1px);
    background:linear-gradient(135deg, rgba(157,180,240,.30), rgba(157,180,240,.12));
    border:1px solid rgba(157,180,240,.5);
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
    animation:tabPop .42s var(--spring);
  }
  @keyframes tabPop{0%{transform:translateY(-1px) scale(.78)}58%{transform:translateY(-1px) scale(1.16)}100%{transform:translateY(-1px) scale(1)}}
  .tab:active .ic{transform:scale(.92);}
  .tab.flag .ic{
    width:46px; height:46px; margin-top:-22px; border-radius:50%;
    background:var(--accent); color:#fff; border:3px solid var(--bg);
    box-shadow:0 6px 16px rgba(26,26,26,.25);
  }
  .tab.flag{color:var(--t3);}
  .tab.flag.active{color:var(--t1);}
  .tab.flag.active .ic{transform:translateY(-3px) scale(1.05); box-shadow:0 8px 20px rgba(26,26,26,.3);}

  .fab{
    position:fixed; bottom:104px; right:16px; z-index:47;
    width:54px; height:54px; border-radius:50%; border:1px solid var(--stroke); cursor:pointer;
    background:rgba(24,24,24,.92); color:#fff;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 8px 22px rgba(26,26,26,.28); display:flex; align-items:center; justify-content:center;
    transition:transform .25s var(--spring);
  }
  .fab:active{transform:scale(.93);}
  /* Wenn ein Sheet/Modal offen ist: Bottom-Nav + Coach-FAB ausblenden, damit nichts überlappt. */
  body.overlay-open .tabbar, body.overlay-open .fab{opacity:0; pointer-events:none; visibility:hidden;}
  .coach-panel{position:fixed; bottom:104px; right:12px; left:12px; max-width:406px; margin:0 auto; z-index:50;}

  .stepper button{width:44px; height:44px; border-radius:999px; background:var(--surface); color:var(--t1);
    border:1px solid var(--hairline); font-size:20px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .stepper .val{min-width:86px; text-align:center; font-size:18px;}

  .btn.cta-big .cta-sub{font-size:11.5px; font-weight:500; opacity:.72; letter-spacing:.01em;}
  .stepper input.stepin::-webkit-outer-spin-button,.stepper input.stepin::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{min-width:44px; height:44px; border-radius:999px; background:var(--surface); border:1px solid var(--hairline);
    color:var(--t2); font-family:var(--font-mono); font-size:14px; cursor:pointer; padding:0 8px; transition:all .25s var(--spring);}
  .scale button.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; text-align:center; gap:18px;}
  .huge{font-size:54px; font-weight:800; letter-spacing:-0.03em; color:var(--t1); font-family:var(--font-hero);}
  .spin{width:40px; height:40px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .pulse{animation:pulse .6s ease-out infinite;}

  /* Gestaffeltes Einblenden der Karten */
  .wrap>.card:nth-child(1),.section:nth-child(1) .card{animation:fade .4s var(--spring) backwards;}
  .wrap>.card:nth-child(2),.section:nth-child(2) .card{animation:fade .4s var(--spring) .05s backwards;}

  .volt-txt{color:var(--hl);} .danger-txt{color:var(--danger);} .warn-txt{color:var(--warn);} .t2{color:var(--t2);}
  .sm{font-size:13px;} .xs{font-size:11px;}
  .mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px;}

/* ===== Partikel-Marke: Sphäre aus beige/braunen Punkten =====
   spherePoints projiziert eine Fibonacci-Sphäre bei fixer Rotation in 2D —
   Basis für das statische Logo (SVG) UND den interaktiven Hero-Ball (Canvas). */
const PART_COLORS=["#C9D6EE","#AEC0E8","#90A8E4","#7E8BE8","#A9B8DA","#E2E8F4"];
function spherePoints(n,ry,rx){
  ry=ry==null?0.5:ry; rx=rx==null?-0.35:rx;
  const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx), out=[];
  for(let i=0;i<n;i++){
    const y=1-(i/(n-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), ph=i*2.399963;
    let x=Math.cos(ph)*r, z=Math.sin(ph)*r;

    out.push({x:x1*persp, y:y2*persp, z:z2, persp});
  }
  return out.sort((a,b)=>a.z-b.z);

function logoSVG(h){
  h=h||24; const id="lg"+Math.random().toString(36).slice(2,6); const c=h/2, r=h*0.44;

let PB={raf:null,onMove:null,onResize:null,

  PB.onMove=(e)=>{const r=canvas.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){ptr.on=false;return;}
    ptr.x=e.clientX-r.left-W/2; ptr.y=e.clientY-r.top-H/2; ptr.on=true; vry=0.02;};
  if(interactive)window.addEventListener("pointermove",PB.onMove,{passive:true});
  function frame(){
    ry+=spin+vry; vry*=0.94;
    const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
    ctx.clearRect(0,0,W,H);
    const proj=base.map(p=>{let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y;
      let y2=y*cx-z*sx,z2=y*sx+z*cx;const persp=1/(1.85-z2*0.55);
      return {sx:x*R*persp,sy:y2*R*persp,z:z2,persp,c:p.c};});

/* =====================================================================
   SUPABASE — Cloud-Sync pro Konto (Auth + ein jsonb-Datensatz je Nutzer).
   LOCAL-FIRST: ohne config.js-Keys läuft die App unverändert lokal weiter.
   Aktivierung: window.METRICGYM_CONFIG.supabaseUrl + .supabaseAnonKey setzen.
   Tabelle (einmalig im Supabase-SQL-Editor anlegen):
     create table user_state (user_id uuid primary key references auth.users(id),
       data jsonb not null default '{}', updated_at timestamptz default now());
     alter table user_state enable row level security;
     create policy "own" on user_state for all
       using (auth.uid()=user_id) with check (auth.uid()=user_id);
   ===================================================================== */
const SB={
  client:null, ready:false, user:null, token:null, pushTimer:null,
  cfg(){ try{ const c=window.METRICGYM_CONFIG||{}; return (c.supabaseUrl&&c.supabaseAnonKey)?{url:c.supabaseUrl,key:c.supabaseAnonKey}:null; }catch{ return null; } },
  enabled(){ return !!SB.cfg(); },
  _load(){ return new Promise((res,rej)=>{
    if(window.supabase&&window.supabase.createClient) return res();
    const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
                "https://unpkg.com/@supabase/supabase-js@2",
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"];
    let i=0;
    const tryNext=()=>{ if(i>=urls.length) return rej(new Error("Supabase-Bibliothek konnte nicht geladen werden"));
      const s=document.createElement("script"); s.src=urls[i++]; s.async=true;
      s.onload=()=>{ (window.supabase&&window.supabase.createClient)?res():tryNext(); };
      s.onerror=()=>tryNext();
      document.head.appendChild(s);
    };
    tryNext();
  });},
  async init(){
    if(SB.ready) return true; const c=SB.cfg(); if(!c) return false;
    await SB._load();
    SB.client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
    SB.ready=true; return true;
  },
  async signUp(email,password,firstName){
    await SB.init();
    // Bestätigungslink soll zurück zur echten App-URL führen (nicht auf Supabase-Default localhost).
    const opts={data:{first_name:firstName}};
    if(location.protocol==="http:"||location.protocol==="https:") opts.emailRedirectTo=location.origin;
    const {data,error}=await SB.client.auth.signUp({email,password,options:opts});
    if(error) throw error; SB.user=data.user||null; return data; // session evtl. null (E-Mail-Bestätigung nötig)
  },
  async signIn(email,password){
    await SB.init();
    const {data,error}=await SB.client.auth.signInWithPassword({email,password});
    if(error) throw error; SB.user=data.user; SB.token=data.session&&data.session.access_token; return data;
  },
  async signOut(){ try{ if(SB.client)await SB.client.auth.signOut(); }catch(e){} SB.user=null; SB.token=null; },
  async signInOAuth(provider){
    await SB.init();
    const redirectTo=(location.protocol==="http:"||location.protocol==="https:")?location.origin:undefined;
    const {error}=await SB.client.auth.signInWithOAuth({provider, options:redirectTo?{redirectTo}:{}});
    if(error) throw error; // leitet zum Anbieter weiter; Rückkehr -> Session-Restore beim Boot
  },
  async pull(){
    if(!SB.client||!SB.user) return null;
    const {data,error}=await SB.client.from("user_state").select("data").eq("user_id",SB.user.id).maybeSingle();
    if(error) throw error; return data?data.data:null;
  },
  push(){ if(!SB.client||!SB.user) return; clearTimeout(SB.pushTimer);
    SB.pushTimer=setTimeout(async()=>{ try{
      await SB.client.from("user_state").upsert({user_id:SB.user.id,data:S,updated_at:new Date().toISOString()});
    }catch(e){} },1400);
  },
  // Cloud-Daten in den laufenden State übernehmen (überlagert, behält neue Default-Felder)
  hydrate(data){ if(!data||typeof data!=="object") return; for(const k in data) S[k]=data[k]; },
  // Legales Empfehlungsprogramm: Einladung serverseitig festhalten (einstufig, 1 Zeile/Geworbenem).
  async recordReferralIfNeeded(){
    if(!SB.client||!SB.user||!S.invitedBy||S.referralInserted) return;
    try{ await SB.client.from("referrals").insert({referee_id:SB.user.id, referrer_code:S.invitedBy}); }catch(e){}
    S.referralInserted=true; save();
  },
  // Bestätigte DIREKTE Werbungen zählen (RPC liefert nur eine Zahl, keine Nutzerdaten).
  async countReferrals(code){
    if(!SB.client) return null;
    try{ const {data,error}=await SB.client.rpc("count_referrals",{code}); if(error) throw error;
      return typeof data==="number"?data:(Array.isArray(data)&&data[0]?(data[0].count||0):0); }catch(e){ return null; }
  },
};

// Bild herunterskalieren (max 900px, JPEG) → kleine dataURL für Vergleichsansicht
function downscaleImage(file,max,cb){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{let{width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));};
    img.onerror=()=>cb(null); img.src=fr.result;};
  fr.onerror=()=>cb(null); fr.readAsDataURL(file);
}

// ---------- Engine ----------
function mifflin(sex,age,h,w){ return Math.round(10*w+6.25*h-5*age+(sex==="male"?5:-161)); }
function katch(w,bf){ return Math.round(370+21.6*w*(1-bf/100)); }
// Adjustiertes Körpergewicht: bei Übergewicht/Adipositas geht NICHT das volle Gewicht
// in den Grundumsatz ein (Fettmasse verbraucht kaum Energie). Sonst überschätzt die
// Formel den Bedarf massiv und das "Defizit" ist gar keins → kein Fettabbau.
// Klinischer Standard: ABW = Idealgewicht + 0,25 × (Ist − Ideal).
function effWeight(a){
  const bmi=a.weight/((a.height/100)**2);
  if(a.bodyFat!=null || bmi<=25) return a.weight;
  const ibw=24*(a.height/100)**2;
  return Math.round((ibw+0.25*(a.weight-ibw))*10)/10;
}
function bmrCalc(a){
  // Mit bekanntem Körperfett: Katch-McArdle (über fettfreie Masse — am genauesten).
  // Sonst: Mifflin mit adjustiertem Gewicht (korrekt über das ganze Gewichtsspektrum).
  if(a.bodyFat!=null) return katch(a.weight,a.bodyFat);
  return mifflin(a.sex,a.age,a.height,effWeight(a));
}
const NEAT={sedentary:1.2,light:1.3,moderate:1.4,active:1.475,very_active:1.55};
function tdeeCalc(bmr,act,w,len,days){
  const rest=Math.round(bmr*NEAT[act]);
  // Realistischer NETTO-Mehrverbrauch einer Krafteinheit (~3,5 kcal/kg/h über dem Alltag),
  // auf der metabolisch aktiven Masse (effWeight) — bewusst konservativ.
  const train=rest+Math.round(3.5*w*(len/60));
  return {rest,train,avg:Math.round((train*days+rest*(7-days))/7)};
}
const GOAL_D={muscle_gain:[.1,.1],fat_loss:[-.2,-.2],recomp:[.1,-.1],strength:[.05,.05],general:[0,0],endurance:[0,0],mobility:[0,0]};
const GOAL_LABEL={muscle_gain:"Muskelaufbau",fat_loss:"Fettabbau",recomp:"Recomp",strength:"Maximalkraft",general:"Fitness",endurance:"Ausdauer",mobility:"Mobility"};
function multiTargets(a,bmr,td){
  const goals=(a.goals&&a.goals.length?a.goals:[a.goal||"muscle_gain"]);
  const hasFat=goals.includes("fat_loss"), hasGain=goals.includes("muscle_gain");
  const bmi=a.weight/((a.height/100)**2);
  const conflicts=[], recs=[];
  // Eine einzige kalorische Richtung — BMI-bewusst: ein Aufbau-Überschuss bei hohem
  // Körperfett setzt v. a. Fett an, daher überschreibt ein hoher BMI das Surplus.
  let dir, dirLabel;
  if(hasFat&&hasGain){ dir=-0.08; dirLabel="Recomp · leichtes Defizit";
    conflicts.push({type:"recomp",msg:"Muskelaufbau + Fettabbau = Recomp: leichtes Defizit (−8 %) bei hohem Protein.",bio:"Viel Protein schützt deine Muskeln im Defizit (Helms et al., 2014)."}); }
  else if(hasFat){ dir=bmi>=30?-0.22:-0.20; dirLabel="Defizit "+(bmi>=30?"−22 %":"−20 %"); }
  else if(hasGain){
    if(bmi>=30){ dir=-0.12; dirLabel="Fettabbau-Phase (empfohlen)";
      recs.push("Bei deinem aktuellen Körpergewicht würde ein Aufbau-Überschuss vor allem Fett ansetzen. Sinnvoller ist jetzt ein leichtes Defizit: Mit viel Protein hältst du deine Muskeln und schaffst die Basis für sauberen Aufbau."); }
    else if(bmi>=27){ dir=0; dirLabel="Erhaltung · Lean-Gain-Start";
      recs.push("Statt direktem Überschuss startest du am Erhaltungsbedarf — so baust du Muskeln auf, ohne unnötig Fett anzusetzen."); }
    else { dir=0.10; dirLabel="Aufbau-Überschuss +10 %"; }
  }
  else if(goals.includes("strength")){ dir=0.03; dirLabel="leichter Überschuss"; }
  else { dir=0; dirLabel="Erhaltung"; }
  if(goals.includes("strength")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Kraft + Ausdauer: Interferenzeffekt. Kraft vor Ausdauer, mind. 6 h Abstand.",bio:"Concurrent Training dämpft mTOR-Signalwege (Wilson et al., 2012)."});
  }
  // Gesundheits-/Cardio-Empfehlung jenseits der angeklickten Ziele
  if(bmi>=30 && !hasFat){ recs.push("Bei deinem BMI senkt regelmäßiges Cardio (2–3×/Woche, lockeres Tempo) Gesundheitsrisiken und beschleunigt den Fettabbau — gelenkschonend per Rad, Crosstrainer oder zügigem Gehen."); }
  else if(bmi>=27 && hasFat){ recs.push("2–3 lockere Cardio-Einheiten pro Woche zusätzlich zum Krafttraining beschleunigen deinen Fettabbau spürbar, ohne die Erholung zu stören."); }
  const days=Math.min(7,Math.max(1,a.days||4));
  const adj=(typeof S!=="undefined"&&S.calAdjust)||0;  // Lern-Korrektur (adaptiver Abgleich)
  const avgT=Math.round(td.avg*(1+dir))+adj;           // Ziel = Wochenschnitt (+ Korrektur)
  const trainBurn=Math.max(0, td.train-td.rest);       // echter Extra-Verbrauch je Einheit
  const floor=a.sex==="female"?1400:1600, warn=[];
  // Eat-back-Cycling: am Trainingstag isst du den Trainingsverbrauch (anteilig) zurück,
  // am Ruhetag die Basis. Wochenschnitt bleibt das Ziel. Trainierst du NICHT (oder lässt
  // das Cardio aus), orientierst du dich am Ruhetag-Ziel.
  let trainK, restK;
  if(days>=7){ trainK=avgT; restK=avgT; }
  else { trainK=Math.round(avgT+trainBurn*(7-days)/7); restK=Math.round(avgT-trainBurn*days/7); }
  const clamp=(v)=>{ if(v<floor){warn.push("floor");return floor;} return Math.round(v); };
  trainK=clamp(trainK); restK=clamp(restK);
  let prot;
  if(a.bodyFat!=null) prot=Math.round(2.2*a.weight*(1-a.bodyFat/100));
  else prot=Math.round(1.8*Math.min(a.weight,25*(a.height/100)**2));
  const fat=Math.round(.9*a.weight);
  const mac=(k)=>({kcal:k,p:prot,f:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4))});
  return {train:mac(trainK),rest:mac(restK),warn:[...new Set(warn)],conflicts,recs,goals,dir,dirLabel,bmi:Math.round(bmi*10)/10};
}
// ---------- Adaptiver Kalorien-Abgleich (Memory): lernt aus der echten Gewichtskurve ----------
// Vergleicht die gemessene Gewichtsänderung (Regressionsgerade über >=14 Tage) mit der
// Ziel-Rate und justiert das Kalorienziel gedämpft nach — so wird es mit der Zeit
// individuell exakt, statt nur auf einer Formel zu beruhen.
function adaptiveCalorieCheck(){
  try{
    if(!S.profile) return;
    const wl=(S.weightLog||[]).filter(x=>x&&x.t&&x.v).sort((a,b)=>a.t-b.t);
    if(wl.length<4) return;
    const spanDays=(wl[wl.length-1].t-wl[0].t)/dayMs;
    if(spanDays<14) return;
    if(Date.now()-(S.calAdjustAt||0) < 7*dayMs) return; // höchstens 1×/Woche
    const n=wl.length; let sx=0,sy=0,sxx=0,sxy=0;
    wl.forEach(p=>{const x=(p.t-wl[0].t)/dayMs; sx+=x;sy+=p.v;sxx+=x*x;sxy+=x*p.v;});
    const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);           // kg/Tag
    if(!isFinite(slope)) return;
    const observedKgWk=slope*7;
    const w=S.profile.a.weight||80, dir=S.profile.tg.dir;
    // Ziel-Rate aus Richtung & Körpergewicht (sichere, wirksame Korridore)
    let targetKgWk = dir<=-0.18? -0.007*w : dir<0? -0.004*w : dir>0.05? 0.0025*w : dir>0? 0.0015*w : 0;
    const errKgWk=observedKgWk-targetKgWk;             // >0: zu langsam ab / zu schnell zu
    S.calAdjustAt=Date.now();
    if(Math.abs(errKgWk)<0.12){ save(); return; }       // im Toleranzband — nichts tun
    let step=Math.round(-errKgWk*1100*0.6/10)*10;       // 0,1 kg/Wo ≈ 110 kcal/Tag, gedämpft
    step=Math.max(-150,Math.min(150,step));
    const before=S.calAdjust||0, after=Math.max(-700,Math.min(700,before+step));
    if(after!==before){
      S.calAdjust=after;
      const verb=after<before?"gesenkt":"erhöht";
      S.calAdjustMsg=`Dein Gewicht ändert sich aktuell ${observedKgWk>=0?"+":""}${observedKgWk.toFixed(2)} kg/Woche (Ziel ${targetKgWk>=0?"+":""}${targetKgWk.toFixed(2)}). Ich habe dein Kalorienziel um ${Math.abs(step)} kcal ${verb} — abgestimmt auf deinen echten Stoffwechsel.`;
      S.profile.tg=multiTargets(S.profile.a,S.profile.bmr,S.profile.td);
    }
    save();
  }catch(e){}
}
function e1rm(w,reps,rpe){
  if(reps===1) return w;
  const eff=reps+(10-(rpe??8));
  return Math.round(w*(1+eff/30)*10)/10;
}
function statusScore(sleep,energy,stress,sore){
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const comps=[[.3,c01((sleep-1)/4)],[.25,c01((energy-1)/4)],[.2,c01(1-(stress-1)/4)],[.25,c01(1-(sore-1)/4)]];
  const score=Math.round(comps.reduce((s,c)=>s+c[0]*c[1],0)*100);
  const tier=score>=80?"Stark":score>=60?"Gut":score>=40?"Mäßig":"Erholung";
  return {score,tier};
}
function forecast12w(series){
  if(series.length<3) return null;
  const n=series.length;
  let st=0,sy=0,stt=0,sty=0;
  series.forEach((p)=>{st+=p.t;sy+=p.v;stt+=p.t*p.t;sty+=p.t*p.v;});
  const den=n*stt-st*st, slope=den===0?0:(n*sty-st*sy)/den, last=series[n-1];
  let vv=last.v, ss=slope; const pts=[];
  for(let b=0;b<3;b++){ vv+=ss*28; ss*=.85; pts.push({wk:(b+1)*4, v:Math.round(Math.min(vv,last.v*1.15)*10)/10}); }
  return pts;
}

function weeklyMuscleSets(weeksBack){
  const from=Date.now()-(weeksBack+1)*7*dayMs, to=Date.now()-weeksBack*7*dayMs;
  const out={};
  for(const [name,sets] of Object.entries(S.liftLog)){

// ---------- Diet-Adherence-Score (±10 % kcal, ≥90 % Protein) — min 3 Tage ----------
function dietAdherence(nDays){
  if(!S.profile)return null;
  const tg=S.profile.tg.train;
  const days=Object.entries(S.nutritionLog)
    .filter(([d,l])=>(l.meals||[]).length>0&&Date.now()-new Date(d).getTime()<nDays*dayMs);
  if(days.length<3)return null;
  let hit=0;
  for(const [,l] of days){
    const s=l.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p}),{k:0,p:0});
    if(Math.abs(s.k-tg.kcal)/tg.kcal<=0.1&&s.p>=tg.p*0.9)hit++;
  }
  return {pct:Math.round(hit/days.length*100),n:days.length,conf:Math.min(90,40+days.length*7)};
}
// ---------- Adaptation Velocity (%/Monat e1RM vs. Trainingsalter) — min 5 Punkte ----------
function adaptationVelocity(name){
  const s=e1Series(name); if(s.length<5)return null;
  const span=(s[s.length-1].t-s[0].t)/dayMs; if(span<14)return null;
  const pctPerMonth=Math.round(((s[s.length-1].v-s[0].v)/s[0].v)/(span/30)*1000)/10;
  const exp=S.profile?S.profile.a.exp:"intermediate";
  const fast={beginner:6,novice:4,intermediate:2.5,advanced:1.5}[exp]||2.5;
  const cls=pctPerMonth>=fast?"schnell":pctPerMonth>=fast*0.4?"normal":pctPerMonth>0.3?"langsam":"stagnierend";
  return {pctPerMonth,cls,conf:Math.min(85,40+s.length*4)};
}

// ---------- Status-Voice-Parser (Keyword-Heuristik, Fallback: Tap-Karten) ----------
function parseStatus(txt){
  const t=txt.toLowerCase(); const r={};
  if(/sehr gut geschlafen|top geschlafen|ausgeschlafen/.test(t))r.sleep=5;
  else if(/gut geschlafen/.test(t))r.sleep=4;
  else if(/mittel.*geschlafen|ok geschlafen/.test(t))r.sleep=3;
  else if(/schlecht geschlafen|wenig geschlafen|kaum geschlafen/.test(t))r.sleep=2;
  else if(/sehr schlecht geschlafen|durchgemacht/.test(t))r.sleep=1;
  if(/voller energie|sehr fit|energiegeladen/.test(t))r.energy=5;
  else if(/\bfit\b|gut erholt|erholt/.test(t))r.energy=4;
  else if(/mittelmäßig|geht so/.test(t))r.energy=3;
  else if(/müde|schlapp|erschöpft/.test(t))r.energy=2;
  if(/sehr gestresst|extrem.*stress/.test(t))r.stress=5;
  else if(/viel stress|gestresst|stress hoch/.test(t))r.stress=4;
  else if(/normaler stress|etwas stress/.test(t))r.stress=3;
  else if(/wenig stress/.test(t))r.stress=2;
  else if(/kein stress|entspannt|ruhig/.test(t))r.stress=1;
  if(/starker kater|alles tut weh|sehr starker kater/.test(t))r.sore=4;
  else if(/mittlerer kater/.test(t))r.sore=3;
  else if(/leichter kater|etwas kater|bisschen kater/.test(t))r.sore=2;
  else if(/kein kater|keine schmerzen/.test(t))r.sore=1;
  return r;
}

// ---------- Auth ----------
async function hashPw(pw){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }catch{
    let h1=0x811c9dc5,h2=0x1000193;
    for(const c of pw){h1=Math.imul(h1^c.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+c.charCodeAt(0),2654435761)>>>0;}
    return "fnv-"+h1.toString(36)+h2.toString(36);
  }
}
function pwStrength(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10; if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const entropy=pw.length*Math.log2(pool||1);
  if(entropy<40)return{lbl:"schwach",pct:33,col:"var(--danger)"};
  if(entropy<60)return{lbl:"mittel",pct:66,col:"var(--warn)"};
  return{lbl:"stark",pct:100,col:"var(--volt)"};
}

      ${fc?`<div class="pw-future">
        <p class="xs" style="color:var(--hl);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Dein Weg — schon berechnet</p>
        <div class="row" style="align-items:flex-end">

          <p class="xs t2" style="text-align:right;max-width:140px;line-height:1.4">${fc.sub}</p>
        </div>
        <p class="xs t2" style="margin-top:10px;line-height:1.5">Die Engine kennt dein Ziel. ${TIER_LABEL[tier]} schaltet den vollständigen, mitlernenden Pfad dorthin frei — du verlierst sonst genau diese Präzision.</p>
      </div>`:""}

        <div><p class="metric" style="font-size:22px">${tierPriceLabel(tier,b)}</p>
          <p class="xs volt-txt">${perDayLabel(tier,b)}${b==="yearly"?` · ${freeMonths(tier)} Monate geschenkt`:""}</p></div>

      <button class="btn ghost" style="min-height:40px" onclick="overlay.innerHTML='';S.tab='pricing';save();render();">Alle Pläne vergleichen</button>

// Granulare Fokus-Muskeln -> übergeordnete Sessiongruppe (für die Tag-Zuordnung)

const SETS_BY_EXP={

  novice:{c:3,a:3,i:2,count:5},
  intermediate:{c:4,a:3,i:3,count:6},
  advanced:{c:4,a:4,i:3,count:6},

/* Progressives Volumen je Trainingsblock-Woche: Mehrgelenksübungen tragen den
   Aufbau (mehr Last-Toleranz), Isolation steigt gedämpft; Woche 4 deloadet. */
function weekSets(name,baseSets){
  const w=S.currentWeek||1;
  if(w===4) return Math.max(1,Math.round(baseSets*0.55));
  const add=(w===2?1:w===3?2:0);
  const isComp=(EXDB[name]||{}).compound;

// ---------- Individualisierung: Körperbau, Volumen, Reps/RIR, Übungsauswahl ----------
function bmiOf(a){ const h=((a&&a.height)||180)/100; return (a&&a.weight)?a.weight/(h*h):24; }

// Einsteiger/hoher BMI/wenig Zeit -> schlanker (ab 3). So bekommt jeder das, was zu ihm passt.
function sessionCount(a){
  const exp=a.exp||"novice";
  let n={beginner:4,novice:5,intermediate:6,advanced:7}[exp]||5;
  const g=(a.goals||["muscle_gain"])[0];
  if(g==="strength")n-=1; else if(g==="muscle_gain"||g==="recomp")n+=1;
  const t=a.sessionTime||60;
  if(t<=35)n-=2; else if(t<=45)n-=1; else if(t>=80)n+=1;
  const bmi=bmiOf(a);
  if(bmi>=35)n-=2; else if(bmi>=30)n-=1;

// Ziel-/Zustands-abhängige Progressions-Parameter (Reps, Pausen, RIR).

// Fettabbau/dekonditioniert (hoher BMI): höhere Reps, moderate Intensität (RIR 2–3),
// gelenkschonend, kürzere Pausen (Dichte). Muskelaufbau: klassische Hypertrophie.
function progParams(a){

  if(g==="endurance") return {decon,cR:"12–15",sR:"12–20",iR:"15–25",lR:"15–25",cRest:75,sRest:60,iRest:45,rir:"2–3"};

// Gelenkfreundlichkeit/Skalierbarkeit (für hohen BMI / Dekonditionierung): Maschinen &

function friendlyScore(name){ const d=EXDB[name]||{}; let s=({machine:5,cable:4,dumbbell:3,band:3,barbell:2,bar:1,body:1})[d.eq]||2; if(LOWIMPACT_PENALTY.includes(name))s-=2; return s; }
function generateTrainingPlan(profile,variant){

  const PP=progParams(a);          // ziel-/zustands-abhängige Reps, Pausen, RIR
  const count=sessionCount(a);     // individuelle Übungszahl statt fixem Wert
  const fits=(n)=>{const d=EXDB[n]; return d&&allowed.includes(d.eq)&&(!d.bench||hasBench);};
  const mk=(n,sets,reps,rest,rir)=>{const d=EXDB[n]||{};return {n,sets,reps,rest,tempo:d.tempo||"2-0-1-0",rir:rir||d.rir||"1–2",m:d.m||"—",why:d.why||"",alt:d.alt||null,lengthened:!!d.lengthened};};

  // Variante B nimmt pro Slot — wo möglich — den ZWEITEN passenden Kandidaten.
  const buildMain=(key)=>{
    const chosen=[];
    for(const slot of SESSION_SLOTS[key]){
      if(chosen.length>=count)break;
      let fitting=slot.filter(x=>fits(x)&&!chosen.includes(x));
      if(PP.decon&&fitting.length>1) fitting=fitting.slice().sort((x,y)=>friendlyScore(y)-friendlyScore(x));

    let added=0;

    push:day("push",buildMain("push")),
    pull:day("pull",buildMain("pull")),
    legs:day("legs",buildMain("legs"),true),
    upper:day("upper",buildMain("upper")),
    lower:day("lower",buildMain("lower"),true),
    full:day("full",buildMain("full"),true),
    chestback:day("chestback",buildMain("chestback")),
    shoulderarms:day("shoulderarms",buildMain("shoulderarms")),
    chest:day("chest",buildMain("chest")),
    back:day("back",buildMain("back")),
    shoulders:day("shoulders",buildMain("shoulders")),
    arms:day("arms",buildMain("arms")),
    cardio:{...day("cardio",[mk("Zone-2 Cardio",1,"30–40 Min",0)]),est:35},
    rest:{key:"rest",...TYPE_META.rest,warmup:[],cooldown:[],main:[],abs:[],est:0},

/* ---------- Optimaler Wochenplan (v5/Phase 1): Vorschlag + Begründung ----------

/* Fortlaufende Rotation (nicht an Wochentage gekoppelt): eine Sequenz von

/* Muskelgruppen-Verteilung einer Session: Satz-Anteil je Muskelgruppe in % —
   berechnet aus dem echten Plan des Tages, nichts erfunden. */
function muscleSplit(key){
  const d=sessionDef(key);
  const setsOf=(e)=>weekSets(e.orig||e.n,e.sets);
  const tot=[...d.main,...(d.abs||[])].reduce((s,e)=>s+setsOf(e),0)||1;
  const map={};
  const addEx=(e,fallback)=>{
    const m=(EXDB[e.orig||e.n]||{}).m||MUSCLE_OF[e.n]||fallback;
    map[m]=(map[m]||0)+setsOf(e);
  };
  d.main.forEach(e=>addEx(e,"Ganzkörper"));
  (d.abs||[]).forEach(e=>addEx(e,"Core"));
  return Object.entries(map).map(([m,s])=>({m,pct:Math.round(s/tot*100)})).sort((x,y)=>y.pct-x.pct);
}

// ---------- Insight-/Risk-Engine (regelbasiert, mit Konfidenz) ----------
function buildInsights(){
  const out=[];
  const p=S.profile; if(!p)return out;
  const r7=S.readinessHistory.slice(-7);
  const th7=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<7*dayMs);
  const th14=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<14*dayMs);
  // Volumen-Trend
  if(S.trainingHistory.length>=6){
    const old=S.trainingHistory.slice(0,Math.floor(S.trainingHistory.length/2));
    const recent=S.trainingHistory.slice(Math.floor(S.trainingHistory.length/2));
    const avgO=old.reduce((s,t)=>s+t.volume,0)/old.length, avgR=recent.reduce((s,t)=>s+t.volume,0)/recent.length;
    const d=Math.round((avgR-avgO)/avgO*100);
    if(Math.abs(d)>=5) out.push({t:`Dein Trainingsvolumen hat sich um ${d>0?"+":""}${d} % verändert (Ø ${nfi.format(avgR)} kg/Session).`,conf:Math.min(95,55+S.trainingHistory.length*2)});
  }
  // Gewicht × Protein
  if(S.weightLog.length>=8&&Object.keys(S.nutritionLog).length>=5){
    const w=S.weightLog;
    const dW=Math.round((w[w.length-1].v-w[0].v)*10)/10;
    const protDays=Object.values(S.nutritionLog).filter(l=>(l.meals||[]).reduce((s,m)=>s+m.p,0)>=p.tg.train.p).length;
    const protPct=Math.round(protDays/Object.keys(S.nutritionLog).length*100);
    out.push({t:`Gewicht ${dW>0?"+":""}${nf.format(dW)} kg im Zeitraum — Protein-Adhärenz lag bei ${protPct} %.`,conf:Math.min(90,40+S.weightLog.length)});
  }
  // Stagnation × Recovery
  const bench=e1Series("Bankdrücken");
  if(bench.length>=5&&r7.length>=4){
    const tail=bench.slice(-4);
    const flat=Math.abs(tail[tail.length-1].v-tail[0].v)<tail[0].v*0.01;
    const avgR=Math.round(r7.reduce((s,x)=>s+x.score,0)/r7.length);
    if(flat&&avgR<65) out.push({t:`Bankdrücken stagniert — wahrscheinlichste Ursache: niedrige Erholungswerte (Ø Status ${avgR}/100).`,conf:70});
  }
  // Risk: Übertraining
  const rpes=th14.map(t=>t.avgRpe).filter(Boolean);
  if(rpes.length>=4){
    const avg=rpes.reduce((a,b)=>a+b,0)/rpes.length;
    if(avg>8.6) out.push({t:`Übertrainings-Risiko erhöht: deine Anstrengung lag im Schnitt bei ${nf.format(Math.round(avg*10)/10)}/10 über 14 Tage. Empfehlung: 1 Satz pro Übung streichen.`,conf:75,risk:true});
  }
  // Risk: Adhärenz
  const plannedPerWeek=schedule().filter(t=>t!=="rest").length||p.a.days;
  if(S.trainingHistory.length>=4){
    const adh=Math.min(100,Math.round(th7.length/Math.max(1,plannedPerWeek)*100));
    if(adh<70) out.push({t:`Dranbleiber-Check: nur ${adh} % deiner geplanten Trainings diese Woche. Kürzere Sessions schlagen ausgefallene.`,conf:80,risk:true});
  }
  // Volumen-Toleranz: 2 Wochen in Folge außerhalb MEV–MRV (min 4 Sessions Daten)
  if(S.trainingHistory.length>=4){
    const w0=weeklyMuscleSets(0), w1=weeklyMuscleSets(1);
    for(const [m,band] of Object.entries(VOL_BANDS)){
      const a0=w0[m]||0, a1=w1[m]||0;
      if(a0>band[1]&&a1>band[1]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen über deinem belastbaren Maximum (${a0} Sätze/Woche, optimal sind ${band[0]}–${band[1]}) — deine Erholung kommt nicht hinterher (Fachbegriff: MRV).`,conf:70,risk:true});
      else if(a0>0&&a1>0&&a0<band[0]&&a1<band[0]) out.push({t:`${LABELS.volume} ${m}: seit 2 Wochen zu niedrig für spürbares Wachstum (${a0} Sätze/Woche) — peile mindestens ${band[0]} Sätze an (Fachbegriff: MEV).`,conf:65});
    }
  }
  // Diet-Adherence-Score (min 3 Tage — sonst kein Output)
  const da=dietAdherence(14);
  if(da) out.push({t:`${LABELS.adherence}: ${da.pct} % der letzten ${da.n} Tage im Zielbereich (±10 % Kalorien, mindestens 90 % Protein).`,conf:da.conf});
  // Adaptation Velocity (stärkster Lift mit ≥5 Datenpunkten)
  for(const lift of ["Kniebeuge","Bankdrücken","Kreuzheben"]){
    const av=adaptationVelocity(lift);
    if(av){
      const expl={schnell:"über dem Erwartungswert deines Trainingsalters — deine Bedingungen stimmen",normal:"im Erwartungsbereich — die Progression läuft sauber",langsam:"unter Erwartung — prüfe Schlaf, Protein und Steigerungsschema",stagnierend:`Plateau — ${LABELS.deload} oder Übungswechsel angezeigt (Schoenfeld, 2017)`}[av.cls];
      out.push({t:`${LABELS.velocity} bei ${lift}: ${av.pctPerMonth>=0?"+":""}${nf.format(av.pctPerMonth)} % Maximalkraft pro Monat — „${av.cls}": ${expl}.`,conf:av.conf});
      break;
    }
  }
  return out.slice(0,8); // Anzeige-Limit pro Tier: Free 1 / Pro 5 / Elite 8
}

// ---------- Voice/NLP: Training ----------
function parseWorkout(input){
  const txt=input.trim().toLowerCase();
  let conf=0.3, name=null;
  const tokens=txt.replace(/[^a-zäöüß0-9\s,.]/g," ").split(/\s+/);
  for(const exName of ALL_EXERCISES){
    const words=exName.toLowerCase().split(/\s+/);
    if(words.some(w=>tokens.some(t=>t.length>=3&&(t.startsWith(w)||w.startsWith(t))))){ name=exName; conf+=0.3; break; }
  }
  // Rechtschreib-Regel auch hier: "bankdrücen 90kg 3x8" wird verstanden
  if(!name){
    let best=null;
    for(const exName of ALL_EXERCISES){
      const words=exName.toLowerCase().replace(/\(.*\)/,"").split(/\s+/).filter(w=>w.length>=4);
      for(const w of words)for(const t of tokens){
        if(t.length<4)continue;
        const d=fuzzyDist(t,w);
        if(d!=null&&(!best||d<best.d))best={n:exName,d};
      }
    }
    if(best){ name=best.n; conf+=0.2; }
  }
  const wMatch=txt.match(/(\d+[.,]?\d*)\s*(kg|kilo)/);
  const weight=wMatch?parseFloat(wMatch[1].replace(",",".")):null;
  if(weight!=null)conf+=0.15;
  let sets=null,reps=null;

    if(rMatch){reps=parseInt(rMatch[1]);conf+=0.1;}

}

/* Levenshtein-Distanz für Tippfehler-tolerante Erkennung. */
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;
  if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
/* GENERELLE RECHTSCHREIB-REGEL: beste Edit-Distanz von `needle` zu IRGENDEINER
   Teilzeichenkette von `hay` (Sellers-Algorithmus). "häncxen" findet so
   "hähnchen" mitten in "hähnchenbrust" — egal ob der Fehler vorn, mittig
   oder hinten sitzt, ob Buchstaben fehlen, vertauscht oder falsch sind. */
function levSub(needle,hay){
  const m=needle.length,n=hay.length;
  if(!m||!n)return Math.max(m,n);
  let prev=new Array(n+1).fill(0); // freier Start in hay
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(needle[i-1]===hay[j-1]?0:1));
    prev=cur;
  }
  return Math.min(...prev); // freies Ende
}
/* Kombinierte Wort-Ähnlichkeit: wörtlich + phonetisch, mit längenabhängiger
   Toleranz. Gibt die Distanz zurück oder null, wenn zu unähnlich. */
function fuzzyDist(t,w){
  if(t===w)return 0;
  // Echtes Teilwort — Überlappung muss ≥4 Zeichen sein: "quark"↔"magerquark", "nudeln"↔"vollkornnudeln".
  // (≥4 verhindert, dass ein kurzes Wort wie "rot" in "brot" "gefunden" wird.)
  if(Math.min(t.length,w.length)>=4&&(w.includes(t)||t.includes(w)))return 0;
  // Deutsche Plural-/Beugungsendung: "eier"→"ei", "tomaten"→"tomate", "äpfel" bleibt fuzzy.
  if(w.length>=2&&(t===w+"e"||t===w+"er"||t===w+"en"||t===w+"n"||t===w+"s"))return 0;
  // Längen-Schranke: ein kurzes Wort darf NICHT zufällig im Ende eines langen "gefunden" werden
  // (verhindert Fehltreffer wie "kuchen"→"maultaschen" oder "spritz"→"schweinefilet").
  if(Math.abs(t.length-w.length)>Math.max(1,Math.ceil(Math.min(t.length,w.length)/3)))return null;
  // Kurze Wörter (≤4) NUR exakt/phonetisch zulassen — 1 Tippfehler ist hier meist ein ANDERES
  // Lebensmittel ("eier"≠"bier", "reis"≠"eis"). Erst ab 5 Zeichen echte Tippfehler-Toleranz.
  const tol=Math.min(t.length,w.length)<=4?0:Math.floor(Math.min(t.length,w.length)/4);
  // Volle Levenshtein-Distanz (kein freies Ende mehr) + phonetischer Vergleich für Hörfehler.
  const d=Math.min(lev(t,w),phon(t)===phon(w)?0:lev(phon(t),phon(w))+0.5);
  return d<=tol?d:null;
}
/* Phonetische Normalisierung (deutsch): gleich klingende Schreibweisen werden
   identisch — "skier"→"skir" und "skyr"→"skir" treffen sich so trotz
   2 Buchstaben Unterschied. */
function phon(s){
  return s.toLowerCase()
    .replace(/ß/g,"ss").replace(/ie/g,"i").replace(/y/g,"i")
    .replace(/ph/g,"f").replace(/th/g,"t").replace(/ck/g,"k")
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u")
    .replace(/(.)\1+/g,"$1");
}
/* Liefert {f, dist}: dist 0 = exakter Treffer, >0 = Tippfehler-/Hörfehler-Korrektur. */
function matchFood(segment){
  const tokens=segment.toLowerCase().replace(/[^a-zäöüß0-9\s]/g," ").split(/\s+/)
    .filter(t=>t.length>=2&&!/^\d+$/.test(t)&&!["und","mit","ein","eine","einen","gramm","stück","etwas","noch","dann","heute","zu","im","am","an","so","da","ja"].includes(t));
  let best=null;
  for(const f of FOODS){
    const words=f[0].toLowerCase().replace(/\(.*\)/,"").trim().split(/\s+/).filter(w=>w.length>=2);
    for(const w of words)for(const t of tokens){
      const dist=fuzzyDist(t,w);
      if(dist==null)continue;
      const exact=(t===w);
      // Rangfolge bei Gleichstand: kleinere Distanz → exakter Worttreffer ("reis"→"Reis"
      // schlägt "Reis-Cake-Riegel") → kürzeres Trefferwort → kürzerer Name.
      if(!best||dist<best.dist
        ||(dist===best.dist&&exact&&!best.exact)
        ||(dist===best.dist&&exact===best.exact&&w.length<best.w.length)
        ||(dist===best.dist&&exact===best.exact&&w.length===best.w.length&&f[0].length<best.f[0].length))
        best={f,dist,w,exact};
    }
  }
  return best;
}
function parseNutrition(input){
  // Multi-Item: "500g hähnchen und 300g reis, 2 tomaten"
  const segments=input.trim().toLowerCase().split(/\s*(?:,|\bund\b|\+|danach)\s*/).filter(Boolean);
  const items=[];
  for(const seg of segments){
    const gramMatch=seg.match(/(\d+)\s*(g|gramm)\b/);
    const countMatch=seg.match(/(\d+)\s*(stück|stk|x)\b/)||seg.match(/^(\d+)\s+/);
    const wordCount={ein:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5}[seg.split(/\s+/)[0]];
    const hit=matchFood(seg);
    if(!hit){
      // Reine Mengenangabe ("…, 150 g") ohne Lebensmittelwort → der vorherigen erkannten
      // Position zuordnen, statt sie fälschlich als eigenen "nicht erkannt"-Eintrag abzuspalten.
      const restWord=seg.replace(/\b\d+\s*(g|gramm|gr|stück|stk|x)?\b/g," ").split(/\s+/).some(t=>t.length>=3);
      const last=items[items.length-1];
      if((gramMatch||countMatch)&&!restWord&&last&&last.food&&!last._qty){
        last.gram=gramMatch?parseInt(gramMatch[1]):last.food[1]*parseInt(countMatch[1]);
        last._qty=true; last.conf=Math.min(0.97,(last.conf||0.55)+0.2);
        continue;
      }
      items.push({raw:seg,food:null});continue;
    }
    const food=hit.f;
    const gram=gramMatch?parseInt(gramMatch[1]):null;
    const count=countMatch?parseInt(countMatch[1]):(wordCount||null);
    const g=gram??(count?food[1]*count:food[1]);
    let conf=0.55; if(gram||count)conf+=0.3; if(seg.includes(food[0].toLowerCase().split(" ")[0]))conf+=0.1;
    conf-=hit.dist*0.1; conf=Math.max(0.2,Math.min(0.97,conf));
    // Schwache Fuzzy-Treffer NICHT raten — lieber ehrlich "nicht erkannt" (manuell eintragbar),
    // statt einem Wort ein falsches Lebensmittel zuzuordnen.
    if(hit.dist>0&&conf<0.45){ items.push({raw:seg,food:null}); continue; }
    items.push({raw:seg,food,gram:g,fuzzy:hit.dist>0,conf,_qty:!!(gram||count)});
  }
  return items;
}

function addFood(food,gram){
  const mult=gram?gram/food[1]:1;
  const entry={n:food[0]+(gram&&gram!==food[1]?` (${gram} g)`:""),g:gram||food[1],
    k:Math.round(food[2]*mult),p:Math.round(food[3]*mult*10)/10,c:Math.round(food[4]*mult*10)/10,f:Math.round(food[5]*mult*10)/10};
  nlogToday().meals.push(entry); save();
  return entry;
}

function ringSVG(score,tier,size=130){

  const st=Math.max(7,Math.round(size*.075)),r=(size-st)/2,c=2*Math.PI*r,arc=c*.75,fill=Math.max(.001,score/100)*arc;
  const id="rg"+Math.random().toString(36).slice(2,8);
  const stops=score<40
      ?["#F0917F","#E56A5C"]:score<60?["#A9C2E6","#7FA0C8"]:["#7FD7E0","#7E8BE8"];
  const big=size>100;
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(135deg);overflow:visible" aria-hidden="true">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${stops[0]}"/><stop offset="1" stop-color="${stops[1]}"/></linearGradient>
        <filter id="${id}f" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="${big?4:2.5}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${st}" stroke-dasharray="${arc} ${c}" stroke-linecap="round"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${st}" stroke-dasharray="${fill} ${c}" stroke-linecap="round" filter="url(#${id}f)" style="--rl:${fill};animation:ringDraw 1.2s cubic-bezier(.34,1.06,.5,1) both"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span class="hero-num"${big?` data-count="${score}"`:""} style="font-size:${big?Math.round(size*.30):size/3.4}px;line-height:1;background:linear-gradient(135deg,${stops[0]},${stops[1]});-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">${score}</span>
      <span class="ring-lbl" style="font-size:${big?11:8}px;margin-top:${big?4:1}px">${tier}</span>
    </div></div>`;
}

    const fpts=[{t:lt.t,v:lt.v},...fc.map((p)=>({t:lt.t+p.wk*7*dayMs,v:p.v}))];
    dash=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const up=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v*(1+0.018*i)).toFixed(1)}`).join(" ");
    const lo=[...fpts].reverse().map((p,i)=>{const j=fpts.length-1-i;return `L${X(p.t).toFixed(1)},${Y(p.v*(1-0.018*j)).toFixed(1)}`;}).join(" ");
    band=`<path d="${up} ${lo} Z" fill="var(--volt)" opacity=".08"/>`;
  }
  // FIX (v5/6B): bei wenigen Datenpunkten/kurzer Zeitspanne erzeugten die 4
  // festen Ticks identische bzw. überlappende Datums-Labels — Duplikate filtern.
  let lastTick="";
  const ticks=[0,.33,.66,1].map((f)=>{const t=tMin+f*(tMax-tMin);
    const lbl=fmtD(new Date(t));
    if(lbl===lastTick)return "";
    lastTick=lbl;
    return `<text x="${X(t)}" y="${H-2}" fill="var(--t3)" font-size="9" text-anchor="middle" font-family="Schibsted Grotesk,sans-serif">${lbl}</text>`;}).join("");
  const gid="lc"+Math.random().toString(36).slice(2,7);
  const fx=X(series[0].t).toFixed(1), lx=X(series[series.length-1].t).toFixed(1);
  const area=`${line} L${lx},${H-P} L${fx},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:16/10;display:block" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--volt)" stop-opacity=".32"/><stop offset="1" stop-color="var(--volt)" stop-opacity="0"/></linearGradient>
      <linearGradient id="${gid}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FD7E0"/><stop offset="1" stop-color="#7E8BE8"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})" stroke="none"/>
    ${band}<path class="chartdraw" d="${line}" fill="none" stroke="url(#${gid}s)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dash?`<path d="${dash}" fill="none" stroke="var(--volt)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}${ticks}</svg>`;
}
function donutSVG(parts,size=110){
  const total=parts.reduce((s,p)=>s+p.v,0)||1, r=size/2-10, c=2*Math.PI*r;
  let off=0;
  const segs=parts.map((p)=>{
    const len=p.v/total*c;
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.col}" stroke-width="14" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}"/>`;
    off+=len; return s;
  }).join("");
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">${segs}</svg>`;
}
function circleTimer(left,total,size=84){
  const r=(size-8)/2,c=2*Math.PI*r,pct=Math.max(0,left/Math.max(1,total)),id="ct"+Math.random().toString(36).slice(2,7);
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);overflow:visible" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FD7E0"/><stop offset="1" stop-color="#7E8BE8"/></linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${pct*c} ${c}" style="filter:drop-shadow(0 0 5px rgba(126,139,232,.55))"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="metric">

}

/* Interaktiver Ziel-Rechner: ehrliche, studienbasierte Projektion (Bereiche,
   klar als Projektion gekennzeichnet — keine versprochenen Einzelresultate). */
const LP={goal:"muscle_gain",days:4,exp:"novice"};
function landingProjection(){
  // Kraftzuwachs auf Grundübungen über 12 Wochen, %-Bereich nach Trainingsalter
  // (Größenordnung gem. Literatur: Anfänger steigern am schnellsten).
  const base={beginner:[20,35],novice:[12,22],intermediate:[6,12],advanced:[3,7]}[LP.exp]||[12,22];
  const dFac=Math.min(1,0.55+LP.days*0.11); // mehr Tage → näher ans obere Ende (mit Sättigung)
  const lo=Math.round(base[0]*dFac), hi=Math.round(base[1]*dFac);
  // Geschätzter Zeitaufwand/Woche aus Tagen × ~55 Min
  const minWk=LP.days*55;
  // Magermasse-Aufbau-Tendenz (qualitativ, nicht als kg versprochen)
  const muscle={muscle_gain:"deutlich",recomp:"moderat",strength:"gering, dafür viel Kraft",fat_loss:"erhalten im Defizit",general:"solide",endurance:"gering",mobility:"gering"}[LP.goal]||"solide";
  return {lo,hi,minWk,muscle};
}
function projChart(lo,hi){
  // Sättigungskurve von 0 → Mittelwert über 12 Wochen, als Fläche
  const mid=(lo+hi)/2, W=300,H=120,P=6, pts=[];
  for(let w=0;w<=12;w++){const v=mid*(1-Math.exp(-w/4.5));pts.push([P+w/12*(W-2*P),H-P-v/(mid||1)*(H-2*P)]);}
  const line=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${line} L${W-P},${H-P} L${P},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:5/2;display:block">
    <path d="${area}" fill="var(--hl)" opacity=".12"/>
    <path class="lp-chartline" d="${line}" fill="none" stroke="var(--hl)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${pts[12][0]}" cy="${pts[12][1]}" r="4" fill="var(--hl)"/>
    <text x="${P}" y="${H-1}" font-size="9" fill="var(--t3)" font-family="Schibsted Grotesk,sans-serif">Heute</text>
    <text x="${W-P}" y="${H-1}" font-size="9" fill="var(--t3)" text-anchor="end" font-family="Schibsted Grotesk,sans-serif">Woche 12</text></svg>`;
}

function renderRegister(){
  A.back=()=>{S.screen="landing";save();render();};
  A.vUser=(el)=>{el.classList.toggle("err",el.value.length>0&&el.value.length<2);el.classList.toggle("ok",el.value.length>=2);};
  A.vMail=(el)=>{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value);el.classList.toggle("err",el.value.length>0&&!ok);el.classList.toggle("ok",ok);};
  A.vPw=(el)=>{
    const s=pwStrength(el.value), m=document.getElementById("pwmeter"), lbl=document.getElementById("pwlbl");
    if(m){m.style.width=s.pct+"%";m.style.background=s.col;} if(lbl){lbl.textContent=el.value?("Stärke: "+s.lbl):"";}
    el.classList.toggle("err",el.value.length>0&&el.value.length<8);el.classList.toggle("ok",el.value.length>=8);
  };
  A.vPw2=(el)=>{const pw=document.getElementById("r-pw").value;el.classList.toggle("err",el.value.length>0&&el.value!==pw);el.classList.toggle("ok",el.value.length>0&&el.value===pw);};
  A.register=async()=>{
    const u=document.getElementById("r-user").value.trim();
    const e=document.getElementById("r-mail").value.trim().toLowerCase();
    const p=document.getElementById("r-pw").value;
    const p2=document.getElementById("r-pw2").value;
    const err=document.getElementById("r-err");
    err.textContent="";
    if(u.length<2){err.textContent="Bitte gib deinen Vornamen ein.";return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){err.textContent="Bitte gültige E-Mail-Adresse angeben.";return;}
    if(p.length<8){err.textContent="Passwort: mindestens 8 Zeichen.";return;}
    if(p!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}
    const cTos=document.getElementById("c-tos"), cHealth=document.getElementById("c-health");
    if(!cTos||!cTos.checked){err.textContent="Bitte Nutzungsbedingungen & Datenschutz akzeptieren.";return;}
    if(!cHealth||!cHealth.checked){err.textContent="Für die Funktion ist die Einwilligung zur Verarbeitung deiner Gesundheitsdaten nötig.";return;}
    S.consent={tos:true,health:true,at:Date.now(),ver:LEGAL_VERSION};
    if(SB.enabled()){
      err.textContent="Konto wird erstellt …";
      try{
        const res=await SB.signUp(e,p,u);
        if(!res||!res.session){ // Supabase verlangt E-Mail-Bestätigung
          err.textContent="";
          modal(`<p class="ct">Fast geschafft</p><p class="sm t2" style="line-height:1.6">Wir haben eine Bestätigungs-Mail an <b>${e}</b> geschickt. Bestätige sie und melde dich dann an.</p>`);
          S.screen="login"; save(); render(); return;
        }
      }catch(ex){ err.textContent="Registrierung fehlgeschlagen: "+(ex.message||ex); return; }
      S.users=[{username:u,email:e,pwHash:""}]; S.currentUser=0; // Cloud-Konto, lokal gespiegelt
      SB.recordReferralIfNeeded();
    } else {
      if(S.users.some(x=>x.email===e)){err.textContent="Diese E-Mail ist bereits registriert.";return;}
      const pwHash=await hashPw(p);
      S.users.push({username:u,email:e,pwHash}); S.currentUser=S.users.length-1;
    }
    S.devMode=false; S.tier="free";
    if(S.invitedBy){ S.tier="pro"; S.proBonusUntil=Date.now()+14*dayMs; setTimeout(()=>toast("Willkommensbonus: 14 Tage PERFORMANCE aktiv"),600); }
    // Garantiert leerer Start: keine synthetischen Daten außerhalb des Demo-Zugangs.
    S.liftLog={}; S.weightLog=[]; S.readinessHistory=[]; S.trainingHistory=[];
    S.nutritionLog={}; S.chat=[]; S.schedule=null; S.plan=null; S.checkin=null; S.checkinDate=null;
    S.screen="onboarding"; S.step=0;
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Konto erstellen</h2></div>
    ${oauthButtons("Mit Google registrieren")}
    <div class="field"><label for="r-user">Vorname</label>
      <input type="text" id="r-user" autocomplete="given-name" oninput="A.vUser(this)" placeholder="Wie sollen wir dich nennen?"></div>
    <div class="field"><label for="r-mail">E-Mail</label>
      <input type="email" id="r-mail" autocomplete="email" oninput="A.vMail(this)" placeholder="du@beispiel.de"></div>
    <div class="field"><label for="r-pw">Passwort</label>
      <input type="password" id="r-pw" autocomplete="new-password" oninput="A.vPw(this)" placeholder="mind. 8 Zeichen">
      <div class="strength-meter"><div id="pwmeter" style="width:0"></div></div>
      <p class="xs t2 mt8" id="pwlbl" style="min-height:14px"></p></div>
    <div class="field"><label for="r-pw2">Passwort bestätigen</label>
      <input type="password" id="r-pw2" autocomplete="new-password" oninput="A.vPw2(this)"></div>
    <label class="row" style="align-items:flex-start;gap:10px;cursor:pointer;margin-top:8px">
      <input type="checkbox" id="c-tos" style="width:20px;height:20px;min-width:20px;accent-color:var(--accent);margin-top:1px">
      <span class="xs t2" style="flex:1;line-height:1.5">Ich akzeptiere die <a onclick="openLegal('terms')" style="color:var(--hl);text-decoration:underline;cursor:pointer">Nutzungsbedingungen</a> und habe die <a onclick="openLegal('privacy')" style="color:var(--hl);text-decoration:underline;cursor:pointer">Datenschutzerklärung</a> gelesen.</span></label>
    <label class="row" style="align-items:flex-start;gap:10px;cursor:pointer;margin-top:10px">
      <input type="checkbox" id="c-health" style="width:20px;height:20px;min-width:20px;accent-color:var(--accent);margin-top:1px">
      <span class="xs t2" style="flex:1;line-height:1.5">Ich willige ausdrücklich ein, dass meine <b style="color:var(--t1)">Gesundheits- & Fitnessdaten</b> (Gewicht, Training, Ernährung) zur Bereitstellung der App verarbeitet werden (Art. 9 Abs. 2 a DSGVO) — jederzeit widerrufbar.</span></label>
    <p class="fielderr mt8" id="r-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.register()">Registrieren & Assessment starten</button>
    <p class="xs t2 mt16" style="text-align:center">Passwort sicher gehasht. Mit der Registrierung stimmst du den o. g. Bedingungen zu.</p></div>`;
}

    err.textContent="";
    if(S.lockoutUntil&&Date.now()<S.lockoutUntil){
      err.textContent=`Zu viele Versuche. Warte ${Math.ceil((S.lockoutUntil-Date.now())/1000)} s.`;return;
    }
    const e=document.getElementById("l-mail").value.trim().toLowerCase();
    const p=document.getElementById("l-pw").value;
    if(SB.enabled()){
      err.textContent="Anmelden …";
      try{ await SB.signIn(e,p); }
      catch(ex){ S.loginAttempts=(S.loginAttempts||0)+1;
        err.textContent=/confirm/i.test(ex.message||"")?"Bitte bestätige zuerst deine E-Mail.":"E-Mail oder Passwort falsch.";
        save(); return; }
      // Cloud-Daten dieses Kontos laden und übernehmen
      let cloud=null; try{ cloud=await SB.pull(); }catch(ex){}
      const fname=(SB.user&&SB.user.user_metadata&&SB.user.user_metadata.first_name)||(e.split("@")[0]);
      if(cloud){ SB.hydrate(cloud); }
      else { S.liftLog={};S.weightLog=[];S.readinessHistory=[];S.trainingHistory=[];S.nutritionLog={};S.chat=[];S.profile=null;S.plan=null;S.schedule=null; }
      S.users=[{username:(cloud&&cloud.users&&cloud.users[0]&&cloud.users[0].username)||fname,email:e,pwHash:""}]; S.currentUser=0;
      S.loginAttempts=0; S.lockoutUntil=null;
      SB.recordReferralIfNeeded();
      S.screen=S.profile?"app":"onboarding"; S.tab="home";
      save(); render(); return;
    }
    const idx=S.users.findIndex(x=>x.email===e);
    const hash=await hashPw(p);
    if(idx<0||S.users[idx].pwHash!==hash){
      S.loginAttempts=(S.loginAttempts||0)+1;
      if(S.loginAttempts>=5){S.lockoutUntil=Date.now()+30000;S.loginAttempts=0;
        err.textContent="5 Fehlversuche — Login für 30 Sekunden gesperrt.";}
      else err.textContent=`E-Mail oder Passwort falsch (Versuch ${S.loginAttempts}/5).`;
      save();return;
    }
    S.currentUser=idx; S.loginAttempts=0; S.lockoutUntil=null;
    S.screen=S.profile?"app":"onboarding"; S.tab="home";
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Anmelden</h2></div>
    ${oauthButtons("Mit Google anmelden")}
    <div class="field"><label for="l-mail">E-Mail</label>
      <input type="email" id="l-mail" autocomplete="email"></div>
    <div class="field"><label for="l-pw">Passwort</label>

    <button class="btn volt mt8" onclick="A.login()">Anmelden</button>
    <button class="btn ghost mt8" onclick="A.forgot()">Passwort vergessen?</button></div>`;
}

// Kontextuelle Quiz-Empfehlung: schlägt anhand der bisherigen Antworten (BMI, Ziel,
// Erfahrung, Alter) die für diesen Menschen beste Wahl vor — wie ein Coach im Funnel.
function quizRec(st){
  const a=S.a||{}; const bmi=(a.weight&&a.height)?a.weight/((a.height/100)**2):null;
  const g=(a.goals&&a.goals[0])||null, ex=a.exp;
  switch(st.id){
    case "goals":
      if(bmi&&bmi>=30) return "Bei deinem Ausgangsgewicht bringt <b>Fettabbau zuerst</b> am meisten — mit viel Protein hältst du dabei deine Muskeln.";
      if(bmi&&bmi<20) return "<b>Muskelaufbau</b> legt bei dir die beste Basis — leichter Kalorienüberschuss, sauber aufgebaut.";
      return "Dein <b>erstes</b> Ziel steuert die Kalorien am stärksten — setz es bewusst an erste Stelle.";
    case "days":
      if(ex==="beginner") return "<b>3 Tage</b> — genug Reiz und viel Erholung für einen starken Einstieg.";
      if(g==="strength") return "<b>4 Tage</b> — ideal für Kraft mit voller Erholung zwischen den Einheiten.";
      if(g==="fat_loss") return "<b>4 Tage</b> Kraft + Cardio an Ruhetagen — hält Muskeln, maximiert den Verbrauch.";
      return "<b>4 Tage</b> — der Sweet Spot: jede Muskelgruppe 2×/Woche, gute Erholung.";
    case "split":{
      const d=a.days||4;
      if(d<=2) return "Bei 2 Tagen sind <b>Ganzkörper</b> oder Ober-/Unterkörper am stärksten — jede Muskelgruppe mehrfach pro Woche.";
      if(d===3) return "Bei 3 Tagen top: <b>Ganzkörper</b> oder Push / Pull / Beine — viel Reiz, gute Erholung.";
      if(d>=5) return "Ab 5 Tagen brillieren <b>Push / Pull / Beine</b>, Arnold oder der Bro-Split. Unsicher? „Für mich optimieren\".";
      return "Unsicher? <b>„Für mich optimieren\"</b> trifft fast immer die beste Wahl für deine Tage & Ziele.";
    }
    case "time": return "<b>60 Min</b> decken vollen Reiz ab. Weniger Zeit? Der Plan wird automatisch kompakter — gleich effektiv.";
    case "focus": return "Wähl gezielt deine Schwachstellen — der Plan gibt ihnen automatisch mehr Volumen, ohne den Rest zu vernachlässigen.";
    case "recovery": return (a.age&&a.age>=45)?"Ab ~45 oder bei wenig Schlaf ist <b>eher langsam</b> oft realistischer — schützt vor Übertraining.":"";
    case "equipment": return "";
    default: return "";
  }
}

// Ziel-PRIORISIERTE Projektion: für jedes Ziel eine ehrliche 12-Wochen-Schätzung,
// sortiert nach der vom Nutzer gewählten Priorität (goals[0] = wichtigstes).
function goalProjections(a,tg,pLo,pHi){
  const w=a.weight||80, exp=a.exp||"novice";
  const fatLo=Math.max(2,Math.round(w*0.04)), fatHi=Math.max(fatLo+1,Math.round(w*0.07));
  const musc={beginner:[2,4],novice:[2,3],intermediate:[1,2],advanced:[1,2]}[exp]||[2,3];
  const D={
    fat_loss:{lo:fatLo,hi:fatHi,prefix:"−",unit:"kg",headline:"leichter werden",sub:"Körperfett weg in 12 Wochen",icon:"activity"},
    muscle_gain:{lo:musc[0],hi:musc[1],prefix:"+",unit:"kg",headline:"mehr Muskeln",sub:"realistischer Aufbau in 12 Wochen",icon:"dumbbell"},
    strength:{lo:pLo,hi:pHi,prefix:"+",unit:"%",headline:"stärker werden",sub:"mehr Maximalkraft in 12 Wochen",icon:"flame"},
    recomp:{lo:fatLo,hi:fatHi,prefix:"−",unit:"kg",headline:"schlanker & stärker",sub:"Fett runter, Kraft rauf",icon:"activity"},
    general:{lo:pLo,hi:pHi,prefix:"+",unit:"%",headline:"fitter werden",sub:"mehr Leistung & Energie",icon:"zap"},
    endurance:{lo:pLo,hi:Math.round(pHi*1.2),prefix:"+",unit:"%",headline:"ausdauernder",sub:"mehr Kondition in 12 Wochen",icon:"activity"},
    mobility:{lo:null,word:"spürbar",headline:"beweglicher",sub:"mehr Bewegungsfreiheit & weniger Schmerz",icon:"activity"},
  };
  const order=(tg.goals&&tg.goals.length)?tg.goals:["strength"];
  const out=[], seen=new Set();
  for(const g of order){ if(D[g]&&!seen.has(g)){ seen.add(g); out.push({key:g,...D[g]}); } }
  if(!out.length) out.push({key:"strength",...D.strength});
  return out;
}
