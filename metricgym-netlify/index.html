/* Teilbare Erfolgs-Karten (Canvas, 1080×1350 Story-Format) — der Kern des
   Product-led-Growth-Loops: jede Karte trägt Marke + Tagline + App-Link,
   jeder Share ist eine kostenlose Impression. Web-Share-API mit Datei,
   sonst Download. */
function drawShareCard(opts){
  const c=document.createElement("canvas"); c.width=1080; c.height=1350;
  const x=c.getContext("2d");
  // Hintergrund mit dezentem Akzent-Schein
  x.fillStyle="#F7F5F1"; x.fillRect(0,0,1080,1350);
  const g=x.createRadialGradient(540,170,40,540,170,900);
  g.addColorStop(0,"rgba(154,101,54,.10)"); g.addColorStop(1,"rgba(247,245,241,0)");
  x.fillStyle=g; x.fillRect(0,0,1080,700);
  // Logo: 3 Balken + Wortmarke
  x.fillStyle="#1A1A1A";
  [[80,104,36],[100,86,54],[120,68,72]].forEach(([bx,by,bh])=>{ if(x.roundRect){x.beginPath();x.roundRect(bx,by,14,bh,7);x.fill();}else x.fillRect(bx,by,14,bh); });
  x.font="800 58px 'Space Grotesk',system-ui"; x.fillText("METRICGYM",156,138);
  // Eyebrow
  x.fillStyle="#9A6536"; x.font="700 34px 'Space Grotesk',system-ui";
  x.fillText((opts.eyebrow||"").toUpperCase(),80,250);
  // Hero
  x.fillStyle="#1A1A1A"; x.font=`900 ${opts.heroSize||200}px 'Space Grotesk',system-ui`;
  x.fillText(opts.hero,80,opts.heroSize?250+opts.heroSize*0.95:470);
  x.fillStyle="#6E6A62"; x.font="600 44px 'Space Grotesk',system-ui";
  let y=(opts.heroSize?250+opts.heroSize*0.95:470)+70;
  x.fillText(opts.heroLabel||"",80,y); y+=120;
  // bis zu 3 Sekundär-Stats
  (opts.stats||[]).forEach(([v,l,accent])=>{
    x.fillStyle=accent?"#9A6536":"#1A1A1A"; x.font="900 100px 'Space Grotesk',system-ui"; x.fillText(v,80,y);
    x.fillStyle="#6E6A62"; x.font="600 38px 'Space Grotesk',system-ui"; x.fillText(l,80,y+52); y+=200;
  });
  // Footer-Band
  x.fillStyle="#1A1A1A"; x.font="700 40px 'Space Grotesk',system-ui";
  x.fillText("Fortschritt, wissenschaftlich fundiert.",80,1230);
  x.fillStyle="#A39E93"; x.font="500 32px 'Space Grotesk',system-ui";
  x.fillText("metricgym.app",80,1285);
  return c;
}
function shareCanvas(canvas,fname,text){
  const done=()=>toast("Bild bereit — teilen oder speichern");
  if(canvas.toBlob){
    canvas.toBlob(async(blob)=>{
      try{
        const file=new File([blob],fname,{type:"image/png"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; }
      }catch{}
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); URL.revokeObjectURL(a.href); done();
    },"image/png");
  } else { const a=document.createElement("a"); a.href=canvas.toDataURL("image/png"); a.download=fname; a.click(); done(); }
}

   ENGAGEMENT-ENGINE (Bindung) — Streak (Verlustangst), Level/XP
   (Fortschritts-Gefühl), Meilensteine + variable Belohnung (Konfetti),
   sichtbares „Investment" (Sunk-Cost). Alles aus echten Daten abgeleitet.

function activityDays(){
  const d=new Set();
  S.readinessHistory.forEach(r=>d.add(r.date));
  S.trainingHistory.forEach(t=>d.add(t.date));
  Object.entries(S.nutritionLog).forEach(([k,l])=>{if((l.meals||[]).length)d.add(k);});
  return d;
}
function engagementStats(){
  const days=activityDays();
  let streak=0;
  for(let i=0;;i++){const key=new Date(Date.now()-i*dayMs).toISOString().slice(0,10);
    if(days.has(key))streak++; else if(i===0) continue; else break;}
  const activeToday=days.has(todayKey());
  const sessions=S.trainingHistory.filter(t=>t.type!=="rest").length;
  const statusN=S.readinessHistory.length;
  const nutriN=Object.values(S.nutritionLog).filter(l=>(l.meals||[]).length).length;
  const prs=Object.keys(S.liftLog).filter(n=>{const s=e1Series(n);return s.length>=2&&s[s.length-1].v>Math.min(...s.map(p=>p.v));}).length;
  const xp=sessions*50+statusN*15+nutriN*10+prs*80+streak*8;
  const LX=(lv)=>Math.round(80*(lv-1)*(lv-1)); // XP, um Level lv zu erreichen
  let level=1; while(xp>=LX(level+1))level++;
  const cur=LX(level), next=LX(level+1);
  const levelPct=Math.min(1,(xp-cur)/((next-cur)||1));
  const totalVol=Object.values(S.liftLog).flat().reduce((s,x)=>s+((x.w||0)*(x.reps||0)),0)
    +S.trainingHistory.reduce((s,t)=>s+(t.volume||0),0);
  const journey=days.size?Math.round((Date.now()-Math.min(...[...days].map(d=>new Date(d).getTime())))/dayMs)+1:0;
  return {streak,activeToday,sessions,statusN,nutriN,prs,xp,level,toNext:Math.max(0,next-xp),levelPct,totalVol,journey,daysCount:days.size};
}

function confetti(){
  try{
    const c=document.createElement("canvas");
    c.style.cssText="position:fixed;inset:0;z-index:75;pointer-events:none";
    c.width=window.innerWidth; c.height=window.innerHeight;
    document.body.appendChild(c); const x=c.getContext("2d");
    const cols=["#9A6536","#1A1A1A","#C98A3D","#7D8CA3","#3B5BDB"];
    const P=Array.from({length:140},()=>({x:c.width*(0.3+Math.random()*0.4),y:c.height*0.28,
      vx:(Math.random()-.5)*16,vy:Math.random()*-13-3,r:4+Math.random()*5,rot:Math.random()*6,
      col:cols[Math.floor(Math.random()*cols.length)]}));
    const start=performance.now();
    (function f(t){
      x.clearRect(0,0,c.width,c.height); let on=false;
      P.forEach(p=>{p.vy+=0.5;p.x+=p.vx;p.y+=p.vy;p.rot+=0.2;
        if(p.y<c.height+30)on=true;
        x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.r,-p.r,p.r*2,p.r*1.3);x.restore();});
      if(on&&t-start<2400)requestAnimationFrame(f); else c.remove();
    })(start);
  }catch{}
}

function checkCelebrations(){
  const s=engagementStats();
  const passed=MILESTONES.filter(m=>m.test(s)).map(m=>m.id);
  if(S.celebrated==null){ S.celebrated=passed; S.lastLevel=s.level; save(); return; } // Erstlauf: still seeden
  const news=passed.filter(id=>!S.celebrated.includes(id));
  if(news.length){ S.celebrated=[...S.celebrated,...news]; save();
    const m=MILESTONES.find(x=>x.id===news[news.length-1]); celebrate(m.t,m.d); return; }
  if(s.level>(S.lastLevel||1)){ S.lastLevel=s.level; save(); celebrate("Level "+s.level+" erreicht!","Dein Einsatz zahlt sich aus. Weiter geht's."); }
}

const GROUP2REGION={Brust:["chest"],Schultern:["delts","reardelts"],"Rücken":["lats","traps","lowerback"],Arme:["biceps","triceps"],Beine:["quads","hams","glutes","calves"],Core:["abs"]};
function muscleHeatBody(){
  const w0=weeklyMuscleSets(0);

  for(const [g,[lo,hi]] of Object.entries(VOL_BANDS)){
    const n=w0[g]||0; let c,st;
    if(n===0){c="#E2DACB";st="—";}

    else if(n<=hi){const t=(n-lo)/(hi-lo||1);c=`rgba(154,101,54,${(0.55+t*0.4).toFixed(2)})`;st="optimal";}

    status[g]={n,st,lo,hi};
    (GROUP2REGION[g]||[]).forEach(r=>r2c[r]=c);

/* Konsistenz-Kalender: letzte 12 Wochen, Spalten=Wochen, Zeilen=Mo–So,
   Zelle eingefärbt nach trainiertem Volumen des Tages. */
function consistencyHeatmap(){
  const weeks=12;
  const byDate={};
  S.trainingHistory.forEach(t=>{if(t.type!=="rest"&&t.type!=="cardio")byDate[t.date]=(byDate[t.date]||0)+t.sets;});
  const today=new Date(); const dow=(today.getDay()+6)%7;
  const monThis=new Date(today); monThis.setDate(today.getDate()-dow); // Montag dieser Woche
  const shade=(s)=>s===0?"var(--s3)":s<=6?"rgba(154,101,54,.35)":s<=12?"rgba(154,101,54,.6)":"rgba(154,101,54,.95)";
  let cols="";
  for(let w=weeks-1;w>=0;w--){
    let cells="";
    for(let r=0;r<7;r++){
      const d=new Date(monThis); d.setDate(monThis.getDate()-w*7+r);
      const key=d.toISOString().slice(0,10);
      const future=d>today;
      const s=byDate[key]||0;
      cells+=`<div title="${key}: ${s} Sätze" style="width:12px;height:12px;border-radius:3px;background:${future?"transparent":shade(s)}"></div>`;
    }
    cols+=`<div style="display:flex;flex-direction:column;gap:3px">${cells}</div>`;
  }
  return `<div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:4px">${cols}</div>
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="xs t2">vor 12 Wochen</span>
      <span class="row" style="gap:4px;align-items:center"><span class="xs t2">weniger</span>
        ${[0,5,10,16].map(s=>`<span style="width:11px;height:11px;border-radius:3px;background:${shade(s)};display:inline-block"></span>`).join("")}
        <span class="xs t2">mehr</span></span></div>`;
}

function planAnswer(q){
  const t=q.toLowerCase();
  for(const e of PLAN_QA){ if(e.k.some(k=>t.includes(k))) return e.a(); }

const AI_MODEL="llama-3.3-70b-versatile";
function aiActive(){ return !!(S.aiOn && S.aiKey && S.aiKey.length>20); }
function aiPersona(){

Persönlichkeit: wissenschaftlich fundiert, direkt, motivierend, auf Augenhöhe. Du klingst wie ein exzellenter Personal Trainer, nicht wie ein Lehrbuch.

Regeln: Nutze die echten Nutzerdaten aus dem Kontext. Erfinde KEINE Zahlen, die nicht im Kontext stehen — wenn Daten fehlen, sag es und ermutige zum Loggen. Keine medizinischen Heilversprechen; bei Schmerz/Verletzung/Erkrankung → ärztlich abklären. Bleib immer ermutigend, aber ehrlich.`;

    `Beste Lifts: ${lifts}`,

    (()=>{const l=S.nutritionLog[todayKey()];if(!l||!(l.meals||[]).length)return "Ernährung heute: noch nichts geloggt";
      const su=l.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p}),{k:0,p:0});

    ins?`Aktueller Insight: ${ins.t}`:"",
  ].filter(Boolean).join("\n");

async function aiStream(history,onDelta){
  const messages=[{role:"system",content:aiPersona()+"\n\n=== AKTUELLE NUTZERDATEN ===\n"+aiContext()}, ...history.slice(-10)];
  const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.aiKey},
    body:JSON.stringify({model:AI_MODEL,messages,temperature:0.6,max_tokens:500,stream:true}),
  });
  if(!res.ok){ let m=""; try{m=(await res.json()).error?.message||"";}catch{} throw new Error("Groq "+res.status+(m?": "+m:"")); }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="", full="";
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split("\n"); buf=parts.pop();
    for(const ln of parts){ const t=ln.trim(); if(!t.startsWith("data:"))continue;
      const d=t.slice(5).trim(); if(d==="[DONE]")continue;
      try{ const tok=JSON.parse(d).choices?.[0]?.delta?.content||""; if(tok){full+=tok;onDelta(full);} }catch{} }
  }
  return full.trim();
}
// Nicht-streamender Aufruf (für strukturierte/kurze Antworten)
async function aiComplete(system,user,opts){
  opts=opts||{};
  const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.aiKey},
    body:JSON.stringify({model:AI_MODEL,messages:[{role:"system",content:system},{role:"user",content:user}],
      temperature:opts.temp??0.5,max_tokens:opts.max||500,...(opts.json?{response_format:{type:"json_object"}}:{})}),
  });
  if(!res.ok){throw new Error("Groq "+res.status);}
  return (await res.json()).choices?.[0]?.message?.content||"";
}
// Erwartet JSON-Objekt zurück; parst robust (Code-Fences/umgebenden Text entfernen)
async function aiJSON(system,user){
  const raw=await aiComplete(system,user,{json:true,temp:0.3,max:700});
  let t=raw.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  try{return JSON.parse(t);}catch{}
  const m=t.match(/\{[\s\S]*\}/); if(m){try{return JSON.parse(m[0]);}catch{}}
  return null;
}
/* Eine Chat-Runde: streamt in die letzte .msg.ai-Bubble des Containers;
   bei Fehler/kein Key → Fallback-Funktion. Persistiert in arr. */
async function aiTurn(arr,chatId,fallbackFn){
  const renderFn=window["__rerender_"+chatId];
  const history=arr.filter(m=>m.t!=="…").map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}));
  if(!aiActive()){ arr[arr.length-1].t=fallbackFn(); save(); renderFn&&renderFn(); return; }
  try{
    const full=await aiStream(history,(txt)=>{
      const box=document.getElementById(chatId); if(!box)return;
      const bubble=box.querySelector(".msg.ai:last-child"); if(bubble){bubble.textContent=txt; box.scrollTop=box.scrollHeight;}
    });
    arr[arr.length-1].t=full||fallbackFn();
  }catch(err){ arr[arr.length-1].t=fallbackFn()+"\n\n_(KI gerade nicht erreichbar — Standard-Antwort. Details: "+String(err.message||err).slice(0,80)+")_"; }
  save(); renderFn&&renderFn();
}

    try{
      const j=await aiJSON(sys,usr);
      const ex=((j&&j.exercises)||[]).filter(e=>e&&EXDB[e.name]).slice(0,9);

function applyAISession(typeKey,exList){
  const {base,variant}=parseTypeKey(typeKey);
  const plan=variant==="B"?activePlanB():activePlan();
  const mk=(n,sets,reps)=>{const d=EXDB[n]||{};return {n,sets:Math.max(1,Math.min(6,parseInt(sets)||3)),reps:String(reps||"8-12"),tempo:d.tempo||"2-0-1-0",rir:d.rir||"1–2",m:d.m||"—",why:d.why||"",alt:d.alt||null,lengthened:!!d.lengthened};};
  if(plan[base]){
    // Undo-Schnappschuss: vorherige Übungen sichern, damit der Nutzer die KI-Anpassung
    // jederzeit zurücknehmen kann (Vorher/Nachher).
    S.planUndo={typeKey, prevMain:JSON.parse(JSON.stringify(plan[base].main||[])), when:Date.now()};
    plan[base].main=exList.map(e=>mk(e.name,e.sets,e.reps));
  }
  if(S.exOverrides)delete S.exOverrides[typeKey];
  save();
}
function planUndoRestore(){

        <p style="font-size:16px;margin:4px 0">${t==="rest"?"·":`<span style="display:inline-flex">${icon(TYPES[t].icon,15)}</span>`}</p>
        <p style="font-size:8.5px;color:var(--t3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t==="rest"?"":TYPES[t].label}</p>

  // Rotations-Strip: Boxen pro Einheit, „Nächste" markiert, alle antippbar
  const rotStrip=`<div class="pills" style="margin-bottom:4px">
    ${rot.map((t,i)=>{const isNext=i===(S.rotationPos||0)%rot.length;
      return `<button class="pill ${isNext?"active":""}" style="flex-direction:column;height:auto;min-height:62px;padding:8px 12px;gap:3px" onclick="A.previewSession('${t}')">
        <span style="display:inline-flex">${icon(TYPES[t].icon,16)}</span>

        ${isNext?'<span style="font-size:8px;letter-spacing:.06em">NÄCHSTE</span>':""}</button>`;}).join("")}

  root.innerHTML=`

    ${renderSection("Dein Plan",
      `<div class="card">
        <div class="lp-seg mb12">
          <button class="${!rotMode?"sel":""}" onclick="A.setPlanMode('week')">Nach Wochentagen</button>
          <button class="${rotMode?"sel":""}" onclick="A.setPlanMode('rotation')">Fortlaufende Rotation</button></div>
        <div class="row mb12"><span class="xs t2">${rotMode?"Du machst einfach die nächste Einheit — egal an welchem Tag":isDeload?LABELS.deload+" aktiv — bewusst leichter":"Woche "+S.currentWeek+" von 4 · "+(S.currentWeek===1?"Volumen-Start":S.currentWeek===2?"Volumen steigt":"Spitzenvolumen")}</span>
          ${rotMode?"":`<button class="btn ghost" style="width:auto;min-height:36px" onclick="A.editSchedule()">${icon("edit",13)} Anpassen</button>`}</div>
        ${rotMode?rotStrip:weekStrip}
        <p class="xs t2 mt8">${rotMode?"Tipp auf eine Box, um die Übungen zu sehen. Nach jeder Einheit rückt die Rotation automatisch weiter.":"Tipp auf einen Tag, um die Einheit komplett anzusehen — auch zukünftige."}</p>
      </div>`)}

    ${focusType?renderSection(rotMode?"Deine nächste Einheit":(sch[dow]!=="rest"?"Dein Training heute":"Dein nächstes Training"),
      (()=>{
        const F=TYPES[focusType], isCardio=parseTypeKey(focusType).base==="cardio";
        const head=`<div class="row"><p class="display-m" style="display:flex;align-items:center;gap:8px">${icon(F.icon,18)} ${F.label}</p>
          ${isCardio?"":`<button class="chip ${S.soreMode[focusType]?"sel":""}" style="min-height:34px;font-size:11px" onclick="A.soreToggle('${focusType}')">Muskelkater?</button>`}</div>
          <p class="sm t2 mt8">${isCardio?"≈ "+(F.est||35)+" Min · ruhiges Tempo":F.main.length+" Übungen · ≈ "+(F.est||S.profile.a.len||60)+" Min"}</p>`;
        if(isCardio){
          return `<div class="card">${head}
            <div style="background:var(--s2);border-radius:16px;padding:18px;text-align:center;margin:14px 0">
              <p style="font-weight:700;font-size:16px;margin-bottom:4px">Zone-2 Cardio</p>
              <p class="sm t2" style="line-height:1.6">30–40 Min im lockeren Tempo, bei dem du noch sprechen kannst. Stärkt dein Herz-Kreislauf-System und unterstützt deine Erholung.</p>
            </div>
            <button class="btn volt" onclick="A.startType('${focusType}')">${icon("play",15)} Einheit starten</button>
          </div>`;
        }
        return `<div class="card">${head}
          <div class="mt12 mb12">${muscleSplitBars(focusType)}</div>
          <p class="label" style="margin-bottom:8px">Übungen</p>
          ${F.main.map((e,i)=>exLine(e,focusType,i)).join("")}
          <p class="xs t2 mt8">Übung gedrückt halten, um eine Alternative zu wählen.</p>
          <button class="btn mt8" onclick="A.aiAdjust('${focusType}')">${icon("sparkle",15)} Mit KI anpassen${aiActive()?'<span class="badge volt" style="font-size:9px;margin-left:4px">KI</span>':""}</button>
          ${S.planUndo&&S.planUndo.typeKey===focusType?`<button class="btn ghost mt8" style="min-height:40px" onclick="planUndoRestore()">${icon("undo",14)} KI-Anpassung rückgängig machen</button>`:""}

let pw=null,pr=null,prpe=8;
const RPE_DESC={7:"2–3 Reps Reserve",8:"1–2 Reps Reserve",9:"1 Rep Reserve",10:"Max-Anstrengung"};
function renderPlayer(){
  const type=S.playerType||todayType();
  if(type==="rest"){S.tab="train";save();render();return;}
  const day=TYPES[type], ex=day.ex[S.exIdx];
  if(!ex){S.tab="summary";save();render();return;}
  const [name,setsBase,repsRange,rest]=ex;
  const rec=recommend(name);
  if(pw===null){pw=rec?rec.w:20;pr=rec?rec.reps:8;prpe=8;}
  const logged=S.logged.filter(l=>l.n===name);
  const targetSets=weekSets(name,setsBase);
  A.step=(k,d)=>{ if(k==="w"){pw=Math.max(0,Math.round((pw+d*2.5)*10)/10);} if(k==="r"){pr=Math.max(1,pr+d);} renderPlayer(); };
  A.rpe=(v)=>{prpe=v;renderPlayer();};
  A.log=()=>{
    S.logged.push({n:name,w:pw,reps:pr,rpe:prpe,ts:Date.now()});
    if(!S.liftLog[name])S.liftLog[name]=[];
    S.liftLog[name].push({t:Date.now(),w:pw,reps:pr,rpe:prpe});
    const e1=e1rm(pw,pr,prpe), prevAll=S.liftLog[name].slice(0,-1);
    const prev=prevAll.reduce((m,s)=>s.w>0?Math.max(m,e1rm(s.w,s.reps,s.rpe)):m,0);
    if(prev>0&&e1>prev&&(!S.prToday||e1-prev>S.prToday.delta)) S.prToday={n:name,e1,delta:Math.round((e1-prev)*10)/10};
    if(rest>0)S.restEnd=Date.now()+rest*1000;
    save(); renderPlayer();
  };
  A.skipRest=()=>{S.restEnd=null;save();renderPlayer();};
  A.jump=(i)=>{pw=null;S.exIdx=i;save();render();};
  A.finish=()=>{
    pw=null;
    const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));
    const rpes=S.logged.map(l=>l.rpe);
    const existing=S.trainingHistory.find(t=>t.date===todayKey());
    if(existing){existing.sets+=S.logged.length;existing.volume+=vol;}
    else S.trainingHistory.push({date:todayKey(),type:parseTypeKey(type).base,sets:S.logged.length,volume:vol,
      avgRpe:rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:8});
    // Rotations-Modus: Pointer auf die nächste Einheit rücken, wenn die fällige absolviert wurde
    if(S.planMode==="rotation"&&type===rotationNext()){
      const r=activeRotation(); S.rotationPos=((S.rotationPos||0)+1)%r.length;
    }
    S.tab="summary"; S.restEnd=null; save(); render();
    // v5/Phase 4: der 10/10-Moment — Plan-Präzision voll, einmalig feiern
    if(!S.precisionShown&&S.trainingHistory.length>=10){
      S.precisionShown=true; save();
      modal(`<p class="ct">${icon("sparkle",14)} Dein Plan kennt dich jetzt</p>
        <p class="metric" style="font-size:34px;font-weight:700">10 / 10</p>
        <p class="sm t2 mt8" style="line-height:1.6">10 geloggte Sessions: Deine Empfehlungen, Prognosen und Warnungen laufen ab jetzt auf voller Präzision — alles aus deinen echten Daten.</p>`);
    }
  };
  let restHtml="";
  if(S.restEnd&&S.restEnd>Date.now()){
    const left=Math.max(0,(S.restEnd-Date.now())/1000);
    restHtml=`<div class="card row"><div><p class="ct" style="margin-bottom:2px">Pause</p>
      <button class="btn ghost" style="width:auto;padding:0" onclick="A.skipRest()">Beenden</button></div>
      ${circleTimer(left,rest)}</div>`;
    clearTimeout(timerInt); timerInt=setTimeout(()=>{ if(S.tab==="player") renderPlayer(); },250);
  } else if(S.restEnd){
    restHtml=`<div class="card row"><p class="metric volt-txt pulse" style="font-size:28px;font-weight:600">0:00</p>
      <button class="btn ghost" style="width:auto" onclick="A.skipRest()">OK</button></div>`;
  }
  const progressPct=((S.exIdx)/day.ex.length+((logged.length/targetSets)/day.ex.length))*100;
  root.innerHTML=`
    <div class="progress mb8" aria-label="Fortschritt"><div style="width:${Math.min(100,progressPct)}%"></div></div>
    <p class="ring-lbl mb8">${day.label} · Übung ${S.exIdx+1}/${day.ex.length}${S.currentWeek===4?" · "+LABELS.deload:""}</p>
    <div class="pills">${day.ex.map((e,i)=>`<button class="pill ${i===S.exIdx?"active":""}" onclick="A.jump(${i})">${e[0].length>16?e[0].slice(0,15)+"…":e[0]}</button>`).join("")}</div>
    <div class="card">
      <div class="row mb4"><h2 style="font-size:19px">${name}</h2>
        <button class="iconbtn" onclick="A.exInfo('${name}')" aria-label="Info">ⓘ</button></div>
      ${(()=>{const d=EXDB[name]||{};return (d.tempo||d.rir)?`<p class="mb8">${d.tempo?`<span class="statchip">Tempo ${d.tempo}</span>`:""}${d.rir?`<span class="statchip">${d.rir} in Reserve</span>`:""}</p>`:"";})()}
      ${rec?`<p class="sm volt-txt metric mb8">Empfehlung: ${fmtKg(rec.w)} × ${rec.reps}
        <button class="iconbtn" style="min-width:28px;min-height:20px;font-size:11px" onclick="A.recWhy('${name}')" aria-label="Warum?">ⓘ</button></p>`
        :`<p class="xs t2 mb8">Erste Session — wähle dein Startgewicht selbst.</p>`}
      <div class="row mb12"><p class="ct" style="margin:0">Sätze</p>
        <div class="setdots" aria-label="${logged.length} von ${targetSets}">${Array.from({length:targetSets},(_,i)=>`<span class="dot ${i<logged.length?"full":""}"></span>`).join("")}</div></div>
      <div class="row mb8"><span class="sm t2">Gewicht</span>
        <div class="stepper"><button onclick="A.step('w',-1)" aria-label="Gewicht verringern">−</button><span class="val metric">${fmtKg(pw)}</span><button onclick="A.step('w',1)" aria-label="Gewicht erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">Reps</span>
        <div class="stepper"><button onclick="A.step('r',-1)" aria-label="Reps verringern">−</button><span class="val metric">${pr}</span><button onclick="A.step('r',1)" aria-label="Reps erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">${LABELS.rpe} ${infoBtn("rpe")}</span>
        <div class="scale">${[7,8,9,10].map(v=>`<button class="${prpe===v?"sel":""}" onclick="A.rpe(${v})" title="${RPE_DESC[v]}" aria-label="Anstrengung ${v}">${v}</button>`).join("")}</div></div>
      <p class="xs t2 mb8" style="text-align:right">${RPE_DESC[prpe]}</p>
      <button class="btn volt" onclick="A.log()">Set loggen</button>
      ${logged.length?`<ul class="list mt16" style="border-top:1px solid var(--border);padding-top:10px">
        ${logged.map(l=>`<li><span class="metric">${fmtKg(l.w)} × ${l.reps}</span><span class="metric">RPE ${l.rpe}</span></li>`).join("")}</ul>`:""}
    </div>
    ${restHtml}
    <div class="grid2 mb8">
      <button class="btn" ${S.exIdx===0?"disabled":""} onclick="A.jump(${S.exIdx-1})">‹ Vorherige</button>
      <button class="btn" ${S.exIdx>=day.ex.length-1?"disabled":""} onclick="A.jump(${S.exIdx+1})">Nächste ›</button></div>
    <button class="btn" onclick="A.finish()">Training abschließen</button>`;
}

function renderSummary(){
  const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));
  A.done=()=>{S.tab="train";S.logged=[];S.exIdx=0;S.restEnd=null;save();render();};
  root.innerHTML=`
    <div class="card"><p class="ct">Volumen</p>
      <p class="metric volt-txt" style="font-size:36px;font-weight:600">${nfi.format(vol)} kg</p>
      <p class="xs t2 mt8">${S.logged.length} Sätze geloggt</p></div>
    ${S.prToday?`<div class="card" style="border-color:rgba(154,101,54,.4)">
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px">
        <p class="ring-lbl mb8">NEUER REKORD</p>
        <p style="font-size:20px;font-weight:600;margin-bottom:8px">${S.prToday.n}</p>
        <p class="metric volt-txt" style="font-size:44px;font-weight:700;line-height:1">${fmtKg(S.prToday.e1)}</p>
        <p class="metric volt-txt sm mt8">+${nf.format(S.prToday.delta)} kg ${LABELS.e1rm} ${infoBtn("e1rm")}</p>
        <p class="mt16" style="font-weight:700;letter-spacing:2px">METRIC<span class="volt-txt">GYM</span></p>
      </div></div>`
    :`<p class="sm t2 mb16">Solide Arbeit. Die Engine hat deine Progression aktualisiert.</p>`}
    ${S.prToday?`<button class="btn volt mb8" onclick="sharePRPNG(S.prToday)">${icon("send",15)} Rekord teilen</button>`:""}
    <button class="btn" onclick="A.done()">Zur Übersicht</button>`;
}

function gateCard(title,need,have,unit,ctaLabel,ctaTab){
  // FIX (v5/6B): need kam teils als String ("3"/"5") an — hart auf Number, sonst
  // rechnet `need-have` per Typkoersion zwar, aber `have/need` ist fragil.
  need=Number(need); have=Number(have);
  // FIX (v5/6B): Zähler "x / y" umbrach bei langen Titeln neben der Progressbar — nowrap.
  return `<div class="card"><p class="ct">${title}</p>
    <p class="sm t2 mb8">Noch ${Math.max(0,need-have)} ${unit} bis zu deiner persönlichen Auswertung — leg jetzt los.</p>
    <div class="row mb8"><div class="progress" style="height:8px;min-width:0"><div style="width:${Math.min(100,have/need*100)}%"></div></div>
    <span class="metric xs t2" style="white-space:nowrap;flex-shrink:0">${have} / ${need}</span></div>
    ${ctaLabel?`<button class="btn" style="min-height:42px;font-size:13px" onclick="S.tab='${ctaTab||"train"}';save();render();">${ctaLabel}</button>`:""}</div>`;
}
function renderAnalytics(){
  const p=S.profile, a=p.a;
  // Ganzseitiger Empty-State bei NULL Daten — unmissverständlich, nichts erfunden.
  const hasAnyData=S.trainingHistory.length>0
    ||Object.values(S.nutritionLog).some(l=>(l.meals||[]).length>0)
    ||S.readinessHistory.length>0
    ||Object.values(S.liftLog).some(x=>x.length>0);
  if(!hasAnyData){
    A.q=(t)=>{S.tab=t;save();render();};
    root.innerHTML=`<div class="center" style="min-height:70dvh">
      <div style="color:var(--t3)">${icon("chart",44)}</div>
      <p class="display-m">Noch keine Daten vorhanden</p>
      <p class="sm t2" style="max-width:290px;line-height:1.7">Deine Analytics entstehen aus deinen echten Trainings- und Ernährungsdaten. <b style="color:var(--t1)">Jede Auswertung beruht auf deinen Werten.</b><br><br>Sobald du dein erstes Training loggst, erscheinen hier deine ersten Einblicke.</p>
      <button class="btn volt" style="max-width:280px" onclick="A.q('train')">Jetzt dein erstes Training loggen</button>
    </div>`;
    return;
  }
  const dp=dataProgress();
  let html0=banner("analytics","chart","<b>Dein Fortschritt, schwarz auf weiß.</b> Belegt durch deine echten Daten.");
  const lifts=Object.keys(S.liftLog).filter(n=>e1Series(n).length>=3);
  const allSets=Object.values(S.liftLog).flat();
  const ins=buildInsights();
  const today=S.checkin||(S.readinessHistory.length?{score:S.readinessHistory[S.readinessHistory.length-1].score,tier:S.readinessHistory[S.readinessHistory.length-1].tier}:null);

  // ---------- Analytics-Übersicht: ein Kopf-Dashboard, das den Zustand bündelt ----------
  const nutriDaysAll=Object.keys(S.nutritionLog).filter(d=>(S.nutritionLog[d].meals||[]).length>0);
  // 6 Analyse-Module: jeweils freigeschaltet, sobald genug echte Daten da sind
  const modules=[
    {n:"Kraft & Prognose",ok:lifts.length>0},
    {n:LABELS.volume,ok:S.trainingHistory.length>=3},
    {n:"Intensität",ok:allSets.length>=10},
    {n:"Körper",ok:S.weightLog.length>=3},
    {n:"Erholung",ok:S.readinessHistory.length>=5},
    {n:"Ernährung",ok:nutriDaysAll.length>=3},
  ];
  const activeMods=modules.filter(m=>m.ok).length;
  const completeness=Math.round((dp.training+dp.nutrition+dp.status)/21*100);
  // Trainingskonstanz: Anteil geplanter Sessions, die in den letzten 14 Tagen wirklich stattfanden
  const planned2w=(schedule().filter(t=>t!=="rest"&&t!=="cardio").length||p.a.days||4)*2;
  const did2w=S.trainingHistory.filter(t=>Date.now()-new Date(t.date).getTime()<14*dayMs&&t.type!=="cardio"&&t.type!=="rest").length;
  const consistency=Math.min(100,Math.round(did2w/Math.max(1,planned2w)*100));
  const headline=ins.length?ins[0]:null;

  let html=html0+`
    <div class="card" style="border-color:rgba(26,26,26,.1)">
      <div class="row mb12"><p class="ct" style="margin:0">${icon("sparkle",14)} Deine Analytics auf einen Blick</p>
        <span class="badge mute">${activeMods}/6 aktiv</span></div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:10px">
        ${[["Datenbasis",completeness+" %",completeness>=70?"volt-txt":completeness>=40?"":"t2"],
           ["Konstanz",consistency+" %",consistency>=70?"volt-txt":consistency>=40?"warn-txt":"t2"],
           ["Insights",String(ins.length),ins.length?"volt-txt":"t2"]].map(([l,v,c])=>`
          <div style="background:var(--s2);border-radius:14px;padding:12px 8px;text-align:center">
            <p class="hero-num ${c}" style="font-size:24px">${v}</p>
            <p class="xs t2" style="margin-top:2px">${l}</p></div>`).join("")}
      </div>
      ${headline?`<div class="msg ai" style="max-width:100%;margin-top:12px;margin-bottom:0">${icon("zap",13)} <b>Wichtigste Erkenntnis:</b> ${headline.t}<div class="conf mt8">Konfidenz ${headline.conf} %</div></div>`
        :`<p class="sm t2 mt12" style="line-height:1.6">Noch keine belastbare Erkenntnis — je vollständiger deine Tages-Routine (siehe Home), desto schärfer werden diese Auswertungen.</p>`}
      <button class="btn mt12" onclick="shareWeekPNG()">${icon("send",15)} Meine Woche teilen</button>
    </div>`;

  html+=`
    <!-- Daten-Sammelstand: ehrlich, immer sichtbar bis voll -->
    ${(dp.training<7||dp.nutrition<7||dp.status<7)?`<div class="card" style="border-color:rgba(91,140,255,.35)">
      <p class="ct">${icon("activity",14)} Deine Daten wachsen — letzte 7 Tage</p>
      ${[["Training",dp.training],["Ernährung",dp.nutrition],["Status",dp.status]].map(([l,v])=>`
        <div class="barrow"><span class="blbl">${l}</span>
        <div class="btrack"><div class="bfill" style="width:${v/7*100}%;background:${v>=5?"var(--volt)":v>=3?"var(--info)":"var(--t3)"}"></div></div>
        <span class="bval metric">${v} / 7 Tage</span></div>`).join("")}
      <p class="xs t2 mt8">Deine Analytics schärfen sich mit jedem Tag, den du loggst.</p></div>`:""}

    ${today?`<div class="card row" style="justify-content:flex-start;gap:20px">${ringSVG(today.score,today.tier)}
      <div><p class="ct" style="margin-bottom:4px">Status</p><p class="xs t2">Aktueller Erholungszustand.</p></div></div>`
    :gateCard("Bereit für heute?",1,0,"Check","Jetzt Check machen","home")}`;

  // Dein Kraftfortschritt — Free: 1 Übung, Pro/Elite: alle (Top 2 mobil)
  if(lifts.length){
    const maxLifts=S.tier==="free"?1:2;
    const sorted=lifts.sort((x,y)=>e1Series(y).length-e1Series(x).length);
    const top=sorted.slice(0,maxLifts);
    const lockedLifts=S.tier==="free"?sorted.length-top.length:0;
    html+=`<div class="card"><p class="ct">Dein Kraftfortschritt ${infoBtn("trajectory")}</p>${top.map(n=>{
      const s=e1Series(n), fc=forecast12w(s);
      return `<p class="sm mb8" style="font-weight:500">${n}</p>${lineChart(s,fc)}
        ${fc?`<p class="sm volt-txt metric mt8">Prognose: ${fmtKg(fc[2].v)} bis ${fmtD(new Date(s[s.length-1].t+84*dayMs))} <span class="conf">· Konfidenz ${Math.min(85,40+s.length*4)} %</span></p>`:""}
        <p class="xs t2 mt8 mb16">Konfidenz steigt mit jeder Session: aktuell ${s.length} Datenpunkte — ab 12 wird die Prognose deutlich stabiler.</p>`;
    }).join("")}
    ${lockedLifts>0?`<div class="lockcard"><p class="sm">${icon("lock",13)} ${lockedLifts} weitere ${lockedLifts===1?"Übung":"Übungen"} mit Prognose (z. B. ${sorted[1]}) — Teil von PERFORMANCE.</p>
      <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('trajectory')">Freischalten</button></div>`:""}</div>`;
  } else html+=gateCard("Dein Kraftfortschritt",3,0,"Trainings je Übung","Training beginnen","train");

  // Persönliche Rekorde — Top 3 geschätzte Maximalkraft mit Datum
  const prs=Object.keys(S.liftLog).map(n=>{
    const s=e1Series(n); if(!s.length)return null;
    let b=s[0]; for(const q of s)if(q.v>b.v)b=q;
    return b.v>0?{n,v:b.v,t:b.t}:null;
  }).filter(Boolean).sort((x,y)=>y.v-x.v).slice(0,3);
  if(prs.length){
    html+=`<div class="card"><p class="ct">${icon("star",14)} Deine Rekorde ${infoBtn("e1rm")}</p>
      ${prs.map((r,i)=>`<div class="row" style="padding:8px 0;${i?"border-top:1px solid var(--hairline)":""}">
        <span class="sm" style="font-weight:600">${r.n}</span>
        <span style="text-align:right"><span class="metric" style="font-size:16px">${fmtKg(r.v)}</span>
        <span class="xs t2" style="display:block">${fmtD(new Date(r.t))}</span></span></div>`).join("")}
      <p class="xs t2 mt8">Geschätzte Maximalkraft — berechnet aus deinen echten Sätzen.</p></div>`;
  }

  // Konsistenz-Kalender (Heatmap der letzten 12 Wochen)
  if(S.trainingHistory.length>=3){
    html+=`<div class="card"><p class="ct">${icon("calendar",14)} Deine Konsistenz · 12 Wochen</p>
      <p class="xs t2 mb12">Jeder Tag, an dem du trainiert hast — je dunkler, desto mehr Sätze. Dranbleiben ist der stärkste Hebel.</p>
      ${consistencyHeatmap()}</div>`;
  }

  // Volumen
  if(S.trainingHistory.length>=3){
    const wks=[...Array(4)].map((_,i)=>{
      const from=Date.now()-(4-i)*7*dayMs, to=Date.now()-(3-i)*7*dayMs;
      return S.trainingHistory.filter(t=>{const x=new Date(t.date).getTime();return x>=from&&x<to;}).reduce((s,t)=>s+t.sets,0);
    });
    const maxW=Math.max(...wks,1);
    const volWhy=S.currentWeek===4
      ?`Grund: geplante ${LABELS.deload} (Woche 4 von 4) — bewusst weniger Sätze, kein Trainingsausfall.`
      :(wks[2]>0&&wks[3]<wks[2]*0.7?"Aktuelle Woche liegt deutlich unter der Vorwoche — geplante Sessions prüfen.":wks[2]>0&&wks[3]>wks[2]*1.3?"Volumen-Sprung ggü. Vorwoche — Steigerungen über +30 %/Woche erhöhen das Verletzungsrisiko (Gabbett, 2016).":"Volumen stabil zur Vorwoche — gute Basis für Progression.");
    html+=`<div class="card"><p class="ct">Dein Trainingsvolumen diese Woche</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">
        ${wks.map((v,i)=>`<div style="flex:1;text-align:center">
          <div style="height:${Math.max(3,v/maxW*76)}px;background:${i===3?"var(--volt)":"var(--t3)"};border-radius:4px 4px 0 0;opacity:.85"></div>
          <p class="xs t2" style="margin-top:4px">W${i+1}</p><p class="metric xs">${v}</p></div>`).join("")}
      </div>
      <p class="xs t2 mt8">${volWhy}</p></div>`;
  } else html+=gateCard("Wochenvolumen","3",S.trainingHistory.length,"Sessions");

  // Muskelbalance: Sätze je Muskelgruppe diese Woche vs. optimaler Korridor (MEV–MRV)
  if(allSets.length>=10){
    const w0=weeklyMuscleSets(0);
    const groups=Object.keys(VOL_BANDS).filter(m=>w0[m]>0);
    if(groups.length){
      html+=`<div class="card"><p class="ct">${icon("activity",14)} Deine Muskel-Heatmap · diese Woche ${infoBtn("volumeBand")}</p>
        <p class="xs t2 mb12">Welcher Muskel wie viel Reiz bekommt — eingefärbt nach deinem optimalen Volumen-Korridor.</p>
        ${muscleHeatBody()}
        <p class="label" style="margin:16px 0 8px">Im Detail</p>
        ${groups.map(m=>{
          const v=w0[m]||0, [lo,hi]=VOL_BANDS[m];
          const scale=Math.max(hi,v)*1.1;
          const status=v<lo?["zu niedrig","var(--info)"]:v>hi?["zu hoch","var(--danger)"]:["optimal","var(--volt)"];
          return `<div class="mb12"><div class="row mb4"><span class="sm" style="font-weight:600">${m}</span>
            <span class="metric xs ${v<lo?"":v>hi?"danger-txt":"volt-txt"}">${v} Sätze · ${status[0]}</span></div>
            <div style="position:relative;height:14px;background:var(--s3);border-radius:7px;overflow:hidden">
              <div style="position:absolute;left:${lo/scale*100}%;width:${(hi-lo)/scale*100}%;top:0;bottom:0;background:rgba(154,101,54,.16)"></div>
              <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,v/scale*100)}%;background:${status[1]};opacity:.8;border-radius:7px"></div>
            </div>
            <p class="xs t2" style="margin-top:3px">Optimal: ${lo}–${hi} Sätze/Woche</p></div>`;
        }).join("")}
      </div>`;
    }
  }

  // RPE
  if(allSets.length>=10){
    const rpeCounts={7:0,8:0,9:0,10:0};
    allSets.forEach(s=>{const k=Math.min(10,Math.max(7,Math.round(s.rpe??8)));rpeCounts[k]++;});
    const total=allSets.length, pct10=Math.round(rpeCounts[10]/total*100);
    html+=`<div class="card"><p class="ct">Wie hart du wirklich trainierst</p>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;padding:0 8px">
        ${[7,8,9,10].map(k=>{const pc=rpeCounts[k]/total;
          return `<div style="flex:1;text-align:center">
            <div style="height:${Math.max(4,pc*76)}px;background:${k<=8?"var(--volt)":k===9?"var(--warn)":"var(--danger)"};border-radius:4px 4px 0 0;opacity:.85"></div>
            <p class="metric xs t2" style="margin-top:4px">RPE ${k}</p><p class="metric xs">${Math.round(pc*100)} %</p></div>`;}).join("")}
      </div>
      ${pct10>20?`<p class="warncard mt8" role="alert"><b>Übertrainings-Risiko:</b> ${pct10} % RPE-10-Sätze. <span class="conf">Konfidenz 75 %</span></p>`:`<p class="xs t2 mt8">Zielzone: ~70 % bei RPE 7–8 (Helms et al., 2016).</p>`}</div>`;
  } else html+=gateCard("Wie hart du wirklich trainierst",10,allSets.length,"Sätze","Training beginnen","train");

  // Körper
  if(S.weightLog.length>=3){
    const w7=S.weightLog;
    const wMin=Math.min(...w7.map(q=>q.v)),wMax=Math.max(...w7.map(q=>q.v));
    const lastW=w7[w7.length-1].v, hM=a.height/100, bmi=Math.round(lastW/(hM*hM)*10)/10;
    const bf=a.bodyFat!=null?a.bodyFat:null;
    const lean=bf!=null?Math.round(lastW*(1-bf/100)*10)/10:null;
    const ffmi=lean!=null?Math.round((lean/(hM*hM)+6.1*(1.8-hM))*10)/10:null;
    html+=`<div class="card"><p class="ct">Deine Körperentwicklung</p>
      <svg viewBox="0 0 340 170" style="width:100%;aspect-ratio:2/1;display:block" aria-hidden="true">
        ${w7.map((q,i)=>{const x=8+i/Math.max(1,w7.length-1)*324,y=160-(q.v-wMin)/(wMax-wMin||1)*144;
          return `<circle cx="${x}" cy="${y}" r="1.6" fill="var(--t3)"/>`;}).join("")}
        <path d="${w7.map((q,i)=>{const win=w7.slice(Math.max(0,i-6),i+1),avg=win.reduce((s,z)=>s+z.v,0)/win.length;
          const x=8+i/Math.max(1,w7.length-1)*324,y=160-(avg-wMin)/(wMax-wMin||1)*144;return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}).join(" ")}"
          fill="none" stroke="var(--volt)" stroke-width="2"/></svg>
      <div class="chips mt8">
        <span class="badge mute">Aktuell <span class="metric" style="margin-left:4px">${fmtKg(lastW)}</span></span>
        <span class="badge mute">BMI <span class="metric" style="margin-left:4px">${nf.format(bmi)}</span></span>
        ${ffmi!=null?`<span class="badge mute">FFMI <span class="metric" style="margin-left:4px">${nf.format(ffmi)}</span></span>`:""}
      </div></div>`;
  } else html+=gateCard("Deine Körperentwicklung",3,S.weightLog.length,"Wiegungen","Gewicht eintragen","profile");

  // Recovery
  if(S.readinessHistory.length>=5){
    const r14=S.readinessHistory.slice(-14);
    const debt=Math.round(r14.reduce((s,x)=>s+Math.max(0,8-(x.sleepH||7)),0)*10)/10;
    html+=`<div class="card"><p class="ct">Deine Erholung im Blick · ${r14.length} Tage</p>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px">
        ${r14.map(x=>`<div style="flex:1" title="${x.date}: ${x.score}">
          <div style="height:${Math.max(3,x.score/100*76)}px;background:${x.score>=60?"var(--volt)":x.score>=40?"var(--info)":"var(--danger)"};border-radius:2px;opacity:.85"></div></div>`).join("")}
      </div>
      <div class="row mt8"><span class="sm t2">Schlaf-Defizit (vs. 8 h)</span>
        <span class="metric ${debt>6?"danger-txt":debt>3?"warn-txt":"volt-txt"}">${nf.format(debt)} h</span></div>
      ${S.rhrLog.length>=5?(()=>{const l7=S.rhrLog.slice(-7);const avg=Math.round(l7.reduce((s,x)=>s+x.v,0)/l7.length);
        return `<div class="row mt8"><span class="sm t2">Ruhepuls (Health-Import)</span><span class="metric">${avg} bpm</span></div>`;})():""}</div>`;
  } else html+=gateCard("Recovery","5",S.readinessHistory.length,"Status-Checks");

  // Ernährung
  const nutriDays=Object.keys(S.nutritionLog).filter(d=>(S.nutritionLog[d].meals||[]).length>0);
  if(nutriDays.length>=3){
    const days7=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*dayMs).toISOString().slice(0,10));
    const nutri7=days7.map(d=>{
      const log=S.nutritionLog[d];
      if(!log)return{d,k:0,p:0,c:0,f:0};
      return {d,...log.meals.reduce((x,m)=>({k:x.k+m.k,p:x.p+m.p,c:x.c+m.c,f:x.f+m.f}),{k:0,p:0,c:0,f:0})};
    });
    const macroSum=nutri7.reduce((s,x)=>({p:s.p+x.p,c:s.c+x.c,f:s.f+x.f}),{p:0,c:0,f:0});
    const kcalMax=Math.max(...nutri7.map(x=>x.k),p.tg.train.kcal)*1.1;
    const protDays=nutri7.filter(x=>x.p>=p.tg.train.p).length, protTracked=nutri7.filter(x=>x.k>0).length||1;
    html+=`<div class="card"><p class="ct">Ernährung · 7 Tage</p>
      <div style="display:flex;align-items:flex-end;gap:5px;height:90px;position:relative">
        <div style="position:absolute;left:0;right:0;bottom:${p.tg.train.kcal/kcalMax*80}px;border-top:1px dashed var(--volt);opacity:.6"></div>
        ${nutri7.map(x=>`<div style="flex:1;text-align:center">
          <div style="height:${Math.max(2,x.k/kcalMax*80)}px;background:${x.k>0&&Math.abs(x.k-p.tg.train.kcal)/p.tg.train.kcal<=.1?"var(--volt)":"var(--t3)"};border-radius:3px 3px 0 0;opacity:.85"></div>
          <p class="xs t2" style="margin-top:3px">${x.d.slice(8)}</p></div>`).join("")}
      </div>
      <div class="row mt8"><span class="sm t2">Protein-Treue</span>
        <span class="metric ${protDays/protTracked>=.7?"volt-txt":"warn-txt"}">${protDays}/${protTracked} Tage</span></div>
      ${(()=>{const da7=dietAdherence(7);return da7?`<div class="row mt8"><span class="sm t2">${LABELS.adherence} ${infoBtn("adherence")}</span>
        <span class="metric ${da7.pct>=70?"volt-txt":"warn-txt"}">${da7.pct} % <span class="conf">· ${da7.conf} %</span></span></div>`:"";})()}
      <div class="row mt8" style="justify-content:flex-start;gap:16px">
        ${donutSVG([{v:macroSum.p*4,col:"var(--volt)"},{v:macroSum.c*4,col:"var(--info)"},{v:macroSum.f*9,col:"var(--t3)"}],90)}
        <div class="sm t2" style="line-height:1.9">
          <span style="color:var(--volt)">●</span> Protein ${nfi.format(macroSum.p*4)} kcal<br>
          <span style="color:var(--info)">●</span> Carbs ${nfi.format(macroSum.c*4)} kcal<br>
          <span style="color:var(--t3)">●</span> Fett ${nfi.format(macroSum.f*9)} kcal</div></div></div>`;
  } else html+=gateCard("Ernährungs-Analytics","3",nutriDays.length,"Tage geloggt");

  // Versorgst du deinen Körper richtig?: NUR aus tatsächlich geloggten Top-10-Lebensmitteln (PERFORMANCE)
  if(S.tier==="free"){
    html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig?</p>
      <div class="lockcard" style="margin-top:0"><p class="sm">${icon("lock",13)} Vitamin-D-, B12-, Eisen- und Magnesium-Schätzung aus deinen Logs — Teil von PERFORMANCE.</p>
      <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('micro')">Freischalten</button></div></div>`;
  } else if(nutriDays.length>=3){
    const sums=[0,0,0,0]; let hits=0;
    for(const [d,l] of Object.entries(S.nutritionLog)){
      if(Date.now()-new Date(d).getTime()>=7*dayMs)continue;
      for(const m of (l.meals||[])){
        const key=Object.keys(MICRO).find(k=>m.n.startsWith(k));
        if(!key)continue;
        const base=(FOODS.find(x=>x[0]===key)||[,100])[1];
        const mult=(m.g||base)/base;
        MICRO[key].forEach((v,i)=>{sums[i]+=v*mult;}); hits++;
      }
    }
    if(hits>0){
      html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig? · 7 Tage ${infoBtn("micro")}</p>
        ${MICRO_NAMES.map((nme,i)=>{const pc=Math.min(100,Math.round(sums[i]/(MICRO_REF[i]*7)*100));
          return `<div class="barrow"><span class="blbl">${nme}</span>
            <div class="btrack"><div class="bfill" style="width:${pc}%;background:${pc>=70?"var(--volt)":pc>=40?"var(--info)":"var(--warn)"}"></div></div>
            <span class="bval metric">${pc} %</span></div>`;}).join("")}
        <p class="xs t2 mt8">Geschätzt aus ${hits} geloggten Einträgen mit hinterlegten Werten — Richtungsanzeige, kein vollständiges Tracking.</p></div>`;
    } else {
      html+=`<div class="card"><p class="ct">Versorgst du deinen Körper richtig? ${infoBtn("micro")}</p>
        <p class="sm t2">Noch keine Lebensmittel mit hinterlegten Mikronährwerten geloggt (z. B. Lachs, Eier, Haferflocken, Spinat).</p></div>`;
    }
  } else html+=gateCard("Versorgst du deinen Körper richtig?",3,nutriDays.length,"Tage","Mahlzeit loggen","nutrition");

  // Insights — Tier-Slicing: Free 1 / Pro 5 / Elite 8, Lock-Card nennt Kategorien
  const insCap=S.tier==="free"?1:(S.tier==="elite"?8:5);
  const visIns=ins.slice(0,insCap);
  const hiddenIns=ins.slice(insCap);
  const hiddenCats=[...new Set(hiddenIns.map(i=>/Fortschrittstempo/.test(i.t)?LABELS.velocity:/Ernährungs-Treue/.test(i.t)?LABELS.adherence:/Trainingsbelastung/.test(i.t)?LABELS.volume:/Übertrain/.test(i.t)?"Übertrainings-Risiko":"Trend-Analyse"))];
  html+=visIns.length?`<div class="card"><p class="ct">${icon("sparkle",14)} Was deine Daten dir sagen</p>
    ${visIns.map(i=>`<div class="${i.risk?"warncard":"msg ai"}" style="max-width:100%;margin-bottom:8px">${i.t}<div class="conf mt8">Konfidenz ${i.conf} %</div></div>`).join("")}
    ${hiddenIns.length?`<div class="lockcard"><p class="sm">${icon("lock",13)} ${hiddenIns.length} weitere ${hiddenIns.length===1?"Insight":"Insights"} verfügbar — ${hiddenCats.slice(0,3).join(", ")}.</p>
      <button class="btn ghost" style="justify-content:flex-start;padding-left:0;min-height:36px" onclick="A.showTeaser('insights')">${TIER_LABEL[S.tier==="free"?"pro":"elite"]} freischalten</button></div>`:""}</div>`
  :`<div class="card"><p class="ct">${icon("sparkle",14)} Was deine Daten dir sagen</p><p class="sm t2">Sobald deine Daten ein belastbares Muster zeigen, erklärt dir die Engine deinen Fortschritt.</p></div>`;

  root.innerHTML=html;
}

// =====================================================================
// ERNÄHRUNG (Voice-first, Multi-Item, Approval)
// =====================================================================
let dayType="train", pendingItems=null, pendingManual=null;
// Makro-„Batterie": horizontaler Füllbalken mit Zielmarke und Über-/Unterzustand
function macroBattery(label,cur,target,col,priority){
  const pct=target?Math.min(100,cur/target*100):0;
  const over=cur>target*1.08;
  return `<div style="margin-bottom:13px">
    <div class="row mb4"><span class="sm" style="font-weight:${priority?700:600}">${label}${priority?' <span class="xs" style="color:var(--hl);font-weight:700">· Priorität</span>':""}</span>
      <span class="metric xs ${over?"warn-txt":pct>=90?"volt-txt":"t2"}">${nfi.format(cur)} / ${nfi.format(target)} g</span></div>
    <div style="position:relative;height:13px;border-radius:7px;background:var(--s3);overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:${over?"var(--warn)":col};border-radius:7px;transition:width .7s cubic-bezier(.25,.8,.25,1)"></div>
      <div style="position:absolute;left:90%;top:-2px;bottom:-2px;width:2px;background:rgba(0,0,0,.18)"></div>
    </div></div>`;
}
// Energie-Budget: verbleibende kcal als Held + segmentierter Makro-Treibstoffbalken
function energyBudget(sum,tg){
  const remaining=tg.kcal-sum.k, over=remaining<0;
  const pk=sum.p*4,ck=sum.c*4,fk=sum.f*9, fuel=pk+ck+ffFix(fk)||1;
  const fillPct=Math.min(100,sum.k/tg.kcal*100);
  const seg=(v,c)=>`<div style="width:${fuel?v/fuel*100:0}%;background:${c}"></div>`;
  return `<div style="text-align:center;padding:6px 0 2px">

function nutritionStats(sum){
  const p=S.profile, bw=p.a.weight||80;
  // Ziel-Verhältnis (wissenschaftlich, ~1,8 g/kg) statt des verwirrenden Tages-Iststands
  const ppkg=Math.round(p.tg.train.p/bw*10)/10;
  const last7=[...Array(7)].map((_,i)=>new Date(Date.now()-i*dayMs).toISOString().slice(0,10)).map(k=>S.nutritionLog[k]).filter(l=>l&&(l.meals||[]).length);
  const avgK=last7.length?Math.round(last7.reduce((s,l)=>s+l.meals.reduce((a,m)=>a+m.k,0),0)/last7.length):0;
  let streak=0;
  for(let d=0;;d++){const key=new Date(Date.now()-d*dayMs).toISOString().slice(0,10);const l=S.nutritionLog[key];
    if(!l||!(l.meals||[]).length){if(d===0)continue;break;}
    if(l.meals.reduce((s,m)=>s+m.p,0)>=p.tg.train.p*0.9)streak++;else break;}
  return [["metric",ppkg.toString().replace(".",","),"g/kg Protein-Ziel"],["metric",avgK?nfi.format(avgK):"—","Ø kcal · 7 T"],["",streak+(streak===1?" Tag":" Tage"),"Protein-Streak"]];
}

/* =====================================================================
   HEALTH-IMPORT (v5/Phase 8A) — Datei-Import statt unmöglicher Live-Sync.
   Ehrlichkeit: HealthKit/Google Fit sind aus einer Browser-App heraus nicht
   live erreichbar. Wir lesen die exportierte Datei lokal — Gewicht →
   Gewichtsverlauf, Schlafdauer → vorhandene Status-Einträge (nichts wird
   erfunden), Ruhepuls → Erholungs-Übersicht.
   ===================================================================== */
function parseAppleHealthExport(xml){
  const out={weight:[],sleepH:{},rhr:[]};
  const tags=xml.match(/<Record\b[^>]*>/g)||[];
  for(const tag of tags){
    const attr=(n)=>{const m=tag.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:null;};
    const type=attr("type"); if(!type)continue;
    if(type==="HKQuantityTypeIdentifierBodyMass"){
      const v=parseFloat(attr("value")), unit=attr("unit")||"kg", t=Date.parse(attr("startDate")||"");
      if(isFinite(v)&&isFinite(t)) out.weight.push({t,v:/lb/i.test(unit)?Math.round(v*0.45359*10)/10:v});
    } else if(type==="HKCategoryTypeIdentifierSleepAnalysis"){
      const s=Date.parse(attr("startDate")||""), e=Date.parse(attr("endDate")||""), val=attr("value")||"";
      if(isFinite(s)&&isFinite(e)&&e>s&&!/InBed/i.test(val)){
        const d=new Date(s).toISOString().slice(0,10);
        out.sleepH[d]=(out.sleepH[d]||0)+(e-s)/36e5;
      }
    } else if(type==="HKQuantityTypeIdentifierRestingHeartRate"){
      const v=parseFloat(attr("value")), t=Date.parse(attr("startDate")||"");
      if(isFinite(v)&&isFinite(t)) out.rhr.push({t,v:Math.round(v)});
    }
  }
  return out;
}
function importHealthData(text,fname){
  const counts={weight:0,sleep:0,rhr:0};
  const mergeWeight=(arr)=>{
    for(const w of arr){
      if(!isFinite(w.t)||!isFinite(w.v)||w.v<20||w.v>400)continue;
      const day=new Date(w.t).toISOString().slice(0,10);
      if(!S.weightLog.some(x=>new Date(x.t).toISOString().slice(0,10)===day)){
        S.weightLog.push({t:w.t,v:Math.round(w.v*10)/10}); counts.weight++;
      }
    }
    S.weightLog.sort((a,b)=>a.t-b.t);
  };
  const t=text.trim();
  if(t.startsWith("<")||/\.xml$/i.test(fname)){
    const p=parseAppleHealthExport(t);
    mergeWeight(p.weight);
    // Schlaf nur in VORHANDENE Status-Einträge mergen — Energie/Stress/Kater werden nie erfunden.
    for(const [d,h] of Object.entries(p.sleepH)){
      const ex=S.readinessHistory.find(r=>r.date===d);
      if(ex){ex.sleepH=Math.round(Math.min(14,h)*10)/10; counts.sleep++;}
    }
    for(const r of p.rhr){ if(!S.rhrLog.some(x=>x.t===r.t)){S.rhrLog.push(r); counts.rhr++;} }
    S.rhrLog.sort((a,b)=>a.t-b.t);
    return counts;
  }
  try{
    const j=JSON.parse(t);
    const arr=Array.isArray(j)?j:(Array.isArray(j.weight)?j.weight:[]);
    mergeWeight(arr.map(x=>({t:typeof x.t==="number"?x.t:Date.parse(x.date||x.t||""),v:parseFloat(String(x.weight??x.v??"").toString().replace(",","."))})));
    return counts;
  }catch{}
  const rows=t.split(/\r?\n/).map(l=>l.split(/[;,]/)).filter(r=>r.length>=2);
  const ws=rows.map(r=>({t:Date.parse(r[0]),v:parseFloat(String(r[1]).replace(",","."))})).filter(x=>isFinite(x.t)&&isFinite(x.v));
  if(ws.length){ mergeWeight(ws); return counts; }
  return null;
}

      <p class="xs t2 mb8" style="line-height:1.6">Apple-Health-Export (<span class="metric">export.xml</span>), CSV (<span class="metric">datum,gewicht</span>) oder JSON. Übernommen werden: Gewicht → Verlauf · Schlafdauer → deine Status-Tage · Ruhepuls → Erholung.</p>
      <button class="btn mb8" onclick="document.getElementById('health-file').click()">${icon("plus",15)} Datei wählen (.xml / .csv / .json)</button>
      <input type="file" id="health-file" accept=".xml,.csv,.json,text/xml,application/json,text/csv" style="display:none" onchange="A.healthFile(this)">
      ${S.rhrLog.length?(()=>{const l7=S.rhrLog.slice(-7);const avg=Math.round(l7.reduce((s,x)=>s+x.v,0)/l7.length);
        return `<p class="xs t2 mb8">${S.rhrLog.length} Ruhepuls-Werte importiert · Ø zuletzt <span class="metric">${avg} bpm</span></p>`;})():""}
      <p class="xs t2" style="line-height:1.6"><b style="color:var(--t1)">Ehrlich gesagt:</b> Eine Live-Synchronisation mit HealthKit oder Google Fit ist aus einer Browser-App technisch nicht möglich. Der Import liest deine exportierte Datei — komplett lokal, nichts verlässt dein Gerät.</p></div>

    ${S.devMode?`<div class="card"><p class="ct">Dev: Demo-Daten</p>
      <p class="xs t2 mb8">Synthetische 10-Wochen-Historie zum Testen aller Analytics-Module. Nur im Developer-Modus sichtbar — echte Konten starten immer leer.</p>
      <div class="grid2">
        <button class="btn" onclick="A.loadDemoData()">Demo-Daten laden</button>
        <button class="btn" onclick="A.clearDemoData()">Historie leeren</button></div></div>`:""}

    <div class="card"><p class="ct">Daten</p>
      <!-- DSGVO: Export & Löschung sind in JEDEM Tier verfügbar — niemals gated. -->
      <button class="btn mb8" onclick="A.exportData()">Daten exportieren (JSON)</button>
      <button class="btn" style="border-color:rgba(255,77,77,.35);color:var(--danger)" onclick="A.wipe()">Konto & Daten löschen</button>
      <p class="xs t2 mt8">DSGVO Art. 17 / 20 · Alle Daten liegen lokal auf diesem Gerät.</p></div>
    <button class="btn ghost" onclick="A.logout()">⎋ Abmelden</button>
    <p class="xs" style="color:var(--t3);text-align:center;margin-top:16px">METRICGYM V4 · Performance Intelligence</p>`;
  // Foto-Thumbnails asynchron aus IndexedDB nachladen
  S.photos.slice(-8).forEach(async(p)=>{const d=await PDB.get(p.id);const el=document.getElementById("thumb-"+p.id);if(el&&d)el.style.backgroundImage=`url(${d})`;});
}

// ---------- Boot ----------
window.addEventListener("error",(e)=>{
  if(!root.innerText.trim()){
    root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
    <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(e.message||"unbekannt")}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
  }
});
try{ render(); }catch(err){
  root.innerHTML=`<div style="padding:32px 0"><p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:var(--volt)">GYM</span></p>
  <p class="sm t2" style="line-height:1.6" role="alert">Startfehler: ${String(err&&err.message||err)}<br><br>Öffne die Datei direkt in Chrome, Safari oder Firefox.</p></div>`;
}
</script>
</body>
</html>
