<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0B">
<title>METRICGYM</title>
<style>
  :root{
    --bg:#0A0A0B; --s1:#121214; --s2:#1A1A1E; --border:#26262B;
    --volt:#C8FF2E; --info:#5B8CFF; --danger:#FF4D4D; --warn:#FFB02E;
    --t1:#F5F5F4; --t2:#9C9CA6; --t3:#6E6E78;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:dark;}
  body{
    background:var(--bg); color:var(--t1);
    font-family:Inter,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .metric{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:430px; margin:0 auto; min-height:100dvh; padding:68px 16px 104px;}
  .wrap.noshell{padding-top:16px;}
  h1{font-size:17px; font-weight:600;}
  h2{font-size:23px; font-weight:600; line-height:1.3; margin-bottom:4px;}
  .hint{font-size:13px; color:var(--t2); margin-bottom:16px;}
  .card{background:var(--s1); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;}
  .ct{font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--t2); margin-bottom:12px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:48px; border-radius:999px; border:1px solid var(--border);
    background:var(--s2); color:var(--t1); font-size:15px; font-weight:500;
    cursor:pointer; transition:background .15s ease-out; font-family:inherit;
  }
  .btn:active{background:var(--s1);}
  .btn.volt{background:var(--volt); color:var(--bg); border:none; font-weight:600;}
  .btn.volt:active{opacity:.85;}
  .btn.ghost{background:transparent; border:none; color:var(--t2); min-height:44px;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--volt); outline-offset:2px;}
  .opt{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px;
    background:var(--s1); border:1px solid var(--border); border-radius:12px;
    color:var(--t1); font-size:15px; font-weight:500; cursor:pointer; font-family:inherit;
    transition:background .15s,border-color .15s; min-height:44px;
  }
  .opt:hover{background:var(--s2);}
  .opt.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.1); color:var(--volt);}
  .opt .sub{display:block; font-size:12px; color:var(--t2); font-weight:400; margin-top:2px;}
  .grid5{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .cell{
    padding:13px 2px; text-align:center; background:var(--s1); border:1px solid var(--border);
    border-radius:12px; color:var(--t1); font-size:17px; font-weight:600; cursor:pointer;
    font-family:"JetBrains Mono",monospace; min-height:44px;
  }
  .cell.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.1); color:var(--volt);}
  .cell.dash{border-style:dashed;}
  .progress{height:4px; flex:1; background:var(--s2); border-radius:999px; overflow:hidden;}
  .progress>div{height:100%; background:var(--volt); transition:width .3s ease-out;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back{background:none; border:none; color:var(--t2); font-size:22px; cursor:pointer; min-width:44px; min-height:44px;}
  input[type=range]{width:100%; height:44px; accent-color:var(--volt);}
  input[type=date],input[type=number],input[type=text],input[type=email],input[type=password]{
    width:100%; min-height:48px; padding:0 14px; background:var(--s2); color:var(--t1);
    border:1px solid var(--border); border-radius:12px; font-size:16px; font-family:inherit;
  }
  input.err{border-color:var(--danger);}
  input.ok{border-color:rgba(200,255,46,.5);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--t2); margin-bottom:5px;}
  .fielderr{font-size:12px; color:var(--danger); margin-top:4px; min-height:14px;}
  .dial{text-align:center; font-size:44px; font-weight:600; margin-bottom:8px;}
  .dial small{font-size:15px; color:var(--t2); font-weight:400;}
  .badge{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:500; border:1px solid;}
  .badge.info{color:var(--info); border-color:rgba(91,140,255,.3); background:rgba(91,140,255,.12);}
  .badge.volt{color:var(--volt); border-color:rgba(200,255,46,.3); background:rgba(200,255,46,.12);}
  .badge.danger{color:var(--danger); border-color:rgba(255,77,77,.3); background:rgba(255,77,77,.12);}
  .badge.warn{color:var(--warn); border-color:rgba(255,176,46,.3); background:rgba(255,176,46,.12);}
  .badge.mute{color:var(--t2); border-color:var(--border); background:var(--s2);}
  .warncard{border:1px solid rgba(255,176,46,.35); background:rgba(255,176,46,.08); border-radius:12px; padding:12px; margin-bottom:10px; font-size:13px; line-height:1.5;}
  .warncard b{color:var(--warn);}

  /* ---- Top App Bar: glassmorphism ---- */
  .appbar{
    position:fixed; top:0; left:0; right:0; z-index:45;
    background:rgba(10,10,11,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(38,38,43,.7);
  }
  .appbar-inner{max-width:430px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 14px; min-height:52px;}
  .logo{font-size:13px; font-weight:700; letter-spacing:2px; white-space:nowrap;}
  .appbar .title{flex:1; text-align:center; font-size:15px; font-weight:600;}
  .avatar{
    width:34px; height:34px; border-radius:50%; background:rgba(200,255,46,.15);
    border:1px solid rgba(200,255,46,.4); color:var(--volt); font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .bell{background:none; border:none; color:var(--t2); font-size:17px; cursor:pointer; min-width:38px; min-height:38px;}

  /* ---- Bottom Nav: 5 Tabs, Analytics zentriert + erhöht ---- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(18,18,20,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar-inner{max-width:430px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr);}
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px;
    background:none; border:none; color:var(--t2); font-size:9.5px; font-weight:500; cursor:pointer; font-family:inherit; min-height:44px;
  }
  .tab .ic{font-size:18px; line-height:1;}
  .tab.active{color:var(--volt);}
  .tab.flag .ic{
    display:flex; align-items:center; justify-content:center;
    width:48px; height:48px; margin-top:-22px; border-radius:50%;
    background:var(--s2); border:1px solid var(--border); font-size:21px;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  .tab.flag.active .ic{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.12); box-shadow:0 4px 18px rgba(200,255,46,.25);}

  /* ---- Floating Coach ---- */
  .fab{
    position:fixed; bottom:96px; right:16px; z-index:48;
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--volt),#9FD61F); color:var(--bg); font-size:23px;
    box-shadow:0 6px 20px rgba(200,255,46,.35); display:flex; align-items:center; justify-content:center;
  }
  .coach-panel{
    position:fixed; bottom:96px; right:16px; left:16px; max-width:398px; margin:0 auto; z-index:50;
  }

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper button{
    width:44px; height:44px; border-radius:999px; background:var(--s2); color:var(--t1);
    border:1px solid var(--border); font-size:20px; cursor:pointer;
  }
  .stepper .val{min-width:86px; text-align:center; font-size:18px;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{
    min-width:44px; height:44px; border-radius:999px; background:var(--s2); border:1px solid var(--border);
    color:var(--t2); font-family:"JetBrains Mono",monospace; font-size:14px; cursor:pointer; padding:0 8px;
  }
  .scale button.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.15); color:var(--volt);}
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; text-align:center; gap:18px;}
  .huge{font-size:54px; font-weight:700; color:var(--volt);}
  .spin{width:40px; height:40px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--volt); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .pulse{animation:pulse .6s ease-out infinite;}
  .fade{animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 14px; border-radius:999px; background:var(--s2); border:1px solid var(--border);
    color:var(--t1); font-size:12.5px; cursor:pointer; font-family:inherit; min-height:40px;
  }
  .chip:hover{border-color:rgba(200,255,46,.4);}
  .chip.sel{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.12); color:var(--volt);}
  .msg{max-width:88%; padding:11px 13px; border-radius:12px; font-size:13.5px; line-height:1.55; margin-bottom:9px;}
  .msg.user{margin-left:auto; background:rgba(200,255,46,.1); border:1px solid rgba(200,255,46,.3);}
  .msg.ai{background:var(--s1); border:1px solid var(--border);}
  .ring-lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--t2);}
  .list li{display:flex; justify-content:space-between; font-size:14px; padding:3px 0; list-style:none; color:var(--t1); gap:8px;}
  .list li span:last-child{color:var(--t2);}
  .volt-txt{color:var(--volt);} .danger-txt{color:var(--danger);} .warn-txt{color:var(--warn);} .t2{color:var(--t2);}
  .sm{font-size:13px;} .xs{font-size:11px;}
  .mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px;}
  .wday{
    background:var(--s1); border:1px solid var(--border); border-radius:10px; padding:8px 2px;
    text-align:center; cursor:pointer; min-height:44px; font-family:inherit; color:var(--t1);
  }
  .wday.today{border-color:rgba(200,255,46,.6);}
  .wday.rest{opacity:.55;}
  .wday .d{font-size:10px; color:var(--t2);}
  .wday .e{font-size:15px; line-height:1.3;}
  .wday .l{font-size:8.5px; color:var(--t2); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;}
  .pill{
    flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--s2); color:var(--t2); font-size:12px; cursor:pointer; font-family:inherit; min-height:38px;
  }
  .pill.active{border-color:rgba(200,255,46,.6); background:rgba(200,255,46,.12); color:var(--volt);}
  .setdots{display:flex; gap:6px; align-items:center;}
  .setdots .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--t3);}
  .setdots .dot.full{background:var(--volt); border-color:var(--volt);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .qcard{
    flex-shrink:0; width:140px; background:var(--s1); border:1px solid var(--border); border-radius:14px;
    padding:12px; cursor:pointer; font-family:inherit; color:var(--t1); text-align:left;
  }
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--s1); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:380px; width:100%; max-height:80dvh; overflow-y:auto;}
  .toast{
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%); z-index:70;
    background:var(--s2); border:1px solid var(--border); color:var(--t1);
    padding:10px 18px; border-radius:999px; font-size:13px; animation:fade .2s ease-out;
    max-width:90%; text-align:center;
  }
  details{margin-top:8px;}
  details summary{font-size:12px; color:var(--info); cursor:pointer; min-height:24px; list-style:none;}
  details summary::before{content:"ⓘ ";}
  details p{font-size:12px; color:var(--t2); line-height:1.55; margin-top:6px;}
  .strength-meter{height:5px; border-radius:999px; background:var(--s2); overflow:hidden; margin-top:6px;}
  .strength-meter>div{height:100%; transition:width .2s,background .2s;}
  .ac-list{background:var(--s2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:6px;}
  .ac-item{display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none; border-bottom:1px solid var(--border); color:var(--t1); font-size:14px; cursor:pointer; font-family:inherit; min-height:44px;}
  .ac-item:last-child{border-bottom:none;}
  .barrow{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .barrow .blbl{width:86px; font-size:11px; color:var(--t2); flex-shrink:0;}
  .barrow .btrack{flex:1; height:14px; background:var(--s2); border-radius:4px; overflow:hidden;}
  .barrow .bfill{height:100%; border-radius:4px;}
  .barrow .bval{width:62px; text-align:right; font-size:11px; color:var(--t2); flex-shrink:0;}
  .statuscard{
    background:var(--s1); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;
  }
  .statuscard.done{border-color:rgba(200,255,46,.4);}
  .statusdots{display:flex; justify-content:center; gap:4px; margin-top:8px;}
  .statusdots button{width:12px; height:12px; min-width:12px; padding:0; border-radius:50%; border:1.5px solid var(--border); background:var(--s2); cursor:pointer;}
  .statusdots button.on{background:var(--volt); border-color:var(--volt);}
  .iconbtn{background:none; border:none; color:var(--t2); font-size:18px; cursor:pointer; min-width:44px; min-height:44px;}
  .conf{font-size:10px; color:var(--t3); font-family:"JetBrains Mono",monospace;}
</style>
</head>
<body>
<div id="appbar"></div>
<div id="root" class="wrap">
  <noscript><div style="padding:32px 16px;color:#F5F5F4;font-family:system-ui">
    <p style="font-weight:700;letter-spacing:2px;margin-bottom:12px">METRIC<span style="color:#C8FF2E">GYM</span></p>
    <p style="color:#9C9CA6;font-size:14px;line-height:1.6">Diese App braucht JavaScript. Lade die Datei herunter und öffne sie direkt im Browser (Chrome, Safari, Firefox).</p></div></noscript>
</div>
<div id="tabbar"></div>
<div id="fab"></div>
<div id="overlay"></div>

<script>
"use strict";
/* =====================================================================
   METRICGYM V4 — Performance Intelligence Platform (Single-File-PWA)
   Prinzipien: Visual-first · keine erfundenen Metriken · User owns
   schedule · Voice-first Input · kontextueller Floating-Coach.
   ===================================================================== */

// ---------- Format ----------
const nf  = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const nfi = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const df  = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});
const dfLong = new Intl.DateTimeFormat("de-DE",{weekday:"long", day:"numeric", month:"long"});
const fmtKg=(v)=>nf.format(v)+" kg", fmtKcal=(v)=>nfi.format(v)+" kcal", fmtD=(d)=>df.format(d);
const todayKey=()=>new Date().toISOString().slice(0,10);
const dayMs=864e5;

// ---------- Storage ----------
const KEY="metricgym-v4";
const MEM={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch{ return MEM[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{ MEM[k]=v; } },
};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>store.set(KEY,JSON.stringify(S)),100); }

// ---------- Engine ----------
function mifflin(sex,age,h,w){ return Math.round(10*w+6.25*h-5*age+(sex==="male"?5:-161)); }
function katch(w,bf){ return Math.round(370+21.6*w*(1-bf/100)); }
function bmrCalc(a){ return a.bodyFat!=null?katch(a.weight,a.bodyFat):mifflin(a.sex,a.age,a.height,a.weight); }
const NEAT={sedentary:1.2,light:1.3,moderate:1.4,active:1.475,very_active:1.55};
function tdeeCalc(bmr,act,w,len,days){
  const rest=Math.round(bmr*NEAT[act]);
  const train=rest+Math.round(5.0*w*(len/60));
  return {rest,train,avg:Math.round((train*days+rest*(7-days))/7)};
}
const GOAL_D={muscle_gain:[.1,.1],fat_loss:[-.2,-.2],recomp:[.1,-.1],strength:[.05,.05],general:[0,0],endurance:[0,0],mobility:[0,0]};
const GOAL_LABEL={muscle_gain:"Muskelaufbau",fat_loss:"Fettabbau",recomp:"Recomp",strength:"Maximalkraft",general:"Fitness",endurance:"Ausdauer",mobility:"Mobility"};
function multiTargets(a,bmr,td){
  const goals=(a.goals&&a.goals.length?a.goals:[a.goal||"muscle_gain"]);
  const conflicts=[];
  let recompOverride=false;
  if(goals.includes("muscle_gain")&&goals.includes("fat_loss")){
    recompOverride=true;
    conflicts.push({type:"recomp",msg:"Muskelaufbau + Fettabbau = Recomp-Protokoll. Kalorienziel ±50 kcal um den TDEE.",bio:"Hoher Proteinbedarf schützt Muskelmasse im Defizit (Helms et al., 2014)."});
  }
  if(goals.includes("strength")&&goals.includes("endurance")){
    conflicts.push({type:"interference",msg:"Kraft + Ausdauer: Interferenzeffekt. Kraft vor Ausdauer, mind. 6 h Abstand.",bio:"Concurrent Training dämpft mTOR-Signalwege (Wilson et al., 2012)."});
  }
  const floor=a.sex==="female"?1400:1600, warn=[];
  const clamp=(k)=>{let v=k; if(v<bmr){v=bmr;warn.push("bmr");} if(v<floor){v=floor;warn.push("floor");} return Math.round(v);};
  let tk,rk;
  if(recompOverride){ tk=clamp(td.train+50); rk=clamp(td.rest-50); }
  else{
    const weights=goals.map((_,i)=>i===0?(goals.length===1?1:0.6):0.4/(goals.length-1));
    let bt=0,br=0;
    goals.forEach((g,i)=>{const d=GOAL_D[g]||GOAL_D.general; bt+=d[0]*weights[i]; br+=d[1]*weights[i];});
    tk=clamp(td.train*(1+bt)); rk=clamp(td.rest*(1+br));
  }
  let prot;
  if(a.bodyFat!=null) prot=Math.round(2.2*a.weight*(1-a.bodyFat/100));
  else prot=Math.round(1.8*Math.min(a.weight,25*(a.height/100)**2));
  const fat=Math.round(.9*a.weight);
  const mac=(k)=>({kcal:k,p:prot,f:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4))});
  return {train:mac(tk),rest:mac(rk),warn:[...new Set(warn)],conflicts,goals};
}
function e1rm(w,reps,rpe){
  if(reps===1) return w;
  const eff=reps+(10-(rpe??8));
  return Math.round(w*(1+eff/30)*10)/10;
}
function statusScore(sleep,energy,stress,sore){
  const c01=(x)=>Math.max(0,Math.min(1,x));
  const comps=[[.3,c01((sleep-1)/4)],[.25,c01((energy-1)/4)],[.2,c01(1-(stress-1)/4)],[.25,c01(1-(sore-1)/4)]];
  const score=Math.round(comps.reduce((s,c)=>s+c[0]*c[1],0)*100);
  const tier=score>=80?"Stark":score>=60?"Gut":score>=40?"Mäßig":"Erholung";
  return {score,tier};
}
function forecast12w(series){
  if(series.length<3) return null;
  const n=series.length;
  let st=0,sy=0,stt=0,sty=0;
  series.forEach((p)=>{st+=p.t;sy+=p.v;stt+=p.t*p.t;sty+=p.t*p.v;});
  const den=n*stt-st*st, slope=den===0?0:(n*sty-st*sy)/den, last=series[n-1];
  let vv=last.v, ss=slope; const pts=[];
  for(let b=0;b<3;b++){ vv+=ss*28; ss*=.85; pts.push({wk:(b+1)*4, v:Math.round(Math.min(vv,last.v*1.15)*10)/10}); }
  return pts;
}

// ---------- Auth ----------
async function hashPw(pw){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }catch{
    let h1=0x811c9dc5,h2=0x1000193;
    for(const c of pw){h1=Math.imul(h1^c.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+c.charCodeAt(0),2654435761)>>>0;}
    return "fnv-"+h1.toString(36)+h2.toString(36);
  }
}
function pwStrength(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10; if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const entropy=pw.length*Math.log2(pool||1);
  if(entropy<40)return{lbl:"schwach",pct:33,col:"var(--danger)"};
  if(entropy<60)return{lbl:"mittel",pct:66,col:"var(--warn)"};
  return{lbl:"stark",pct:100,col:"var(--volt)"};
}

function buildInsights(){

    const avgO=old.reduce((s,t)=>s+t.volume,0)/old.length, avgR=recent.reduce((s,t)=>s+t.volume,0)/recent.length;

    const avgR=Math.round(r7.reduce((s,x)=>s+x.score,0)/r7.length);
    if(flat&&avgR<65) out.push({t:`Bankdrücken stagniert — wahrscheinlichste Ursache: niedrige Erholungswerte (Ø Status ${avgR}/100).`,conf:70});
  }
  // Risk: Übertraining

  if(da) out.push({t:`Ernährungs-Adhärenz: ${da.pct} % der letzten ${da.n} Tage im Zielkorridor (±10 % kcal, ≥90 % Protein).`,conf:da.conf});
  // Adaptation Velocity (stärkster Lift mit ≥5 Datenpunkten)
  for(const lift of ["Kniebeuge","Bankdrücken","Kreuzheben"]){
    const av=adaptationVelocity(lift);
    if(av){
      const expl={schnell:"über dem Erwartungswert deines Trainingsalters — Bedingungen stimmen",normal:"im Erwartungsbereich — Progression läuft sauber",langsam:"unter Erwartung — prüfe Schlaf, Protein und Progressionsschema",stagnierend:"Plateau — Deload oder Variationswechsel angezeigt (Schoenfeld, 2017)"}[av.cls];
      out.push({t:`${lift}: ${av.pctPerMonth>=0?"+":""}${nf.format(av.pctPerMonth)} %/Monat e1RM — Adaption „${av.cls}": ${expl}.`,conf:av.conf});
      break;
    }
  }
  return out.slice(0,5);
}

function parseWorkout(input){
  const txt=input.trim().toLowerCase();
  let conf=0.3, name=null;
  const tokens=txt.replace(/[^a-zäöüß0-9\s,.]/g," ").split(/\s+/);
  for(const exName of ALL_EXERCISES){
    const words=exName.toLowerCase().split(/\s+/);
    if(words.some(w=>tokens.some(t=>t.length>=3&&(t.startsWith(w)||w.startsWith(t))))){ name=exName; conf+=0.3; break; }
  }
  const wMatch=txt.match(/(\d+[.,]?\d*)\s*(kg|kilo)/);
  const weight=wMatch?parseFloat(wMatch[1].replace(",",".")):null;
  if(weight!=null)conf+=0.15;
  let sets=null,reps=null;
  const sxr=txt.match(/(\d+)\s*x\s*(\d+)/);
  if(sxr){sets=parseInt(sxr[1]);reps=parseInt(sxr[2]);conf+=0.2;}
  else{
    const sMatch=txt.match(/(\d+)\s*(sätze|satz|sets)/);
    const rMatch=txt.match(/(\d+)\s*(wiederholungen|wdh|reps)/);
    if(sMatch){sets=parseInt(sMatch[1]);conf+=0.1;}
    if(rMatch){reps=parseInt(rMatch[1]);conf+=0.1;}
  }
  if(!name)return null;
  return {name,weight:weight??0,sets:sets??1,reps:reps??8,conf:Math.min(0.98,conf)};
}
function logParsedWorkout(pw){
  const now=Date.now();
  if(!S.liftLog[pw.name])S.liftLog[pw.name]=[];
  for(let i=0;i<pw.sets;i++) S.liftLog[pw.name].push({t:now+i,w:pw.weight,reps:pw.reps,rpe:8});
  const vol=Math.round(pw.weight*pw.reps*pw.sets);
  const existing=S.trainingHistory.find(t=>t.date===todayKey());
  if(existing){existing.sets+=pw.sets;existing.volume+=vol;}
  else S.trainingHistory.push({date:todayKey(),type:todayType(),sets:pw.sets,volume:vol,avgRpe:8});
  save();
}

function matchFood(segment){
  const tokens=segment.replace(/[^a-zäöüß0-9\s]/g," ").split(/\s+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)&&!["und","mit","ein","eine","einen","gramm"].includes(t));
  const found=FOODS.map(f=>{
    const words=f[0].toLowerCase().replace(/\(.*\)/,"").trim().split(/\s+/).filter(w=>w.length>=2);
    const hit=words.some(w=>tokens.some(t=>t.startsWith(w)||w.startsWith(t)));
    return hit?{f,len:f[0].length}:null;
  }).filter(Boolean).sort((a,b)=>a.len-b.len);
  return found.length?found[0].f:null;
}
function parseNutrition(input){
  // Multi-Item: "500g hähnchen und 300g reis, 2 tomaten"
  const segments=input.trim().toLowerCase().split(/\s*(?:,|und|\+|danach)\s*/).filter(Boolean);
  const items=[];
  for(const seg of segments){
    const food=matchFood(seg);
    if(!food){items.push({raw:seg,food:null});continue;}
    const gramMatch=seg.match(/(\d+)\s*(g|gramm)\b/);
    const countMatch=seg.match(/(\d+)\s*(stück|stk|x)\b/)||seg.match(/^(\d+)\s+/);
    const wordCount={ein:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5}[seg.split(/\s+/)[0]];
    const gram=gramMatch?parseInt(gramMatch[1]):null;
    const count=countMatch?parseInt(countMatch[1]):(wordCount||null);
    const g=gram??(count?food[1]*count:food[1]);
    let conf=0.55; if(gram||count)conf+=0.3; if(seg.includes(food[0].toLowerCase().split(" ")[0]))conf+=0.1;
    items.push({raw:seg,food,gram:g,conf:Math.min(0.97,conf)});
  }
  return items;
}
function nlogToday(){
  if(!S.nutritionLog[todayKey()])S.nutritionLog[todayKey()]={meals:[],water:0};
  if(S.nutritionLog[todayKey()].water==null)S.nutritionLog[todayKey()].water=0;
  return S.nutritionLog[todayKey()];
}
function addFood(food,gram){
  const mult=gram?gram/food[1]:1;
  const entry={n:food[0]+(gram&&gram!==food[1]?` (${gram} g)`:""),g:gram||food[1],
    k:Math.round(food[2]*mult),p:Math.round(food[3]*mult*10)/10,c:Math.round(food[4]*mult*10)/10,f:Math.round(food[5]*mult*10)/10};
  nlogToday().meals.push(entry); save();
  return entry;
}

function miniRing(label,v,t,unit,size=68){

function lineChart(series, fc){
  const all=[...series.map(p=>p.v), ...(fc||[]).map(p=>p.v)];
  const min=Math.min(...all)*.97, max=Math.max(...all)*1.03, W=340,H=190,P=8;
  const tMax=series[series.length-1].t+(fc?84*dayMs:0), tMin=series[0].t;
  const X=(t)=>P+(t-tMin)/(tMax-tMin||1)*(W-2*P), Y=(v)=>H-P-(v-min)/(max-min||1)*(H-2*P);
  const line=series.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  let dash="",band="";
  if(fc){
    const lt=series[series.length-1];
    const fpts=[{t:lt.t,v:lt.v},...fc.map((p)=>({t:lt.t+p.wk*7*dayMs,v:p.v}))];
    dash=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const up=fpts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v*(1+0.018*i)).toFixed(1)}`).join(" ");
    const lo=[...fpts].reverse().map((p,i)=>{const j=fpts.length-1-i;return `L${X(p.t).toFixed(1)},${Y(p.v*(1-0.018*j)).toFixed(1)}`;}).join(" ");
    band=`<path d="${up} ${lo} Z" fill="var(--volt)" opacity=".08"/>`;
  }
  const ticks=[0,.33,.66,1].map((f)=>{const t=tMin+f*(tMax-tMin);
    return `<text x="${X(t)}" y="${H-2}" fill="var(--t3)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmtD(new Date(t))}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;aspect-ratio:16/10;display:block" aria-hidden="true">
    ${band}<path d="${line}" fill="none" stroke="var(--volt)" stroke-width="2"/>
    ${dash?`<path d="${dash}" fill="none" stroke="var(--volt)" stroke-width="1.5" stroke-dasharray="5 4"/>`:""}${ticks}</svg>`;
}
function donutSVG(parts,size=110){

    off+=len; return s;
  }).join("");
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">${segs}</svg>`;
}

let coachOpen=false;
function coachContext(){
  const p=S.profile, tab=S.tab;
  const log=nlogToday(), sum=log.meals.reduce((s,m)=>({k:s.k+m.k,p:s.p+m.p}),{k:0,p:0});
  if(tab==="nutrition"||tab==="home"){
    const restP=Math.max(0,(p?p.tg.train.p:0)-Math.round(sum.p));
    return {chips:["Wie viel Protein fehlt heute noch?","Was ist ein gutes Abendessen?","Wie viele Kalorien habe ich noch?"],
      answers:{
        "Wie viel Protein fehlt heute noch?":`Dir fehlen heute noch ${nfi.format(restP)} g Protein (${nfi.format(sum.p)} von ${nfi.format(p?p.tg.train.p:0)} g geloggt). Magerquark, Hähnchen oder ein Shake schließen die Lücke effizient.`,
        "Wie viele Kalorien habe ich noch?":`Du hast ${fmtKcal(sum.k)} geloggt — bleiben ${fmtKcal(Math.max(0,(p?p.tg.train.kcal:0)-sum.k))} bis zum Trainingstagesziel.`,
        "Was ist ein gutes Abendessen?":`Mit ${nfi.format(restP)} g offenem Protein: 200 g Hähnchen + 150 g Reis + Gemüse ≈ 560 kcal, 65 g Protein. Passt in dein verbleibendes Budget.`,
      }};
  }
  if(tab==="train"||tab==="player"||tab==="summary"){
    const next=nextTrainingType();
    return {chips:["Wie steigere ich meine Bank?","Was trainiere ich heute?","Wie lange Pause zwischen Sätzen?"],
      answers:{
        "Wie steigere ich meine Bank?":bestE1("Bankdrücken")>0?`Dein Bank-e1RM liegt bei ${fmtKg(bestE1("Bankdrücken"))}. Bleib bei 5–8 Reps, +2,5 kg sobald alle Sätze bei RPE ≤ 8 sitzen. Stagniert es 3 Sessions: ein Deload, dann Schrägbank als Variation.`:"Logge zuerst 2–3 Bank-Sessions, dann kann ich deine Progression konkret steuern.",
        "Was trainiere ich heute?":todayType()==="rest"?`Heute ist Erholung geplant${next?` — nächste Session: ${TYPES[next].label}`:""}. Spazieren, Mobility, Schlaf.`:`Heute steht ${TYPES[todayType()].label} an: ${TYPES[todayType()].ex.length} Übungen. Starte im Training-Tab.`,
        "Wie lange Pause zwischen Sätzen?":"Grundübungen 2,5–3 Min, Isolation 60–90 s. Längere Pausen = mehr Volumen-Qualität (Grgic et al., 2018).",
      }};
  }
  if(tab==="analytics"){
    const ins=buildInsights();
    return {chips:["Erkläre meinen Trend","Wo ist mein größtes Risiko?","Was soll ich diese Woche ändern?"],
      answers:{
        "Erkläre meinen Trend":ins.length?ins[0].t+` (Konfidenz ${ins[0].conf} %)`:"Noch nicht genug Daten für eine Trend-Analyse — logge weiter, ab ~7 Tagen wird es belastbar.",
        "Wo ist mein größtes Risiko?":(ins.find(i=>i.risk)||{t:"Aktuell kein erhöhtes Risiko erkennbar — Intensität und Adhärenz liegen im grünen Bereich."}).t,
        "Was soll ich diese Woche ändern?":ins.length>1?ins[1].t:"Halte den Kurs: konsistente Sessions schlagen jede Optimierung.",
      }};
  }
  return {chips:["Was sagt mein Status heute?","Wie baue ich am schnellsten Muskeln auf?"],
    answers:{
      "Was sagt mein Status heute?":S.checkin?`Dein Status: ${S.checkin.score}/100 (${S.checkin.tier}). ${S.checkin.score>=60?"Training wie geplant.":"Heute Intensität deckeln (RPE 7)."}`:"Mach zuerst deinen Status-Check im Home-Tab — dauert 10 Sekunden.",
      "Wie baue ich am schnellsten Muskeln auf?":"Drei Hebel in dieser Reihenfolge: Progressive Überladung (jede Woche +Reps oder +2,5 kg), 1,8–2,2 g/kg Protein täglich, 7–9 h Schlaf. Alles andere ist Feintuning (Schoenfeld, 2017).",
    }};
}
function renderFab(){
  A.coach=()=>{coachOpen=!coachOpen;renderFab();};
  A.coachAsk=(q)=>{
    const ctx=coachContext();
    S.chat.push({r:"user",t:q});
    S.chat.push({r:"ai",t:ctx.answers[q]||"Dazu habe ich noch keine Daten — logge weiter, dann wird meine Antwort konkret."});
    save(); renderFab();
  };
  A.coachVoice=()=>speech((txt)=>{const inp=document.getElementById("coach-in"); if(inp){inp.value=txt; A.coachSend();}},"co-mic");
  A.coachSend=()=>{
    const inp=document.getElementById("coach-in");
    if(!inp||!inp.value.trim())return;
    const q=inp.value.trim();
    const ctx=coachContext();
    const hit=Object.keys(ctx.answers).find(k=>k.toLowerCase().split(" ").some(w=>w.length>4&&q.toLowerCase().includes(w)));
    S.chat.push({r:"user",t:q});
    S.chat.push({r:"ai",t:hit?ctx.answers[hit]:"Gute Frage — in der Vollversion beantworte ich das mit deinen Live-Daten über die AI-API. Probier die Vorschläge unten."});
    save(); renderFab();
  };
  if(!coachOpen){
    fabEl.innerHTML=`<button class="fab" onclick="A.coach()" aria-label="Coach öffnen">💬</button>`;
    return;
  }
  const ctx=coachContext();
  fabEl.innerHTML=`<div class="coach-panel"><div class="card fade" style="border-color:rgba(200,255,46,.4);box-shadow:0 8px 32px rgba(0,0,0,.55);margin:0">
    <div class="row mb8"><p class="ct" style="margin:0">💬 Coach · ${TAB_TITLES[S.tab]||"Kontext"}</p>
      <button class="btn ghost" style="width:auto" onclick="A.coach()" aria-label="Schließen">✕</button></div>
    <div id="coach-chat" style="max-height:200px;overflow-y:auto;margin-bottom:8px">
      ${S.chat.slice(-6).map(m=>`<div class="msg ${m.r==="user"?"user":"ai"}">${m.t}</div>`).join("")||'<p class="xs t2">Der Coach kennt deinen aktuellen Screen-Kontext.</p>'}</div>
    <div class="chips mb8">${ctx.chips.map(c=>`<button class="chip" onclick="A.coachAsk('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("")}</div>
    <div class="row">
      <button id="co-mic" class="btn" style="width:48px;min-width:48px" onclick="A.coachVoice()" aria-label="Sprechen">🎤</button>
      <input type="text" id="coach-in" placeholder="Frag deinen Coach …" style="flex:1;border-radius:999px" onkeydown="if(event.key==='Enter')A.coachSend()">
      <button class="btn volt" style="width:48px;min-width:48px" onclick="A.coachSend()" aria-label="Senden">➤</button></div>
  </div></div>`;
  const cc=document.getElementById("coach-chat"); if(cc)cc.scrollTop=cc.scrollHeight;
}

function renderApp(){
  if(!S.profile){ S.screen="onboarding"; save(); render(); return; }
  if(S.tab==="home") renderHome();
  else if(S.tab==="train") renderTrain();
  else if(S.tab==="player") renderPlayer();
  else if(S.tab==="summary") renderSummary();
  else if(S.tab==="analytics") renderAnalytics();
  else if(S.tab==="nutrition") renderNutrition();
  else if(S.tab==="profile") renderProfile();
  else renderHome();
}

// =====================================================================
// AUTH (Landing · Login · Register · Developer-Modus)
// =====================================================================
function renderAuth(){
  if(S.screen==="register") return renderRegister();
  if(S.screen==="login") return renderLogin();
  A.toRegister=()=>{S.screen="register";save();render();};
  A.toLogin=()=>{S.screen="login";save();render();};
  A.devMode=()=>{
    // Developer-Modus: Demo-Konto + komplette Demo-Historie, Onboarding übersprungen.
    if(!S.users.some(u=>u.email==="dev@metricgym.app"))
      S.users.push({username:"Dev",email:"dev@metricgym.app",pwHash:"dev"});
    S.currentUser=S.users.findIndex(u=>u.email==="dev@metricgym.app");
    S.devMode=true;
    const a={sex:"male",age:29,height:181,weight:82,bodyFat:15,goals:["muscle_gain","fat_loss"],exp:"intermediate",days:4,len:60,act:"light",sleep:7,stress:2};
    const bmr=bmrCalc(a), td=tdeeCalc(bmr,a.act,a.weight,a.len,a.days);
    S.profile={a,bmr,td,tg:multiTargets(a,bmr,td)};
    const seed=buildDevSeed();
    S.liftLog=seed.liftLog; S.weightLog=seed.weightLog; S.readinessHistory=seed.readinessHistory;
    S.trainingHistory=seed.trainingHistory; S.nutritionLog=seed.nutritionLog;
    S.schedule=suggestSchedule(4);
    S.screen="app"; S.tab="home";
    save(); render();
    toast("Developer-Modus: Demo-Konto mit 10 Wochen Historie generiert");
  };
  root.innerHTML=`<div class="center fade">
    <div>
      <p style="font-size:34px;font-weight:700;letter-spacing:3px">METRIC<span class="volt-txt">GYM</span></p>
      <p class="sm t2 mt8" style="max-width:290px">Versteh, warum dein Fortschritt passiert — nicht nur, dass er passiert.</p>
    </div>
    <div style="width:100%;max-width:300px">
      <button class="btn volt mb8" onclick="A.toRegister()">Konto erstellen</button>
      <button class="btn mb8" onclick="A.toLogin()">Anmelden</button>
      <button class="btn ghost" onclick="A.devMode()">⚙ Developer-Modus</button>
    </div>
    <div class="row" style="gap:14px;justify-content:center">
      <span class="xs t2">Kein Abo</span><span class="xs" style="color:var(--t3)">·</span>
      <span class="xs t2">Daten lokal</span><span class="xs" style="color:var(--t3)">·</span>
      <span class="xs t2">DSGVO</span>
    </div></div>`;
}

function renderRegister(){
  A.back=()=>{S.screen="landing";save();render();};
  A.vUser=(el)=>{el.classList.toggle("err",el.value.length>0&&el.value.length<3);el.classList.toggle("ok",el.value.length>=3);};
  A.vMail=(el)=>{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value);el.classList.toggle("err",el.value.length>0&&!ok);el.classList.toggle("ok",ok);};
  A.vPw=(el)=>{
    const s=pwStrength(el.value), m=document.getElementById("pwmeter"), lbl=document.getElementById("pwlbl");
    if(m){m.style.width=s.pct+"%";m.style.background=s.col;} if(lbl){lbl.textContent=el.value?("Stärke: "+s.lbl):"";}
    el.classList.toggle("err",el.value.length>0&&el.value.length<8);el.classList.toggle("ok",el.value.length>=8);
  };
  A.vPw2=(el)=>{const pw=document.getElementById("r-pw").value;el.classList.toggle("err",el.value.length>0&&el.value!==pw);el.classList.toggle("ok",el.value.length>0&&el.value===pw);};
  A.register=async()=>{
    const u=document.getElementById("r-user").value.trim();
    const e=document.getElementById("r-mail").value.trim().toLowerCase();
    const p=document.getElementById("r-pw").value;
    const p2=document.getElementById("r-pw2").value;
    const err=document.getElementById("r-err");
    err.textContent="";
    if(u.length<3){err.textContent="Benutzername: mindestens 3 Zeichen.";return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){err.textContent="Bitte gültige E-Mail-Adresse angeben.";return;}
    if(p.length<8){err.textContent="Passwort: mindestens 8 Zeichen.";return;}
    if(p!==p2){err.textContent="Passwörter stimmen nicht überein.";return;}
    if(S.users.some(x=>x.email===e)){err.textContent="Diese E-Mail ist bereits registriert.";return;}
    const pwHash=await hashPw(p);
    S.users.push({username:u,email:e,pwHash});
    S.currentUser=S.users.length-1; S.devMode=false;
    S.screen="onboarding"; S.step=0;
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Konto erstellen</h2></div>
    <div class="field"><label for="r-user">Benutzername</label>
      <input type="text" id="r-user" autocomplete="username" oninput="A.vUser(this)" placeholder="mind. 3 Zeichen"></div>
    <div class="field"><label for="r-mail">E-Mail</label>
      <input type="email" id="r-mail" autocomplete="email" oninput="A.vMail(this)" placeholder="du@beispiel.de"></div>
    <div class="field"><label for="r-pw">Passwort</label>
      <input type="password" id="r-pw" autocomplete="new-password" oninput="A.vPw(this)" placeholder="mind. 8 Zeichen">
      <div class="strength-meter"><div id="pwmeter" style="width:0"></div></div>
      <p class="xs t2 mt8" id="pwlbl" style="min-height:14px"></p></div>
    <div class="field"><label for="r-pw2">Passwort bestätigen</label>
      <input type="password" id="r-pw2" autocomplete="new-password" oninput="A.vPw2(this)"></div>
    <p class="fielderr" id="r-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.register()">Registrieren & Assessment starten</button>
    <p class="xs t2 mt16" style="text-align:center">SHA-256-Hash, nie Klartext. Daten bleiben auf diesem Gerät.</p></div>`;
}

function renderLogin(){
  A.back=()=>{S.screen="landing";save();render();};
  A.forgot=()=>modal(`<p class="ct">Passwort vergessen?</p><p class="sm t2" style="line-height:1.6">Demo-Modus: Passwort-Reset via E-Mail ist nicht verfügbar — lösche den LocalStorage dieser Seite, um alle Konten zurückzusetzen.</p>`);
  A.login=async()=>{
    const err=document.getElementById("l-err");
    err.textContent="";
    if(S.lockoutUntil&&Date.now()<S.lockoutUntil){
      err.textContent=`Zu viele Versuche. Warte ${Math.ceil((S.lockoutUntil-Date.now())/1000)} s.`;return;
    }
    const e=document.getElementById("l-mail").value.trim().toLowerCase();
    const p=document.getElementById("l-pw").value;
    const idx=S.users.findIndex(x=>x.email===e);
    const hash=await hashPw(p);
    if(idx<0||S.users[idx].pwHash!==hash){
      S.loginAttempts=(S.loginAttempts||0)+1;
      if(S.loginAttempts>=5){S.lockoutUntil=Date.now()+30000;S.loginAttempts=0;
        err.textContent="5 Fehlversuche — Login für 30 Sekunden gesperrt.";}
      else err.textContent=`E-Mail oder Passwort falsch (Versuch ${S.loginAttempts}/5).`;
      save();return;
    }
    S.currentUser=idx; S.loginAttempts=0; S.lockoutUntil=null;
    S.screen=S.profile?"app":"onboarding"; S.tab="home";
    save(); render();
  };
  root.innerHTML=`<div class="fade" style="padding-top:8px">
    <div class="topbar"><button class="back" onclick="A.back()" aria-label="Zurück">‹</button><h2>Anmelden</h2></div>
    <div class="field"><label for="l-mail">E-Mail</label>
      <input type="email" id="l-mail" autocomplete="email"></div>
    <div class="field"><label for="l-pw">Passwort</label>
      <input type="password" id="l-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')A.login()"></div>
    <p class="fielderr" id="l-err" role="alert"></p>
    <button class="btn volt mt8" onclick="A.login()">Anmelden</button>
    <button class="btn ghost mt8" onclick="A.forgot()">Passwort vergessen?</button></div>`;
}

// =====================================================================
// ONBOARDING (kompakt — 10 Fragen)
// =====================================================================
const STEPS=[
  {id:"sex",q:"Biologisches Geschlecht",type:"single",key:"sex",opts:[["male","Männlich"],["female","Weiblich"]]},
  {id:"age",q:"Wie alt bist du?",type:"dial",key:"age",min:16,max:80,step:1,unit:"Jahre",def:29},
  {id:"height",q:"Wie groß bist du?",type:"dial",key:"height",min:140,max:215,step:1,unit:"cm",def:181},
  {id:"weight",q:"Wie viel wiegst du?",type:"dial",key:"weight",min:40,max:180,step:0.5,unit:"kg",def:82},
  {id:"bf",q:"Körperfett (Schätzung)",type:"single",key:"bodyFat",skip:true,
   opts:[[12,"10–13 %"],[15,"13–16 %"],[18,"16–20 %"],[22,"20–24 %"],[26,"24–28 %"],[30,"28–33 %"]]},
  {id:"goals",q:"Deine Ziele",hint:"Bis zu 3 — das erste zählt am stärksten.",type:"multi",key:"goals",max:3,
   opts:[["muscle_gain","Muskelaufbau",""],["fat_loss","Fettabbau",""],["strength","Maximalkraft",""],["general","Allgemeine Fitness",""],["endurance","Ausdauer",""],["mobility","Mobility",""]]},
  {id:"exp",q:"Trainingserfahrung",type:"single",key:"exp",
   opts:[["beginner","Unter 1 Jahr"],["novice","1–2 Jahre"],["intermediate","2–4 Jahre"],["advanced","Über 4 Jahre"]]},
  {id:"injury",q:"Verletzungen oder Einschränkungen?",hint:"Optional — riskante Übungen werden im Plan markiert und Alternativen vorgeschlagen.",type:"multi",key:"injuries",max:3,skip:true,
   opts:[["knee","Knie",""],["back","Rücken / LWS",""],["shoulder","Schulter",""]]},
  {id:"days",q:"Trainingstage pro Woche",type:"cells",key:"days",opts:[2,3,4,5,6],unit:"Tage"},
  {id:"act",q:"Alltag ohne Training",type:"single",key:"act",
   opts:[["sedentary","Sitzend"],["light","Etwas Bewegung"],["moderate","Regelmäßig auf den Beinen"],["active","Aktiver Beruf"],["very_active","Schwere Arbeit"]]},
  {id:"medical",type:"medical"},
  {id:"reveal",type:"reveal"},
];
const QCOUNT=STEPS.filter(s=>!["reveal"].includes(s.type)).length;

function renderOnboarding(){
  const st=STEPS[S.step]||STEPS[0];
  const qNum=Math.min(QCOUNT,S.step+1);
  const bar=`<div class="topbar">
    <button class="back" onclick="A.back()" aria-label="Zurück">‹</button>
    <div class="progress"><div style="width:${qNum/QCOUNT*100}%"></div></div>
    <span class="metric xs t2">${qNum}/${QCOUNT}</span></div>`;
  A.back=()=>{ if(S.step>0){S.step--;save();render();} else {S.currentUser=null;S.screen="landing";save();render();} };
  A.next=()=>{S.step++;save();render();};
  A.pick=(k,v)=>{ S.a[k]=v; save(); setTimeout(A.next,130); };
  A.dial=(k,v)=>{ S.a[k]=parseFloat(v); save(); const el=document.getElementById("dialv"); if(el)el.textContent=nf.format(S.a[k]); };
  A.multi=(k,v,max)=>{
    const cur=S.a[k]||[];
    let next=cur.includes(v)?cur.filter(x=>x!==v):(cur.length<max?[...cur,v]:null);
    if(next===null){toast(`Maximal ${max} Auswahlen`);return;}
    S.a[k]=next; save(); render();
  };
  if(st.type==="single"){
    root.innerHTML=bar+`<div class="fade"><h2>${st.q}</h2><p class="hint">${st.hint||""}</p>
      ${st.opts.map(([v,l])=>`<button class="opt ${S.a[st.key]===v?"sel":""}" onclick="A.pick('${st.key}',${typeof v==="string"?`'${v}'`:v})">${l}</button>`).join("")}
      ${st.skip?`<button class="btn ghost" onclick="A.next()">Überspringen</button>`:""}</div>`;
  }
  else if(st.type==="multi"){
    const sel=S.a[st.key]||[];
    root.innerHTML=bar+`<div class="fade"><h2>${st.q}</h2><p class="hint">${st.hint||""}</p>
      ${st.opts.map(([v,l])=>`<button class="opt ${sel.includes(v)?"sel":""}" onclick="A.multi('${st.key}','${v}',${st.max})">
        ${sel.includes(v)?`<span class="metric xs" style="margin-right:6px">${sel.indexOf(v)+1}.</span>`:""}${l}</button>`).join("")}
      <button class="btn volt mt8" onclick="A.next()" ${sel.length===0&&!st.skip?"disabled":""}>Weiter${sel.length?` (${sel.length})`:""}</button>
      ${st.skip?`<button class="btn ghost" onclick="A.next()">Überspringen</button>`:""}</div>`;
  }
  else if(st.type==="dial"){
    const v=S.a[st.key]??st.def; S.a[st.key]=v;
    root.innerHTML=bar+`<div class="fade"><h2>${st.q}</h2><p class="hint"></p>
      <p class="dial metric"><span id="dialv">${nf.format(v)}</span> <small>${st.unit}</small></p>
      <input type="range" min="${st.min}" max="${st.max}" step="${st.step}" value="${v}" oninput="A.dial('${st.key}',this.value)" aria-label="${st.unit}">
      <div class="mt16"><button class="btn volt" onclick="A.next()">Weiter</button></div></div>`;
  }
  else if(st.type==="cells"){
    root.innerHTML=bar+`<div class="fade"><h2>${st.q}</h2><p class="hint"></p>
      <div class="grid5">
      ${st.opts.map(v=>`<button class="cell ${S.a[st.key]===v?"sel":""}" onclick="A.pick('${st.key}',${v})">${v}</button>`).join("")}</div>
      <p class="hint mt8" style="text-align:center">${st.unit}</p></div>`;
  }
  else if(st.type==="medical"){
    root.innerHTML=bar+`<div class="fade"><h2>Bevor es losgeht</h2>
      <p class="hint">METRICGYM ersetzt keine medizinische Beratung. Bei Herz-Kreislauf-Problemen, Schwindel oder attestierten Einschränkungen: vorher ärztlich abklären.</p>
      <label class="card row" style="cursor:pointer">
        <input type="checkbox" id="med" style="width:20px;height:20px;accent-color:var(--volt)" onchange="document.getElementById('mednext').disabled=!this.checked">
        <span class="sm" style="flex:1">Verstanden. Ich trainiere eigenverantwortlich.</span></label>
      <button class="btn volt" id="mednext" disabled onclick="A.next()">Weiter</button></div>`;
  }
  else if(st.type==="reveal"){
    root.innerHTML=`<div class="center"><div class="spin"></div><p class="sm t2">Engine berechnet …</p></div>`;
    setTimeout(()=>{
      const a={...S.a,days:S.a.days||4,len:60,act:S.a.act||"light",sex:S.a.sex||"male",age:S.a.age||29};
      if(!a.goals||!a.goals.length)a.goals=["muscle_gain"];
      const bmr=bmrCalc(a), td=tdeeCalc(bmr,a.act,a.weight,a.len,a.days);
      S.profile={a,bmr,td,tg:multiTargets(a,bmr,td)};
      S.scheduleSuggestion=suggestSchedule(a.days);
      S.weightLog=[{t:Date.now(),v:a.weight}];
      save(); renderReveal();
    },1300);
  }
}

function renderReveal(){
  const p=S.profile, tg=p.tg;
  A.startApp=()=>{S.screen="app";S.tab="home";save();render();};
  root.innerHTML=`<div class="fade">
    <h2 class="mb16">Dein Performance-Profil</h2>
    <div class="row mb8" style="justify-content:flex-start;flex-wrap:wrap;gap:6px">
      ${tg.goals.map((g,i)=>`<span class="badge ${i===0?"volt":"mute"}">${i===0?"Primär: ":""}${GOAL_LABEL[g]}</span>`).join("")}
    </div>
    ${tg.conflicts.map(c=>`<div class="warncard" role="alert"><b>Hinweis:</b> ${c.msg}<br><i style="color:var(--t2)">${c.bio}</i></div>`).join("")}
    <div class="card">
      <div class="grid2 mb16">
        <div><p class="xs t2">Grundumsatz ${infoBtn("bmr")}</p><p class="metric" style="font-size:24px;font-weight:600">${fmtKcal(p.bmr)}</p></div>

    const inf=EXINFO[name]||{prim:"—",sek:"—",cues:[]};

      ${voicePreview?`<div class="warncard" style="border-color:rgba(200,255,46,.4);background:rgba(200,255,46,.06)">

let pw=null,pr=null,prpe=8;
const RPE_DESC={7:"2–3 Reps Reserve",8:"1–2 Reps Reserve",9:"1 Rep Reserve",10:"Max-Anstrengung"};
function renderPlayer(){
  const type=S.playerType||todayType();
  if(type==="rest"){S.tab="train";save();render();return;}
  const day=TYPES[type], ex=day.ex[S.exIdx];
  if(!ex){S.tab="summary";save();render();return;}
  const [name,setsBase,repsRange,rest]=ex;
  const rec=recommend(name);
  if(pw===null){pw=rec?rec.w:20;pr=rec?rec.reps:8;prpe=8;}
  const logged=S.logged.filter(l=>l.n===name);
  const targetSets=S.currentWeek===4?Math.max(1,Math.round(setsBase*.6)):setsBase;
  A.step=(k,d)=>{ if(k==="w"){pw=Math.max(0,Math.round((pw+d*2.5)*10)/10);} if(k==="r"){pr=Math.max(1,pr+d);} renderPlayer(); };
  A.rpe=(v)=>{prpe=v;renderPlayer();};
  A.log=()=>{
    S.logged.push({n:name,w:pw,reps:pr,rpe:prpe,ts:Date.now()});
    if(!S.liftLog[name])S.liftLog[name]=[];
    S.liftLog[name].push({t:Date.now(),w:pw,reps:pr,rpe:prpe});
    const e1=e1rm(pw,pr,prpe), prevAll=S.liftLog[name].slice(0,-1);
    const prev=prevAll.reduce((m,s)=>s.w>0?Math.max(m,e1rm(s.w,s.reps,s.rpe)):m,0);
    if(prev>0&&e1>prev&&(!S.prToday||e1-prev>S.prToday.delta)) S.prToday={n:name,e1,delta:Math.round((e1-prev)*10)/10};
    if(rest>0)S.restEnd=Date.now()+rest*1000;
    save(); renderPlayer();
  };
  A.skipRest=()=>{S.restEnd=null;save();renderPlayer();};
  A.jump=(i)=>{pw=null;S.exIdx=i;save();render();};
  A.finish=()=>{
    pw=null;
    const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));
    const rpes=S.logged.map(l=>l.rpe);
    const existing=S.trainingHistory.find(t=>t.date===todayKey());
    if(existing){existing.sets+=S.logged.length;existing.volume+=vol;}
    else S.trainingHistory.push({date:todayKey(),type,sets:S.logged.length,volume:vol,
      avgRpe:rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:8});
    S.tab="summary"; S.restEnd=null; save(); render();
  };
  let restHtml="";
  if(S.restEnd&&S.restEnd>Date.now()){
    const left=Math.max(0,(S.restEnd-Date.now())/1000);
    restHtml=`<div class="card row"><div><p class="ct" style="margin-bottom:2px">Pause</p>
      <button class="btn ghost" style="width:auto;padding:0" onclick="A.skipRest()">Beenden</button></div>
      ${circleTimer(left,rest)}</div>`;
    clearTimeout(timerInt); timerInt=setTimeout(()=>{ if(S.tab==="player") renderPlayer(); },250);
  } else if(S.restEnd){
    restHtml=`<div class="card row"><p class="metric volt-txt pulse" style="font-size:28px;font-weight:600">0:00</p>
      <button class="btn ghost" style="width:auto" onclick="A.skipRest()">OK</button></div>`;
  }
  const progressPct=((S.exIdx)/day.ex.length+((logged.length/targetSets)/day.ex.length))*100;
  root.innerHTML=`
    <div class="progress mb8" aria-label="Fortschritt"><div style="width:${Math.min(100,progressPct)}%"></div></div>
    <p class="ring-lbl mb8">${day.emoji} ${day.label} · Übung ${S.exIdx+1}/${day.ex.length}${S.currentWeek===4?" · Deload":""}</p>
    <div class="pills">${day.ex.map((e,i)=>`<button class="pill ${i===S.exIdx?"active":""}" onclick="A.jump(${i})">${e[0].length>16?e[0].slice(0,15)+"…":e[0]}</button>`).join("")}</div>
    <div class="card">
      <div class="row mb4"><h2 style="font-size:19px">${name}</h2>
        <button class="iconbtn" onclick="A.exInfo('${name}')" aria-label="Info">ⓘ</button></div>
      ${rec?`<p class="sm volt-txt metric mb8">Engine: ${fmtKg(rec.w)} × ${rec.reps}
        <button class="iconbtn" style="min-width:28px;min-height:20px;font-size:11px" onclick="A.recWhy('${name}')" aria-label="Warum?">ⓘ</button></p>`
        :`<p class="xs t2 mb8">Erste Session — wähle dein Startgewicht selbst.</p>`}
      <div class="row mb12"><p class="ct" style="margin:0">Sätze</p>
        <div class="setdots" aria-label="${logged.length} von ${targetSets}">${Array.from({length:targetSets},(_,i)=>`<span class="dot ${i<logged.length?"full":""}"></span>`).join("")}</div></div>
      <div class="row mb8"><span class="sm t2">Gewicht</span>
        <div class="stepper"><button onclick="A.step('w',-1)" aria-label="Gewicht verringern">−</button><span class="val metric">${fmtKg(pw)}</span><button onclick="A.step('w',1)" aria-label="Gewicht erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">Reps</span>
        <div class="stepper"><button onclick="A.step('r',-1)" aria-label="Reps verringern">−</button><span class="val metric">${pr}</span><button onclick="A.step('r',1)" aria-label="Reps erhöhen">+</button></div></div>
      <div class="row mb8"><span class="sm t2">RPE</span>
        <div class="scale">${[7,8,9,10].map(v=>`<button class="${prpe===v?"sel":""}" onclick="A.rpe(${v})" title="${RPE_DESC[v]}" aria-label="RPE ${v}">${v}</button>`).join("")}</div></div>
      <p class="xs t2 mb8" style="text-align:right">${RPE_DESC[prpe]}</p>
      <button class="btn volt" onclick="A.log()">Set loggen</button>
      ${logged.length?`<ul class="list mt16" style="border-top:1px solid var(--border);padding-top:10px">
        ${logged.map(l=>`<li><span class="metric">${fmtKg(l.w)} × ${l.reps}</span><span class="metric">RPE ${l.rpe}</span></li>`).join("")}</ul>`:""}
    </div>
    ${restHtml}
    <div class="grid2 mb8">
      <button class="btn" ${S.exIdx===0?"disabled":""} onclick="A.jump(${S.exIdx-1})">‹ Vorherige</button>
      <button class="btn" ${S.exIdx>=day.ex.length-1?"disabled":""} onclick="A.jump(${S.exIdx+1})">Nächste ›</button></div>
    <button class="btn" onclick="A.finish()">Session abschließen</button>`;
}

  const vol=Math.round(S.logged.reduce((s,l)=>s+l.w*l.reps,0));

  root.innerHTML=`
    <div class="card"><p class="ct">Volumen</p>
      <p class="metric volt-txt" style="font-size:36px;font-weight:600">${nfi.format(vol)} kg</p>
      <p class="xs t2 mt8">${S.logged.length} Sätze geloggt</p></div>
    ${S.prToday?`<div class="card" style="border-color:rgba(200,255,46,.4)">
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px">
        <p class="ring-lbl mb8">NEUER REKORD</p>
        <p style="font-size:20px;font-weight:600;margin-bottom:8px">${S.prToday.n}</p>
        <p class="metric volt-txt" style="font-size:44px;font-weight:700;line-height:1">${fmtKg(S.prToday.e1)}</p>
        <p class="metric volt-txt sm mt8">+${nf.format(S.prToday.delta)} kg e1RM</p>
        <p class="mt16" style="font-weight:700;letter-spacing:2px">METRIC<span class="volt-txt">GYM</span></p>
      </div></div>`
