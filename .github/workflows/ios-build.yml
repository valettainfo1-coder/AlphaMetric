# METRICGYM — iPhone-App bauen und zu TestFlight hochladen, OHNE eigenen Mac
# und OHNE selbst Zertifikate zu basteln.
# ============================================================================
# Der Mac ist nur die BAUMASCHINE, nicht das Ziel: Apple laesst iOS-Apps nur
# mit Xcode uebersetzen, Xcode gibt es nur fuer macOS. Die App laeuft auf dem
# iPhone. GitHub stellt macOS-Maschinen bereit — fuer oeffentliche
# Repositories (dieses ist eins) kostenlos.
#
# WARUM ES HIER KEINE ZERTIFIKATE ZUM HOCHLADEN GIBT:
# Seit Xcode 13 kann xcodebuild sich mit einem App-Store-Connect-Schluessel
# selbst beim Entwicklerportal anmelden (-authenticationKey*) und fehlende
# Zertifikate und Profile selbst anlegen (-allowProvisioningUpdates). Der
# private Schluessel des Verteilungszertifikats bleibt dabei in Apples Cloud
# ("Cloud Managed Distribution Certificate") — genau dafuer gemacht, dass die
# Baumaschine bei jedem Lauf eine andere ist.
#
# Du brauchst deshalb VIER Secrets statt sieben, und keinen einzigen
# openssl-Befehl. Einrichtung: BUILD-OHNE-MAC.md
#
# EHRLICH: Diesen Workflow konnte ich nicht zu Ende testen — dafuer braeuchte
# ich dein Apple-Entwicklerkonto. Geprueft ist die YAML und dass jeder Pfad
# existiert. Der erste Lauf ist der eigentliche Test; bricht er, sagt das
# Protokoll in welchem Schritt.
# ============================================================================
name: iPhone-App bauen

on:
  workflow_dispatch:
    inputs:
      hochladen:
        description: "Nach dem Bauen zu TestFlight hochladen?"
        type: boolean
        default: true
      hinweis:
        description: "Notiz fuer die TestFlight-Version (optional)"
        type: string
        default: ""

jobs:
  bauen:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJEKT: metricgym-app
      WORKSPACE: metricgym-app/ios/App/App.xcworkspace
      SCHEMA: App
      BUNDLE_ID: de.metricgym.app

    steps:
      - uses: actions/checkout@v4

      - name: Umgebung zeigen
        run: |
          echo "Xcode:      $(xcodebuild -version | head -1)"
          echo "CocoaPods:  $(pod --version)"
          echo "Node:       $(node --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- 1 · Weboberflaeche in die App-Huelle ----
      - name: Abhaengigkeiten und Web-Stand
        working-directory: ${{ env.PROJEKT }}
        run: |
          npm ci
          ./sync.sh

      - name: Kaufmodul ist wirklich mitgekommen
        run: |
          # Ohne diese Datei endet jeder Kaufversuch in der App in einem 404.
          # Lieber hier hart scheitern als eine kaputte App hochladen.
          test -f "$PROJEKT/ios/App/App/public/vendor/cdv-purchase.js" \
            || { echo "::error::vendor/cdv-purchase.js fehlt im iOS-Paket"; exit 1; }
          test -f "$PROJEKT/ios/App/App/public/index.html" \
            || { echo "::error::index.html fehlt im iOS-Paket"; exit 1; }
          echo "✓ Weboberflaeche und Kaufmodul liegen im Paket"

      # ---- 2 · Apple-Zugang ablegen ----
      # Eine einzige Datei. Mehr braucht die Signatur nicht.
      - name: App-Store-Connect-Schluessel ablegen
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            [ -n "${!v:-}" ] || { echo "::error::Secret $v fehlt — siehe BUILD-OHNE-MAC.md"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey_$KEY_ID.p8"
          # Formfehler sofort zeigen statt erst in einem kryptischen Xcode-Fehler
          head -1 "$RUNNER_TEMP/apple/AuthKey_$KEY_ID.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::APPSTORE_API_KEY_P8_BASE64 ist keine gueltige .p8 — falsch kodiert?"; exit 1; }
          echo "APPLE_KEY=$RUNNER_TEMP/apple/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
          echo "✓ Schluessel $KEY_ID abgelegt"

      # ---- 3 · Baunummer ----
      # Jeder Upload braucht eine HOEHERE Nummer als der vorherige, sonst weist
      # App Store Connect ihn ab. Die Lauf-Nummer waechst von selbst.
      - name: Baunummer setzen
        working-directory: ${{ env.PROJEKT }}/ios/App
        run: |
          agvtool new-version -all "${{ github.run_number }}"
          echo "✓ Build ${{ github.run_number }}"

      # ---- 4 · Bauen ----
      - name: Pods installieren
        working-directory: ${{ env.PROJEKT }}/ios/App
        run: pod install --repo-update

      - name: Archivieren (Xcode holt sich Zertifikat und Profil selbst)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEMA" \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$RUNNER_TEMP/METRICGYM.xcarchive" \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath "$APPLE_KEY" \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     CODE_SIGN_STYLE=Automatic \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     archive

      - name: IPA ausgeben
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          export_versuch () {
            xcodebuild -exportArchive \
                       -archivePath "$RUNNER_TEMP/METRICGYM.xcarchive" \
                       -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
                       -exportPath "$RUNNER_TEMP/ausgabe" \
                       -allowProvisioningUpdates \
                       -authenticationKeyPath "$APPLE_KEY" \
                       -authenticationKeyID "$KEY_ID" \
                       -authenticationKeyIssuerID "$ISSUER_ID"
          }

          # Xcode 15.3 hat "app-store" in "app-store-connect" umbenannt. Statt zu
          # raten, welche Fassung die Maschine hat: erst die neue probieren,
          # bei Ablehnung die alte. Spart eine ganze Fehlerklasse.
          if ! export_versuch; then
            echo "::notice::Export mit 'app-store-connect' abgelehnt — versuche 'app-store'"
            sed -i '' 's|app-store-connect|app-store|' "$RUNNER_TEMP/Export.plist"
            export_versuch
          fi
          ls -lh "$RUNNER_TEMP/ausgabe"

      - name: IPA als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: METRICGYM-ipa-build-${{ github.run_number }}
          path: ${{ runner.temp }}/ausgabe/*.ipa
          retention-days: 30

      # ---- 5 · Hochladen ----
      # fastlane statt `xcrun altool`: altool ist von Apple abgekuendigt.
      # fastlane ist auf GitHubs macOS-Maschinen vorinstalliert und nutzt
      # denselben Schluessel — kein zweiter Zugang noetig.
      - name: Zu TestFlight hochladen
        if: ${{ inputs.hochladen }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Den Schluessel mit Python in die JSON-Datei schreiben, die fastlane
          # erwartet. Den PEM-Block im Shell in JSON zu quetschen geht an den
          # Zeilenumbruechen schief — hier macht es ein JSON-Serialisierer.
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["APPLE_KEY"]) as f:
              schluessel = f.read()
          ziel = os.environ["RUNNER_TEMP"] + "/apple/api_key.json"
          with open(ziel, "w") as f:
              json.dump({
                  "key_id": os.environ["KEY_ID"],
                  "issuer_id": os.environ["ISSUER_ID"],
                  "key": schluessel,
                  "in_house": False,
              }, f)
          PYTHON

          IPA=$(ls "$RUNNER_TEMP"/ausgabe/*.ipa | head -1)
          echo "Lade hoch: $(basename "$IPA")"
          fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/apple/api_key.json" \
            ipa:"$IPA" \
            skip_waiting_for_build_processing:true \
            changelog:"${{ inputs.hinweis }}"

      - name: Aufraeumen
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple" || true
