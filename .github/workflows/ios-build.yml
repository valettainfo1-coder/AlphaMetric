# METRICGYM — iPhone-App bauen und zu TestFlight hochladen, OHNE eigenen Mac.
# ============================================================================
# Apple laesst sich iOS-Apps nur mit Xcode bauen, und Xcode gibt es nur fuer
# macOS. Der Mac ist dabei aber nur die BAUMASCHINE, nicht das Ziel — die App
# laeuft auf dem iPhone. GitHub stellt macOS-Maschinen bereit, und fuer
# oeffentliche Repositories (dieses ist oeffentlich) kosten sie nichts.
#
# Dieser Workflow laeuft NUR auf Knopfdruck (Actions → "iPhone-App bauen" →
# "Run workflow"). Automatisch bei jedem Push waere Verschwendung und wuerde
# bei jedem Commit eine neue TestFlight-Version erzeugen.
#
# Was du dafuer EINMALIG brauchst, alles ohne Mac erzeugbar:
# siehe BUILD-OHNE-MAC.md im Projektstamm.
#
# ACHTUNG, EHRLICH: Diesen Workflow konnte ich nicht zu Ende testen — dafuer
# braeuchte ich dein Apple-Entwicklerkonto. Geprueft ist, dass die YAML gueltig
# ist und jeder Pfad, auf den er zeigt, existiert. Der erste Lauf ist der
# eigentliche Test; wenn er bricht, sagt das Protokoll in welchem Schritt.
# ============================================================================
name: iPhone-App bauen

on:
  workflow_dispatch:
    inputs:
      hochladen:
        description: "Nach dem Bauen zu TestFlight hochladen?"
        type: boolean
        default: true
      hinweis:
        description: "Notiz fuer die TestFlight-Version (optional)"
        type: string
        default: ""

jobs:
  bauen:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJEKT: metricgym-app
      WORKSPACE: metricgym-app/ios/App/App.xcworkspace
      SCHEMA: App
      BUNDLE_ID: de.metricgym.app

    steps:
      - uses: actions/checkout@v4

      - name: Umgebung zeigen
        run: |
          echo "Xcode:      $(xcodebuild -version | head -1)"
          echo "CocoaPods:  $(pod --version)"
          echo "Node:       $(node --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- 1 · Weboberflaeche in die App-Huelle ----
      - name: Abhaengigkeiten und Web-Stand
        working-directory: ${{ env.PROJEKT }}
        run: |
          npm ci
          ./sync.sh

      - name: Kaufmodul ist wirklich mitgekommen
        run: |
          # Ohne diese Datei endet jeder Kaufversuch in der App in einem 404.
          # Lieber hier hart scheitern als eine kaputte App hochladen.
          test -f "$PROJEKT/ios/App/App/public/vendor/cdv-purchase.js" \
            || { echo "::error::vendor/cdv-purchase.js fehlt im iOS-Paket"; exit 1; }
          test -f "$PROJEKT/ios/App/App/public/index.html" \
            || { echo "::error::index.html fehlt im iOS-Paket"; exit 1; }
          echo "✓ Weboberflaeche und Kaufmodul liegen im Paket"

      # ---- 2 · Signatur einrichten ----
      # Zertifikat und Profil kommen als Base64 aus den Repository-Secrets.
      # In einem oeffentlichen Repo sind Secrets trotzdem geschuetzt: sie werden
      # nie ins Protokoll geschrieben und Forks bekommen sie nicht.
      - name: Zertifikat und Profil einspielen
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFIL_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_B64 P12_PASS PROFIL_B64; do
            [ -n "${!v:-}" ] || { echo "::error::Secret $v fehlt — siehe BUILD-OHNE-MAC.md"; exit 1; }
          done

          SCHLUESSELBUND="$RUNNER_TEMP/bau.keychain-db"
          SCHLUESSELPASS="$(uuidgen)"
          security create-keychain -p "$SCHLUESSELPASS" "$SCHLUESSELBUND"
          security set-keychain-settings -lut 3600 "$SCHLUESSELBUND"
          security unlock-keychain -p "$SCHLUESSELPASS" "$SCHLUESSELBUND"

          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$SCHLUESSELBUND" \
            -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$SCHLUESSELPASS" "$SCHLUESSELBUND" >/dev/null
          security list-keychains -d user -s "$SCHLUESSELBUND" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFIL_B64" | base64 --decode > "$RUNNER_TEMP/profil.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" \
                 | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" \
                 | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profil.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFIL_NAME=$NAME" >> "$GITHUB_ENV"
          echo "✓ Profil eingespielt: $NAME"

          # Zum Aufraeumen am Ende
          echo "SCHLUESSELBUND=$SCHLUESSELBUND" >> "$GITHUB_ENV"

      # ---- 3 · Baunummer ----
      # Jeder Upload braucht eine HOEHERE Baunummer als der vorherige, sonst
      # weist App Store Connect ihn ab. Die Lauf-Nummer waechst von selbst.
      - name: Baunummer setzen
        working-directory: ${{ env.PROJEKT }}/ios/App
        run: |
          agvtool new-version -all "${{ github.run_number }}"
          echo "✓ Build ${{ github.run_number }}"

      # ---- 4 · Bauen ----
      - name: Pods installieren
        working-directory: ${{ env.PROJEKT }}/ios/App
        run: pod install --repo-update

      - name: Archivieren
        run: |
          set -euo pipefail
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEMA" \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$RUNNER_TEMP/METRICGYM.xcarchive" \
                     CODE_SIGN_STYLE=Manual \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFIL_NAME" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     archive

      - name: IPA ausgeben
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFIL_NAME</string></dict>
          </dict></plist>
          PLIST
          # Xcode 15.3 hat "app-store" in "app-store-connect" umbenannt. Statt zu
          # raten, welche Fassung die Maschine hat: erst die neue probieren,
          # bei Ablehnung die alte. Spart eine ganze Fehlerklasse.
          if ! xcodebuild -exportArchive \
                 -archivePath "$RUNNER_TEMP/METRICGYM.xcarchive" \
                 -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
                 -exportPath "$RUNNER_TEMP/ausgabe"; then
            echo "::notice::Export mit 'app-store-connect' abgelehnt — versuche 'app-store'"
            sed -i '' 's|app-store-connect|app-store|' "$RUNNER_TEMP/Export.plist"
            xcodebuild -exportArchive \
                       -archivePath "$RUNNER_TEMP/METRICGYM.xcarchive" \
                       -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
                       -exportPath "$RUNNER_TEMP/ausgabe"
          fi
          ls -lh "$RUNNER_TEMP/ausgabe"

      - name: IPA als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: METRICGYM-ipa-build-${{ github.run_number }}
          path: ${{ runner.temp }}/ausgabe/*.ipa
          retention-days: 30

      # ---- 5 · Hochladen ----
      # fastlane statt `xcrun altool`: altool ist von Apple abgekuendigt.
      # fastlane ist auf GitHubs macOS-Maschinen vorinstalliert und nutzt den
      # App-Store-Connect-API-Schluessel, der kein 2FA braucht.
      - name: Zu TestFlight hochladen
        if: ${{ inputs.hochladen }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for v in API_KEY_ID API_ISSUER_ID API_KEY_P8; do
            [ -n "${!v:-}" ] || { echo "::error::Secret $v fehlt — siehe BUILD-OHNE-MAC.md"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/privatschluessel"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/privatschluessel/key.p8"

          # Den Schluessel mit Python in die JSON-Datei schreiben, die fastlane
          # erwartet. Den PEM-Block im Shell in JSON zu quetschen geht an den
          # Zeilenumbruechen schief — hier macht es ein JSON-Serialisierer.
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/privatschluessel/key.p8") as f:
              schluessel = f.read()
          daten = {
              "key_id": os.environ["API_KEY_ID"],
              "issuer_id": os.environ["API_ISSUER_ID"],
              "key": schluessel,
              "in_house": False,
          }
          with open(os.environ["RUNNER_TEMP"] + "/privatschluessel/api_key.json", "w") as f:
              json.dump(daten, f)
          PYTHON

          IPA=$(ls "$RUNNER_TEMP"/ausgabe/*.ipa | head -1)
          echo "Lade hoch: $(basename "$IPA")"
          fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/privatschluessel/api_key.json" \
            ipa:"$IPA" \
            skip_waiting_for_build_processing:true \
            changelog:"${{ inputs.hinweis }}"

      - name: Aufraeumen
        if: always()
        run: |
          security delete-keychain "${SCHLUESSELBUND:-}" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/privatschluessel" || true
